name: MobileApp Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

# Read-only: these jobs check out and test the code, nothing more.
permissions:
  contents: read

jobs:
  expo-doctor:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install MobileApp dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/MobileApp
      - name: Run Expo Doctor
        run: cd packages/MobileApp && npx expo-doctor@latest

  jest:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install MobileApp dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/MobileApp
      - name: Run Jest Tests
        run: cd packages/MobileApp && npm test

  expo-web-export:
    runs-on: ubuntu-latest
    # In the Playwright image, as App Test's Dashboard Offline UI groups are:
    # Chromium and its system packages and fonts are in it, so nothing is
    # fetched from the runner's Ubuntu mirror (on 14.0.93's release gate an
    # apt-get update here hung after its third index for over three hours).
    # The limit holds the responsive checks' three tries, about 7 minutes for
    # checkout and the npm install, and 5 for the image's pull
    # (Tests/Ops/PlaywrightImage).
    timeout-minutes: 105
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    # In a container a run step with no shell of its own gets sh, not the
    # bash -e {0} a runner gives it; the steps here are written for the
    # runner's (Tests/Ops/PlaywrightImage).
    defaults:
      run:
        shell: bash -e {0}
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      # The fonts an ubuntu runner has and the image lacks (DejaVu, the
      # runner's sans-serif, serif and monospace), so pages that load no web
      # font of their own draw their words as on the runner.
      - uses: ./.github/actions/runner-fonts
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install MobileApp dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/MobileApp
      - name: Verify responsive screens and project switching
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: cd packages/MobileApp && npm run test-ui
      - name: Upload UI screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-report
          path: |
            packages/MobileApp/playwright-report
            packages/MobileApp/test-results
          retention-days: 7
