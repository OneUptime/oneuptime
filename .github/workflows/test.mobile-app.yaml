name: MobileApp Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  expo-doctor:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: cd MobileApp && npm install
      - name: Run Expo Doctor
        run: cd MobileApp && npx expo-doctor@latest

  jest:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: cd MobileApp && npm install
      - name: Run Jest Tests
        run: cd MobileApp && npm test

  expo-web-export:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: cd MobileApp && npm install
      - name: Install browser for responsive UI tests
        run: cd MobileApp && npx playwright install --with-deps chromium
      - name: Verify responsive screens and project switching
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: cd MobileApp && npm run test-ui
      - name: Upload UI screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-report
          path: |
            MobileApp/playwright-report
            MobileApp/test-results
          retention-days: 7
