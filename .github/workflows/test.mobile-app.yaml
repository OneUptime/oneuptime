name: MobileApp Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

# Read-only: these jobs check out and test the code, nothing more.
permissions:
  contents: read

jobs:
  expo-doctor:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install MobileApp dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/MobileApp
      - name: Run Expo Doctor
        run: cd packages/MobileApp && npx expo-doctor@latest

  jest:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install MobileApp dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/MobileApp
      - name: Run Jest Tests
        run: cd packages/MobileApp && npm test

  expo-web-export:
    runs-on: ubuntu-latest
    # Holds the Chromium install's own limit, the responsive checks' three
    # tries, and about 7 minutes for checkout and the npm install
    # (Tests/Ops/BrowserInstallLimits). With no limit, a hung install holds
    # the runner for GitHub's six-hour default.
    timeout-minutes: 125
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install MobileApp dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/MobileApp
      # `--with-deps` fetches about 26 MB of system packages and fonts from the
      # runner's Ubuntu mirror. It usually takes 20 seconds, but some runners
      # are served at a few dozen kB/s (10 minutes on master on 2026-10-26),
      # and on 14.0.93's release gate that day apt-get update hung after its
      # third index and sat for over three hours until it was cancelled. So
      # it has the 25 minutes App Test's browser installs have.
      - name: Install browser for responsive UI tests
        timeout-minutes: 25
        run: cd packages/MobileApp && npx playwright install --with-deps chromium
      - name: Verify responsive screens and project switching
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: cd packages/MobileApp && npm run test-ui
      - name: Upload UI screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-report
          path: |
            packages/MobileApp/playwright-report
            packages/MobileApp/test-results
          retention-days: 7
