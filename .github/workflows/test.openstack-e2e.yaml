name: OpenStack E2E

# Deploys a real OpenStack with DevStack on the runner, builds a known estate
# on it, breaks it in the ways that page operators, and records what its APIs
# and openstack-exporter answer each time. The OpenStack product's collectors,
# health rules and alert templates are tested on those recordings
# (packages/Common/Tests/Fixtures/OpenStack), because OpenStack answers
# differently by release and network backend, and a wrong guess costs empty
# pages rather than a failed test. See Tests/Ops/openstack-e2e/README.md.
#
# A DevStack takes about half an hour to deploy, so this runs by hand and once
# a week, and on a pull request only when the rig itself or the agent changes.
# Path-filtered, so it must not be a required check.
on:
  workflow_dispatch:
    inputs:
      logs_only:
        description: Only record service logs, notifications and audit events, which skips what takes the rest of the time
        type: boolean
        default: false
      control_plane_only:
        description: Only record what RabbitMQ, Galera, Memcached, HAProxy and OVN say when they break, which takes no DevStack
        type: boolean
        default: false
      traces_only:
        description: With logs_only too, only record what OSProfiler's driver sends, on the entries that do
        type: boolean
        default: false
      capacity_only:
        description: Only record what Placement says of an estate of several hosts, which skips everything else
        type: boolean
        default: false
      agent_install_only:
        description: Only install the agent the way its docs say, with and without Docker, on one DevStack
        type: boolean
        default: false
  schedule:
    - cron: "23 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/test.openstack-e2e.yaml"
      - "Tests/Ops/openstack-e2e/**"
      - "agents/OpenStackAgent/**"

permissions:
  contents: read

# The control plane's own run takes no DevStack and has nothing to do with a full one,
# so neither cancels the other. Nor does a run that only records traces, that only installs the
# agent, or that only records capacity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.control_plane_only && 'control-plane' || inputs.traces_only && 'traces' || inputs.capacity_only && 'capacity' || inputs.agent_install_only && 'agent-install' || 'all' }}
  cancel-in-progress: true

jobs:
  # Real clusters of what a cloud stands on, in containers, with the exporters
  # Kolla-Ansible pins: a DevStack has one of each, so it cannot lose a node or quorum.
  record-control-plane:
    name: control plane clusters
    if: ${{ !inputs.logs_only && !inputs.agent_install_only && !inputs.capacity_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Break each one, and record what it says
        run: bash Tests/Ops/openstack-e2e/control-plane-clusters.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording

      - name: Upload the recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openstack-recording-control-plane
          path: ${{ runner.temp }}/recording
          if-no-files-found: warn
          retention-days: 30

  # The agent the way its docs say, on the newest release. A job of its own, so that it holds no
  # recording up and costs only this one DevStack: nothing here needs Ceilometer. By hand when asked
  # for by name, because a run dispatched for its recordings has no use for it, and otherwise on
  # the weekly run and on a pull request that changes the agent. See agent-install.sh for what it
  # proves that the installers' tests, on stubs, cannot.
  agent-install:
    name: agent install
    if: ${{ inputs.agent_install_only || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Deploy DevStack
        uses: gophercloud/devstack-action@60ca1042045c0c9e3e001c64575d381654ffcba1 # v0.19
        with:
          branch: stable/2026.2
          conf_overrides: |
            NOVA_SERVICE_REPORT_INTERVAL=10
            CINDER_SERVICE_REPORT_INTERVAL=10
          enable_workaround_docker_io: "false"

      - name: Docker still answers
        run: |
          if ! docker info >/dev/null 2>&1; then
            # DevStack can leave the runner's Docker stopped or removed.
            sudo systemctl start docker || sudo apt-get install -y docker.io
            sudo systemctl start docker
          fi
          docker compose version >/dev/null 2>&1 || sudo apt-get install -y docker-compose-v2
          docker info --format 'Docker {{.ServerVersion}}'
          docker compose version

      - name: Build the estate
        run: bash Tests/Ops/openstack-e2e/estate.sh

      - name: Install the agent the way its docs say, and break it
        run: bash Tests/Ops/openstack-e2e/agent-install.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording

      - name: Make every name one an artifact can hold
        if: always()
        run: bash Tests/Ops/openstack-e2e/safe-artifact-names.sh "${RUNNER_TEMP}/recording"

      - name: Upload what it did
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openstack-agent-install
          path: ${{ runner.temp }}/recording
          if-no-files-found: warn
          retention-days: 30

      - name: Collect DevStack's logs on failure
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/devstack-logs"
          sudo journalctl -u 'devstack@*' --no-pager -n 5000 > "${RUNNER_TEMP}/devstack-logs/journal.txt" || true
          sudo cp -r /tmp/devstack-logs/. "${RUNNER_TEMP}/devstack-logs/" 2>/dev/null || true
          sudo chown -R "$(id -u)" "${RUNNER_TEMP}/devstack-logs"

      - name: Upload DevStack's logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openstack-devstack-logs-agent-install
          path: ${{ runner.temp }}/devstack-logs
          if-no-files-found: ignore
          retention-days: 7

  # What Placement says of an estate of several hosts, which a DevStack's one host can't show:
  # an allocation ratio that differs by host, a reserved amount, and memory spread too thinly
  # for a large flavor. Every step is on its own: the newest release, the release ML2/OVS is
  # recorded on and the oldest one maintained, because Placement's answers are the same shape
  # over all of them or the product needs to know.
  record-capacity:
    name: capacity ${{ matrix.name }}
    if: ${{ inputs.capacity_only || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hibiscus-ovn
            branch: stable/2026.2
            conf_overrides: ""
          - name: gazpacho-ovn
            branch: stable/2026.1
            conf_overrides: ""
          - name: epoxy-ovn
            branch: unmaintained/2025.1
            conf_overrides: |
              TARGET_BRANCH=unmaintained/2025.1
    steps:
      - uses: actions/checkout@v4

      - name: Deploy DevStack
        uses: gophercloud/devstack-action@60ca1042045c0c9e3e001c64575d381654ffcba1 # v0.19
        with:
          branch: ${{ matrix.branch }}
          conf_overrides: |
            NOVA_SERVICE_REPORT_INTERVAL=10
            CINDER_SERVICE_REPORT_INTERVAL=10
            ${{ matrix.conf_overrides }}
          enable_workaround_docker_io: "false"

      - name: Docker still answers
        run: |
          if ! docker info >/dev/null 2>&1; then
            sudo systemctl start docker || sudo apt-get install -y docker.io
            sudo systemctl start docker
          fi
          docker info --format 'Docker {{.ServerVersion}}'

      - name: Build the estate
        run: bash Tests/Ops/openstack-e2e/estate.sh

      - name: Start the agent's exporter and collector
        run: bash Tests/Ops/openstack-e2e/start-agent.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording
          OPENSTACK_LIBVIRT_EXPORTER_TARGETS: "[]"
          OPENSTACK_CEILOMETER_EXPORTER_TARGETS: "[]"
          OPENSTACK_RABBITMQ_TARGETS: "[]"
          OPENSTACK_MARIADB_TARGETS: "[]"
          OPENSTACK_MEMCACHED_TARGETS: "[]"
          OPENSTACK_NETWORK_EXPORTER_TARGETS: "[]"
          OPENSTACK_LIBVIRT_HEALTH_TARGETS: "[]"

      - name: Add hosts, fill them, break them, and record what Placement says
        run: bash Tests/Ops/openstack-e2e/capacity-record.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording

      - name: Stop the agent and keep what it exported
        if: always()
        run: bash Tests/Ops/openstack-e2e/stop-agent.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording

      - name: Make every name one an artifact can hold
        if: always()
        run: bash Tests/Ops/openstack-e2e/safe-artifact-names.sh "${RUNNER_TEMP}/recording"

      - name: Upload the recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openstack-capacity-recording-${{ matrix.name }}
          path: ${{ runner.temp }}/recording
          if-no-files-found: warn
          retention-days: 30

      - name: Collect DevStack's logs on failure
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/devstack-logs"
          sudo journalctl -u 'devstack@*' --no-pager -n 5000 > "${RUNNER_TEMP}/devstack-logs/journal.txt" || true
          sudo journalctl -u 'ou-capacity-*' --no-pager -n 5000 > "${RUNNER_TEMP}/devstack-logs/capacity-hosts.txt" || true
          sudo chown -R "$(id -u)" "${RUNNER_TEMP}/devstack-logs"

      - name: Upload DevStack's logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openstack-capacity-devstack-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/devstack-logs
          if-no-files-found: ignore
          retention-days: 7

  record:
    name: ${{ matrix.name }}
    if: ${{ !inputs.control_plane_only && !inputs.agent_install_only && !inputs.capacity_only }}
    runs-on: ubuntu-24.04
    # Half an hour more on the two entries that drill what a cloud stands on.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every maintained release, and the newest unmaintained SLURP release
          # (https://releases.openstack.org). DevStack's default network
          # backend is OVN.
          # traces: the two sides of OSProfiler's root span fix. 4.4.0 here sends a request's
          # first span with no parent, and 4.3.0 on Flamingo sends it a parent that is never
          # sent. What it records is on its own step, so losing it costs nothing else.
          - name: hibiscus-ovn
            branch: stable/2026.2
            conf_overrides: ""
            traces: true
          - name: gazpacho-ovn
            branch: stable/2026.1
            conf_overrides: ""
            control_plane: true
          - name: flamingo-ovn
            branch: stable/2025.2
            conf_overrides: ""
            traces: true
          # An unmaintained release's branches were renamed, and its DevStack still
          # asks for them by the old name.
          - name: epoxy-ovn
            branch: unmaintained/2025.1
            conf_overrides: |
              TARGET_BRANCH=unmaintained/2025.1
          # ML2/OVS reports the DHCP, L3 and OVS agents OVN does not have, and
          # the product must read both.
          - name: gazpacho-ovs
            branch: stable/2026.1
            control_plane: true
            enabled_services: "-ovn-controller,-ovn-northd,-ovs-vswitchd,-ovsdb-server,-q-ovn-metadata-agent,-q-ovn-agent,q-agt,q-dhcp,q-l3,q-meta"
            conf_overrides: |
              Q_AGENT=openvswitch
              Q_ML2_PLUGIN_MECHANISM_DRIVERS=openvswitch
              Q_ML2_TENANT_NETWORK_TYPE=vxlan
              Q_ML2_PLUGIN_TYPE_DRIVERS=flat,vlan,vxlan
    steps:
      - uses: actions/checkout@v4

      - name: Deploy DevStack
        if: ${{ !inputs.traces_only || matrix.traces }}
        uses: gophercloud/devstack-action@60ca1042045c0c9e3e001c64575d381654ffcba1 # v0.19
        with:
          branch: ${{ matrix.branch }}
          enabled_services: ${{ matrix.enabled_services }}
          # OpenStack's own default. DevStack waits 2 minutes between heartbeats and
          # calls a service down after 12, which outlasts every drill's wait.
          # Ceilometer only for its polling agent and the exporter it holds, from 2025.1:
          # what it says about an instance is recorded, and nothing is stored here. Its
          # polling interval is a minute rather than five so a run sees several.
          conf_overrides: |
            NOVA_SERVICE_REPORT_INTERVAL=10
            CINDER_SERVICE_REPORT_INTERVAL=10
            enable_plugin ceilometer https://opendev.org/openstack/ceilometer ${{ matrix.branch }}
            disable_service ceilometer-acentral ceilometer-anotification
            CEILOMETER_BACKENDS=none
            CEILOMETER_PIPELINE_INTERVAL=60
            ${{ matrix.conf_overrides }}
          # Its workaround replaces containerd with runc, which stops Docker, and
          # the agent's exporter and collector run in Docker. Kuryr is not used here.
          enable_workaround_docker_io: "false"

      - name: Docker still answers
        if: ${{ !inputs.traces_only || matrix.traces }}
        run: |
          if ! docker info >/dev/null 2>&1; then
            # DevStack can leave the runner's Docker stopped or removed.
            sudo systemctl start docker || sudo apt-get install -y docker.io
            sudo systemctl start docker
          fi
          docker info --format 'Docker {{.ServerVersion}}'

      - name: Build the estate
        if: ${{ !inputs.traces_only || matrix.traces }}
        run: bash Tests/Ops/openstack-e2e/estate.sh

      # On its own, as the access matrix is: losing a source of VM metrics costs that
      # recording, not the drills.
      - name: Start what reports real VM metrics
        if: ${{ !inputs.logs_only }}
        continue-on-error: true
        run: bash Tests/Ops/openstack-e2e/start-instance-metrics.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording

      # Before the agent starts, so its collector reads them from its first scrape.
      - name: Start the exporters of what the cloud stands on
        if: ${{ !inputs.logs_only && matrix.control_plane }}
        continue-on-error: true
        run: bash Tests/Ops/openstack-e2e/control-plane-cloud.sh start
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording

      - name: Start the agent's exporter and collector
        if: ${{ !inputs.logs_only }}
        run: bash Tests/Ops/openstack-e2e/start-agent.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording
          OPENSTACK_LIBVIRT_EXPORTER_TARGETS: "[127.0.0.1:9177]"
          OPENSTACK_CEILOMETER_EXPORTER_TARGETS: "[127.0.0.1:9101]"
          OPENSTACK_RABBITMQ_TARGETS: ${{ matrix.control_plane && '[127.0.0.1:15692]' || '[]' }}
          OPENSTACK_MARIADB_TARGETS: ${{ matrix.control_plane && '[127.0.0.1:9104]' || '[]' }}
          OPENSTACK_MEMCACHED_TARGETS: ${{ matrix.control_plane && '[127.0.0.1:9150]' || '[]' }}
          OPENSTACK_NETWORK_EXPORTER_TARGETS: ${{ matrix.control_plane && '[127.0.0.1:1981]' || '[]' }}
          OPENSTACK_LIBVIRT_HEALTH_TARGETS: ${{ matrix.control_plane && '[127.0.0.1:9177]' || '[]' }}

      # On its own, so that a problem here still leaves the drills recorded. It takes
      # its policy files back off when it ends, whichever way it ends.
      - name: Least privilege, tested on the real policies
        if: ${{ !inputs.logs_only }}
        continue-on-error: true
        run: bash Tests/Ops/openstack-e2e/access-matrix.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording

      - name: Record the failure drills
        if: ${{ !inputs.logs_only }}
        run: bash Tests/Ops/openstack-e2e/drills.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording
          EXPORTER_STABLE_URL: http://127.0.0.1:9181

      # After the drills, so the scenes they recorded hold the estate they always held.
      - name: Record real VM metrics from both sources
        if: ${{ !inputs.logs_only }}
        continue-on-error: true
        run: bash Tests/Ops/openstack-e2e/instance-metrics.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording

      # What the cloud does when what it stands on goes away. After the rest, because it
      # takes the whole cloud down more than once, and on its own, so that a problem here
      # still leaves everything else recorded.
      - name: Stop what the cloud stands on, and record what falls
        if: ${{ !inputs.logs_only && matrix.control_plane }}
        continue-on-error: true
        run: bash Tests/Ops/openstack-e2e/control-plane-cloud.sh drills
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording

      # Signs real requests, on its own and with a limit of its own, so that a problem here
      # costs neither the drills nor the logs. Before the logs, because it takes back
      # everything it changes, and they leave a cloud configured their own way.
      - name: Record what OSProfiler's driver sends for a signed request
        if: ${{ matrix.traces }}
        continue-on-error: true
        timeout-minutes: 45
        run: bash Tests/Ops/openstack-e2e/traces-record.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording

      # Last, because it changes every service's config and breaks things of its own, and
      # on its own, so that a problem here still leaves the drills recorded.
      - name: Record service logs, notifications and audit events
        if: ${{ !inputs.traces_only }}
        continue-on-error: true
        run: bash Tests/Ops/openstack-e2e/logs-record.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording

      - name: Stop the agent and keep what it exported
        if: ${{ always() && !inputs.logs_only }}
        run: bash Tests/Ops/openstack-e2e/stop-agent.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/recording

      - name: Make every name one an artifact can hold
        if: always()
        run: bash Tests/Ops/openstack-e2e/safe-artifact-names.sh "${RUNNER_TEMP}/recording"

      - name: Upload the recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openstack-recording-${{ matrix.name }}
          path: ${{ runner.temp }}/recording
          if-no-files-found: warn
          retention-days: 30

      - name: Collect DevStack's logs on failure
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/devstack-logs"
          sudo journalctl -u 'devstack@*' --no-pager -n 5000 > "${RUNNER_TEMP}/devstack-logs/journal.txt" || true
          sudo cp -r /tmp/devstack-logs/. "${RUNNER_TEMP}/devstack-logs/" 2>/dev/null || true
          sudo chown -R "$(id -u)" "${RUNNER_TEMP}/devstack-logs"

      - name: Upload DevStack's logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openstack-devstack-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/devstack-logs
          if-no-files-found: ignore
          retention-days: 7
