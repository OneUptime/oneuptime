# Builds our custom OneUptime App image and pushes it to our private ECR
# (repository and OIDC role live in dedicatted/msp-internal-tools-terraform,
# tools/ecr.tf and tools/github_actions.tf).
#
# This is the only active workflow in the fork for now: upstream's workflows
# are parked in .github/workflows-disabled/, where GitHub does not run them.
# To re-enable one, `git mv` it back into .github/workflows/.
#
# The image is built for linux/arm64 only, because the oneuptime instance it
# runs on is a Graviton (t4g) host. Add linux/amd64 to PLATFORMS if needed.
name: Build and push to ECR

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # OIDC token for aws-actions/configure-aws-credentials

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::686420703307:role/oneuptime-github-actions
  ECR_REPOSITORY: oneuptime-app
  # packages/App/Dockerfile builds both editions; "community" or "enterprise".
  APP_TARGET: community
  PLATFORMS: linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      # Tells prerun's Scripts/Install/configure.sh it runs in CI (no `git pull`).
      CI_PIPELINE_ID: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      # Renders every Dockerfile.tpl into its Dockerfile.
      - name: Generate Dockerfiles
        run: npm run prerun

      - name: Read version
        id: version
        run: echo "app_version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/App/Dockerfile
          target: ${{ env.APP_TARGET }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          # Single-manifest images, so the ECR lifecycle policy counts one
          # image per push instead of an extra attestation manifest.
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.app_version }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.app_version }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
