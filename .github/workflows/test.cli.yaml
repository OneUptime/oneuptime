name: CLI Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install Common dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Common
      - name: Install CLI dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/CLI
      # The package npm publishes: `npm pack` builds the bundle first (the
      # prepack script). Packed before the tests, so the jobs below get it
      # even when a test fails.
      - name: Pack the CLI as npm publishes it
        run: |
          mkdir -p "$RUNNER_TEMP/cli-package"
          cd packages/CLI && npm pack --pack-destination "$RUNNER_TEMP/cli-package"
      - name: Upload the packed CLI
        uses: actions/upload-artifact@v4
        with:
          name: cli-package
          path: ${{ runner.temp }}/cli-package/*.tgz
          if-no-files-found: error
          retention-days: 1
          # A re-run of this job replaces the tarball of the attempt before,
          # rather than failing on an artifact of the same name.
          overwrite: true
      - run: cd packages/CLI && npm run test

  # Every CLI published from 10.0.5 until #4872 was fixed died at start with
  # "Cannot find module 'Common/Models/DatabaseModels/Index'", because no job
  # ran the package npm publishes. This installs that package as a customer does
  # - globally, into an empty prefix, with an empty npm cache and no network -
  # on each Node.js line the CLI supports (package.json engines) below the
  # Node.js 26 of the job above, whose Tests/PackagedCli does the same and
  # more. The smoke script needs nothing but Node.js and npm, so nothing else
  # is installed here.
  packaged-cli:
    name: Packaged CLI on Node.js ${{ matrix.node }}
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packages/CLI/Scripts
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Download the packed CLI
        uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: ${{ runner.temp }}/cli-package
      - name: Install it as a customer does, and run it
        run: |
          tarball="$(ls "$RUNNER_TEMP"/cli-package/oneuptime-cli-*.tgz)"
          node packages/CLI/Scripts/SmokeTestPackage.js --tarball "$tarball"
