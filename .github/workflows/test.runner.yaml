name: Runner Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master


jobs:

  test:
    runs-on: ubuntu-latest
    # The suite runs transpile-only: packages/Runner/jest.config.json sets
    # ts-jest's isolatedModules, as App's and Common's do. ts-jest used to
    # type-check each test file together with everything it imports, one file
    # after another (--detectOpenHandles keeps jest in band), and that was most
    # of this job: Tests/Jobs/HeartbeatWriteLimitsServerParity.test.ts, which
    # loads Common's server services, took 409 of jest's 503 seconds.
    #
    # Nothing goes unchecked: Runner's tsconfig.json includes ./**/*.ts, so the
    # compile-runner job in the Compile workflow type-checks every test file as
    # part of one tsc program. A type error in a test fails there.
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install Common dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Common
      - name: Install Runner dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Runner
      - run: cd packages/Runner && npm run test
