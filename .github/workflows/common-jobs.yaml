name: Common Jobs

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  # Every Helm chart test, in one check. The runner walks HelmChart/Tests/suites
  # cheapest-first -- lint, then the cluster-free helm-unittest suites, then the
  # ones that need a real API server (secrets-lifecycle installs and upgrades the
  # chart on a throwaway KinD cluster; no images are pulled, since the release
  # goes up without --wait and without hooks). A failing suite does not stop the
  # rest, so one run reports everything that is broken.
  helm-test:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Run Helm Chart tests
        run: bash ./HelmChart/Tests/run.sh
      - name: Show how to run these locally
        if: ${{ failure() }}
        run: echo "Run 'npm run test-helm-chart-all', or a single suite with 'bash ./HelmChart/Tests/run.sh <suite>' (suites live in HelmChart/Tests/suites). 'npm run test-helm-chart' still runs just the cluster-free helm-unittest suites."


  js-lint:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y curl gcc
      - run: sudo apt-get install -y build-essential
      - run: sudo apt-get install -y nodejs
      - run: npm install
      - run: npm run lint
      - name: Validate locale files (key parity + placeholders)
        run: npm run i18n:validate
      - name: Validate docs anchor links resolve to a heading
        run: npm run docs:check-anchors
      - name: Show how to fix lint
        if: ${{ failure() }}
        run: echo "Please run 'npm run fix' to auto-fix lint, 'npm run i18n:validate' to see any missing/extra locale keys or broken placeholders, and 'npm run docs:check-anchors' to see any in-page doc links pointing at a heading that does not exist."
