          --forceExit

      # Clones the migrated Project, GlobalConfig and SSO provider tables into
      # an isolated schema and writes through the services: a sign-in change
      # that names its rows by a filter writes exactly the rows it read under
      # its lock - a row created a moment later is left alone - and a hard
