      - name: Test VMware probe collection's SQL on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_VMWARE_PROBE_COLLECTION_TESTS: "true"
          VMWARE_PROBE_COLLECTION_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          VMWARE_PROBE_COLLECTION_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          VMWARE_PROBE_COLLECTION_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/VMwareProbeCollectionSqlPostgres.test.ts --forceExit

      # Clones the migrated InstanceReceivingPeriod table into an isolated
      # schema and runs the receiving ledger's SQL (issue #2825): heartbeats
      # extend a stretch on the database's clock, one after more than the gap
      # threshold starts a new stretch, replicas heartbeating at once after an
      # outage converge on one timeline, a window reads the stretches around
