          DOCKER_HOST_REREGISTER_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Telemetry/DockerHostReRegisterPostgres.test.ts --forceExit

      # Exceptions: the exception group upsert's ON CONFLICT branch, which is
      # all of regression detection - an occurrence after the resolve
      # reopens it as Regressed, a late one from before does not, and one
      # resolved in the next release waits out the release it was resolved
      # after. Clones the migrated TelemetryException into an isolated
      # schema.
      - name: Test exception regressions on migrated Postgres
        if: matrix.shard == 3
        working-directory: packages/App
        env:
          RUN_POSTGRES_EXCEPTION_REGRESSION_TESTS: "true"
          EXCEPTION_REGRESSION_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          EXCEPTION_REGRESSION_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          EXCEPTION_REGRESSION_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Telemetry/ExceptionRegressionPostgres.test.ts --forceExit

      # Archiving the values records pick from, on migrated Postgres: the two
      # migrations on tables that already hold values (every value comes out
      # live, the keys to who archived one are added online and cleared when
      # the user goes, both undo), the reads the write check and the archive
      # guard make, an archive stamped through the real update path, and the
      # usage counts of the Archive and Delete dialogs run by Postgres for
      # every reference the models declare.
      - name: Test archiving states, severities, statuses, labels and roles on migrated Postgres
        if: matrix.shard == 3
        working-directory: packages/Common
        env:
          RUN_POSTGRES_ARCHIVABLE_VALUES_TESTS: "true"
          ARCHIVABLE_VALUES_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          ARCHIVABLE_VALUES_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          ARCHIVABLE_VALUES_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/ArchivableValuesPostgres.test.ts --forceExit

      # Postmortem statuses (Incidents > Postmortems), on migrated Postgres:
      # the two migrations on a copy of the incidents table that already
      # holds incidents (the column added without a rewrite, the indexes and
      # key built online and safe to build again, a status incidents are in
      # can't be deleted), the backfill that gives every incident from before
      # the status its postmortem is in, and the list's reads through the
      # incident service.
      - name: Test postmortem statuses and their backfill on migrated Postgres
        if: matrix.shard == 3
        working-directory: packages/Common
        env:
          RUN_POSTGRES_POSTMORTEM_STATUS_TESTS: "true"
          POSTMORTEM_STATUS_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          POSTMORTEM_STATUS_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          POSTMORTEM_STATUS_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/IncidentPostmortemStatusPostgres.test.ts --forceExit

      # The Owner chip of every list, on migrated Postgres: each kind with
      # owners of its own (on-call schedules, monitors, incidents, episodes,
      # templates, probes, runners and the rest) is listed through its own
      # route by a member, filtered by a person, a team, both, none of them,
      # anyone and nobody - a team's members never stand for the team, a
      # removed owner row is no owner, counts and pages agree - with the owner
      # tables read through their indexes, and a reader who may not read the
      # owners refused.
      - name: Test every list filtered by its owners on migrated Postgres
        if: matrix.shard == 3
        working-directory: packages/Common
        env:
          RUN_POSTGRES_OWNER_FILTER_TESTS: "true"
          OWNER_FILTER_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          OWNER_FILTER_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          OWNER_FILTER_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/API/OwnerFilterListsPostgres.test.ts --forceExit

      # The LLM provider an AI rule picks, on migrated Postgres: the two
      # migrations on copies of the rule tables that already hold rules (the
      # columns added without a backfill, each rule's index and key built
      # online and safe to build again), and a provider deleted while rules
      # point at it - every rule that picked it picks none, while a run keeps
      # the pick it was queued with.
      - name: Test the AI rules' LLM provider on migrated Postgres
        if: matrix.shard == 3
        working-directory: packages/Common
        env:
          RUN_POSTGRES_RULE_LLM_PROVIDER_TESTS: "true"
          RULE_LLM_PROVIDER_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          RULE_LLM_PROVIDER_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          RULE_LLM_PROVIDER_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Infrastructure/Postgres/AddRuleLlmProvidersPostgres.test.ts
          --forceExit

      # Investigation rules become AI rules, on migrated Postgres: the
      # AddAiRuleInvestigation and MergeInvestigationRulesIntoAiRules
      # migrations on copies of both rule tables, seeded with every
      # combination (each kind alone, matching and different conditions,
      # disabled rules, name order, both kinds of signal, a deleted rule and
      # project). Each rule's new shape is checked, and so is the behaviour:
      # for a spread of incidents and alerts, what is investigated (wait, LLM
      # provider, MCP servers, repositories), which rules fix it and which
      # pull requests open is the same before and after. up() run again
      # changes nothing, and down() gives the rules back.
      - name: Test merging investigation rules into AI rules on migrated Postgres
        if: matrix.shard == 3
        working-directory: packages/Common
        env:
          RUN_POSTGRES_AI_RULE_MERGE_TESTS: "true"
          AI_RULE_MERGE_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          AI_RULE_MERGE_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          AI_RULE_MERGE_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Infrastructure/Postgres/MergeInvestigationRulesIntoAiRulesPostgres.test.ts
          --forceExit

      # Labels in natural order (#5183), on migrated Postgres: the
      # AddLabelNameSortKey migration on a copy of the Label table that
      # already holds labels (the key added empty, under the "C" collation),
      # and the labels ordered by their keys in exactly the order the browser
      # sorts them in (Utils/LabelOrder) - numbered labels first, by their
      # numbers - where ordering by the name puts "10." before "2.".
      - name: Test labels' natural order on migrated Postgres
        if: matrix.shard == 3
        working-directory: packages/Common
        env:
          RUN_POSTGRES_LABEL_ORDER_TESTS: "true"
          LABEL_ORDER_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          LABEL_ORDER_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          LABEL_ORDER_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Infrastructure/Postgres/AddLabelNameSortKeyPostgres.test.ts
          --forceExit

      # A security case's priority and status became the project's own.
      # Builds the tables as they were before AddSecurityCasePrioritiesAnd
      # Statuses in an isolated schema, seeds every old priority and status
      # on cases, playbooks, runs, notification settings, Slack and Teams
      # rules and saved views (and text that names none of them), and runs
      # the migration and its online keys: every project gets the scale it
      # had, every reference names the project's own by id, and down()
      # gives the text back.
      - name: Test security case priorities and statuses on migrated Postgres
        if: matrix.shard == 3
        working-directory: packages/Common
        env:
          RUN_POSTGRES_SECURITY_CASE_VALUES_TESTS: "true"
          SECURITY_CASE_VALUES_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          SECURITY_CASE_VALUES_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          SECURITY_CASE_VALUES_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Infrastructure/Postgres/AddSecurityCasePrioritiesAndStatusesPostgres.test.ts
          --forceExit

      # Security's Turn on recommended through its route, on copies of the
      # migrated DetectionRule, SecurityPlaybook, SecurityLogSource,
      # SecurityCasePriority and SecurityCaseStatus tables: from nothing,
      # twice (nothing written twice), with one write the database refuses
      # part way (the rest written, the answer naming it), with rules added
      # by hand, on a name column still 50 wide (and WidenDetectionRuleName
      # widening it in place), and every Rule Library entry and playbook
      # template created as it is.
      - name: Test Turn on recommended on migrated Postgres
        if: matrix.shard == 3
        working-directory: packages/Common
        env:
          RUN_POSTGRES_TURN_ON_RECOMMENDED_TESTS: "true"
          TURN_ON_RECOMMENDED_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          TURN_ON_RECOMMENDED_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          TURN_ON_RECOMMENDED_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Utils/SecurityEvent/TurnOnRecommendedPostgres.test.ts
          --forceExit

      # Entity risk on copies of the migrated User, Project,
      # SecurityEntityRisk and SecurityEntityCriticality tables, through the
      # real services: a finding writes one row and the next about the same
      # entity (whatever its case) adds to it, its sources and history as
      # jsonb; the unique (projectId, entityKey) index; criticality read from
      # its table; the refresh's riskExpiresAt <= now and forgetting a month
      # quiet; Reset Risk's delete. The lock and the case ingest stood in.
      - name: Test entity risk on migrated Postgres
        if: matrix.shard == 3
        working-directory: packages/Common
        env:
          RUN_POSTGRES_SECURITY_ENTITY_RISK_TESTS: "true"
          SECURITY_ENTITY_RISK_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          SECURITY_ENTITY_RISK_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          SECURITY_ENTITY_RISK_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Utils/SecurityEvent/EntityRisk/SecurityEntityRiskPostgres.test.ts
          --forceExit

      # The Enterprise half: GET /team/compliance-status/:teamId end to end -
      # rules written through the real settings service, members' notification
      # rules and methods seeded as rows, and every query the ee status service
      # builds run by Postgres.
      - name: Install ee for the Enterprise Postgres suite
        if: matrix.shard == 3
        uses: ./.github/actions/npm-install
        with:
          working-directory: ee
          command: ci
          args: --ignore-scripts
      - name: Test team compliance status on migrated Postgres (Enterprise)
        if: matrix.shard == 3
        working-directory: ee
        env:
          RUN_POSTGRES_TEAM_COMPLIANCE_TESTS: "true"
          TEAM_COMPLIANCE_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          TEAM_COMPLIANCE_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          TEAM_COMPLIANCE_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest
          Tests/Server/TeamCompliance/TeamComplianceStatusPostgres.test.ts
          --selectProjects server --runInBand --forceExit

      # The audit log exporter (Enterprise) on copies of the migrated Project,
      # User and AuditLogExport tables: exports saved through the real service,
      # sent by the real exporter, the cursor and failure state written by its
      # compare-and-set UPDATE - across a restart and two racing exporters, a
      # project's export kept to its project, Export From, a pause, and the
      # project's foreign key.
      - name: Test the audit log exporter on migrated Postgres (Enterprise)
        if: matrix.shard == 3
        working-directory: ee
        env:
          RUN_POSTGRES_AUDIT_LOG_EXPORT_TESTS: "true"
          AUDIT_LOG_EXPORT_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          AUDIT_LOG_EXPORT_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          AUDIT_LOG_EXPORT_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest
          Tests/Server/AuditLogExport/AuditLogExporterPostgres.test.ts
          --selectProjects server --runInBand --forceExit

      # Backups (Enterprise): PostgreSQL's half with the real pg_dump and
      # pg_restore on this job's server - a database dumped while in use,
      # streamed into a storage, read back, restored beside the live one
      # byte for byte, switched in with the connections to it ended, and
      # dropped - in databases of its own. The runner image carries the
      # PostgreSQL client tools; they are installed if it ever does not.
      - name: Make sure pg_dump and pg_restore are here
        if: matrix.shard == 3
        run: command -v pg_dump || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Test backing up and restoring PostgreSQL on a real server (Enterprise)
        if: matrix.shard == 3
        working-directory: ee
        env:
          RUN_POSTGRES_BACKUP_TESTS: "true"
          BACKUP_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          BACKUP_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest
          Tests/Server/Backup/PostgresBackupEnginePostgres.test.ts
          --selectProjects server --runInBand --forceExit
