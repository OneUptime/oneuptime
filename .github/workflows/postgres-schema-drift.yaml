      - name: Test the receiving ledger on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_INSTANCE_RECEIVING_TESTS: "true"
          INSTANCE_RECEIVING_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          INSTANCE_RECEIVING_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
