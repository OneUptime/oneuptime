          STATUS_PAGE_PRIVACY_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          STATUS_PAGE_PRIVACY_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/StatusPagePrivateUserReadAccessPostgres.test.ts
          --forceExit

      # Clones the migrated status page session, private user and SSO
      # provider tables into an isolated schema: a session counts only while
