          WORKSPACE_MEMBER_ACTION_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          WORKSPACE_MEMBER_ACTION_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Utils/Workspace/WorkspaceMemberActionsPostgres.test.ts
          --forceExit

      - name: Test workflow OAuth variables on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_WORKFLOW_VARIABLE_OAUTH_TESTS: "true"
          WORKFLOW_VARIABLE_OAUTH_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          WORKFLOW_VARIABLE_OAUTH_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          WORKFLOW_VARIABLE_OAUTH_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
          DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/WorkflowVariableOAuthPostgres.test.ts
          --forceExit

      # Clones the migrated TeamMember and Team tables, every personal
      # notification table and the on-call history into an isolated schema,
      # with the foreign keys between them: membership is an accepted
      # membership of that very project, nothing is sent through the setting
      # row of somebody who is not a member, removing somebody's last
      # membership removes their own notification settings for that project
      # and nothing else while the on-call history stays, and the data
      # migration's walk removes former members' leftovers only.
      - name: Test project membership and leaving a project on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_PROJECT_MEMBERSHIP_TESTS: "true"
          PROJECT_MEMBERSHIP_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          PROJECT_MEMBERSHIP_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
