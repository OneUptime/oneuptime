name: Postgres Schema Drift

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  # Migrates an empty database with every migration registered in
  # SchemaMigrations/Index.ts, then asks TypeORM to generate a migration against
  # the result. A correct migration set leaves nothing to generate.
  #
  # This catches the two ways the schema silently rots: an entity edited without
  # a migration, and a migration file generated but never added to Index.ts (it
  # never runs, so production never gets the column). It also proves the whole
  # chain still applies to an empty database — the path every new install takes.
  postgres-schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
      # LocalMigrationGenerationDataSource defaults to localhost:5400, which is
      # where docker compose publishes Postgres locally. The service below is
      # mapped to the same port so local and CI runs are the same command.
      DATABASE_MIGRATIONS_HOST: localhost
      DATABASE_MIGRATIONS_PORT: 5400
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: oneuptimedb
    services:
      postgres:
        # Docker Hub's postgres, from mirror.gcr.io: the runner starts service
        # containers before any step, so a daemon mirror cannot apply
        # (.github/actions/docker-hub-mirror).
        image: mirror.gcr.io/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneuptimedb
        ports:
          - 5400:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # typeorm + ts-node live in the root package; the entities the check
      # reflects over resolve their imports through Common's.
      - name: Install root dependencies
        uses: ./.github/actions/npm-install
      - name: Install Common dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Common

      - name: Check for Postgres schema drift
        run: npm run check-postgres-schema-drift

      # The suite clones the migrated Alert and Incident table structures into
      # an isolated schema, so it must run after the registered migrations.
      - name: Test AI investigation decision persistence
        working-directory: packages/Common
        env:
          RUN_POSTGRES_AI_INVESTIGATION_TESTS: "true"
          AI_INVESTIGATION_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          AI_INVESTIGATION_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          AI_INVESTIGATION_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/AIInvestigationDecisionPostgres.test.ts --forceExit

      # The daily AI limit's owner notice (one conditional UPDATE decides the
      # once-a-day email, even when servers race) and the catch-up that
      # investigates the incidents and alerts the limit skipped (its jsonb
      # read and compare-and-set), on structure-only copies of the migrated
      # tables in a schema of their own.
      - name: Test the daily AI limit's notice and catch-up on Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_AI_DAILY_LIMIT_TESTS: "true"
          AI_DAILY_LIMIT_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          AI_DAILY_LIMIT_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          AI_DAILY_LIMIT_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/AIDailyLimitNoticeAndCatchUpPostgres.test.ts
          --forceExit

      # The one-time notice to owners of projects already below the plans
      # their API keys and SCIM connections need: one conditional UPDATE
      # claims it (workers racing included), and the whole run, on real
      # rows, tells each project's owners once.
      - name: Test the plan cut-off notice on Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_PLAN_CUTOFF_NOTICE_TESTS: "true"
          PLAN_CUTOFF_NOTICE_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          PLAN_CUTOFF_NOTICE_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          PLAN_CUTOFF_NOTICE_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/PlanCutoffNoticePostgres.test.ts
          --forceExit

      # When a project's AI credits run out: the one conditional UPDATE that
      # tells the owners once each time (even when servers race) and that a
      # recharge re-arms, the recharge's atomic credit, and Auto Recharge
      # charging once for many callers, on a structure-only copy of the
      # migrated Project table.
      - name: Test AI credits running out on Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_AI_CREDITS_TESTS: "true"
          AI_CREDITS_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          AI_CREDITS_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          AI_CREDITS_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/AICreditsRunOutPostgres.test.ts --forceExit

      # The balance SMS, calls, WhatsApp and Telegram are paid from: costs
      # and recharge credits are one statement each, so messages sent
      # together all pay and a cost taken while a charge was out is kept;
      # Auto Recharge charges the card once for many messages; the owners'
      # low-balance email is one conditional UPDATE claim. On a
      # structure-only copy of the migrated Project table, with real
      # concurrency.
      - name: Test the SMS and call balance on Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_MESSAGING_BALANCE_TESTS: "true"
          MESSAGING_BALANCE_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          MESSAGING_BALANCE_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          MESSAGING_BALANCE_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/MessagingBalancePostgres.test.ts --forceExit

      - name: Test episode member deletion on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_EPISODE_MEMBER_DELETE_TESTS: "true"
          EPISODE_MEMBER_DELETE_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          EPISODE_MEMBER_DELETE_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          EPISODE_MEMBER_DELETE_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/EpisodeMemberDeletePostgres.test.ts --forceExit

      # A person adds only an incident or alert they can see to an episode
      # they can see, and neither side's feed entry - nor the episode's Slack
      # / Teams post - names the other side when it is private.
      - name: Test adding to an episode with private ends on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_EPISODE_MEMBER_PRIVATE_ENDS_TESTS: "true"
          EPISODE_MEMBER_PRIVATE_ENDS_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          EPISODE_MEMBER_PRIVATE_ENDS_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          EPISODE_MEMBER_PRIVATE_ENDS_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/EpisodeMemberPrivateEndsPostgres.test.ts
          --forceExit

      # An incident's or alert's episode follows the episode's members only:
      # a create or update that names it is refused for every caller, and
      # joining and leaving through the members still moves it.
      - name: Test episode reference writes on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_EPISODE_REFERENCE_WRITE_TESTS: "true"
          EPISODE_REFERENCE_WRITE_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          EPISODE_REFERENCE_WRITE_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          EPISODE_REFERENCE_WRITE_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/EpisodeReferenceWritePostgres.test.ts --forceExit

      # An episode's members show their incident or alert, and their episode,
      # through joins that run neither one's privacy rules: a member row is
      # listed, counted, read and removed only by someone who may see both.
      - name: Test episode member privacy on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_EPISODE_MEMBER_PRIVACY_TESTS: "true"
          EPISODE_MEMBER_PRIVACY_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          EPISODE_MEMBER_PRIVACY_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          EPISODE_MEMBER_PRIVACY_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/EpisodeMemberPrivacyPostgres.test.ts --forceExit

      # An episode a private incident or alert opens is stored with the title
      # in its grouping key hashed: later records find it, and every episode
      # stored before titles were hashed, by either form of their key.
      - name: Test episode grouping keys on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_EPISODE_GROUPING_KEY_TESTS: "true"
          EPISODE_GROUPING_KEY_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          EPISODE_GROUPING_KEY_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          EPISODE_GROUPING_KEY_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/EpisodeGroupingKeyPostgres.test.ts --forceExit

      # A record's live update reaches the people its own read lets read it:
      # labels, owners, blocks with labels (and the labelled records a
      # label-less row names), private incidents, a person's own AI
      # conversation, and deletes decided before the rows go.
      - name: Test who hears about a record's live updates on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_REALTIME_AUDIENCE_TESTS: "true"
          REALTIME_AUDIENCE_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          REALTIME_AUDIENCE_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          REALTIME_AUDIENCE_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Utils/Realtime/RealtimeAudiencePostgres.test.ts --forceExit

      # Clones the migrated Databases tables (DatabaseServer, its endpoints,
      # labels, owners, incident / alert / maintenance links and the
      # Kubernetes / Docker / Podman parents) into an isolated schema and runs
      # the product's hand-written SQL against them. The second suite holds
      # the container command projection Postgres computes to its JavaScript
      # twin (reduceContainerCommand), which the discovery job classifies by.
      # The third runs the metrics snapshot's container upsert on session TEMP
      # tables: agent labels merged into a row's labels, the start time only
      # moving forward.
      - name: Test the Databases product's SQL against the migrated schema
        working-directory: packages/Common
        env:
          RUN_POSTGRES_DATABASE_SERVER_SQL_TESTS: "true"
          DATABASE_SERVER_SQL_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          DATABASE_SERVER_SQL_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          DATABASE_SERVER_SQL_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/DatabaseServerSqlPostgres.test.ts
          Tests/Types/DatabaseServer/DatabaseContainerCommandPostgres.test.ts
          Tests/Server/Services/ContainerSnapshotUpsertPostgres.test.ts
          --forceExit

      # Clones the migrated Queues tables (MessageQueue, its labels and owners,
      # and Label) into an isolated schema and runs the product's
      # hand-written SQL against them: the partial identity index and
      # discovery racing on it, the family refinement, the auto-archive
      # sweep's "untouched" rules (the generated-name predicate included),
      # its window, bound and order, the budget count, the automatic
      # assignment bookkeeping, the sighting heartbeat, and a person's create
      # and restore through the real pipelines.
      - name: Test the Queues product's SQL against the migrated schema
        working-directory: packages/Common
        env:
          RUN_POSTGRES_MESSAGE_QUEUE_SQL_TESTS: "true"
          MESSAGE_QUEUE_SQL_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          MESSAGE_QUEUE_SQL_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          MESSAGE_QUEUE_SQL_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/MessageQueueSqlPostgres.test.ts --forceExit

      # Clones the migrated Service table and holds a row lock from a second
      # connection: the SKIP LOCKED heartbeat write must yield AND report it.
      - name: Test the non-blocking heartbeat write against Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_UPDATE_IF_UNLOCKED_TESTS: "true"
          UPDATE_IF_UNLOCKED_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          UPDATE_IF_UNLOCKED_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          UPDATE_IF_UNLOCKED_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/DatabaseServiceUpdateColumnsIfUnlockedPostgres.test.ts --forceExit

      # Clones the migrated Workflow table (its unique key included) into an
      # isolated schema: the incoming email key's compare-and-set must write
      # once and let exactly one racing save win, no workflow may take
      # another's key, and an email must start the run of the key's workflow.
      - name: Test the workflow incoming email key against Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_WORKFLOW_EMAIL_KEY_TESTS: "true"
          WORKFLOW_EMAIL_KEY_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          WORKFLOW_EMAIL_KEY_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          WORKFLOW_EMAIL_KEY_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/WorkflowIncomingEmailSecretKeyPostgres.test.ts --forceExit

      # Clones the migrated HuntressConnection and HuntressIncidentReport tables
      # into an isolated schema: the signing secret is written encrypted and a
      # new one clears the last refusal, and of two deliveries racing to claim
      # one Huntress report the unique index lets exactly one through - what
      # "one incident per report" rests on.
      - name: Test Huntress connections and report claims on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_HUNTRESS_TESTS: "true"
          HUNTRESS_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          HUNTRESS_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          HUNTRESS_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/HuntressPostgres.test.ts --forceExit

      # Clones the migrated IoTDevice and sibling inventory tables into an
      # isolated schema and executes each service's hand-built
      # UPDATE ... FROM (VALUES ...) latest-metric mirror write against them.
      # A VALUES tuple / alias / param mismatch only fails on a real driver.
      - name: Test the inventory latest-metric mirror writes against Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_LATEST_METRICS_TESTS: "true"
          LATEST_METRICS_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          LATEST_METRICS_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          LATEST_METRICS_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/IoTDeviceLatestMetricsPostgres.test.ts --forceExit

      # Clones the migrated NetworkDevice, CloudResource and InventoryItem
      # tables into an isolated schema and runs the inventory mirror's
      # reconcile against them. jsonb reorders an attribute bag's keys, so
      # only a real database shows whether a steady-state pass writes nothing.
      - name: Test the inventory mirror reconcile against Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_INVENTORY_MIRROR_TESTS: "true"
          INVENTORY_MIRROR_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          INVENTORY_MIRROR_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          INVENTORY_MIRROR_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Utils/Telemetry/InventoryMirrorPostgres.test.ts --forceExit

      # Clones the migrated CloudResource table into an isolated schema and
      # runs the discovered resources' sweeps against it: Not reporting,
      # auto-archive, restore when a resource reports again, and the budget's
      # count - set-based raw SQL only a real database can check.
      - name: Test the Cloud Resource sweeps against Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_CLOUD_RESOURCE_SWEEP_TESTS: "true"
          CLOUD_RESOURCE_SWEEP_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          CLOUD_RESOURCE_SWEEP_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          CLOUD_RESOURCE_SWEEP_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/CloudResourceMonitoredSweepsPostgres.test.ts
          --forceExit

      # Clones the migrated IncidentAlert (and its FKs/unique index) into an
      # isolated schema, so it must run after the registered migrations.
      - name: Test IncidentAlert link table on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_INCIDENT_ALERT_TESTS: "true"
          INCIDENT_ALERT_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          INCIDENT_ALERT_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          INCIDENT_ALERT_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/IncidentAlertPostgres.test.ts --forceExit

      # Clones the migrated IncidentForm and IncidentFormSubmission tables
      # (their foreign keys and the link key's unique constraint) into an
      # isolated schema, so it must run after the registered migrations.
      - name: Test incident forms on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_INCIDENT_FORM_TESTS: "true"
          INCIDENT_FORM_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          INCIDENT_FORM_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          INCIDENT_FORM_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/IncidentFormPostgres.test.ts --forceExit

      # Clones the migrated UserProjectSsoConsent table (and its unique index)
      # into an isolated schema: two racing confirmations must leave one row.
      - name: Test project SSO consent records on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_SSO_CONSENT_TESTS: "true"
          SSO_CONSENT_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          SSO_CONSENT_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          SSO_CONSENT_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/UserProjectSsoConsentPostgres.test.ts --forceExit

      # Clones the migrated User table into an isolated schema: a signup that
      # names an existing user's id must be refused and leave that row as it
      # was, because TypeORM's save() would otherwise UPDATE it in place.
      - name: Test signup cannot overwrite an existing user on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_SIGNUP_ID_TESTS: "true"
          SIGNUP_ID_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          SIGNUP_ID_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          SIGNUP_ID_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/UserSignupIdTakeoverPostgres.test.ts --forceExit

      # Clones the migrated Project table into an isolated schema: POST
      # /api/project with a tenantid header must insert a new project and
      # leave the one the header named as it was. Project's tenant column is
      # its own id, so a create that carried the tenant's id would be an
      # UPDATE of that project in place.
      - name: Test project creation cannot overwrite the tenant project on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_PROJECT_TENANT_CREATE_TESTS: "true"
          PROJECT_TENANT_CREATE_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          PROJECT_TENANT_CREATE_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          PROJECT_TENANT_CREATE_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/API/ProjectCreateWithTenantHeaderPostgres.test.ts --forceExit

      # Clones the migrated Incident / Alert / Scheduled Maintenance reminder
      # rule tables (with their junctions, the trigger that encodes a
      # criteria-backed rule's enabled state, and the tables the reminder
      # refresh reads and writes) into an isolated schema, so it must run
      # after the registered migrations. The criteria-backed isEnabled filter
      # is raw SQL only Postgres can judge (#4030).
      - name: Test reminder rule lookup on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_REMINDER_RULE_TESTS: "true"
          REMINDER_RULE_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          REMINDER_RULE_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          REMINDER_RULE_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/ReminderRuleLookupPostgres.test.ts --forceExit

      # Clones the migrated InventoryItem / InventoryItemRelationship tables
      # (with their indexes, the new entity-key one included) into an isolated
      # schema and runs the Topology API's SQL against fixtures: nesting
      # choice, activity, winners among duplicate keys, collections, keyset
      # paging, search escaping and the drawer's sections. The differential
      # suite then checks the same SQL against a reference implementation of
      # the spec on seeded random estates, the activity parity suite checks
      # the SQL activity predicate against the Dashboard's over a truth table,
      # and the migration suite runs the entity-key index migration's build
      # and skip branches against a clone of InventoryItem.
      - name: Test the Topology API's SQL against the migrated schema
        working-directory: packages/Common
        env:
          RUN_POSTGRES_TOPOLOGY_TESTS: "true"
          TOPOLOGY_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          TOPOLOGY_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          TOPOLOGY_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Utils/Topology/TopologyQueriesPostgres.test.ts
          Tests/Server/Utils/Topology/TopologyQueriesDifferentialPostgres.test.ts
          Tests/Server/Utils/Topology/TopologyActivityParityPostgres.test.ts
          Tests/Server/Utils/Topology/InventoryItemEntityKeyIndexMigrationPostgres.test.ts
          --forceExit

      # Clones the migrated StatusPage and subscriber notification template
