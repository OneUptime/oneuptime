          RULE_CRITERIA_MIGRATION_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          RULE_CRITERIA_MIGRATION_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
