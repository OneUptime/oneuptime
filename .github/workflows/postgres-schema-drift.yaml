        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Utils/TeamMember/ProjectMembershipPostgres.test.ts
          --forceExit

      # Clones the migrated UserPush, PushNotificationLog and
      # UserOnCallLogTimeline tables into an isolated schema. An Expo push
      # receipt saying DeviceNotRegistered stops every phone with the token
      # being verified - every account and project, never a browser - so
      # paging and readiness no longer find it; the push log and the page's
      # timeline row that said "sent" say "not delivered", an acknowledged
      # page is left alone; a phone whose app registered again after the push
      # stays verified; and a phone naming its old token carries the new one
      # on its own device only.
      - name: Test Expo push receipts on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_EXPO_PUSH_RECEIPTS_TESTS: "true"
          EXPO_PUSH_RECEIPTS_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          EXPO_PUSH_RECEIPTS_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          EXPO_PUSH_RECEIPTS_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/ExpoPushReceiptsPostgres.test.ts --forceExit

      # Clones the migrated PacketCapture, File and Probe tables into an
      # isolated schema and runs packet capture's hand-written SQL: a probe
      # claims only its own Pending captures (FOR UPDATE SKIP LOCKED), hears
      # only its own stops, settles only its own captures, and the server
      # counts the packets in the uploaded file; Stop from the dashboard, the
      # stale capture sweep and the retention sweep (files included).
      - name: Test packet capture's SQL on migrated Postgres
        working-directory: packages/Common
        env:
          RUN_POSTGRES_PACKET_CAPTURE_SQL_TESTS: "true"
          PACKET_CAPTURE_SQL_TEST_DATABASE_HOST: ${{ env.DATABASE_MIGRATIONS_HOST }}
          PACKET_CAPTURE_SQL_TEST_DATABASE_PORT: ${{ env.DATABASE_MIGRATIONS_PORT }}
          PACKET_CAPTURE_SQL_TEST_DATABASE_NAME: ${{ env.DATABASE_NAME }}
        run: >-
          node --max-old-space-size=4096 node_modules/.bin/jest --runInBand
          Tests/Server/Services/PacketCaptureSqlPostgres.test.ts --forceExit

      # Clones the migrated Project, Probe, VMwareVCenter and
      # VMwareVCenterConnectionTest tables into an isolated schema and runs
