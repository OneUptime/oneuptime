name: Mobile Recorder Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  # Not on every push to main: each pull request was tested on its merge
  # with main, and main runs this nightly and on demand instead
  # (Tests/Ops/PullRequestChecksNotOnPush.test.js says why).
  schedule:
    - cron: "19 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install Mobile Recorder dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/App/FeatureSet/MobileRecorder
      - name: Test Mobile Recorder
        run: cd packages/App/FeatureSet/MobileRecorder && npm run test
