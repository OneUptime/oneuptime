name: Browser Recorder Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # In the Playwright image, as App Test's Dashboard Offline UI groups are:
    # Chromium and its system packages and fonts are in it, so nothing is
    # fetched from the runner's Ubuntu mirror. Tests/RealBrowser finds the
    # image's Chromium through PLAYWRIGHT_BROWSERS_PATH, which the image
    # sets. The limit holds the suite's own, about 7 minutes for checkout and
    # the npm install, and 5 for the image's pull (Tests/Ops/PlaywrightImage).
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # No Common install: the recorder is bundled for third-party origins and
      # must not pull server dependencies. The shared pure logic it does use
      # (masking, sampling, URL scrubbing) is inlined by the bundler at build
      # time and unit-tested on the Common side.
      - name: Install Browser Recorder dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/App/FeatureSet/BrowserRecorder
      # Tests/RealBrowserVitals.test.ts drives a real Chromium over CDP: a
      # prerendered page, a background tab and the back/forward cache are
      # things jsdom cannot be (issue #5181). The image's Chromium, the build
      # of the Playwright packages/E2E locks; on CI the suite fails rather
      # than skips when no browser is there. About a minute.
      - timeout-minutes: 10
        run: cd packages/App/FeatureSet/BrowserRecorder && npm run test
