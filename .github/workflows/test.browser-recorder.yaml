name: Browser Recorder Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Holds the Chromium install's own limit, the suite's, and about 7 minutes
    # for checkout and the npm install (Tests/Ops/BrowserInstallLimits). With
    # no limit, a hung install holds the runner for GitHub's six-hour default.
    timeout-minutes: 42
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # No Common install: the recorder is bundled for third-party origins and
      # must not pull server dependencies. The shared pure logic it does use
      # (masking, sampling, URL scrubbing) is inlined by the bundler at build
      # time and unit-tested on the Common side.
      - name: Install Browser Recorder dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/App/FeatureSet/BrowserRecorder
      # Tests/RealBrowserVitals.test.ts drives a real Chromium over CDP: a
      # prerendered page, a background tab and the back/forward cache are
      # things jsdom cannot be (issue #5181). Playwright's Chromium build,
      # pinned to the version packages/E2E uses; on CI the suite fails
      # rather than skips when no browser is there. `--with-deps` fetches
      # Chromium's system packages and fonts from the runner's Ubuntu mirror:
      # about 25 seconds, but some runners are served at a few dozen kB/s, so
      # the install has the 25 minutes the other browser installs have.
      - name: Install Chromium for the real-browser vitals test
        working-directory: packages/App/FeatureSet/BrowserRecorder
        timeout-minutes: 25
        run: npx --yes playwright@1.63.0 install --with-deps chromium
      # About a minute.
      - timeout-minutes: 10
        run: cd packages/App/FeatureSet/BrowserRecorder && npm run test
