          # failure that broke app-docker-image-merge on master).
          driver: docker

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | bash ./Scripts/GHA/docker_login.sh --username "${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | bash ./Scripts/GHA/docker_login.sh --registry ghcr.io --username "${{ github.repository_owner }}"

      - name: Merge multi-arch manifests
        run: |
          VERSION="${{needs.read-version.outputs.major_minor}}-test"
          SANITIZED_VERSION="${VERSION//+/-}"
          bash ./Scripts/GHA/merge_docker_manifests.sh \
            --image app \
            --tags "${SANITIZED_VERSION},test,enterprise-${SANITIZED_VERSION},enterprise-test"

  # ─── Non-Docker jobs (unchanged) ─────────────────────────────────────

  # Exercise the real publish script in dry-run mode: generation, deletion-aware
  # sync, local commit + tag, go vet/test, and the full GoReleaser build + sign.
  # Nothing is pushed to the real provider repo and no release is created, but
  # publish-path bugs surface here instead of during a production release.
  publish-terraform-provider:
    runs-on: ubuntu-latest
    needs: [read-version, generate-build-number]
    timeout-minutes: 120
    env:
      CI_PIPELINE_ID: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6.1.0
        with:
          install-only: true
          # Pin to v2.x for the same reason as release.yml: a future v3 with
          # renamed flags/config must not silently break this job.
          version: '~> v2'

      - name: Install dependencies
        run: |
          npm install
          if [ -d "Common" ]; then cd Common && npm install && cd ..; fi
          if [ -d "Scripts" ]; then cd Scripts && npm install && cd ..; fi

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            # %b: the secret stores newlines as literal \n — see release.yml.
            printf '%b\n' "$GPG_PRIVATE_KEY" > private.key
            # `gpg --import` can exit non-zero on a non-fatal warning (e.g. an
            # "invalid armor header" on stray whitespace/comment lines in the
            # secret) even when the actual key material imports successfully, so
            # don't let its exit status abort the step under `set -e`. The
            # `gpg --list-secret-keys` check below is the real gate: it fails the
            # step only when no usable secret key ended up in the keyring.
            gpg --batch --import private.key || true
            rm -f private.key
          else
            # No signing secret available: generate a throwaway key so the
            # dry run still exercises GoReleaser's sign step end to end.
            printf '%s\n' \
              '%no-protection' \
              'Key-Type: RSA' \
              'Key-Length: 3072' \
              'Name-Real: OneUptime Test Release' \
              'Name-Email: test-release@oneuptime.com' \
              'Expire-Date: 1d' \
              '%commit' | gpg --batch --gen-key
          fi
          if ! gpg --list-secret-keys --keyid-format=long | grep -q '^sec'; then
            echo "::error::No GPG secret key available for the dry-run sign step."
            exit 1
          fi

      - name: Dry-run Terraform provider publish
        run: |
          VERSION="${{needs.read-version.outputs.major_minor}}-test"
          npm run publish-terraform-provider -- --version "$VERSION" --test-release --dry-run


  test-helm-chart:
    runs-on: ubuntu-latest
    needs: [infrastructure-agent-deploy, publish-terraform-provider, home-docker-image-merge, test-server-docker-image-merge, test-docker-image-merge, probe-docker-image-merge, runner-docker-image-merge, app-docker-image-merge, nginx-docker-image-merge, e2e-docker-image-merge]
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      # Docker compose needs a lot of space to build images, so we need to free up some space first in the GitHub Actions runner
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: cd HelmChart && cd Tests && bash index.sh

  test-e2e-test-saas:
    runs-on: ubuntu-latest
    needs: [test-helm-chart, generate-build-number, read-version]
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      # Docker compose needs a lot of space to build images, so we need to free up some space first in the GitHub Actions runner
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Preinstall and enable billing
        run: |
          set -euo pipefail
          npm run prerun
          bash ./Tests/Scripts/enable-billing-env-var.sh
      - name: Inject billing (Stripe) config for SaaS e2e
        env:
          # Secret Stripe credentials (private key + webhook secret must not be
          # committed; the public key is browser-exposed but kept alongside).
          BILLING_PUBLIC_KEY: ${{ secrets.BILLING_PUBLIC_KEY }}
          BILLING_PRIVATE_KEY: ${{ secrets.BILLING_PRIVATE_KEY }}
          BILLING_WEBHOOK_SECRET: ${{ secrets.BILLING_WEBHOOK_SECRET }}
          # Real Stripe test-mode subscription plans (Stripe account ...ANuQdJ93r7,
          # matching the injected keys and the hardcoded test metered price IDs in
          # BillingService). config.env is gitignored, so CI generates it from
          # config.example.env which ships placeholder price IDs (priceMonthlyId
          # / priceYearlyId); billing-mode project creation subscribes the project
          # to one of these plans via Stripe, so the SaaS e2e job needs the real
          # price IDs. These IDs are non-secret (already served to the browser via
          # /env.js), so they are stored as repo *variables* (auditable, and not
          # masked in logs) rather than secrets.
          SUBSCRIPTION_PLAN_BASIC: ${{ vars.SUBSCRIPTION_PLAN_BASIC }}
          SUBSCRIPTION_PLAN_GROWTH: ${{ vars.SUBSCRIPTION_PLAN_GROWTH }}
          SUBSCRIPTION_PLAN_SCALE: ${{ vars.SUBSCRIPTION_PLAN_SCALE }}
          SUBSCRIPTION_PLAN_ENTERPRISE: ${{ vars.SUBSCRIPTION_PLAN_ENTERPRISE }}
        run: |
          set -euo pipefail
          # Values arrive via the step env (never interpolated into the command)
          # and contain no '|' or newlines, so the sed replacement is safe.
          # Fail fast if any are missing/empty: without them the app silently
          # falls back to config.example.env placeholders and every billing-mode
          # project-creation test fails with an opaque "Server Error".
          for k in BILLING_PUBLIC_KEY BILLING_PRIVATE_KEY BILLING_WEBHOOK_SECRET \
                   SUBSCRIPTION_PLAN_BASIC SUBSCRIPTION_PLAN_GROWTH \
                   SUBSCRIPTION_PLAN_SCALE SUBSCRIPTION_PLAN_ENTERPRISE; do
            v="$(printenv "$k" || true)"
            if [ -z "$v" ]; then
              echo "::error::${k} is empty. Set the matching GitHub Actions secret/variable (Settings > Secrets and variables > Actions)." >&2
              exit 1
            fi
            if grep -q "^${k}=" config.env; then
              sed -i "s|^${k}=.*|${k}=${v}|" config.env
            else
              echo "${k}=${v}" >> config.env
            fi
          done
      - name: Pin APP_TAG to test release
        run: |
          set -euo pipefail
          VERSION="${{needs.read-version.outputs.major_minor}}-test"
          SANITIZED_VERSION="${VERSION//+/-}"
          if [ -f config.env ]; then
            if grep -q '^APP_TAG=' config.env; then
              sed -i "s/^APP_TAG=.*/APP_TAG=${SANITIZED_VERSION}/" config.env
            else
              echo "APP_TAG=${SANITIZED_VERSION}" >> config.env
            fi
          else
            echo "APP_TAG=${SANITIZED_VERSION}" > config.env
          fi
      - name: Expose notification-channel verification codes to the e2e suite
        run: |
          set -euo pipefail
          # TEST-ONLY. The e2e stack has no mailbox, so the API is told to hand
          # back the notification-channel verification code on the create
          # response (Common/Server/Services/UserEmailService.ts). This is set
          # ONLY here, for the ephemeral CI stack; it is never in a shipped
          # config, and production leaves it empty so the code stays emailed.
          KEY=EXPOSE_VERIFICATION_CODE_IN_API_RESPONSE_FOR_E2E
          if [ -f config.env ] && grep -q "^${KEY}=" config.env; then
            sed -i "s|^${KEY}=.*|${KEY}=true|" config.env
          else
            echo "${KEY}=true" >> config.env
          fi
      - name: Start Server with release tag
        run: |
          set -euo pipefail
          export $(grep -v '^#' config.env | xargs)
          export APP_TAG=${{needs.read-version.outputs.major_minor}}-test
          docker compose -f docker-compose.billing.yml up --remove-orphans -d
          npm run status-check
      - name: Wait for server to start
        run: bash ./Tests/Scripts/status-check.sh http://localhost
      - name: Run E2E Tests. Run docker container e2e in docker compose file
        run: |
          export $(grep -v '^#' config.env | xargs)
          export APP_TAG=${{needs.read-version.outputs.major_minor}}-test
          docker compose -f docker-compose.dev.yml up --exit-code-from e2e --abort-on-container-exit e2e || (docker compose -f docker-compose.dev.yml logs e2e && exit 1)
      - name: Upload test results
        uses: actions/upload-artifact@v4
        # Run this on failure
        if: failure()
        with:
          # Name of the artifact to upload.
          # Optional. Default is 'artifact'
          name: test-results-${{ github.job }}-${{ github.run_attempt }}

          # A file, directory or wildcard pattern that describes what to upload
          # Required.
          path: |
            ./E2E


          # Duration after which artifact will expire in days. 0 means using default retention.
          # Minimum 1 day.
          # Maximum 90 days unless changed from the repository settings page.
          # Optional. Defaults to repository settings.
          retention-days: 7


