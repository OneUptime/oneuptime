  # The self-hosted ENTERPRISE stack: the published enterprise- App image booted
  # from docker-compose.yml with billing OFF. Nothing else in CI covers it. The
  # SaaS job boots the same image with billing ON, where EnterpriseEdition
  # answers "OneUptime Cloud" to every check and the license decides nothing;
  # the self-hosted job boots the Community image, which has no ee/ at all. Only
  # here does the LICENSE decide whether SSO, SCIM and audit logging run.
  #
  # The suite runs in two phases against one stack:
  #
  #   A  licensed - a fresh Enterprise install is inside its 14-day unlicensed
  #      trial, so the 44 identity routes answer through nginx, the dashboard
  #      renders the SSO/OIDC/SCIM and audit-log screens instead of the upsell,
  #      and the audit recorder writes a real row to ClickHouse.
  #   B  lapsed - the trial is pushed into the past and the SAME stack is
  #      re-probed: the license gates refuse (402/403, not 404 - the routes are
  #      still mounted), enterprise configuration becomes read-only, and
  #      password sign-in still works.
  #
  # In-process jest suites (test.ee.yaml) already cover route mounting, the gate
  # matrix, recorder eligibility and the license classifier. What only a booted
  # stack proves is the published image, nginx's /identity rewrite, the shipped
  # UI bundles, and a real ClickHouse write - so this job asserts those.
  test-e2e-test-enterprise:
    runs-on: ubuntu-latest
    needs: [test-helm-chart, generate-build-number, read-version]
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      # Docker compose needs a lot of space to build images, so we need to free up some space first in the GitHub Actions runner
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate
      # Billing stays OFF here, deliberately: no Tests/Scripts/enable-billing-env-var.sh
      # and no Stripe configuration. This job exists to exercise the self-hosted
      # Enterprise path, and billing on would short-circuit every license check.
      - name: Preinstall
        run: |
          set -euo pipefail
          npm run prerun
      # Billing is off, so the Enterprise Edition is requested through the image
      # tag alone - the enterprise- tag of the App, same one the SaaS job boots.
      - name: Pin APP_TAG to the enterprise test release
        run: |
          set -euo pipefail
          VERSION="${{needs.read-version.outputs.major_minor}}-test"
          SANITIZED_VERSION="enterprise-${VERSION//+/-}"
          if [ -f config.env ]; then
            if grep -q '^APP_TAG=' config.env; then
              sed -i "s/^APP_TAG=.*/APP_TAG=${SANITIZED_VERSION}/" config.env
            else
              echo "APP_TAG=${SANITIZED_VERSION}" >> config.env
            fi
          else
            echo "APP_TAG=${SANITIZED_VERSION}" > config.env
          fi
      - name: Expose notification-channel verification codes to the e2e suite
        run: |
          set -euo pipefail
          # TEST-ONLY, and the same step the SaaS e2e job runs. The e2e stack has
          # no mailbox, so the API is told to hand back the notification-channel
          # verification code on the create response
          # (Common/Server/Services/UserEmailService.ts). The enterprise suites
          # sign up their own accounts, so they need it too. This is set ONLY
          # here, for the ephemeral CI stack; it is never in a shipped config,
          # and production leaves it empty so the code stays emailed.
          KEY=EXPOSE_VERIFICATION_CODE_IN_API_RESPONSE_FOR_E2E
          if [ -f config.env ] && grep -q "^${KEY}=" config.env; then
            sed -i "s|^${KEY}=.*|${KEY}=true|" config.env
          else
            echo "${KEY}=true" >> config.env
          fi
          # Also surface it as a real environment variable for every later step,
          # so `docker compose` interpolates ${KEY} straight from the process
          # env and does not depend on the config.env round-trip.
          echo "${KEY}=true" >> "$GITHUB_ENV"
      # The App tag this job boots is a published enterprise- image, and the
      # whole job is meaningless if it is not really the Enterprise Edition: a
      # Community image would answer 404 to every identity route and phase B
      # would "pass" for the wrong reason. Check it before booting it: ee/ in
      # the image and in its UI bundles, and the loader actually loading it.
      - name: Check the App image is the Enterprise Edition
        env:
          APP_IMAGE: oneuptime/app:enterprise-${{needs.read-version.outputs.major_minor}}-test
        run: |
          set -euo pipefail
          docker pull "$APP_IMAGE"
          bash ./Scripts/GHA/check_app_image_edition.sh --image "$APP_IMAGE" --edition enterprise
      - name: Start Server with release tag
        run: |
          set -euo pipefail
          export $(grep -v '^#' config.env | xargs)
          export APP_TAG=enterprise-${{needs.read-version.outputs.major_minor}}-test
          # No billing overlay: BILLING_ENABLED stays false, which is the point
          # of this job. The e2e overlay publishes ClickHouse on the runner's
          # loopback for the fixtures; see the header of
          # packages/E2E/docker-compose.e2e-clickhouse.yml.
          docker compose -f docker-compose.yml -f packages/E2E/docker-compose.e2e-clickhouse.yml up --remove-orphans -d
          npm run status-check
      - name: Wait for server to start
        run: bash ./Tests/Scripts/status-check.sh http://localhost
      - name: Report the edition and license the stack booted with (non-fatal)
        run: |
          set +e
          echo "GET /api/global-config/license:"
          curl -sS --max-time 15 http://localhost/api/global-config/license
          echo ""
      # PHASE A. A fresh Enterprise install is inside its unlicensed 14-day
      # trial, so the license is usable and every enterprise feature is on.
      #
      # `run --rm` rather than `up --exit-code-from e2e`: the e2e image's default
      # CMD is the whole default suite (`npm test`), and there is no other way to
      # run a subset. `run` overrides the command, streams the suite's output
      # into this step, propagates the suite's exit code, and removes the
      # container afterwards - so there is no e2e container left to `logs` on
      # failure, only the stack's own containers, which is where a 500 explains
      # itself anyway.
      - name: Run E2E Tests (phase A, licensed enterprise stack)
        run: |
          export $(grep -v '^#' config.env | xargs)
          export APP_TAG=enterprise-${{needs.read-version.outputs.major_minor}}-test
          docker compose --project-directory . -f Scripts/Dev/docker-compose.dev.yml run --rm e2e npm run test-enterprise-licensed || (bash ./Tests/Scripts/dump-container-logs.sh docker-compose.yml; exit 1)
      # PHASE B, step 1: make the license lapse.
      #
      # WHY psql. There is deliberately no test hook, no env var and no API for
      # faking a license state - a switch that could say "pretend this install is
      # licensed" is a switch an unlicensed install could flip, so it does not
      # exist. The only way to reach the lapsed state is the way a real install
      # reaches it: let the trial run out. The trial is counted from one column,
      # GlobalConfig.enterpriseEditionFirstSeenAt (singleton row
      # 00000000-0000-0000-0000-000000000000), so backdating that column past the
      # 14-day trial is the whole lapse. It is stable because
      # ee/Server/License/LicenseStore.ts stamps the column ONLY when it is
      # missing - a backdated value is never overwritten, by this boot or any
      # later one. 60 days clears the 14-day trial with room to spare.
      - name: Expire the enterprise trial (phase B setup)
        run: |
          set -euo pipefail
          export $(grep -v '^#' config.env | xargs)
          # Heredoc, quoted, so the shell touches none of it: the quoted
          # identifiers and the INTERVAL literal reach psql exactly as written.
          # RETURNING + count so the affected-row count is a value this step can
          # test, rather than a psql status line that -q would swallow.
          ROWS="$(docker compose -f docker-compose.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -qtAX <<'SQL'
          WITH backdated AS (
            UPDATE "GlobalConfig"
               SET "enterpriseEditionFirstSeenAt" = NOW() - INTERVAL '60 days'
            RETURNING 1
          )
          SELECT count(*) FROM backdated;
          SQL
          )"
          ROWS="$(printf '%s' "$ROWS" | tr -d '[:space:]')"
          echo "Backdated GlobalConfig rows: [${ROWS}]"
          if [ "$ROWS" != "1" ]; then
            echo "::error::Backdating GlobalConfig.enterpriseEditionFirstSeenAt updated ${ROWS:-0} row(s), expected 1. Either the singleton GlobalConfig row is missing, or the Enterprise App never stamped the column on boot - which would mean an unlicensed Enterprise install never starts its trial. Fail here rather than run phase B against a license that never lapsed." >&2
            exit 1
          fi
      # PHASE B, step 2: wait for the app to notice. It does NOT need a restart,
      # but it is not instant either: the license inputs are cached for
      # LICENSE_INPUTS_CACHE_TTL_IN_MS (60s, ee/Server/License/LicenseSettings.ts)
      # and the synchronous getCachedSnapshot() the gates use keeps serving the
      # old inputs while it kicks off a background reload
      # (ee/Server/License/LicenseProvider.ts). So poll the public license
      # endpoint - it awaits the reload - until it reports the lapse. Once it
      # does, the reload has landed on the one provider instance that backs every
      # gate in the process, and phase B can start. curl + jq only; both are on
      # the runner image.
      - name: Wait for the license to lapse (phase B setup)
        run: |
          set -uo pipefail
          DEADLINE=$(( $(date +%s) + 180 ))
          ATTEMPT=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            ATTEMPT=$(( ATTEMPT + 1 ))
            PAYLOAD="$(curl -sS --max-time 15 http://localhost/api/global-config/license || true)"
            echo "attempt ${ATTEMPT}: ${PAYLOAD}"
            STATUS="$(printf '%s' "$PAYLOAD" | jq -r '.status' 2>/dev/null || true)"
            # `.licenseValid` is read without jq's `//` default on purpose: `//`
            # treats false as absent, which is exactly the value being waited for.
            VALID="$(printf '%s' "$PAYLOAD" | jq -r '.licenseValid' 2>/dev/null || true)"
            if [ "$STATUS" = "missing" ] && [ "$VALID" = "false" ]; then
              echo "License lapsed after ${ATTEMPT} attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The license never lapsed within 180s of backdating GlobalConfig.enterpriseEditionFirstSeenAt. Expected GET /api/global-config/license to report status=missing and licenseValid=false (the license inputs cache is 60s). The last payload is in this step's log above." >&2
          exit 1
      # PHASE B. Same stack, same data, lapsed license.
      - name: Run E2E Tests (phase B, lapsed enterprise license)
        run: |
          export $(grep -v '^#' config.env | xargs)
          export APP_TAG=enterprise-${{needs.read-version.outputs.major_minor}}-test
          docker compose --project-directory . -f Scripts/Dev/docker-compose.dev.yml run --rm e2e npm run test-enterprise-lapsed || (bash ./Tests/Scripts/dump-container-logs.sh docker-compose.yml; exit 1)
      - name: Upload test results
        uses: actions/upload-artifact@v4
        # Run this on failure
        if: failure()
        with:
          # Name of the artifact to upload.
          # Optional. Default is 'artifact'
          name: test-results-${{ github.job }}-${{ github.run_attempt }}

          # A file, directory or wildcard pattern that describes what to upload
          # Required.
          path: |
            ./packages/E2E


          # Duration after which artifact will expire in days. 0 means using default retention.
          # Minimum 1 day.
          # Maximum 90 days unless changed from the repository settings page.
          # Optional. Defaults to repository settings.
          retention-days: 7


  infrastructure-agent-deploy:
    needs: [read-version, generate-build-number]
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v4

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6.1.0
        with:
          install-only: true

      - name: GoReleaser Version
        run: goreleaser -v

      # This tool is used to generate .rpm and .deb packages
      - name: Install NFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # This job runs the same InfrastructureAgent/.goreleaser.yaml as
      # release.yml, and that config now has an sboms: block. --snapshot does
      # not skip SBOM generation, so without syft on PATH GoReleaser fails the
      # whole job — and this workflow runs on every push to master.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Show GoReleaser version
        run: goreleaser -v

      - name: Run GoReleaser
        run: cd agents/InfrastructureAgent && export GORELEASER_CURRENT_TAG=${{needs.read-version.outputs.major_minor}}.${{needs.generate-build-number.outputs.build_number}} && goreleaser release --clean --snapshot

      - name: Release MSI Images
        run: cd agents/InfrastructureAgent && bash build-msi.sh ${{needs.read-version.outputs.major_minor}}.${{needs.generate-build-number.outputs.build_number}}


      - name: Upload Release Binaries
        uses: actions/upload-artifact@v4
        # Run this on failure
        with:
          # Name of the artifact to upload.
          # Optional. Default is 'artifact'
          name: binaries

          # A file, directory or wildcard pattern that describes what to upload
          # Required.
          path: |
            ./agents/InfrastructureAgent/dist


          # Duration after which artifact will expire in days. 0 means using default retention.
          # Minimum 1 day.
          # Maximum 90 days unless changed from the repository settings page.
          # Optional. Defaults to repository settings.
          retention-days: 7
