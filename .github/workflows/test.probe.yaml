name: Probe Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: cd packages/Common && npm install
      - run: cd packages/Probe && npm install
      - run: cd packages/Probe && npx playwright install --with-deps chromium firefox
      # SyntheticBrowserSlowStorage.test.ts runs Chromium under strace to make
      # its storage slow, and FirefoxNoSyncLibrary.test.ts compiles the no-sync
      # shim with gcc and runs Firefox under strace; on CI both fail rather
      # than skip without these tools.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace gcc
      - run: cd packages/Probe && npm run test
