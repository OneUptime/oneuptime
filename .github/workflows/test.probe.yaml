name: Probe Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs transpile-only: packages/Probe/jest.config.json sets
    # ts-jest's isolatedModules, as App's and Common's do, so ts-jest no longer
    # type-checks each test file together with everything it imports, one file
    # after another (--detectOpenHandles keeps jest in band).
    #
    # Nothing goes unchecked: Probe's tsconfig.json includes ./**/*.ts, so the
    # compile-probe job in the Compile workflow type-checks every test file as
    # part of one tsc program. A type error in a test fails there.
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install Common dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Common
      - name: Install Probe dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Probe
      - run: cd packages/Probe && npx playwright install --with-deps chromium firefox
      # SyntheticBrowserSlowStorage.test.ts runs Chromium under strace to make
      # its storage slow, and FirefoxNoSyncLibrary.test.ts compiles the no-sync
      # shim with gcc and runs Firefox under strace; on CI both fail rather
      # than skip without these tools.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace gcc
      - run: cd packages/Probe && npm run test
