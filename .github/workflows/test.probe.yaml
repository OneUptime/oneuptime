name: Probe Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

# Read-only: these jobs check out and test the code, nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs transpile-only: packages/Probe/jest.config.json sets
    # ts-jest's isolatedModules, as App's and Common's do, so ts-jest no longer
    # type-checks each test file together with everything it imports, one file
    # after another (the test script runs jest in band, --runInBand; it no
    # longer passes --detectOpenHandles: Tests/Ops/JestOpenHandlesInCi).
    #
    # Nothing goes unchecked: Probe's tsconfig.json includes ./**/*.ts, so the
    # compile-probe job in the Compile workflow type-checks every test file as
    # part of one tsc program. A type error in a test fails there.
    #
    # The limit holds the browser install's own limit, each later step's, and
    # about 7 minutes for checkout and the npm installs
    # (Tests/Ops/BrowserInstallLimits), and the apt cache's steps before the
    # install: 7 + 5 + 1 + 45 + 10 + 2 + 5 + 10 + 20. A run takes only one of
    # the two ways through them. With no limit, a hung install holds the
    # runner for GitHub's six-hour default.
    timeout-minutes: 105
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install Common dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Common
      - name: Install Probe dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Probe
      # Chromium and Firefox need about 54 MB of system packages and fonts
      # the runner lacks, and the suite strace (below), all from apt, and the
      # runner's Ubuntu mirror serves some runners at a few dozen kB/s: 11
      # minutes on master on 2026-10-26, and still going at 19 on another
      # run that day. The other browser jobs run in the Playwright image,
      # which has the browsers' packages (Tests/Ops/PlaywrightImage); this
      # suite needs strace and gcc too, which the image lacks. So what apt
      # installs here comes from the Actions cache, keyed on the runner image
      # (whose packages it completes), the Probe's Playwright (which picks
      # the browsers' packages) and this file (which names the rest): a run
      # on an image the cache has seen installs it with no package source at
      # all, and a run on a new image, or with a cache apt cannot install
      # alone, installs from the mirror as before and keeps what it fetched
      # for the next run (Scripts/GHA/apt_archive_cache.sh,
      # Tests/Ops/ProbeAptCache).
      - name: Name the runner image
        id: runner-image
        run: bash ./Scripts/GHA/apt_archive_cache.sh image >>"$GITHUB_OUTPUT"
      - name: Restore what apt installs here from the Actions cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/probe-apt
          key: probe-apt-${{ steps.runner-image.outputs.image }}-${{ hashFiles('packages/Probe/package-lock.json', '.github/workflows/test.probe.yaml') }}
      - name: Install the cached packages, with no package source
        id: apt-from-cache
        if: steps.apt-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: bash ./Scripts/GHA/apt_archive_cache.sh install "${{ runner.temp }}/probe-apt"
      - name: Keep what apt downloads from here on, for the Actions cache
        if: steps.apt-from-cache.outcome != 'success'
        timeout-minutes: 1
        run: bash ./Scripts/GHA/apt_archive_cache.sh keep /var/cache/oneuptime-apt
      # From the mirror. It usually takes 25 seconds; at the pace of a
      # Dashboard Offline UI group's 20-minute install (about 26 MB,
      # 2026-10-22) it would take about 41, so it has 45 of its own.
      - timeout-minutes: 45
        if: steps.apt-from-cache.outcome != 'success'
        run: cd packages/Probe && npx playwright install --with-deps chromium firefox
      # SyntheticBrowserSlowStorage.test.ts runs Chromium under strace to make
      # its storage slow, and FirefoxNoSyncLibrary.test.ts compiles the no-sync
      # shim with gcc and runs Firefox under strace; on CI both fail rather
      # than skip without these tools.
      - timeout-minutes: 10
        if: steps.apt-from-cache.outcome != 'success'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace gcc
      # A new cache entry only where the restore found none: a key that
      # exists cannot be saved again. Two runs missing at once both try to
      # save; the loser only logs a warning.
      - name: Copy out what apt downloaded, for the Actions cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        run: bash ./Scripts/GHA/apt_archive_cache.sh save /var/cache/oneuptime-apt "${{ runner.temp }}/probe-apt"
      - name: Save what apt installed here to the Actions cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/probe-apt
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      # The cache had the browsers' packages: the browsers alone, from
      # Playwright's own download host, not the Ubuntu mirror.
      - timeout-minutes: 10
        if: steps.apt-from-cache.outcome == 'success'
        run: cd packages/Probe && npx playwright install chromium firefox
      # About 7 minutes.
      - timeout-minutes: 20
        run: cd packages/Probe && npm run test
