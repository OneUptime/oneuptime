name: Enterprise Edition Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

# Read-only: these jobs check out and test the code, nothing more.
permissions:
  contents: read

jobs:
  # ee/'s own jest suites: the "server" and "ui" projects in ee/jest.config.js.
  # The Common and App test jobs remove ee/ before they run, so this is the only
  # job that tests it.
  #
  # ee code runs against the real Common and App sources, so both are
  # installed, then ee (npm ci: exactly the lockfile; --ignore-scripts: no
  # lifecycle scripts of the linked Common/App). test-setup.sh writes the same
  # config.env the core suites run with -- including BILLING_ENABLED=true, which
  # is why every ee suite that touches gating pins billing and the edition
  # facade itself -- and ee's `npm test` exports it, as App's test script does.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_PIPELINE_ID: ${{ github.run_number }}
      BILLING_PRIVATE_KEY: ${{ secrets.TEST_BILLING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # Before test-setup.sh pulls postgres and valkey: through mirror.gcr.io,
      # not anonymously from Docker Hub (.github/actions/docker-hub-mirror).
      - uses: ./.github/actions/docker-hub-mirror
      - name: Set up test services and config.env
        working-directory: packages/Common
        run: bash test-setup.sh
      - name: Install Common
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Common
      - name: Install App
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/App
      # App's two Enterprise boundary guards, with ee/ in the checkout. Their
      # ee-direction checks (what ee/ imports, the ee UI plugins' module-load
      # reads, the ee UI tsconfigs) skip when ee/ is absent, and the App Test
      # job deletes ee/ before it runs, so this is where they run. They only
      # read files: no config.env and no ee install needed.
      - name: Run App's Enterprise boundary guards with ee/ present
        working-directory: packages/App
        run: node node_modules/.bin/jest Tests/EnterpriseImportGuard.test.ts Tests/EnterprisePluginResolution.test.ts --forceExit
      # App's UI source guards that walk ee/Dashboard and ee/AdminDashboard as
      # well as the core frontends: every More (⋯) menu item has an icon, a
      # details card shows the record's own ID on its ID line, every Show ID
      # dialog is the shared one that never hands React an object, no list
      # asks for the bulk Delete while keeping Delete off its rows, and every
      # field, switch, card, dialog and empty-state description is short, the
      # bulk actions audit (Enterprise Licenses' Delete and Change Expiry
      # Date), and the row actions audit (each row of a list of records
      # switched on and off - Custom Channels, Audit Log Export - turns its
      # record on and off). The App Test job deletes ee/ first, so only this
      # run holds the Enterprise screens to them. They only read files.
      - name: Run App's UI source guards with ee/ present
        working-directory: packages/App
        run: node node_modules/.bin/jest Tests/MoreMenuItemIconsGuard.test.ts Tests/RecordIdLineGuard.test.ts Tests/ShowIdDialogGuard.test.ts Tests/Dashboard/ListDeletePolicy.test.ts Tests/Dashboard/BulkActionsAudit.test.ts Tests/Dashboard/RowActionsAudit.test.ts Tests/Dashboard/ShortDescriptionsGuard.test.ts --forceExit
      # App's guards that every menu path a text writes ("User Settings >
      # Notification Settings", "Project Settings > Billing and Invoices >
      # Billing", "On-Call Duty > Advanced > User Overrides") is one a reader
      # can follow read ee/Server, ee/Dashboard and ee/AdminDashboard too. The
      # App Test job deletes ee/ first, so only this run holds the Enterprise
      # texts to them. They only read files.
      - name: Run App's menu path guard with ee/ present
        working-directory: packages/App
        run: node node_modules/.bin/jest Tests/Dashboard/SettingsMenuPathsInProductText.test.ts Tests/Dashboard/ProjectSettingsMenuPathsInProductText.test.ts Tests/Dashboard/OnCallDutyMenuPathsInProductText.test.ts --forceExit
      # App's docs facts that hold a page to code in ee/ as well as in core:
      # the identity pages to the SCIM server and its pages, the SLO pages to
      # the audit log settings, the upgrading notes to the enterprise Health
      # dashboards, the licence period claims to ee/README.md, the span
      # metrics page to what ee/ holds, the RUM and Session Replay pages to
      # the Enterprise retention override cards, the telemetry Data
      # Retention page to the retention-by-type form, the Audit Logs page to
      # the audit log settings form, list, recorder and licence notice, and
      # the Audit Log Export page to the export screens, the exporter and its
      # webhook, syslog and file destinations, and the Backups page to the
      # Backups screens, the runner's API, its notifications and its tools.
      # Each checks its ee/ half only where ee/ is checked out, and the App
      # Test job deletes ee/ first, so this is where that half runs. They only
      # read files.
      - name: Run App's docs facts that read ee/ with ee/ present
        working-directory: packages/App
        run: node node_modules/.bin/jest Tests/FeatureSet/Docs/IdentityDocsFacts.test.ts Tests/FeatureSet/Docs/IdentityDocsTranslations.test.ts Tests/FeatureSet/Docs/SloDocsFacts.test.ts Tests/FeatureSet/Docs/UpgradingDocsFacts.test.ts Tests/FeatureSet/Docs/LicensePeriodClaims.test.ts Tests/FeatureSet/Docs/KubernetesAgentSpanMetricsDocs.test.ts Tests/FeatureSet/Docs/RumReplayDocsFacts.test.ts Tests/FeatureSet/Docs/TelemetryExplorersDocsFacts.test.ts Tests/FeatureSet/Docs/TelemetryAdminDocsFacts.test.ts Tests/FeatureSet/Docs/AdministrationDocsFacts.test.ts Tests/FeatureSet/Docs/AuditLogExportDocsFacts.test.ts Tests/FeatureSet/Docs/BackupsDocsFacts.test.ts --forceExit
      # App's guard that only the Builder's Run Workflow and Run just this step
      # hand the workflow queue a person - which is what lets a run start while
      # the workflow is off, as a test run - walks ee/ too, for any other code
      # that asks for a run. The App Test job deletes ee/ first, so only this
      # run reads ee/. It only reads files.
      - name: Run App's workflow test-run guard with ee/ present
        working-directory: packages/App
        run: node node_modules/.bin/jest Tests/FeatureSet/Workflow/WorkflowTestRunStartersGuard.test.ts --forceExit
      # App's guard on worker jobs that run every minute or more often (a
      # job more often than every minute says why; none lists every project)
      # reads ee/Server's jobs too - backups, billing, the audit log export.
      # The App Test job deletes ee/ first, so only this run reads them. It
      # only reads files.
      - name: Run App's frequent jobs guard with ee/ present
        working-directory: packages/App
        run: node node_modules/.bin/jest Tests/Workers/FrequentJobsGuard.test.ts --forceExit
      # Common's UI source guards that walk ee/Dashboard and ee/AdminDashboard
      # too - the foreign `.hidden` guard, the create-form defaults guard,
      # which lists the ee compliance rule form's Enabled switch, the
      # card-in-card guard, the card-rows guard (cards side by side are a
      # CardGrid), the long-form steps guard, and the check that
      # every permission table asks one Scope (the custom role table is in
      # ee/Dashboard since #5216) - but the Common Test job deletes ee/
      # first, so only this run sees the Enterprise UI. They only read files
      # (and load Common's models).
      - name: Run Common's UI source guards with ee/ present
        working-directory: packages/Common
        run: node node_modules/.bin/jest Tests/UI/ForeignHiddenRuleGuard.test.ts Tests/UI/Components/Forms/CreateFormDefaultsGuard.test.ts Tests/UI/Components/CardInCardGuard.test.ts Tests/UI/Components/CardRowsGuard.test.ts Tests/UI/Components/Forms/LongFormStepsGuard.test.ts Tests/App/Dashboard/PermissionScopeChoice.test.ts --forceExit
      # Common's guard that every removal of a project membership goes through
      # TeamMemberService with its hooks, so the leaver's own notification
      # settings go with it, also walks ee/Server: SCIM deprovisioning removes
      # memberships. The Common Test job deletes ee/ first, so only this run
      # holds SCIM to it.
      - name: Run Common's membership-removal guard with ee/ present
        working-directory: packages/Common
        run: node node_modules/.bin/jest Tests/Server/Services/TeamMemberNotificationSettingsCleanup.test.ts --forceExit
      # Common's guard that a relation filtered by ids is written to its key
      # beside the key's own condition, never over it, also walks ee/Server
      # for code that would copy a relation's filter over its key. The Common
      # Test job deletes ee/ first, so only this run reads ee/Server.
      - name: Run Common's relation filter guard with ee/ present
        working-directory: packages/Common
        run: node node_modules/.bin/jest Tests/Server/Types/Database/RelationFilterKeepsKeyGuard.test.ts --forceExit
      # Common's guard that a request carrying one of OneUptime's keys keeps
      # its redirects on the server it was sent to also walks ee/ for
      # requests whose body or headers name a key. The Common Test job
      # deletes ee/ first, so only this run reads ee/. It only reads files.
      - name: Run Common's key-carrying requests guard with ee/ present
        working-directory: packages/Common
        run: node node_modules/.bin/jest Tests/Server/Utils/KeyCarryingRequestsGuard.test.ts --forceExit
      # Common's guard that every route sending a test to an address someone
      # types asks the rule its table names lists ee/'s test routes too (the
      # audit log export's, a project's and the instance's). The Common Test
      # job deletes ee/ first, so only this run holds them to it. It only
      # reads files.
      - name: Run Common's test-send routes guard with ee/ present
        working-directory: packages/Common
        run: node node_modules/.bin/jest Tests/Server/API/TestSendRoutesAskTheRule.test.ts --forceExit
      # Common's guard that every Express router is made by
      # Express.getRouter() - gated, so a request passes a router none of
      # whose routes can match it - walks ee/ too, for routers of ee/'s own
      # APIs. The Common Test job deletes ee/ first, so only this run holds
      # ee/ to it. It only reads files.
      - name: Run Common's gated routers guard with ee/ present
        working-directory: packages/Common
        run: node node_modules/.bin/jest Tests/Server/Utils/ExpressRoutersAreGatedGuard.test.ts --forceExit
      - name: Install ee
        uses: ./.github/actions/npm-install
        with:
          working-directory: ee
          command: ci
          args: --ignore-scripts
      - name: Run the ee tests
        working-directory: ee
        run: npm test

  # The Enterprise pages in real Chromium, with no backend and with ee/
  # checked out. App Test's Dashboard Offline UI groups remove ee/ first, and
  # there these specs skip, so only this job holds the Enterprise pages to
  # them:
  #   - the Backups page (Admin Dashboard > Settings > Backups): Backups
  #     bundles the production page through the Admin Dashboard's Enterprise
  #     plugin, and the Community Edition beside it, over in-memory settings
  #     and runs - the first run, setting backups up, a backup running and one
  #     failed, a restore and its confirmation, at 1280 and 390 pixels, light
  #     and dark (about a minute with its bundle);
  #   - Admin Dashboard > Enterprise Licenses: Delete in a row's menu and in
  #     Bulk Actions, and the bulk Change Expiry Date
  #     (BulkActions/EnterpriseLicenses.spec.ts, about a minute);
  #   - custom roles: Teams > Settings > Roles, a role's page, Add a Role's
  #     custom roles and an API key's roles (CustomRoles, about 4 minutes with
  #     its bundle).
  # E2E_REQUIRE_ENTERPRISE turns a spec that would skip for want of ee/ into
  # a failure (packages/E2E/SuiteHelpers/Edition.ts), so a fixture that stops
  # finding ee/ cannot pass here by skipping everything. A job of its own, so
  # it runs beside the ee tests rather than after them. The bundles read
  # Common's, the Admin Dashboard's and the Dashboard's packages, and nothing
  # of App's or ee's own installs.
  enterprise-ui:
    name: Enterprise UI
    runs-on: ubuntu-latest
    # In the Playwright image, as App Test's Dashboard Offline UI groups are:
    # Chromium and its system packages and fonts are in it, so nothing is
    # fetched from the runner's Ubuntu mirror (an install from it ran past
    # this job's old 10-minute limit twice on master on 2026-10-26). The
    # limit holds each suite's own, about 7 minutes for checkout and the npm
    # installs, and 5 for the image's pull (Tests/Ops/PlaywrightImage).
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    # In a container a run step with no shell of its own gets sh, not the
    # bash -e {0} a runner gives it; the steps here are written for the
    # runner's (Tests/Ops/PlaywrightImage).
    defaults:
      run:
        shell: bash -e {0}
    env:
      E2E_REQUIRE_ENTERPRISE: "1"
    steps:
      - uses: actions/checkout@v4
      # The fonts an ubuntu runner has and the image lacks (DejaVu, the
      # runner's sans-serif, serif and monospace), so pages that load no web
      # font of their own draw their words as on the runner.
      - uses: ./.github/actions/runner-fonts
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install Common
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Common
      - name: Install Admin Dashboard
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/App/FeatureSet/AdminDashboard
      # The Enterprise Licenses and custom roles fixtures bundle Dashboard
      # pages beside the Enterprise ones.
      - name: Install Dashboard
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/App/FeatureSet/Dashboard
      - name: Install browser test dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/E2E
          # Skip the preinstall hook that downloads every browser: the
          # image has them.
          args: --ignore-scripts
      - name: Run the Backups page's browser checks
        working-directory: packages/E2E
        timeout-minutes: 10
        run: npm run test-backups-ui
      # Each suite runs even if one before it failed, so one run reports all.
      - name: Run the Enterprise Licenses list's browser checks
        if: ${{ !cancelled() }}
        working-directory: packages/E2E
        timeout-minutes: 10
        run: npm run test-enterprise-licenses-ui
      - name: Run the custom roles' browser checks
        if: ${{ !cancelled() }}
        working-directory: packages/E2E
        timeout-minutes: 15
        run: npm run test-custom-roles-ui
      - name: Upload browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.job }}-${{ github.run_attempt }}
          path: |
            output/playwright/backups-ui/*.png
            output/playwright/backups-ui/test-results
            output/playwright/bulk-actions-ui/*.png
            output/playwright/bulk-actions-ui/test-results
            output/playwright/custom-roles-ui/*.png
            output/playwright/custom-roles-ui/test-results
