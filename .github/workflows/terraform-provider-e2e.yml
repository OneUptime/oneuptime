name: Terraform Provider E2E Tests

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
  # Lets the release pipeline invoke this workflow as a gate (release.yml
  # `uses:` this workflow). Nothing below may rely on pull_request-only context.
  workflow_call:

jobs:
  terraform-e2e-tests:
    runs-on: ubuntu-latest
    # Raised from 120 when the OpenTofu pass was added: the suite now runs twice
    # against one stack, so test time roughly doubles while bring-up does not.
    timeout-minutes: 180
    env:
      CI_PIPELINE_ID: ${{ github.run_number }}
      APP_TAG: latest
      # Terraform phones checkpoint-api.hashicorp.com for an update check on
      # every command; nothing here wants that network call.
      CHECKPOINT_DISABLE: 1
      # The engines and the one registry provider the fixtures use, pinned by
      # the sha256 of the file that gets installed: the terraform/tofu
      # executable itself (so its release .zip and its .deb package verify
      # against the same digest), and the provider .zip as each engine's
      # registry serves it. The digests live here, never fetched from the
      # release they verify. See "Restore pinned Terraform, OpenTofu and
      # providers" below for how they are used.
      TERRAFORM_VERSION: "1.9.8"
      TERRAFORM_SHA256: "7386e89a97d0f24024955acc79ccf693b75b97f7c6383cb9d966e7d59aa5b223"
      TOFU_VERSION: "1.12.5"
      TOFU_SHA256: "36dae7ca1e4f1552a6faef27179dc16ef403203e956f31416c17b3d87a38c3f4"
      # Must equal RANDOM_PROVIDER_VERSION in
      # packages/E2E/Terraform/e2e-tests/scripts/run-tests.sh (the harness
      # self-test fails when they differ). Terraform resolves hashicorp/random
      # against registry.terraform.io and OpenTofu against
      # registry.opentofu.org, which serve different builds, so each engine's
      # copy has its own digest.
      RANDOM_PROVIDER_VERSION: "3.8.0"
      RANDOM_PROVIDER_TERRAFORM_REGISTRY_SHA256: "1c56852d094161997df5fd8a6cbca7c6c979b3f8c3c00fbcc374a59305d117b1"
      RANDOM_PROVIDER_OPENTOFU_REGISTRY_SHA256: "cbb2aa867fd828fcb4125239e00862b9a3bc2f280e945c760224276b476f4c49"

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Additional Disk Cleanup
        run: |
          echo "=== Initial disk space ==="
          df -h

          echo "=== Removing unnecessary tools and libraries ==="
          # Remove Android SDK (if not already removed)
          sudo rm -rf /usr/local/lib/android || true

          # Remove .NET SDK and runtime
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /etc/skel/.dotnet || true

          # Remove Haskell/GHC
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true

          # Remove CodeQL
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          # Remove Boost
          sudo rm -rf /usr/local/share/boost || true

          # Remove Swift
          sudo rm -rf /usr/share/swift || true

          # Remove Julia
          sudo rm -rf /usr/local/julia* || true

          # Remove Rust (cargo/rustup)
          sudo rm -rf /usr/share/rust || true
          sudo rm -rf /home/runner/.rustup || true
          sudo rm -rf /home/runner/.cargo || true

          # Remove unnecessary hostedtoolcache items
          sudo rm -rf /opt/hostedtoolcache/Python || true
          sudo rm -rf /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/Java* || true

          # Remove additional large directories
          sudo rm -rf /usr/share/miniconda || true
          sudo rm -rf /usr/local/graalvm || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/az_* || true

          # Remove documentation
          sudo rm -rf /usr/share/doc || true
          sudo rm -rf /usr/share/man || true

          # Remove unnecessary locales
          sudo rm -rf /usr/share/locale || true

          # Clean apt cache
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo rm -rf /var/cache/apt/archives/* || true

          # Clean tmp
          sudo rm -rf /tmp/* || true

          echo "=== Moving Docker data to /mnt for more space ==="
          # Stop docker
          sudo systemctl stop docker || true

          # Move docker data directory to /mnt (which has ~70GB)
          sudo mv /var/lib/docker /mnt/docker || true
          sudo mkdir -p /var/lib/docker || true
          sudo mount --bind /mnt/docker /var/lib/docker || true

          # Restart docker
          sudo systemctl start docker || true

          echo "=== Final disk space ==="
          df -h

          echo "=== Docker info ==="
          docker info | grep -E "Docker Root Dir|Storage Driver" || true

      - name: Checkout code
        uses: actions/checkout@v4

      # Hermetic checks of the harness itself (engine dispatch, fixture and
      # workflow contracts) against fake terraform/tofu binaries. Placed
      # immediately after checkout and before every expensive step — npm
      # install, provider generation, the Docker stack — so a harness
      # regression fails in seconds instead of after a stack bring-up. Needs no
      # Node, Go, Docker or network.
      - name: Harness self-test
        run: ./packages/E2E/Terraform/e2e-tests/scripts/self-test.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # Both engines are installed because the suite runs end to end twice, once
      # each. The wrappers that hashicorp/setup-terraform and
      # opentofu/setup-opentofu install are deliberately avoided: they replace
      # the binary with a script that buffers stdout for step outputs, which
      # breaks the runner's command substitution and `plan -detailed-exitcode`
      # handling. With the wrapper disabled those actions do nothing more than
      # download the release and put it on PATH -- with no retry, which flaked
      # on a transient `read ECONNRESET` -- so the binaries are installed by
      # hand below.
      #
      # Retrying that download was not enough. The OpenTofu release is a
      # GitHub release asset, and GitHub's release CDN answers 500/504 in
      # bursts that outlast any retry a step can afford: on 2026-09-21 it was
      # degraded for 50+ minutes and "Setup OpenTofu" failed on master after
      # three curl-with-retry attempts (~54s). OpenTofu's copy of
      # hashicorp/random is served from the same CDN, and tofu's own 2-attempt
      # (~11s) retry during run-tests.sh's `init` lost to it three times in two
      # weeks. So this job no longer downloads any of them per run:
      #
      #   * Each binary and provider zip is pinned by sha256 in the job env and
      #     kept in the Actions cache, keyed on those pins. On a hit nothing is
      #     downloaded at all.
      #   * On a miss (a pin bump, or an eviction)
      #     Scripts/GHA/fetch_pinned_artifact.sh fetches each one: the release
      #     first, then -- for the engines -- the same executable from the
      #     vendor's package repository, which is not behind GitHub's CDN. It
      #     backs off exponentially and goes round the sources again after 30s
      #     and 90s, riding out a burst of several minutes, and installs
      #     nothing that does not match its pin (a copy restored from the cache
      #     included).
      #   * The two random provider zips form a packed provider mirror that
      #     run-tests.sh points both engines at (TF_E2E_PROVIDER_MIRROR), so
      #     `init` for hashicorp/random does not reach a registry either.
      #
      # Caches written by master runs are visible to pull requests and to the
      # `release` branch, so a release -- which calls this workflow as a gate
      # -- restores the copies master already verified.
      - name: Restore pinned Terraform, OpenTofu and providers from the Actions cache
        id: pinned-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/terraform-e2e-pinned
          key: terraform-e2e-pinned-${{ runner.os }}-${{ runner.arch }}-terraform-${{ env.TERRAFORM_VERSION }}-${{ env.TERRAFORM_SHA256 }}-tofu-${{ env.TOFU_VERSION }}-${{ env.TOFU_SHA256 }}-random-${{ env.RANDOM_PROVIDER_VERSION }}-${{ env.RANDOM_PROVIDER_TERRAFORM_REGISTRY_SHA256 }}-${{ env.RANDOM_PROVIDER_OPENTOFU_REGISTRY_SHA256 }}

      # Runs on a hit too: a restored copy is only used after it verifies
      # against its pin, and one that does not is downloaded again.
      - name: Verify pinned Terraform, OpenTofu and providers, or download them on a cache miss
        env:
          PINNED_DIR: ${{ runner.temp }}/terraform-e2e-pinned
        run: |
          set -euo pipefail
          # Every pin above is a linux_amd64 build.
          if [[ "${RUNNER_OS}/${RUNNER_ARCH}" != "Linux/X64" ]]; then
            echo "::error title=No pinned Terraform/OpenTofu::this job pins linux_amd64 builds but runs on ${RUNNER_OS}/${RUNNER_ARCH}."
            exit 1
          fi
          FETCH="${GITHUB_WORKSPACE}/Scripts/GHA/fetch_pinned_artifact.sh"

          # HashiCorp's release archive, then the same executable from
          # HashiCorp's apt repository.
          bash "$FETCH" --name terraform --sha256 "$TERRAFORM_SHA256" --dest "${PINNED_DIR}/bin" --mode 0755 \
            --source zip:terraform "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            --source deb:./usr/bin/terraform "https://apt.releases.hashicorp.com/pool/amd64/main/terraform_${TERRAFORM_VERSION}-1_amd64.deb"

          # The GitHub release, then the same executable from OpenTofu's own
          # package repository, which does not go through GitHub's CDN.
          bash "$FETCH" --name tofu --sha256 "$TOFU_SHA256" --dest "${PINNED_DIR}/bin" --mode 0755 \
            --source zip:tofu "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip" \
            --source deb:./usr/bin/tofu "https://packages.opentofu.org/opentofu/tofu/any/pool/any/main/t/tofu/tofu_${TOFU_VERSION}_amd64.deb"

          # hashicorp/random as each engine's registry serves it, laid out as a
          # packed provider mirror:
          #   <mirror>/<registry host>/hashicorp/random/terraform-provider-random_<version>_linux_amd64.zip
          # registry.opentofu.org has no source off GitHub for this build, which
          # is why the cache, not the download, is what the job relies on.
          RANDOM_ZIP="terraform-provider-random_${RANDOM_PROVIDER_VERSION}_linux_amd64.zip"
          bash "$FETCH" --name "$RANDOM_ZIP" --sha256 "$RANDOM_PROVIDER_TERRAFORM_REGISTRY_SHA256" \
            --dest "${PINNED_DIR}/provider-mirror/registry.terraform.io/hashicorp/random" \
            --source file "https://releases.hashicorp.com/terraform-provider-random/${RANDOM_PROVIDER_VERSION}/${RANDOM_ZIP}"
          bash "$FETCH" --name "$RANDOM_ZIP" --sha256 "$RANDOM_PROVIDER_OPENTOFU_REGISTRY_SHA256" \
            --dest "${PINNED_DIR}/provider-mirror/registry.opentofu.org/hashicorp/random" \
            --source file "https://github.com/opentofu/terraform-provider-random/releases/download/v${RANDOM_PROVIDER_VERSION}/${RANDOM_ZIP}"

      # Saved straight away rather than by actions/cache's post step, which
      # only saves when the whole job succeeds: a run that fails later (a
      # provider regression, a bring-up that gives up) would otherwise never
      # fill the cache, and the next run would be back on the CDN.
      - name: Save pinned Terraform, OpenTofu and providers to the Actions cache
        if: steps.pinned-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/terraform-e2e-pinned
          key: ${{ steps.pinned-tools-cache.outputs.cache-primary-key }}

      # The real executables, not wrappers (see above). The version check
      # makes sure these are what PATH resolves to.
      - name: Install Terraform and OpenTofu
        env:
          PINNED_DIR: ${{ runner.temp }}/terraform-e2e-pinned
        run: |
          set -euo pipefail
          sudo install -m 0755 "${PINNED_DIR}/bin/terraform" /usr/local/bin/terraform
          sudo install -m 0755 "${PINNED_DIR}/bin/tofu" /usr/local/bin/tofu
          check_version() { # binary expected-first-line
            local output first
            # Captured first rather than piped into head, which can SIGPIPE
            # the binary under pipefail.
            output="$("$1" version)"
            echo "$output"
            first="$(head -n 1 <<<"$output")"
            if [[ "$first" != "$2" ]]; then
              echo "::error title=Unexpected $1 on PATH::expected '$2', got '${first}' from $(command -v "$1")"
              exit 1
            fi
          }
          check_version terraform "Terraform v${TERRAFORM_VERSION}"
          check_version tofu "OpenTofu v${TOFU_VERSION}"

      # Dependencies are installed and the provider is generated BEFORE the
      # OneUptime services stack starts: generation loads the whole codebase
      # through ts-node and shells out to the Go toolchain, and overlapping
      # that memory peak with the running services kills the CI runner.
      - name: Install dependencies
        run: |
          # Clean node_modules to avoid permission issues with npm cache in CI
          rm -rf packages/Common/node_modules Scripts/node_modules || true
          npm install
          cd packages/Common && npm install && cd ../..
          cd Scripts && npm install && cd ..

      - name: Generate Terraform provider
        run: npm run generate-terraform-provider

      - name: Vet and unit test generated provider
        working-directory: Terraform/terraform-provider-oneuptime
        run: |
          go mod tidy
          go vet ./...
          go test ./...

      # `npm run dev` runs `npm run prerun`, whose Scripts/Install/configure.sh
      # renders the Dockerfile templates with gomplate and downloads gomplate
      # from GitHub's release CDN whenever it is not on PATH -- the same CDN,
      # with the same bursts, that failed other jobs' gomplate downloads on
      # 2026-09-21. This puts the pinned, cached copy on PATH first, so
      # configure.sh skips its download and the bring-up retry below is left
      # to the flakes it exists for.
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      # Infra bring-up is the only step that legitimately flakes (image pulls,
      # slow service boot), so it is the only step that gets retried. The test
      # suite itself runs exactly once — retrying it would mask real provider
      # bugs as flakes.
      #
      # Only `app` and `ingress` are named. A bare `npm run dev` brings up every
      # service in Scripts/Dev/docker-compose.dev.yml, and since each carries a
      # `build:` section that means building every image from source on a cold
      # runner: `home` (which clones the ~4 GB blog repo),
      # `e2e` (which downloads Playwright's browsers), both probes, the runner,
      # test-server, fluentd and fluent-bit. That was ~27 of this job's ~43
      # minutes spent on containers no assertion in this suite ever reaches:
      # every request it makes is `http://localhost/api/...`, which is nginx in
      # front of `app`.
      #
      # Nothing is lost by naming them. postgres, valkey and clickhouse still
      # come up — `app` and `ingress` both depend_on them with
      # condition: service_healthy — and all eight endpoints status-check waits
      # on (/, /dashboard, /admin/env.js, /public-dashboard, /accounts,
      # /status-page, /status, /status/ready) are served by `app` through nginx,
      # so the readiness gate below still means exactly what it did before.
      # (`/` proxies to `home` only when BILLING_ENABLED=true; config.env
      # defaults it to false, which is what this job runs with.)
      - name: Start OneUptime services
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: |
            npm run dev --services="app ingress"
            npm run status-check

      - name: Set up test account
        run: |
          chmod +x ./packages/E2E/Terraform/e2e-tests/scripts/*.sh
          ./packages/E2E/Terraform/e2e-tests/scripts/setup-test-account.sh

      # TF_E2E_PROVIDER_MIRROR makes run-tests.sh install hashicorp/random from
      # the pinned mirror staged above instead of the registry; both engine
      # runs need it.
      - name: Run Terraform E2E tests
        env:
          TF_CLI: terraform
          TF_E2E_PROVIDER_MIRROR: ${{ runner.temp }}/terraform-e2e-pinned/provider-mirror
        run: ./packages/E2E/Terraform/e2e-tests/scripts/run-tests.sh

      # The identical fixtures, re-run against OpenTofu. This is the gate behind
      # OneUptime's OpenTofu support claim: the provider is published to the
      # OpenTofu Registry, so `tofu` has to stay a tested path and not an
      # assumption inherited from Terraform compatibility.
      #
      # It reuses the stack and test project the Terraform run just used rather
      # than getting its own job. Bring-up (disk cleanup, npm install, provider
      # generation, docker compose, account setup) dominates this job's runtime,
      # and duplicating all of it to re-run the same fixtures would roughly
      # double CI cost for no extra coverage. Re-running against a used project
      # is safe because every test destroys what it created and the runner fails
      # the build if deletion cannot be verified — a leak cannot silently carry
      # over into this run.
      - name: Run OpenTofu E2E tests
        env:
          TF_CLI: tofu
          TF_E2E_PROVIDER_MIRROR: ${{ runner.temp }}/terraform-e2e-pinned/provider-mirror
        run: ./packages/E2E/Terraform/e2e-tests/scripts/run-tests.sh

      # Coverage ratchet: the suite must exercise at least as many provider
      # resource types as the checked-in baseline. run-tests.sh already
      # enforces this at the end of a successful run; this dedicated step
      # keeps the gate visible in the CI UI and protects against the wiring
      # inside run-tests.sh being removed. It is purely static (greps fixture
      # files against the generated docs), so re-running it here is free.
      - name: Terraform resource coverage gate
        run: |
          ./packages/E2E/Terraform/e2e-tests/scripts/coverage-report.sh \
            --min-count "$(cat packages/E2E/Terraform/e2e-tests/scripts/coverage-baseline.txt)"

      # Without this, a failure here says only "App still not returning HTTP
      # 200" after five minutes of 502s, with no indication of why. Boot
      # failures in this job are usually a schema or migration error that the
      # app logs clearly and nobody ever sees.
      - name: Dump container logs on failure
        if: failure()
        run: |
          # Must mirror how `npm run dev` started the stack: the same compose
          # file, the same project directory and the same exported config.env.
          # A plain `docker compose logs` resolves docker-compose.yml instead,
          # finds a different project, and prints nothing but "variable is not
          # set" warnings.
          set +e
          export $(grep -v '^#' config.env | xargs) 2>/dev/null
          COMPOSE="docker compose --project-directory . -f Scripts/Dev/docker-compose.dev.yml"

          echo "===== container status (including exited) ====="
          $COMPOSE ps -a

          for service in app worker ingress postgres clickhouse valkey; do
            echo ""
            echo "===== ${service} (last 300 lines) ====="
            $COMPOSE logs --tail=300 --no-color "${service}" 2>&1
          done
