name: Infrastructure Agent Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  # Only the pull requests that change the agent, a Go module of its own that
  # reads nothing outside its directory, as the MSI test
  # (test.infrastructure-agent-msi.yaml) already runs. Two jobs, one on a
  # Windows runner, that every other pull request used to start for nothing.
  # Main runs it nightly, whatever changed.
  pull_request:
    paths:
      - "agents/InfrastructureAgent/**"
      - ".github/workflows/test.infrastructure-agent.yaml"
      # What the reproducible-build job builds with, and what it checks.
      - ".github/actions/setup-release-toolchain/**"
      - "Tests/Ops/InfrastructureAgentReproducibleBuild.test.js"
  # Not on every push to main: each pull request was tested on its merge
  # with main, and main runs this nightly and on demand instead
  # (Tests/Ops/PullRequestChecksNotOnPush.test.js says why).
  schedule:
    - cron: "19 1 * * *"
  workflow_dispatch:

# Read-only: these jobs check out and test the code, nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pin to the module's own Go version instead of drifting with whatever
          # the runner image happens to ship.
          go-version-file: agents/InfrastructureAgent/go.mod
      # The suite includes the secret-key redaction guards, which are what keep
      # the agent's secret out of its world-readable log file. -race is cheap
      # here and the agent runs a scheduler, so it is worth the coverage.
      - run: cd agents/InfrastructureAgent && go test ./... -race
      # The agent ships for Windows and macOS too, but the tests above only
      # compile the Linux build. Vet the other release targets so code behind
      # a //go:build tag (utils/disk_drives_windows.go) is at least type-checked.
      - run: cd agents/InfrastructureAgent && GOOS=windows GOARCH=amd64 go vet ./...
      - run: cd agents/InfrastructureAgent && GOOS=darwin GOARCH=arm64 go vet ./...

  # The agent built twice from one commit, two clones made seconds apart, with
  # the release's own Go, GoReleaser and syft: every archive, package, SBOM
  # and the checksums file must be the same bytes, as the apt and yum indexes,
  # the Homebrew cask and the winget manifest record their SHA-256 (#11466).
  # The config as it was before must give other bytes, so the check is not
  # vacuous. RUN_AGENT_REPRODUCIBLE_BUILD=1 fails the suite, rather than
  # skipping it, if a tool is missing (the Ops Config Test job, which has
  # none of them, skips it).
  reproducible-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up the release toolchain
        uses: ./.github/actions/setup-release-toolchain
        with:
          syft: 'true'
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Tests/Ops/package-lock.json
      - name: Install Ops test dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: Tests/Ops
      - name: Build the agent twice, and hold every file to the same bytes
        working-directory: Tests/Ops
        env:
          RUN_AGENT_REPRODUCIBLE_BUILD: "1"
        run: npx jest --config ./jest.config.json --runInBand InfrastructureAgentReproducibleBuild

  # Disk collection handles what gopsutil returns on Windows - partial partition
  # lists, drive-letter devices - and the Linux job can only reproduce that with
  # stubs. Run the disk tests on Windows too, including disk_windows_test.go,
  # which checks those stubs against the real Windows APIs.
  test-windows-disk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/InfrastructureAgent/go.mod
      - working-directory: agents/InfrastructureAgent
        run: go test ./utils/ -count=1 -v -run "^Test(ListDiskMetrics|Disk|WindowsDisk|LookupIOCounters|IOCountersKeyCandidates|DescribeDiskError|MissingDrives)"
