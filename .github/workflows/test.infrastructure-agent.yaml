name: Infrastructure Agent Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pin to the module's own Go version instead of drifting with whatever
          # the runner image happens to ship.
          go-version-file: agents/InfrastructureAgent/go.mod
      # The suite includes the secret-key redaction guards, which are what keep
      # the agent's secret out of its world-readable log file. -race is cheap
      # here and the agent runs a scheduler, so it is worth the coverage.
      - run: cd agents/InfrastructureAgent && go test ./... -race
      # The agent ships for Windows and macOS too, but the tests above only
      # compile the Linux build. Vet the other release targets so code behind
      # a //go:build tag (utils/disk_drives_windows.go) is at least type-checked.
      - run: cd agents/InfrastructureAgent && GOOS=windows GOARCH=amd64 go vet ./...
      - run: cd agents/InfrastructureAgent && GOOS=darwin GOARCH=arm64 go vet ./...

  # Disk collection handles what gopsutil returns on Windows - partial partition
  # lists, drive-letter devices - and the Linux job can only reproduce that with
  # stubs. Run the disk tests on Windows too, including disk_windows_test.go,
  # which checks those stubs against the real Windows APIs.
  test-windows-disk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/InfrastructureAgent/go.mod
      - working-directory: agents/InfrastructureAgent
        run: go test ./utils/ -count=1 -v -run "^Test(ListDiskMetrics|Disk|WindowsDisk|LookupIOCounters|IOCountersKeyCandidates|DescribeDiskError|MissingDrives)"
