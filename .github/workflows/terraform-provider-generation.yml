name: Terraform Provider Generation

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-terraform-provider:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{ github.run_number }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install Common dependencies
        run: cd Common && npm install

      - name: Install root dependencies
        run: npm install

      - name: Install Script dependencies
        run: cd Scripts && npm install

      - name: Install generator test dependencies
        run: cd Scripts/TerraformProvider && npm install

      - name: Run generator unit tests
        run: cd Scripts/TerraformProvider && npm test

      - name: Generate Terraform provider
        run: npm run generate-terraform-provider

      - name: Verify provider generation
        run: |
          set -euo pipefail
          # The generator emits the provider into this subdirectory of
          # Terraform/ (see Scripts/TerraformProvider/GenerateProvider.ts).
          # Pointing at ./Terraform instead made the go.mod/README checks
          # silent no-ops.
          PROVIDER_DIR="./Terraform/terraform-provider-oneuptime"

          # Check if provider directory was created
          if [ ! -d "$PROVIDER_DIR" ]; then
            echo "❌ Terraform provider directory not created at $PROVIDER_DIR"
            exit 1
          fi
          echo "✅ Provider directory created: $PROVIDER_DIR"

          # Count generated files
          GO_FILES=$(find "$PROVIDER_DIR" -name "*.go" | wc -l)
          echo "📊 Generated Go files: $GO_FILES"

          if [ "$GO_FILES" -eq 0 ]; then
            echo "❌ No Go files were generated"
            exit 1
          fi

          # Essential files must exist; any miss fails the job.
          for essential in go.mod main.go README.md .goreleaser.yml terraform-registry-manifest.json; do
            if [ ! -f "$PROVIDER_DIR/$essential" ]; then
              echo "❌ Essential file missing: $PROVIDER_DIR/$essential"
              exit 1
            fi
            echo "✅ Found $essential"
          done

          # Show directory structure for debugging
          echo "📁 Provider directory structure:"
          ls -la "$PROVIDER_DIR"

      - name: Build generated provider
        working-directory: ./Terraform/terraform-provider-oneuptime
        run: go build ./...

      - name: Vet generated provider
        working-directory: ./Terraform/terraform-provider-oneuptime
        run: go vet ./...

      - name: Test generated provider
        working-directory: ./Terraform/terraform-provider-oneuptime
        run: go test ./...

      - name: Upload Terraform provider as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terraform
          path: ./Terraform/
          retention-days: 30