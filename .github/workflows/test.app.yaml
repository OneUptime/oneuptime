name: App Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

# Read-only: these jobs check out and test the code, nothing more.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # This job stopped finishing altogether: it ran into the 6h runner ceiling
    # and was killed there, so master had no App test signal at all. The suite
    # is ~340 files, two thirds of them under Tests/Dashboard, and each one was
    # dragging the Dashboard's React import graph through ts-jest's per-file
    # type check -- in a single process, because --detectOpenHandles implies
    # --runInBand. It now transpiles instead of type-checking
    # (App/jest.config.json sets isolatedModules) and runs on jest's worker
    # pool, which took the whole suite to under three minutes of test time.
    #
    # Nothing goes unchecked: the Compile workflow's Compile App step (in its
    # compile-services job) has every App test file as a tsc program root, and
    # checks the whole program once in about a minute rather than 338 times
    # over.
    #
    # This cap is the tripwire: if a shard ever hits it something has
    # regressed, and it should fail here rather than quietly block the queue
    # for a workday.
    timeout-minutes: 30
    strategy:
      # One slow or broken shard should not hide the results of the others.
      fail-fast: false
      # Three shards. In one job the suite had grown to ~1,800 files and 26 of
      # the job's 30 minutes (jest's own time 1,541 s on master, 2026-10-17),
      # so the cap was about to fail runs with nothing wrong in them. Setup
      # takes a minute and a half, so three bring each shard to about ten
      # minutes for much the same runner time in all. When a shard passes
      # about 20 minutes, add one here rather than raise the cap.
      matrix:
        shard: [1, 2, 3]
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
      BILLING_PRIVATE_KEY: ${{secrets.TEST_BILLING_PRIVATE_KEY}}
      # Suites that must run their SQL against a real server, not just assert
      # on the generated string. Tests/Workers/SessionReplayFinalizerClickhouse
      # is the first: a query ClickHouse rejected passed every string check and
      # stopped RUM sessions finalizing. Each suite creates and drops its own
      # database, and fails this job if the URL goes missing rather than skip.
      TEST_CLICKHOUSE_URL: http://default:test@localhost:18123
      # The cluster of two shards the step below gives that server, so
      # Tests/Telemetry/PagedFindBoundClickhouse also pages through a
      # Distributed table over two shards, as a sharded install reads one.
      TEST_CLICKHOUSE_TWO_SHARD_CLUSTER: paged_find_bound_two_shards
    services:
      clickhouse:
        # Match the version docker-compose.base.yml ships. Docker Hub's
        # clickhouse/clickhouse-server, from mirror.gcr.io: the runner starts
        # service containers before any step, so the daemon's mirror
        # (.github/actions/docker-hub-mirror) is not set yet.
        image: mirror.gcr.io/clickhouse/clickhouse-server:26.7
        env:
          CLICKHOUSE_PASSWORD: test
        ports:
          - 18123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # Two shards, each a database of its own on the one ClickHouse service
      # (Tests/Telemetry/Fixtures/ClickhouseTwoShardCluster.xml). The server
      # reads config.d again a moment after it changes, long before the
      # tests start; the suite waits for the cluster all the same.
      - name: Give the ClickHouse service a cluster of two shards
        env:
          CLICKHOUSE_CONTAINER: ${{ job.services.clickhouse.id }}
        run: docker cp packages/App/Tests/Telemetry/Fixtures/ClickhouseTwoShardCluster.xml "$CLICKHOUSE_CONTAINER:/etc/clickhouse-server/config.d/paged-find-bound-two-shards.xml"
      # Core is the Community Edition by construction: it must build and pass
      # without ee/ in the checkout. ee/ has its own jobs (compile-ee, test.ee.yaml).
      - name: Remove the Enterprise Edition (core runs without ee/)
        run: rm -rf ee
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # Before test-setup.sh pulls postgres and valkey: through mirror.gcr.io,
      # not anonymously from Docker Hub (.github/actions/docker-hub-mirror).
      - uses: ./.github/actions/docker-hub-mirror
      - run: cd packages/Common && bash test-setup.sh
      # App tests import Common sources directly (jest maps Common/* to
      # ../Common), so Common's own dependencies must be installed too.
      - name: Install Common dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Common
      - name: Install App dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/App
      - run: cd packages/App && npm run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  session-replay-ui:
    name: Session Replay UI
    runs-on: ubuntu-latest
    # In the Playwright image, as dashboard-offline-ui below says why. The
    # limit holds each suite's own, about 7 minutes for checkout and the npm
    # installs, and 5 for the image's pull (Tests/Ops/PlaywrightImage).
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    # In a container a run step with no shell of its own gets sh, not the
    # bash -e {0} a runner gives it; the steps here are written for the
    # runner's (Tests/Ops/PlaywrightImage).
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Core is the Community Edition by construction: it must build and pass
      # without ee/ in the checkout. ee/ has its own jobs (compile-ee, test.ee.yaml).
      - name: Remove the Enterprise Edition (core runs without ee/)
        run: rm -rf ee
      # The fonts an ubuntu runner has and the image lacks (DejaVu, the
      # runner's sans-serif, serif and monospace), so pages that load no web
      # font of their own draw their words as on the runner.
      - uses: ./.github/actions/runner-fonts
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # These browser tests render Dashboard sources with fixture API data.
      # They need the frontend dependencies, but no test database or Docker stack.
      - name: Install shared dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Common
      - name: Install Dashboard dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/App/FeatureSet/Dashboard
      - name: Install browser test dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/E2E
          # Skip the preinstall hook that downloads every browser: the
          # image has them.
          args: --ignore-scripts
      - name: Run Session Replay UI regressions
        working-directory: packages/E2E
        timeout-minutes: 15
        run: npm run test-session-replay-ui
      # Runs even if the replay suite failed, so one run reports both.
      - name: Run User Flows UI regressions
        if: ${{ !cancelled() }}
        working-directory: packages/E2E
        timeout-minutes: 10
        run: npm run test-user-flows-ui
      - name: Upload browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.job }}-${{ github.run_attempt }}
          path: |
            output/playwright/session-replay-ui/*.png
            output/playwright/session-replay-ui/test-results
            output/playwright/user-flows-ui/*.png
            output/playwright/user-flows-ui/test-results
          retention-days: 7

  # Browser suites that each bundle real Dashboard or Status Page sources with
  # esbuild and serve them against fixture data: no database or Docker stack.
  # They used to run one after another in a single 41-minute job, the longest
  # of every pull request's checks. They are independent - each starts its
  # own fixture server on its own port - so they run here in thirteen groups
  # balanced by measured duration. Event Overview and the Workflow Builder
  # suite outgrew a group each on their own (20.4 and 19.4 minutes on
  # 2026-10-17's slowest runner), so each now runs in halves, in two groups
  # (see below); every group holds about 17 to 20 minutes of suites. Setup
  # adds a minute and a half. Each suite still runs exactly as before: same
  # config, same browsers, one worker.
  #
  # The same group has taken a third longer on one run than on the next with
  # nothing changed but the runner (group 1: about 18 and 24 minutes), so keep
  # each group near 20 minutes on a slow runner, well under its run step's 28.
  # When one passes about 22, move a suite or add a group.
  #
  # The groups run in the Playwright image (mcr.microsoft.com/playwright, at
  # the version packages/E2E locks): Chromium, Firefox and the system
  # packages and fonts they need are in it, so a group fetches nothing from
  # the runner's Ubuntu mirror, and any suite can run in any group. They
  # used to install them with `playwright install --with-deps`: about 25 MB
  # that some runners' mirror served at 36 kB/s, 20 minutes in group 3
  # (2026-10-22) and 11.7 in group 6 (2026-10-23), and elsewhere an apt-get
  # update that hung for three hours. The image, about 1 GB from Microsoft's
  # registry, is pulled before the first step in about a minute. It lacks one
  # thing the runner has: DejaVu, fontconfig's sans-serif, serif and
  # monospace there, which the suites' pages with no web font of their own
  # were measured in. .github/actions/runner-fonts installs the runner's
  # DejaVu faces from the repository, with no apt (in the image, four tests
  # that measure words failed without them).
  # Tests/Ops/PlaywrightImage holds its tag to the lockfile's Playwright, the
  # job's limit to the run step's 28 minutes, the setup and the pull, and
  # every job in the image to installing the runner's fonts.
  # When Event Overview or
  # the Workflow Builder suite passes it alone, split that suite across two
  # groups. Event Overview is split since 2026-10-22: it is one spec file, so
  # its config reads EVENT_OVERVIEW_SHARD (set below from the group's
  # event_overview_shard) and shards by test; the same can be done for any
  # suite, with a variable of its own. The Workflow Builder suite is split
  # since 2026-10-27: its config reads WORKFLOW_BUILDER_SHARD (set below from
  # the group's workflow_builder_shard) and Playwright shards it by spec file,
  # the laptop's projects in one half and the phone's in the other
  # (Tests/Ops/DashboardOfflineUiShards holds every half to running once).
  #
  # A suite added to packages/E2E needs a place in one group's `suites`, and
  # its output paths in the upload step below.
  dashboard-offline-ui:
    name: Dashboard Offline UI (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The runner's own user: the workspace and HOME are its, and Firefox
      # will not start as root in a home another user owns. The host's IPC
      # namespace, as Playwright's image asks, so Chromium cannot run short of
      # shared memory.
      options: --user 1001 --ipc=host
    # In a container a run step with no shell of its own gets sh, not the
    # bash -e {0} a runner gives it; the steps here are written for the
    # runner's (Tests/Ops/PlaywrightImage).
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: read
    # Which half of Event Overview a group runs, "1/2" or "2/2"; empty in
    # the groups that do not run it (playwright.event-overview-ui.config.ts).
    env:
      EVENT_OVERVIEW_SHARD: ${{ matrix.event_overview_shard || '' }}
      # Which half of the Workflow Builder suite, the same way
      # (playwright.workflow-builder-ui.config.ts).
      WORKFLOW_BUILDER_SHARD: ${{ matrix.workflow_builder_shard || '' }}
    strategy:
      # Every group reports its own suites, whatever happens to the others.
      fail-fast: false
      matrix:
        include:
          # Event Overview on its own. With the thirteen shorter suites that
          # once shared its group and the setup, the group passed the job's 30
          # minutes. Status Page Theme moved to group 6 when this group took
          # 24.3 minutes. On 2026-10-22 Event Overview alone took 25.9 and
          # 26.9 minutes on two runs, so it runs in halves: the first here,
          # the second in group 10. SNMP Walk (about 1.5 minutes locally with
          # its bundle, Chromium only: a device's SNMP Walk page - walking a
          # subtree, continuing a walk, Collect, Alert on it, Copy OID and why
          # a walk failed - at 1280 and 390 pixels, dark, Japanese and German)
          # joined it on 2026-10-23, the group with the most room once Event
          # Overview ran in halves: about 15. Asset Details (about 40 seconds
          # locally with its bundle, Chromium only: where each asset detail
          # came from on Inventory's Asset Details card and a device's
          # Inventory card, at 1280 and 390 pixels, dark, Japanese and German)
          # joined them the same day: about 16. Traces AI (1.5 minutes with
          # its bundle locally, Chromium only: Traces' AI tab - Insights, a
          # finding's evidence, Fix with AI, Create Monitor and Open in
          # Traces, Logs and Settings - at 1280 and 390 pixels, light and
          # dark) joined them on 2026-10-24, when this group took 14.9 minutes
          # and group 8 22.4: about 16.5. Metrics AI (1.5 minutes with its
          # bundle locally, Chromium only: Metrics' AI tab - Insights, a
          # finding's evidence, Fix with AI, Open in Metrics and Open in
          # Traces, Logs and Settings - at 1280 and 390 pixels, light and dark)
          # joined them on 2026-10-25, when this group took 18.5 and 19.1
          # minutes on master's last two runs with Traces AI, and group 9,
          # where Exceptions AI was going, 16.3 to 18.4: about 20.5.
          # Metrics AI (1.9 minutes on 14.0.93's gate run) moved to group 4 and
          # Asset Details (0.9) to group 13 on 2026-10-27, when that run took
          # this group 21.7 minutes: about 19.
          # Timed again on 2026-10-28, after #5262 grew each half of Event
          # Overview by about half a minute (and one of them by 15 seconds
          # more with its UI review), from 14.0.94's two gate runs with this
          # group's suites: its half of Event Overview 16.1 and 16.7 minutes,
          # SNMP Walk 1.2 and 1.3, Traces AI 1.8 and 1.9 - 19.1 and 19.9 in
          # all, under the 22 the groups are kept to, so nothing moved.
          - group: 1
            event_overview_shard: 1/2
            suites: >-
              test-event-overview-ui
              test-snmp-walk-ui
              test-traces-ai-ui
          # The Alerts suite also runs in Firefox, and so do Code Editor (the
          # editor's text layers must line up in both) and Diagrams. Diagrams
          # and Navigation Search (about 8 minutes together) moved here from
          # group 3 when the Probe Status specs in Monitor Overview and the
          # docs' diagrams took group 3 from 25.5 minutes past the job's 30.
          # Runbook Steps (about 35 seconds locally with its bundle, Chromium
          # only: a runbook's Steps page and a run's execution page) joined it
          # on 2026-10-20, when it took 17.6 to 19.2 minutes: group 3, beside
          # Runbook Variables, had reached 25 and group 7 about 18. Navigation
          # Search (2.9 to 3.5 minutes) moved to group 10 on 2026-10-22, when
          # this group took 26.2 minutes on a slow runner and 20.9 on a fast
          # one. Chart Time Zoom gained HostOverviewHeader.spec.ts on
          # 2026-10-26 (8 tests, about 35 seconds locally: a host's name and
          # its hero's controls at five widths, zoomed and not, and on a
          # phone), when this group took 17.8 minutes: about 18.5.
          # Logs AI (2.5 minutes, Chromium only) and External MCP Servers (1.0)
          # moved here from group 7 on 2026-10-26, when 14.0.93's gate run took
          # this group 15.8 minutes and group 7 23.4: about 19.5.
          # Logs AI (2.0 minutes on 14.0.93's gate run) and External MCP Servers
          # (0.8) moved to group 13 on 2026-10-27, when that run took this group
          # 20.9 minutes: about 18. Every group has Firefox since the groups run
          # in the Playwright image.
          - group: 2
            suites: >-
              test-chart-time-zoom-ui
              test-code-editor-ui
              test-exception-detail-ui
              test-alerts-ui
              test-pencil-button-ui
              test-color-picker-ui
              test-diagrams-ui
              test-runbook-steps-ui
          # Value Picker also runs in Firefox (the chip editor's caret handling
          # differs in each). Discovery (about 5 minutes) moved to group 6
          # when this group took 23.5 minutes. Global Runners (about a
          # minute, Chromium only) joined it at 15.4 minutes, the lightest
          # group on 2026-10-18's run, and Runbook Variables (about a minute
          # and a half with its bundle, Chromium only) beside it. Rules Menu
          # Section (about half a minute with its bundle, Chromium only: the
          # status page's and an SLO's side menus) joined it on 2026-10-20.
          # Model Tables (about 4 minutes with its bundle locally, Chromium
          # only: every table's look and, in CardHeaders.spec.ts, where every
          # card header puts its description - about a minute of it) moved
          # here from group 6 on 2026-10-21, when group 6 took 21.9 minutes
          # and this group 17.3, the lightest that holds several suites once
          # group 8 took three of group 5's: about 21.5 for the twelve. On
          # the next run the same day the group ran past the job's 30 minutes
          # (28.5 of suites; the job was cancelled two specs from the end of
          # Model Tables), so Model Tables and Runbook Variables moved to
          # group 5, Security Events Empty States to group 8 and Global
          # Runners to group 6: about 9.5 minutes, 20.5 left for the eight.
          # Rules Menu Section gained SideMenuNavigation.spec.ts on 2026-10-26
          # (14 tests, about 50 seconds locally: the shared side menu's
          # current entry, long French, German and Persian titles, and the lit
          # entry kept in sight in a menu taller than the window), when this
          # group took 18.2 to 18.9 minutes on master's runs of 2026-10-24:
          # about 19.5 to 20. Its UI review added SideMenuWordBreaks.spec.ts
          # the same day (6 tests in Chromium and the same 6 in Firefox,
          # which this group installs: where the menu's words break, since
          # Firefox hyphenates words Chrome moves whole) and 3 tests of the
          # list's fades and fitted card: 45 tests in 2.4 minutes locally,
          # about 50 seconds more, about 20.5 to 21. #5300's UI review added
          # CloudLinkSuggestions.spec.ts to Monitor Overview the same day (5
          # tests, about 20 seconds locally: the cloud resources a monitor's
          # Linked Resources card offers, linking one, a refused link, a read
          # that fails, dark): about 21 to 21.5. #5236 added 5 tests to Monitor
          # Overview on 2026-10-27 (about 15 seconds locally: scheduled
          # maintenance on a monitor's 90-day uptime strip - the band, the
          # tooltip, the day's dialog opening the event, a read that fails,
          # dark) and MaintenanceHistory.spec.ts to Status Page Search (8 tests
          # on each of its two Chromium projects with its UI review's, about 37
          # seconds locally), so Status Page Search (34.9 seconds on master's
          # run of 03:08 on 2026-10-26, 1.2 minutes with its new spec) moved to
          # group 11: about 20.5.
          - group: 3
            suites: >-
              test-monitor-overview-ui
              test-value-picker-ui
              test-event-notes-ui
              test-trace-detail-ui
              test-label-rule-transfer-ui
              test-list-delete-ui
              test-rules-menu-section-ui
          # The Workflow Builder suite on its own: it sat in group 2 near the
          # job's 30 minutes, and its On Create or Update spec would take that
          # group past them. Its two projects, a laptop and a phone, are both
          # Chromium. Calendar Feed moved to group 6 when this group took 23.6
          # minutes.
          # The Workflow Builder suite runs in halves since 2026-10-27, when it
          # took 20.4 minutes alone on 14.0.93's gate run and #5320 grew it
          # after: the laptop's half here (211 tests, 13.1 minutes locally on a
          # busy machine; about 12 on a runner), the phone's (188, 9.6 locally)
          # in group 9. Model Tables (4.7) from group 9 and Metrics AI (1.9)
          # from group 1 joined it: about 18.5.
          # Metrics AI gained MetricsInsights.spec.ts on 2026-10-28 (22 tests,
          # about 40 seconds locally, Chromium only: Metrics > Insights'
          # service cards at 1440, 1280, 1024, 768 and 390 pixels, with long
          # names and in the dark theme): about 19.
          - group: 4
            workflow_builder_shard: 1/2
            suites: >-
              test-workflow-builder-ui
              test-metrics-ai-ui
              test-model-tables-ui
          # The Chromium-only suites that ran after Event Overview in group 1.
          # Topology is one of them (about 2.5 minutes) since the Workflow
          # Builder suite grew again with its UI review: group 2 had reached
          # 24.5 of the job's 30 minutes on a slow runner. Calendar Feed and
          # Status Page Theme moved to groups 4 and 1 when this group reached
          # 28.5 minutes, and its last five suites to group 6 when it took
          # 25.5. Code (about 5 minutes: a laptop and a phone) joined it at
          # 14.2 to 16.4 minutes, the most room of the six. Public Addresses
          # (about a minute, Chromium only: a status page's Overview and a
          # dashboard's Sharing page) joined it on 2026-10-19. On 2026-10-21
          # the group ran past the job's 30 minutes (Security Operations had
          # grown with the Security pages to about 3.5 minutes, and the job
          # was cancelled in Code, with Public Addresses never run), so those
          # three moved to group 8: about 10 minutes of the group's 29.5.
          # Model Tables and Runbook Variables (about 4 minutes and 1, both
          # Chromium only) moved here from group 3 later that day, when this
          # group took 14.7 minutes, the lightest: about 19.5. The next run
          # took 24.9 (the same suites ran about 40% slower on its runner),
          # so Model Tables and Home Overview moved on to group 9: about 19.
          # Dashboard Value Widget (about a minute with its bundle locally,
          # Chromium only: the Value widgets' lines, arrows and tooltips
          # inside OneUptime and on the public page, at a laptop's and a
          # phone's width, dark, German and Persian) joined it on 2026-10-22,
          # when it took 14.4 minutes, the lightest of the nine: about 16.
          # Kubernetes Events (1.6 minutes locally with its bundle, Chromium
          # only: a cluster's warning events on its Events page, the Events
          # tab of a node, an HPA, a Deployment and a namespace, and the
          # Overview's Recent Warnings, at 1280 and 390 pixels, light, dark
          # and German) joined it on 2026-10-23, still the lightest: about 18.
          # Owners on Create (under a minute locally with its bundle,
          # Chromium only: Declare Incident's and Create Alert's Owners under
          # More fields, the declarer's teams one click away, the owner rules
          # the review says will run, and an owner rule's Creator's Team, at
          # 1280 and 390 pixels, dark and German) joined it the same day:
          # about 19. AI Context (about 1.5 minutes with its bundle locally,
          # Chromium only: Project Settings > AI > AI Features' AI context
          # card and its dialog, and the line a run's activity draws for what
          # it read with the dialog its View opens, at 1280 and 390 pixels,
          # light and dark, German and Persian) joined it on 2026-10-24, the
          # lightest group: about 20.5. Kubernetes Events gained 3 tests on
          # 2026-10-26 (about 10 seconds locally: a node's and an HPA's page
          # light their entry in the cluster's side menu, and a phone's menu
          # button names the section and the page, in German): still about
          # 20.5.
          # Kubernetes Events and Topology (2.8 minutes each on 14.0.93's gate
          # run) moved to group 9, and AI Context (1.6) to group 11, on
          # 2026-10-26, when that run took this group 25.8 minutes: about 19.
          # Side by Side Pages (about a minute locally with its two bundles,
          # Chromium only) moved here from group 8 the same day, when #5300's
          # UI review grew Cloud Connect there by about a minute: about 20.
          # Shared UI (2.5 minutes on 14.0.93's gate run) from group 11 and Owner
          # Filters (0.9) from group 10 joined it on 2026-10-27, when that run
          # took this group 13.4 minutes before Side by Side Pages: about 18.
          # First On-Call Policy (about half a minute locally with its bundle,
          # 11 tests, Chromium only: a new project's Create On-Call Policy
          # asking "Page this policy for every new incident and alert", what
          # Create sends, when it is not asked, at 1280 and 390 pixels, German
          # and Persian dark) joined it the same day, beside Incoming Call
          # Policies and Owners on Create: about 19.
          - group: 5
            suites: >-
              test-slo-burn-rate-ui
              test-incoming-call-policies-ui
              test-push-registration-ui
              test-packet-capture-ui
              test-llm-provider-test-ui
              test-custom-field-options-ui
              test-pagination-ui
              test-status-timeline-ui
              test-episode-bulk-add-ui
              test-runbook-triggers-ui
              test-network-first-run-ui
              test-runbook-variables-ui
              test-dashboard-value-widget-ui
              test-owners-on-create-ui
              test-first-on-call-policy-ui
              test-side-by-side-pages-ui
              test-owner-filters-ui
              test-shared-ui-ui
          # Added when group 5 took 25.5 of the job's 30 minutes and groups 1,
          # 3 and 4 23.5 to 24.3 on one run: group 5's last five suites, with
          # Discovery from group 3, Status Page Theme from group 1 and Calendar
          # Feed from group 4. All Chromium. Postmortem Rules (about 2
          # minutes) joined it at 15.3 to 20.5 minutes on 2026-10-19's runs,
          # the lightest of the groups that hold several suites. Maintenance
          # Calendar grew by 22 specs on 2026-10-20 (the calendar's own page,
