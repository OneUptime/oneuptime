name: App Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    # This job stopped finishing altogether: it ran into the 6h runner ceiling
    # and was killed there, so master had no App test signal at all. The suite
    # is ~340 files, two thirds of them under Tests/Dashboard, and each one was
    # dragging the Dashboard's React import graph through ts-jest's per-file
    # type check -- in a single process, because --detectOpenHandles implies
    # --runInBand. It now transpiles instead of type-checking
    # (App/jest.config.json sets isolatedModules) and runs on jest's worker
    # pool, which took the whole suite to under three minutes of test time.
    #
    # Nothing goes unchecked: the compile-app job in the Compile workflow has
    # every App test file as a tsc program root, and checks the whole program
    # once in about a minute rather than 338 times over.
    #
    # This cap is the tripwire. The suite has room to grow several times over
    # before it comes close, so if the job ever hits it something has regressed
    # and it should fail here rather than quietly block the queue for a workday.
    timeout-minutes: 30
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
      BILLING_PRIVATE_KEY: ${{secrets.TEST_BILLING_PRIVATE_KEY}}
      # Suites that must run their SQL against a real server, not just assert
      # on the generated string. Tests/Workers/SessionReplayFinalizerClickhouse
      # is the first: a query ClickHouse rejected passed every string check and
      # stopped RUM sessions finalizing. Each suite creates and drops its own
      # database, and fails this job if the URL goes missing rather than skip.
      TEST_CLICKHOUSE_URL: http://default:test@localhost:18123
    services:
      clickhouse:
        # Match the version docker-compose.base.yml ships.
        image: clickhouse/clickhouse-server:26.7
        env:
          CLICKHOUSE_PASSWORD: test
        ports:
          - 18123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: cd Common && bash test-setup.sh
      # App tests import Common sources directly (jest maps Common/* to
      # ../Common), so Common's own dependencies must be installed too.
      - run: cd Common && npm install
      - run: cd App && npm install && npm run test

  session-replay-ui:
    name: Session Replay UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # These browser tests render Dashboard sources with fixture API data.
      # They need the frontend dependencies, but no test database or Docker stack.
      - name: Install shared dependencies
        working-directory: Common
        run: npm install
      - name: Install Dashboard dependencies
        working-directory: App/FeatureSet/Dashboard
        run: npm install
      - name: Install browser test dependencies
        working-directory: E2E
        # Skip the preinstall hook that downloads every browser; this suite uses Chromium.
        run: npm install --ignore-scripts
      - name: Install Chromium
        working-directory: E2E
        run: npx playwright install --with-deps chromium
      - name: Run Session Replay UI regressions
        working-directory: E2E
        run: npm run test-session-replay-ui
      - name: Upload browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.job }}-${{ github.run_attempt }}
          path: |
            output/playwright/session-replay-ui/*.png
            output/playwright/session-replay-ui/test-results
          retention-days: 7

  dashboard-offline-ui:
    name: Dashboard Offline UI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # Each suite bundles real Dashboard / Status Page sources with esbuild and
      # serves them against fixture data on 127.0.0.1: no database or Docker stack.
      - name: Install shared dependencies
        working-directory: Common
        run: npm install
      - name: Install Dashboard dependencies
        working-directory: App/FeatureSet/Dashboard
        run: npm install
      - name: Install Status Page dependencies
        working-directory: App/FeatureSet/StatusPage
        run: npm install
      - name: Install browser test dependencies
        working-directory: E2E
        # Skip the preinstall hook that downloads every browser.
        run: npm install --ignore-scripts
      - name: Install browsers
        working-directory: E2E
        # The Alerts suite also runs in Firefox; every other suite is Chromium only.
        run: npx playwright install --with-deps chromium firefox
      # Every suite runs even if an earlier one failed, so one run reports them all.
      - name: Run Incoming Call Policies UI regressions
        if: ${{ !cancelled() }}
        working-directory: E2E
        run: npm run test-incoming-call-policies-ui
      - name: Run SLO Burn Rate UI regressions
        if: ${{ !cancelled() }}
        working-directory: E2E
        run: npm run test-slo-burn-rate-ui
      - name: Run Status Page Search UI regressions
        if: ${{ !cancelled() }}
        working-directory: E2E
        run: npm run test-status-page-search-ui
      - name: Run Pencil Button UI regressions
        if: ${{ !cancelled() }}
        working-directory: E2E
        run: npm run test-pencil-button-ui
      - name: Run Alerts UI regressions
        if: ${{ !cancelled() }}
        working-directory: E2E
        run: npm run test-alerts-ui
      - name: Run Label Rules UI regressions
        if: ${{ !cancelled() }}
        working-directory: E2E
        run: npm run test-label-rule-transfer-ui
      - name: Run Discovery UI regressions
        if: ${{ !cancelled() }}
        working-directory: E2E
        run: npm run test-discovery-ui
      - name: Run Topology UI regressions
        if: ${{ !cancelled() }}
        working-directory: E2E
        run: npm run test-topology-ui
      - name: Upload browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.job }}-${{ github.run_attempt }}
          path: |
            output/playwright/incoming-call-policies/*.png
            output/playwright/incoming-call-policies/test-results
            output/playwright/slo-burn-rate/*.png
            output/playwright/slo-burn-rate/test-results
            output/playwright/status-page-search/test-results
            output/playwright/pencil-button/test-results
            output/playwright/alerts/*.png
            output/playwright/alerts/test-results
            output/playwright/label-rule-import-export/*.png
            output/playwright/label-rule-import-export/fixture-test-results
            output/playwright/discovery/*.png
            output/playwright/discovery/test-results
            output/playwright/topology/*.png
            output/playwright/topology/test-results
          retention-days: 7
