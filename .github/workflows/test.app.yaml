name: App Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  # Not on every push to main: each pull request was tested on its merge
  # with main, and main runs this nightly and on demand instead
  # (Tests/Ops/PullRequestChecksNotOnPush.test.js says why).
  schedule:
    - cron: "19 1 * * *"
  workflow_dispatch:

# Read-only: these jobs check out and test the code, nothing more.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # This job stopped finishing altogether: it ran into the 6h runner ceiling
    # and was killed there, so master had no App test signal at all. The suite
    # is ~340 files, two thirds of them under Tests/Dashboard, and each one was
    # dragging the Dashboard's React import graph through ts-jest's per-file
    # type check -- in a single process, because --detectOpenHandles implies
    # --runInBand. It now transpiles instead of type-checking
    # (App/jest.config.json sets isolatedModules) and runs on jest's worker
    # pool, which took the whole suite to under three minutes of test time.
    #
    # Nothing goes unchecked: the Compile workflow's Compile App step (in its
    # compile-services job) has every App test file as a tsc program root, and
    # checks the whole program once in about a minute rather than 338 times
    # over.
    #
    # This cap is the tripwire: if a shard ever hits it something has
    # regressed, and it should fail here rather than quietly block the queue
    # for a workday.
    timeout-minutes: 30
    strategy:
      # One slow or broken shard should not hide the results of the others.
      fail-fast: false
      # Three shards. In one job the suite had grown to ~1,800 files and 26 of
      # the job's 30 minutes (jest's own time 1,541 s on master, 2026-10-17),
      # so the cap was about to fail runs with nothing wrong in them. Setup
      # takes a minute and a half, so three bring each shard to about ten
      # minutes for much the same runner time in all. When a shard passes
      # about 20 minutes, add one here rather than raise the cap.
      #
      # Four since 2026-11-14. Shard 3 of 3 had taken 26 and 24 minutes on the
      # 14.0.109 and 14.0.110 release branches (jest's own time 1,291 s on
      # 14.0.110, 897 files), and on 14.0.111 it reached the cap after 861 of
      # its files: the same 846 files as before took a third longer on that
      # runner, no one of them the cause, while the other two shards took 17
      # and 23 minutes.
      #
      # Six since 2026-11-16, of two workers each where four shards had
      # jest's three (the test step below says why): the same twelve workers,
      # so each shard keeps about the time it had.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
      BILLING_PRIVATE_KEY: ${{secrets.TEST_BILLING_PRIVATE_KEY}}
      # Suites that must run their SQL against a real server, not just assert
      # on the generated string. Tests/Workers/SessionReplayFinalizerClickhouse
      # is the first: a query ClickHouse rejected passed every string check and
      # stopped RUM sessions finalizing. Each suite creates and drops its own
      # database, and fails this job if the URL goes missing rather than skip.
      TEST_CLICKHOUSE_URL: http://default:test@localhost:18123
      # The cluster of two shards the step below gives that server, so
      # Tests/Telemetry/PagedFindBoundClickhouse also pages through a
      # Distributed table over two shards, as a sharded install reads one.
      TEST_CLICKHOUSE_TWO_SHARD_CLUSTER: paged_find_bound_two_shards
    services:
      clickhouse:
        # Match the version docker-compose.base.yml ships. Docker Hub's
        # clickhouse/clickhouse-server, from mirror.gcr.io: the runner starts
        # service containers before any step, so the daemon's mirror
        # (.github/actions/docker-hub-mirror) is not set yet.
        image: mirror.gcr.io/clickhouse/clickhouse-server:26.7
        env:
          CLICKHOUSE_PASSWORD: test
        ports:
          - 18123:8123
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # Two shards, each a database of its own on the one ClickHouse service
      # (Tests/Telemetry/Fixtures/ClickhouseTwoShardCluster.xml). The server
      # reads config.d again a moment after it changes, long before the
      # tests start; the suite waits for the cluster all the same.
      - name: Give the ClickHouse service a cluster of two shards
        env:
          CLICKHOUSE_CONTAINER: ${{ job.services.clickhouse.id }}
        run: docker cp packages/App/Tests/Telemetry/Fixtures/ClickhouseTwoShardCluster.xml "$CLICKHOUSE_CONTAINER:/etc/clickhouse-server/config.d/paged-find-bound-two-shards.xml"
      # Core is the Community Edition by construction: it must build and pass
      # without ee/ in the checkout. ee/ has its own jobs (compile-ee, test.ee.yaml).
      - name: Remove the Enterprise Edition (core runs without ee/)
        run: rm -rf ee
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # Before test-setup.sh pulls postgres and valkey: through mirror.gcr.io,
      # not anonymously from Docker Hub (.github/actions/docker-hub-mirror).
      - uses: ./.github/actions/docker-hub-mirror
      - run: cd packages/Common && bash test-setup.sh
      # App tests import Common sources directly (jest maps Common/* to
      # ../Common), so Common's own dependencies must be installed too.
      - name: Install Common dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Common
      - name: Install App dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/App
      # Two jest workers at 4 GB of heap each (App's test script:
      # NODE_OPTIONS=--max-old-space-size=4096 and --maxWorkers=2). The heap
      # flag is a ceiling per process - jest-worker hands it to every worker
      # it forks - and a worker grows into it: V8 keeps finished test files'
      # contexts while it has room, so by a shard's middle each worker holds
      # 3.5 to 4 GB. Jest's default of three workers on this four-CPU, 16 GB
      # runner made that a 12 GB ceiling beside ClickHouse (about 3 GB),
      # Postgres and Valkey, and on the 14.3.0 release branch shard 1 of 4
      # reached it after 433 of its 722 suites, twice: every worker stopped at
      # once, the job printed nothing more, and the cap cut it off. A smaller
      # heap for three workers is no way out: at 2560 MB workers of shards 2
      # and 3 ran out of it ("Ineffective mark-compacts near heap limit"). Two
      # at 4 GB keep the ceiling at 8 GB, as Common Test's pool is held
      # (test.common.yaml).
      - run: cd packages/App && npm run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  session-replay-ui:
    name: Session Replay UI
    runs-on: ubuntu-latest
    # In the Playwright image, as dashboard-offline-ui below says why. The
    # limit holds each suite's own, about 7 minutes for checkout and the npm
    # installs, and 5 for the image's pull (Tests/Ops/PlaywrightImage).
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    # In a container a run step with no shell of its own gets sh, not the
    # bash -e {0} a runner gives it; the steps here are written for the
    # runner's (Tests/Ops/PlaywrightImage).
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Core is the Community Edition by construction: it must build and pass
      # without ee/ in the checkout. ee/ has its own jobs (compile-ee, test.ee.yaml).
      - name: Remove the Enterprise Edition (core runs without ee/)
        run: rm -rf ee
      # The fonts an ubuntu runner has and the image lacks (DejaVu, the
      # runner's sans-serif, serif and monospace), so pages that load no web
      # font of their own draw their words as on the runner.
      - uses: ./.github/actions/runner-fonts
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # These browser tests render Dashboard sources with fixture API data.
      # They need the frontend dependencies, but no test database or Docker stack.
      - name: Install shared dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Common
      - name: Install Dashboard dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/App/FeatureSet/Dashboard
      - name: Install browser test dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/E2E
          # Skip the preinstall hook that downloads every browser: the
          # image has them.
          args: --ignore-scripts
      - name: Run Session Replay UI regressions
        working-directory: packages/E2E
        timeout-minutes: 15
        run: npm run test-session-replay-ui
      # Runs even if the replay suite failed, so one run reports both.
      - name: Run User Flows UI regressions
        if: ${{ !cancelled() }}
        working-directory: packages/E2E
        timeout-minutes: 10
        run: npm run test-user-flows-ui
      - name: Upload browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.job }}-${{ github.run_attempt }}
          path: |
            output/playwright/session-replay-ui/*.png
            output/playwright/session-replay-ui/test-results
            output/playwright/user-flows-ui/*.png
            output/playwright/user-flows-ui/test-results
          retention-days: 7

  # Browser suites that each bundle real Dashboard or Status Page sources with
  # esbuild and serve them against fixture data: no database or Docker stack.
  # They used to run one after another in a single 41-minute job, the longest
  # of every pull request's checks. They are independent - each starts its
  # own fixture server on its own port - so they run here in groups, each a
  # job of its own. Each suite runs exactly as before: same config, same
  # browsers, one worker.
  #
  # A group runs two of its suites at a time (since 2026-11-16,
  # packages/E2E/Scripts/RunUiSuites.js, the run step below), never two that
  # share a port, a fixture server or an output directory: one suite kept
  # about one and a half of the runner's four CPUs busy, so a group's runner
  # was mostly idle. Beside another suite a suite takes about a quarter
  # longer than alone (1.26 times: the median over 68 runs of 37 suites
  # unchanged between 14.3.0's gate runs, one at a time, and 15.0.0's, two at
  # a time), and the groups are planned by what two lanes take. There were 22
  # groups, each 12 to 28 minutes one suite at a time, and 9 to 23 minutes two
  # at a time on 15.0.0's gate run (2026-11-17), the groups that held one long
  # suite and little else the slowest; there are twelve now, each about 21
  # minutes, and a thirteenth that had room for a suite none of them had.
  #
  # The same group has taken a third longer on one run than on the next with
  # nothing changed but the runner (about 18 and 24 minutes), and on
  # 14.0.100's second gate run (2026-11-01) one took 1.45 times the minutes
  # of the first run, suite for suite. So the run step's limit is 35,
  # and a group is planned at about 22 minutes on a runner of normal speed
  # (about 32 on the slowest seen). When one passes that, move a suite or add
  # a group.
  # Tests/Ops/DashboardOfflineUiBudget holds every group to it: each suite's
  # minutes beside another - a suite run in parts, each part's - are in
  # Tests/Ops/DashboardOfflineUiMinutes.json, measured from App Test's runs
  # (its `about` says how; a new suite's from a local run until then), and a
  # group's suites, started as the run step starts them, must end within 22.
  # Its failure names the groups with the most room.
  #
  # The groups run in the Playwright image (mcr.microsoft.com/playwright, at
  # the version packages/E2E locks): Chromium, Firefox and the system
  # packages and fonts they need are in it, so a group fetches nothing from
  # the runner's Ubuntu mirror, and any suite can run in any group. They
  # used to install them with `playwright install --with-deps`: about 25 MB
  # that some runners' mirror served at 36 kB/s, 20 minutes in one group
  # (2026-10-22) and 11.7 in another (2026-10-23), and elsewhere an apt-get
  # update that hung for three hours. The image, about 1 GB from Microsoft's
  # registry, is pulled before the first step in about a minute. It lacks one
  # thing the runner has: DejaVu, fontconfig's sans-serif, serif and
  # monospace there, which the suites' pages with no web font of their own
  # were measured in. .github/actions/runner-fonts installs the runner's
  # DejaVu faces from the repository, with no apt (in the image, four tests
  # that measure words failed without them).
  # Tests/Ops/PlaywrightImage holds its tag to the lockfile's Playwright, the
  # job's limit to the run step's 35 minutes, the setup and the pull, and
  # every job in the image to installing the runner's fonts.
  #
  # A suite that would take a group's minutes by itself runs in parts, one
  # per group: its config reads a variable of its own, set below from the
  # group's <name>_shard ("1/2" or "2/2", or "1/3" to "3/3"), and passes it
  # to Playwright's shard. Event Overview (one spec file, split by test) ran
  # in halves from 2026-10-22, and in thirds since 2026-11-17: a half took 20
  # to 23 minutes alone, more than a group's 22 beside another suite. The
  # Workflow Builder suite runs in halves since 2026-10-27, by spec file (the
  # laptop's projects in one half, the phone's in the other); Model Tables
  # and Monitor Overview since 2026-11-01, and Security Operations since
  # 2026-11-17, by test as Event Overview is; and the OpenStack pages in
  # thirds since 2026-11-10 (Tests/Ops/DashboardOfflineUiShards holds every
  # part to running once, and to adding up to the suite).
  #
  # A suite added to packages/E2E needs a place in one group's `suites`, its
  # minutes in Tests/Ops/DashboardOfflineUiMinutes.json, and its output
  # paths in the upload step below. Its config needs a port of its own unless
  # it shares a fixture with another suite: RunUiSuites.js keeps two suites
  # with one port apart, so a shared port only costs time.
  dashboard-offline-ui:
    name: Dashboard Offline UI (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 48
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The runner's own user: the workspace and HOME are its, and Firefox
      # will not start as root in a home another user owns. The host's IPC
      # namespace, as Playwright's image asks, so Chromium cannot run short of
      # shared memory.
      options: --user 1001 --ipc=host
    # In a container a run step with no shell of its own gets sh, not the
    # bash -e {0} a runner gives it; the steps here are written for the
    # runner's (Tests/Ops/PlaywrightImage).
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: read
    # Which third of Event Overview a group runs, "1/3" to "3/3"; empty in
    # the groups that do not run it (playwright.event-overview-ui.config.ts).
    env:
      EVENT_OVERVIEW_SHARD: ${{ matrix.event_overview_shard || '' }}
      # Which half of the Workflow Builder suite, the same way
      # (playwright.workflow-builder-ui.config.ts).
      WORKFLOW_BUILDER_SHARD: ${{ matrix.workflow_builder_shard || '' }}
      # And of Model Tables (playwright.model-tables-ui.config.ts).
      MODEL_TABLES_SHARD: ${{ matrix.model_tables_shard || '' }}
      # And of Monitor Overview (playwright.monitor-overview-ui.config.ts).
      MONITOR_OVERVIEW_SHARD: ${{ matrix.monitor_overview_shard || '' }}
      # And which third of the OpenStack pages, "1/3" to "3/3"
      # (playwright.openstack-pages-ui.config.ts).
      OPENSTACK_PAGES_SHARD: ${{ matrix.openstack_pages_shard || '' }}
      # And which half of Security Operations
      # (playwright.security-operations-ui.config.ts).
      SECURITY_OPERATIONS_SHARD: ${{ matrix.security_operations_shard || '' }}
    strategy:
      # Every group reports its own suites, whatever happens to the others.
      fail-fast: false
      matrix:
        include:
          # Packed on 2026-11-17 from DashboardOfflineUiMinutes.json, as
          # evenly as could be found: each group 21.2 to 21.6 minutes on two
          # lanes at a median runner's speed (eleven groups would have taken
          # 23.4 each, past the 22 they are kept to). Each group lists its
          # suites slowest first, as they start. Until then each group carried
          # the history of the suites that joined and left it, one at a time;
          # git log has it. The same day the guided setups' suites took
          # places: the on-call setup's (group 13's alone until then, #9418)
          # in group 2, never beside the journeys, whose fixture server it
          # shares, and the website setup's (#7056) in group 5. Four short
          # suites moved to make room (Profiles to 1, Suite Helpers to 5,
          # Exceptions AI to 10, Give Feedback to 11): each group 21.3 to
          # 21.9 minutes. On 2026-11-18 How to Reach Me's suite (#7453, 1.2
          # minutes: 54 s locally, times 1.26) joined group 8, and
          # Infrastructure First Run moved to group 3 to make room: group 8
          # 21.6 minutes, group 3 21.8. Group 13 came on the same day for
          # the status page and telemetry setups' suite (#7143, 2.9 minutes:
          # 138 s locally, times 1.26): no group had that left on a lane.
          # The journeys' two guided journeys (#7141) took Journeys from 4.4
          # to 4.9 minutes, so Product Onboarding moved from group 2 to group
          # 13: group 2 21.4 minutes, group 13 2.9.
          - group: 1
            event_overview_shard: 1/3
            suites: >-
              test-event-overview-ui
              test-exception-detail-ui
              test-profiles-ui
              test-vmware-pages-ui
              test-traces-ai-ui
              test-llm-provider-test-ui
              test-dashboard-table-thresholds-ui
              test-openshift-pages-ui
              test-archivable-values-ui
              test-storage-array-pages-ui
              test-runbook-variables-ui
              test-first-on-call-policy-ui
          - group: 2
            event_overview_shard: 2/3
            suites: >-
              test-event-overview-ui
              test-security-events-empty-states-ui
              test-journeys-ui
              test-resource-overviews-ui
              test-dashboard-time-range-ui
              test-dashboard-widget-sort-ui
              test-list-delete-ui
              test-host-collectors-ui
              test-on-call-guided-setup-ui
              test-resource-onboarding-ui
          - group: 3
            event_overview_shard: 3/3
            suites: >-
              test-event-overview-ui
              test-topology-ui
              test-kubernetes-events-ui
              test-logs-ai-ui
              test-event-notes-ui
              test-trace-detail-ui
              test-accounts-theme-ui
              test-custom-roles-ui
              test-push-registration-ui
              test-label-rule-transfer-ui
              test-infrastructure-first-run-ui
              test-pencil-button-ui
          - group: 4
            openstack_pages_shard: 1/3
            suites: >-
              test-openstack-pages-ui
              test-ask-ai-ui
              test-meraki-traffic-ui
              test-navigation-search-ui
              test-slo-burn-rate-ui
              test-proxmox-pages-ui
              test-bulk-actions-ui
              test-postmortems-ui
              test-acknowledgement-timeout-ui
          - group: 5
            openstack_pages_shard: 2/3
            security_operations_shard: 1/2
            suites: >-
              test-security-operations-ui
              test-openstack-pages-ui
              test-status-page-theme-ui
              test-home-overview-ui
              test-security-hunts-ui
              test-suite-helpers-ui
              test-website-down-guided-setup-ui
              test-runbook-triggers-ui
              test-custom-field-files-ui
              test-custom-field-options-ui
          - group: 6
            openstack_pages_shard: 3/3
            suites: >-
              test-openstack-pages-ui
              test-app-platforms-ui
              test-network-traffic-names-ui
              test-episode-bulk-add-ui
              test-host-pages-ui
              test-calendar-feed-ui
              test-ceph-pages-ui
              test-detail-cards-ui
              test-public-addresses-ui
              test-snmp-walk-ui
              test-database-pages-ui
              test-ai-insights-ui
              test-incoming-call-policies-ui
              test-pagination-ui
          - group: 7
            security_operations_shard: 2/2
            suites: >-
              test-security-operations-ui
              test-reading-direction-ui
              test-diagrams-ui
              test-resource-topology-ui
              test-rules-menu-section-ui
              test-ai-context-ui
              test-owner-filters-ui
              test-container-host-pages-ui
              test-cloud-recommendations-ui
          - group: 8
            workflow_builder_shard: 1/2
            monitor_overview_shard: 2/2
            suites: >-
              test-workflow-builder-ui
              test-monitor-overview-ui
              test-dashboard-playlists-ui
              test-data-security-ui
              test-new-version-ui
              test-asset-details-ui
              test-kubernetes-pages-ui
              test-network-first-run-ui
              test-how-to-reach-me-ui
              test-runbooks-menu-ui
          - group: 9
            workflow_builder_shard: 2/2
            suites: >-
              test-workflow-builder-ui
              test-cloud-spend-ui
              test-public-dashboard-theme-ui
              test-code-editor-ui
              test-shared-ui-ui
              test-maintenance-calendar-ui
              test-status-timeline-ui
              test-color-picker-ui
              test-postmortem-rules-ui
              test-security-page-ui
          - group: 10
            model_tables_shard: 1/2
            suites: >-
              test-code-ui
              test-cloud-connect-ui
              test-model-tables-ui
              test-metrics-ai-ui
              test-exceptions-ai-ui
              test-status-page-search-ui
              test-packet-capture-ui
              test-multi-device-snmp-walk-ui
              test-alerts-ui
              test-external-mcp-servers-ui
              test-permissions-per-tab-ui
          - group: 11
            suites: >-
              test-chart-time-zoom-ui
              test-discovery-ui
              test-auto-remediation-rules-ui
              test-llm-connect-ui
              test-dashboard-templates-ui
              test-docker-swarm-pages-ui
              test-owners-on-create-ui
              test-runbook-steps-ui
              test-test-page-ui
              test-give-feedback-ui
          - group: 12
            model_tables_shard: 2/2
            monitor_overview_shard: 1/2
            suites: >-
              test-security-cases-detections-ui
              test-monitor-overview-ui
              test-model-tables-ui
              test-value-picker-ui
              test-global-runners-ui
              test-vmware-host-page-ui
              test-dashboard-value-widget-ui
              test-sign-in-options-ui
              test-side-by-side-pages-ui
              test-server-setup-ui
          - group: 13
            suites: >-
              test-admin-health-ui
              test-status-page-telemetry-guided-setups-ui
              test-product-onboarding-ui
    steps:
      - uses: actions/checkout@v4
      # Core is the Community Edition by construction: it must build and pass
      # without ee/ in the checkout. ee/ has its own jobs (compile-ee, test.ee.yaml).
      - name: Remove the Enterprise Edition (core runs without ee/)
        run: rm -rf ee
      # The fonts an ubuntu runner has and the image lacks (DejaVu, the
      # runner's sans-serif, serif and monospace), so pages that load no web
      # font of their own draw their words as on the runner.
      - uses: ./.github/actions/runner-fonts
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install shared dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/Common
      - name: Install Dashboard dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/App/FeatureSet/Dashboard
      - name: Install Status Page dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/App/FeatureSet/StatusPage
      - name: Install browser test dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: packages/E2E
          # Skip the preinstall hook that downloads every browser: the
          # image has them.
          args: --ignore-scripts
      # Two suites at a time (Scripts/RunUiSuites.js says why): a suite keeps
      # about one and a half of the runner's four CPUs busy, so one at a time
      # left most of the runner idle. Never two that share a port, a fixture
      # server or an output directory, each read from the suite's config, and
      # each suite runs exactly as before (its own config, browser, worker and
      # fixture server). The slowest start first. Each line of output starts
      # with its suite's name, each suite's whole log is uploaded below, and
      # the step summary lists every suite's result and minutes.
      #
      # Every suite in the group runs even if another failed, so one run
      # reports them all, and the step fails at the end if any did. A name that
      # is not a script in packages/E2E/package.json fails before anything
      # runs, rather than quietly running nothing. UI_SUITE_LANES: "1" runs
      # them one after another, as before (Tests/Ops/RunUiSuites.test.js).
      - name: Run this group's UI regressions
        working-directory: packages/E2E
        timeout-minutes: 35
        env:
          SUITES: ${{ matrix.suites }}
          UI_SUITE_LANES: "2"
        run: node Scripts/RunUiSuites.js
