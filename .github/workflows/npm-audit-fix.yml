name: NPM Audit Fix

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  npm-audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Run npm audit fix across packages
        run: npm run audit-fix

      - name: Detect changes
        id: changes
        run: |
          if git status --porcelain | grep .; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # The audit fixes take half an hour, and master moves meanwhile. A branch
      # built on the master the run started from carries that master's copy of
      # every workflow file, and GitHub refuses this token a branch whose
      # workflow files differ from master's ("refusing to allow a GitHub App to
      # create or update workflow ... without `workflows` permission"), as on
      # 2026-10-29 when #5393 changed test.app.yaml mid-run. So the fixes move
      # onto the newest master just before the pull request is made. A lockfile
      # master changed in the same lines stops the run here, and the next
      # night's run starts from that master.
      - name: Put the fixes on the newest master
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git stash push --include-untracked
          git fetch --no-tags origin master
          git reset --hard origin/master
          git stash pop

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: npm audit fix"
          title: "chore: npm audit fix"
          body: |
            Automated npm audit fix run.
            Audit exceptions whose advisory is no longer in a project's
            dependency tree are removed from Scripts/Security/npm-audit-exceptions.json in the
            same change, so review those removals with the lockfile updates.
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}
          branch: chore/npm-audit-fix
          delete-branch: true
