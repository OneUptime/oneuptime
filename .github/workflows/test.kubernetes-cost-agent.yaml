name: Kubernetes Cost Agent Test

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

# Read-only: these jobs check out and test the code, nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          # Restores ~/.npm so the npm install below resolves from cache
          # instead of re-downloading the tree from the registry every run.
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install Kubernetes Cost Agent dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: agents/KubernetesCostAgent
      # `npm test` compiles with tsc first and then runs the node:test suites
      # against the build output, so this covers type errors as well. The
      # suites stand in for the cost engine, Prometheus and OneUptime
      # themselves, so no cluster is needed.
      #
      # These suites had no workflow of their own, and the agent's image stopped
      # compiling them when it left its tests out (COPY --exclude=Tests), so
      # this is the only place they run. Tests/Ops/NodeAgentsInCi.test.js holds
      # every agent with npm tests to a workflow like this one.
      - run: cd agents/KubernetesCostAgent && npm run test
