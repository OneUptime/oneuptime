name: Build

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pull requests only. Every push to master builds these same images again in
# test-release.yaml - from the same Dockerfiles, for both architectures and
# both editions, with the release's own build script - and its e2e jobs check
# the App's editions on the pushed images. Building them here as well on each
# push to master cost ~40 runner-minutes (the home image alone ~20) and showed
# nothing those jobs do not.
on:
  pull_request:

# Every job checks out and runs `docker build`; none pushes or calls the API.
permissions:
  contents: read

# The builds run in nick-fields/retry, as the runner's own user (it is in the
# docker group), never through sudo. An attempt that reaches its
# timeout_minutes is stopped by the action killing the command's processes,
# which it cannot do to a root-owned `sudo docker build`: the action died on
# "Error: kill EPERM" and failed the job instead of trying again (Build run
# 41681440927, whose Home image's blog clone stalled).
# Tests/Ops/RetryStepsWithoutSudo.test.js keeps sudo out of them.

jobs:

  docker-build-home:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall 
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/Home/Dockerfile
      
      # build image for accounts service
      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -f ./packages/Home/Dockerfile .


  docker-build-app:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      # The runtime check at the end starts the App with the PostgreSQL,
      # ClickHouse and Valkey docker-compose.yml runs: pull those through
      # mirror.gcr.io, not anonymously from Docker Hub
      # (.github/actions/docker-hub-mirror). The App image itself is built
      # here, never pulled.
      - uses: ./.github/actions/docker-hub-mirror

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall 
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/App/Dockerfile

      # The App Dockerfile builds both editions (packages/App/Dockerfile.tpl):
      # --target community is the Community Edition and --target enterprise is
      # the same build plus ee/. Community first and from scratch, like every
      # other image here; the enterprise build then reuses its cached layers,
      # so it only pays for ee/ and the two rebuilt frontend bundles.
      - name: build the Community Edition image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache --target community -t oneuptime-app:community -f ./packages/App/Dockerfile .

      - name: build the Enterprise Edition image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --target enterprise -t oneuptime-app:enterprise -f ./packages/App/Dockerfile .

      # Nothing else would notice a Community image that picked up ee/, or an
      # Enterprise image whose Dashboard quietly fell back to the Community UI.
      - name: check the Community Edition image
        run: sudo bash ./Scripts/GHA/check_app_image_edition.sh --image oneuptime-app:community --edition community

      - name: check the Enterprise Edition image
        run: sudo bash ./Scripts/GHA/check_app_image_edition.sh --image oneuptime-app:enterprise --edition enterprise

      # Each edition's image copies /usr/src out of a pruned build
      # (Scripts/Docker/PruneUnreachablePackages.js), so a package or a file
      # the App needs and the prune took would fail only when something reads
      # it. Start the Community image as Docker Compose starts it, with its
      # datastores, and have it serve every frontend, the docs, the API
      # reference, an install script and a sign-up
      # (Tests/Ops/AppImageRuntime.test.js).
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: 'Tests/Ops/package-lock.json'

      - name: Install Ops test dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: Tests/Ops

      - name: start the Community Edition image and have it serve
        run: |
          docker tag oneuptime-app:community oneuptime/app:ci-runtime
          cd Tests/Ops && RUN_APP_IMAGE_RUNTIME_TESTS=1 APP_IMAGE_TAG=ci-runtime npx jest --config ./jest.config.json AppImageRuntime


  docker-build-e2e:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall 
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/E2E/Dockerfile

        
      # build image for accounts service
      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -f ./packages/E2E/Dockerfile .

  docker-build-probe:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/Probe/Dockerfile

      # build image probe api
      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -f ./packages/Probe/Dockerfile .

  docker-build-runner:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/Runner/Dockerfile

      # build runner image (the merged Runbook Agent + AI Agent)
      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -t oneuptime-runner:ci -f ./packages/Runner/Dockerfile .

      # The image is pruned to the packages the Runner reaches
      # (Scripts/Docker/PruneUnreachablePackages.js), so a package the walk
      # missed would be gone from it and fail only when the code that loads
      # it runs. Start the image as it ships, against a stand-in for the
      # OneUptime server, and have it register and run a JavaScript step (its
      # isolated-vm sandbox) and a Bash step (Tests/Ops/RunnerImageRuntime.test.js).
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: 'Tests/Ops/package-lock.json'

      - name: Install Ops test dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: Tests/Ops

      - name: start the image and have it run steps
        run: cd Tests/Ops && RUN_RUNNER_IMAGE_RUNTIME_TESTS=1 RUNNER_IMAGE=oneuptime-runner:ci npx jest --config ./jest.config.json RunnerImageRuntime

  # The Kubernetes AI agent image (agents/KubernetesAIAgent), which the
  # kubernetes-agent chart installs by default. Built on every pull request
  # so a broken kubectl download or digest, or an agent that does not compile
  # inside the image, fails here rather than in the release. This builds the
  # runner's architecture (amd64) only; test-release.yaml builds both on every
  # push to master.
  docker-build-kubernetes-ai-agent:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./agents/KubernetesAIAgent/Dockerfile

      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -f ./agents/KubernetesAIAgent/Dockerfile .

  # The resource AI agent image (agents/ResourceAIAgent), which the Docker,
  # Podman, Swarm, Proxmox, VMware, Ceph, database and host agents run as
  # their "ai-agent" service. Built on every pull request so an Alpine
  # package that is renamed or dropped (docker-cli, govc, ceph19-common,
  # util-linux-misc), or an agent that does not compile inside the image,
  # fails here rather than in the release. This builds the runner's
  # architecture (amd64) only; test-release.yaml builds both on every push to
  # master.
  docker-build-resource-ai-agent:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # Seeds the base image into the local store first, from Docker Hub if
      # public.ecr.aws will not serve it (its shared anonymous quota runs out
      # in a busy CI window); see docker-build-kubernetes-ai-agent above.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./agents/ResourceAIAgent/Dockerfile

      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -f ./agents/ResourceAIAgent/Dockerfile .

  docker-build-test-server:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/TestServer/Dockerfile

      # build image for mail service
      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -f ./packages/TestServer/Dockerfile .
