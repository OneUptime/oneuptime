name: Build

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master


jobs:

  docker-build-home:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall 
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/Home/Dockerfile
      
      # build image for accounts service
      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: sudo docker build --no-cache -f ./packages/Home/Dockerfile .


  docker-build-app:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall 
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/App/Dockerfile

      # The App Dockerfile builds both editions (packages/App/Dockerfile.tpl):
      # --target community is the Community Edition and --target enterprise is
      # the same build plus ee/. Community first and from scratch, like every
      # other image here; the enterprise build then reuses its cached layers,
      # so it only pays for ee/ and the two rebuilt frontend bundles.
      - name: build the Community Edition image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: sudo docker build --no-cache --target community -t oneuptime-app:community -f ./packages/App/Dockerfile .

      - name: build the Enterprise Edition image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: sudo docker build --target enterprise -t oneuptime-app:enterprise -f ./packages/App/Dockerfile .

      # Nothing else would notice a Community image that picked up ee/, or an
      # Enterprise image whose Dashboard quietly fell back to the Community UI.
      - name: check the Community Edition image
        run: sudo bash ./Scripts/GHA/check_app_image_edition.sh --image oneuptime-app:community --edition community

      - name: check the Enterprise Edition image
        run: sudo bash ./Scripts/GHA/check_app_image_edition.sh --image oneuptime-app:enterprise --edition enterprise


