name: Build

# Supersede in-flight runs for the same branch/PR: only the newest commit needs CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pull requests only. Every push to main builds these same images again in
# test-release.yaml - from the same Dockerfiles, for both architectures and
# both editions, with the release's own build script - and its e2e jobs check
# the App's editions on the pushed images. Building them here as well on each
# push to main cost ~40 runner-minutes (the home image alone ~20) and showed
# nothing those jobs do not. The Kubernetes cost agent and log tailer are the
# exceptions: test-release.yaml does not build them (see their jobs below).
on:
  pull_request:

# Every job checks out and runs `docker build`; none pushes or calls the API.
permissions:
  contents: read

# The Vulnerability gate (vulnerability-gate, the last job). On a pull request
# into `release` - so on every release, before it ships - or one labelled
# vulnerability-gate, each job that builds an image the release ships also
# writes that image's SBOM (.github/actions/image-sbom), and the gate scans
# them with Grype and fails on a critical, high or known exploited
# vulnerability that a newer version fixes, unless
# Scripts/Security/image-vulnerability-exceptions.json accepts it until a date
# (Scripts/Security/ImageVulnerabilities.js). 16.0.0 shipped nginx 1.30.5 with
# three critical vulnerabilities that 1.30.6 had fixed four weeks before: the
# release's own scan listed them, and nothing failed. Three images are built
# for the gate alone (docker-build-nginx, docker-build-docker-agent and
# docker-build-podman-agent), since no other pull request check builds them
# whole. Every other pull request skips all of it.
# Tests/Ops/ImageVulnerabilities.test.js holds each image the release ships
# to one SBOM here.
env:
  VULNERABILITY_GATE: ${{ github.base_ref == 'release' || contains(github.event.pull_request.labels.*.name, 'vulnerability-gate') }}

# The builds run in nick-fields/retry, as the runner's own user (it is in the
# docker group), never through sudo. An attempt that reaches its
# timeout_minutes is stopped by the action killing the command's processes,
# which it cannot do to a root-owned `sudo docker build`: the action died on
# "Error: kill EPERM" and failed the job instead of trying again (Build run
# 41681440927, whose Home image's blog clone stalled).
# Tests/Ops/RetryStepsWithoutSudo.test.js keeps sudo out of them.

jobs:

  docker-build-home:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall 
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/Home/Dockerfile
      
      # build image for accounts service
      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -f ./packages/Home/Dockerfile .


  docker-build-app:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      # The runtime check at the end starts the App with the PostgreSQL,
      # ClickHouse and Valkey docker-compose.yml runs: pull those through
      # mirror.gcr.io, not anonymously from Docker Hub
      # (.github/actions/docker-hub-mirror). The App image itself is built
      # here, never pulled.
      - uses: ./.github/actions/docker-hub-mirror

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall 
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/App/Dockerfile

      # The App Dockerfile builds both editions (packages/App/Dockerfile.tpl):
      # --target community is the Community Edition and --target enterprise is
      # the same build plus ee/. Community first and from scratch, like every
      # other image here; the enterprise build then reuses its cached layers,
      # so it only pays for ee/ and the two rebuilt frontend bundles.
      - name: build the Community Edition image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache --target community -t oneuptime-app:community -f ./packages/App/Dockerfile .

      - name: build the Enterprise Edition image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --target enterprise -t oneuptime-app:enterprise -f ./packages/App/Dockerfile .

      # Both editions' SBOMs, for the Vulnerability gate (see the top).
      - name: SBOM of the Community Edition image for the vulnerability gate
        if: env.VULNERABILITY_GATE == 'true'
        uses: ./.github/actions/image-sbom
        with:
          image: oneuptime-app:community
          name: app

      - name: SBOM of the Enterprise Edition image for the vulnerability gate
        if: env.VULNERABILITY_GATE == 'true'
        uses: ./.github/actions/image-sbom
        with:
          image: oneuptime-app:enterprise
          name: app-enterprise

      # Nothing else would notice a Community image that picked up ee/, or an
      # Enterprise image whose Dashboard quietly fell back to the Community UI.
      - name: check the Community Edition image
        run: sudo bash ./Scripts/GHA/check_app_image_edition.sh --image oneuptime-app:community --edition community

      - name: check the Enterprise Edition image
        run: sudo bash ./Scripts/GHA/check_app_image_edition.sh --image oneuptime-app:enterprise --edition enterprise

      # Each edition's image copies /usr/src out of a pruned build
      # (Scripts/Docker/PruneUnreachablePackages.js), so a package or a file
      # the App needs and the prune took would fail only when something reads
      # it. Start the Community image as Docker Compose starts it, with its
      # datastores, and have it serve every frontend, the docs, the API
      # reference, an install script and a sign-up
      # (Tests/Ops/AppImageRuntime.test.js).
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: 'Tests/Ops/package-lock.json'

      - name: Install Ops test dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: Tests/Ops

      - name: start the Community Edition image and have it serve
        run: |
          docker tag oneuptime-app:community oneuptime/app:ci-runtime
          cd Tests/Ops && RUN_APP_IMAGE_RUNTIME_TESTS=1 APP_IMAGE_TAG=ci-runtime npx jest --config ./jest.config.json AppImageRuntime


  docker-build-e2e:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall 
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/E2E/Dockerfile

        
      # build image for accounts service
      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -f ./packages/E2E/Dockerfile .

  docker-build-probe:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/Probe/Dockerfile

      # build image probe api
      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -t oneuptime-probe:ci -f ./packages/Probe/Dockerfile .

      - name: SBOM for the vulnerability gate
        if: env.VULNERABILITY_GATE == 'true'
        uses: ./.github/actions/image-sbom
        with:
          image: oneuptime-probe:ci
          name: probe

  docker-build-runner:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/Runner/Dockerfile

      # build runner image (the merged Runbook Agent + AI Agent)
      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -t oneuptime-runner:ci -f ./packages/Runner/Dockerfile .

      - name: SBOM for the vulnerability gate
        if: env.VULNERABILITY_GATE == 'true'
        uses: ./.github/actions/image-sbom
        with:
          image: oneuptime-runner:ci
          name: runner

      # The image is pruned to the packages the Runner reaches
      # (Scripts/Docker/PruneUnreachablePackages.js), so a package the walk
      # missed would be gone from it and fail only when the code that loads
      # it runs. Start the image as it ships, against a stand-in for the
      # OneUptime server, and have it register and run a JavaScript step (its
      # isolated-vm sandbox) and a Bash step (Tests/Ops/RunnerImageRuntime.test.js).
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: 'Tests/Ops/package-lock.json'

      - name: Install Ops test dependencies
        uses: ./.github/actions/npm-install
        with:
          working-directory: Tests/Ops

      - name: start the image and have it run steps
        run: cd Tests/Ops && RUN_RUNNER_IMAGE_RUNTIME_TESTS=1 RUNNER_IMAGE=oneuptime-runner:ci npx jest --config ./jest.config.json RunnerImageRuntime

  # The Kubernetes AI agent image (agents/KubernetesAIAgent), which the
  # kubernetes-agent chart installs by default. Built on every pull request
  # so a broken kubectl download or digest, or an agent that does not compile
  # inside the image, fails here rather than in the release. This builds the
  # runner's architecture (amd64) only; test-release.yaml builds both on every
  # push to main.
  docker-build-kubernetes-ai-agent:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./agents/KubernetesAIAgent/Dockerfile

      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -t oneuptime-kubernetes-ai-agent:ci -f ./agents/KubernetesAIAgent/Dockerfile .

      - name: SBOM for the vulnerability gate
        if: env.VULNERABILITY_GATE == 'true'
        uses: ./.github/actions/image-sbom
        with:
          image: oneuptime-kubernetes-ai-agent:ci
          name: kubernetes-ai-agent

  # The resource AI agent image (agents/ResourceAIAgent), which the Docker,
  # Podman, Swarm, Proxmox, VMware, Ceph, database and host agents run as
  # their "ai-agent" service. Built on every pull request so an Alpine
  # package that is renamed or dropped (ceph19-common, util-linux-misc), a
  # docker or govc release whose pinned digest no longer matches, or an
  # agent that does not compile inside the image, fails here rather than in
  # the release. This builds the runner's
  # architecture (amd64) only; test-release.yaml builds both on every push to
  # main.
  docker-build-resource-ai-agent:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # Seeds the base image into the local store first, from Docker Hub if
      # public.ecr.aws will not serve it (its shared anonymous quota runs out
      # in a busy CI window); see docker-build-kubernetes-ai-agent above.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./agents/ResourceAIAgent/Dockerfile

      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -t oneuptime-resource-ai-agent:ci -f ./agents/ResourceAIAgent/Dockerfile .

      - name: SBOM for the vulnerability gate
        if: env.VULNERABILITY_GATE == 'true'
        uses: ./.github/actions/image-sbom
        with:
          image: oneuptime-resource-ai-agent:ci
          name: resource-ai-agent

  # The Kubernetes cost agent image (agents/KubernetesCostAgent), which the
  # kubernetes-agent chart runs when cost collection is on. release.yml is the
  # only other workflow that builds it, so this is what stops a template that
  # does not build, or an agent that does not compile inside the image (with
  # production dependencies only, and without its tests), from first failing
  # in a release. This builds the runner's architecture (amd64) only. Unlike
  # the two AI agents above it is not built for both in test-release.yaml: it
  # adds only ca-certificates and tini to Node's base image and has no native
  # modules, so nothing in it differs by architecture.
  docker-build-kubernetes-cost-agent:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # Seeds the base image into the local store first, from Docker Hub if
      # public.ecr.aws will not serve it (its shared anonymous quota runs out
      # in a busy CI window); see docker-build-kubernetes-ai-agent above.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./agents/KubernetesCostAgent/Dockerfile

      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -t oneuptime-kubernetes-cost-agent:ci -f ./agents/KubernetesCostAgent/Dockerfile .

      - name: SBOM for the vulnerability gate
        if: env.VULNERABILITY_GATE == 'true'
        uses: ./.github/actions/image-sbom
        with:
          image: oneuptime-kubernetes-cost-agent:ci
          name: kubernetes-cost-agent

  # The Kubernetes log tailer image (agents/KubernetesLogTailer), which the
  # kubernetes-agent chart runs when logs.mode is "api", as the GKE Autopilot,
  # EKS Fargate and OpenShift restricted presets choose. Built here, and for
  # amd64 only, for the reasons the cost agent above is.
  docker-build-kubernetes-log-tailer:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # Seeds the base image into the local store first, from Docker Hub if
      # public.ecr.aws will not serve it (its shared anonymous quota runs out
      # in a busy CI window); see docker-build-kubernetes-ai-agent above.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./agents/KubernetesLogTailer/Dockerfile

      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -t oneuptime-kubernetes-log-tailer:ci -f ./agents/KubernetesLogTailer/Dockerfile .

      - name: SBOM for the vulnerability gate
        if: env.VULNERABILITY_GATE == 'true'
        uses: ./.github/actions/image-sbom
        with:
          image: oneuptime-kubernetes-log-tailer:ci
          name: kubernetes-log-tailer

  docker-build-test-server:
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # public.ecr.aws mirrors Docker's official images, and serves anonymous
      # pullers from one shared data quota that a busy CI window exhausts. When
      # it does, `docker build` dies on "429 Too Many Requests ... Data limit
      # exceeded" before it has read an instruction, and the three attempts above
      # all burn inside the same exhausted window — that is runs 36338348855 and
      # 36315910324, both red on an image nobody touched. So seed the base images
      # into the local store first, from Docker Hub if ECR will not serve them;
      # BuildKit then resolves FROM locally and never asks ECR about it.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/TestServer/Dockerfile

      # build image for mail service
      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -f ./packages/TestServer/Dockerfile .

  # The ingress image (packages/Nginx), built whole for the Vulnerability gate
  # alone (see the top): Nginx Test builds only its base stage
  # (test.nginx.yaml), and only the release builds the rest.
  docker-build-nginx:
    if: github.base_ref == 'release' || contains(github.event.pull_request.labels.*.name, 'vulnerability-gate')
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Its base is nginx's own image, on Docker Hub: pull it through
      # mirror.gcr.io (.github/actions/docker-hub-mirror).
      - uses: ./.github/actions/docker-hub-mirror

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # Seeds the Node.js donor stage's public.ecr.aws image into the local
      # store first, from Docker Hub if ECR will not serve it; see
      # docker-build-kubernetes-ai-agent above.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/Nginx/Dockerfile

      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: docker build --no-cache -t oneuptime-nginx:ci -f ./packages/Nginx/Dockerfile .

      - name: SBOM for the vulnerability gate
        uses: ./.github/actions/image-sbom
        with:
          image: oneuptime-nginx:ci
          name: nginx

  # The Docker agent image (agents/DockerAgent): the OpenTelemetry Collector's
  # image and a config file. Built for the Vulnerability gate alone, as the
  # ingress above is.
  docker-build-docker-agent:
    if: github.base_ref == 'release' || contains(github.event.pull_request.labels.*.name, 'vulnerability-gate')
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The collector's image is on Docker Hub: pull it through mirror.gcr.io
      # (.github/actions/docker-hub-mirror).
      - uses: ./.github/actions/docker-hub-mirror

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # Every image job warms its Dockerfile's public.ecr.aws images; this one
      # names none, so it is quick.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./agents/DockerAgent/Dockerfile

      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: docker build --no-cache -t oneuptime-docker-agent:ci -f ./agents/DockerAgent/Dockerfile .

      - name: SBOM for the vulnerability gate
        uses: ./.github/actions/image-sbom
        with:
          image: oneuptime-docker-agent:ci
          name: docker-agent

  # The Podman agent image (agents/PodmanAgent), the Docker agent's twin.
  docker-build-podman-agent:
    if: github.base_ref == 'release' || contains(github.event.pull_request.labels.*.name, 'vulnerability-gate')
    runs-on: ubuntu-latest
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The collector's image is on Docker Hub: pull it through mirror.gcr.io
      # (.github/actions/docker-hub-mirror).
      - uses: ./.github/actions/docker-hub-mirror

      # The pinned, cached gomplate, so prerun's configure.sh does not download
      # it from GitHub's release CDN (see .github/actions/setup-gomplate).
      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Preinstall
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run prerun

      # Every image job warms its Dockerfile's public.ecr.aws images; this one
      # names none, so it is quick.
      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./agents/PodmanAgent/Dockerfile

      - name: build docker image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: docker build --no-cache -t oneuptime-podman-agent:ci -f ./agents/PodmanAgent/Dockerfile .

      - name: SBOM for the vulnerability gate
        uses: ./.github/actions/image-sbom
        with:
          image: oneuptime-podman-agent:ci
          name: podman-agent

  # The Vulnerability gate (see the top). It fails while an image this release
  # would ship has a critical, high or known exploited vulnerability that a
  # newer version fixes and that Scripts/Security/image-vulnerability-exceptions.json
  # does not accept. Its summary names each thing to upgrade, the lines that
  # pin it and how to clear it; RELEASING.md (step 5) says what a release does
  # about it. It needs every job that writes an SBOM, and fails when one of
  # the images the release ships has none (--require-product-images).
  vulnerability-gate:
    name: Vulnerability gate
    if: github.base_ref == 'release' || contains(github.event.pull_request.labels.*.name, 'vulnerability-gate')
    needs:
      - docker-build-app
      - docker-build-probe
      - docker-build-runner
      - docker-build-kubernetes-ai-agent
      - docker-build-resource-ai-agent
      - docker-build-kubernetes-cost-agent
      - docker-build-kubernetes-log-tailer
      - docker-build-nginx
      - docker-build-docker-agent
      - docker-build-podman-agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Download the images' SBOMs
        uses: actions/download-artifact@v4
        with:
          pattern: vulnerability-gate-sbom-*
          path: sbom
          merge-multiple: true

      # The Grype the release's scan-sbom-vulnerabilities job uses.
      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      # Its summary counts every vulnerability, fixed or not: the gate's own,
      # next, is the one that says what fails it, so this one is not shown.
      - name: Scan each SBOM with Grype
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          GITHUB_STEP_SUMMARY=/dev/null PATH="$(dirname "$GRYPE"):$PATH" \
            bash ./Scripts/GHA/scan_sbom_vulnerabilities.sh \
            --input-dir sbom \
            --output-dir vulnerabilities

      - name: Fail on what a newer version fixes
        run: node Scripts/Security/ImageVulnerabilities.js gate --reports vulnerabilities --require-product-images

      # The reports, for whoever clears the gate: every finding, with its
      # package's paths in the image.
      - name: Keep Grype's reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-gate-reports
          path: vulnerabilities/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
