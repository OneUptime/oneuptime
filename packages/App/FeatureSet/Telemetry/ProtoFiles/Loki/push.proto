// Loki's push API (logproto.PushRequest).
//
// Wire-compatible with pkg/push/push.proto in github.com/grafana/loki,
// without its gogoproto options. google.protobuf.Timestamp is declared
// here with the same two fields, so the file needs no imports:
// https://grafana.com/docs/loki/latest/reference/loki-http-api/#ingest-logs
syntax = "proto3";

package logproto;

message PushRequest {
  repeated StreamAdapter streams = 1;
}

message StreamAdapter {
  // The stream's labels as a label set: {app="checkout", env="prod"}.
  string labels = 1;
  repeated EntryAdapter entries = 2;
  uint64 hash = 3;
}

message EntryAdapter {
  Timestamp timestamp = 1;
  string line = 2;
  repeated LabelPairAdapter structuredMetadata = 3;
  repeated LabelPairAdapter parsed = 4;
}

message LabelPairAdapter {
  string name = 1;
  string value = 2;
}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}
