// The Datadog Agent's metric intake payloads, as protocol buffers.
// Wire-compatible with proto/metrics/agent_payload.proto in
// https://github.com/DataDog/agent-payload (package datadog.agentpayload),
// with its gogoproto import and options left out: they only shape the Go
// code generated from it, never the bytes on the wire.
//
// The Agent posts a MetricPayload to /api/v2/series and a SketchPayload
// (its distribution metrics, as DDSketches) to /api/beta/sketches.
// Used by Utils/Compatible/DatadogIntake.ts.

syntax = "proto3";

package datadog.agentpayload;

message CommonMetadata {
  string agent_version = 1;
  string timezone = 2;
  double current_epoch = 3;
  string internal_ip = 4;
  string public_ip = 5;
  string api_key = 6;
}

// Which Datadog product sent a series or a sketch.
message Origin {
  reserved 1, 2, 3;
  uint32 origin_product = 4;
  uint32 origin_category = 5;
  uint32 origin_service = 6;
}

message Metadata {
  Origin origin = 1;
}

message MetricPayload {
  enum MetricType {
    UNSPECIFIED = 0;
    COUNT = 1;
    RATE = 2;
    GAUGE = 3;
  }

  message MetricPoint {
    double value = 1;
    // Seconds since the UNIX epoch.
    int64 timestamp = 2;
  }

  message Resource {
    string type = 1;
    string name = 2;
  }

  message MetricSeries {
    // The Agent always sends { type: "host", name: <hostname> }, and
    // { type: "device", name: <device> } for a series with a device.
    repeated Resource resources = 1;
    string metric = 2;
    repeated string tags = 3;
    repeated MetricPoint points = 4;
    MetricType type = 5;
    string unit = 6;
    string source_type_name = 7;
    // Seconds between two points of a count or a rate.
    int64 interval = 8;
    Metadata metadata = 9;
  }

  repeated MetricSeries series = 1;
}

message SketchPayload {
  message Sketch {
    // The Agent 5 / early Agent 6 GK sketch, superseded by Dogsketch.
    message Distribution {
      int64 ts = 1;
      int64 cnt = 2;
      double min = 3;
      double max = 4;
      double avg = 5;
      double sum = 6;
      repeated double v = 7;
      repeated uint32 g = 8;
      repeated uint32 delta = 9;
      repeated double buf = 10;
    }

    // A DDSketch: bin keys k and their counts n, plus its exact summary.
    message Dogsketch {
      int64 ts = 1;
      int64 cnt = 2;
      double min = 3;
      double max = 4;
      double avg = 5;
      double sum = 6;
      repeated sint32 k = 7;
      repeated uint32 n = 8;
    }

    string metric = 1;
    string host = 2;
    repeated Distribution distributions = 3;
    repeated string tags = 4;
    reserved 5, 6;
    reserved "distributionsK", "distributionsC";
    repeated Dogsketch dogsketches = 7;
    Metadata metadata = 8;
  }

  repeated Sketch sketches = 1;
  CommonMetadata metadata = 2;
}
