# OVERLAY for the SaaS / billing-enabled CI stack. Always pass it after
# docker-compose.yml, whose folder (the repo root) every path below resolves
# against:
#
#   docker compose -f docker-compose.yml -f packages/E2E/docker-compose.billing.yml up -d
#
# It adds the home container and leaves the global Runner out.

services:
  home:
    image: oneuptime/home:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: home
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # Only started when this profile is active, which nothing ever does.
  global-runner:
    profiles:
      - billing-disabled

  # And turned off where it is set up, as config.env's GLOBAL_RUNNER_REPLICAS=0
  # does: the app removes its row, so no project waits for a global Runner
  # this stack never starts.
  app:
    environment:
      GLOBAL_RUNNER_REPLICAS: "0"
