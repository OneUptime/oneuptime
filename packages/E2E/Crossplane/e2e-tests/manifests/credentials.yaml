# Both ways to give the provider the project's API key.
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
# A namespace's own key, which its ProviderConfig reads.
apiVersion: v1
kind: Secret
metadata:
  name: oneuptime
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  api-key: ${ONEUPTIME_API_KEY}
---
apiVersion: crossplane.oneuptime.com/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: ${NAMESPACE}
spec:
  url: ${CLUSTER_ONEUPTIME_URL}
  credentials:
    secretRef:
      name: oneuptime
      key: api-key
---
# JSON credentials that name the URL too, in another namespace, which a
# ClusterProviderConfig reads. The ClusterProviderConfig has no url, so the
# provider takes the JSON's: a default url would send it to OneUptime Cloud.
apiVersion: v1
kind: Secret
metadata:
  name: oneuptime-cluster
  namespace: crossplane-system
type: Opaque
stringData:
  credentials: '{"api_key": "${ONEUPTIME_API_KEY}", "oneuptime_url": "${CLUSTER_ONEUPTIME_URL}"}'
---
apiVersion: crossplane.oneuptime.com/v1beta1
kind: ClusterProviderConfig
metadata:
  name: oneuptime
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: oneuptime-cluster
      key: credentials
