global:
  resolve_timeout: 5m
route:
  receiver: oneuptime
  group_by: ["alertname", "instance"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h
receivers:
  - name: oneuptime
    webhook_configs:
      - url: "http://192.168.100.10:8099/heartbeat/rig-heartbeat-key"
        send_resolved: true
templates:
  - '/etc/prometheus/*.tmpl'
