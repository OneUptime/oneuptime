  # ---- aiAccess.extraEnv ---------------------------------------------------

  - it: passes aiAccess.extraEnv into the Runner container after its own environment
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.extraEnv:
        - name: HTTPS_PROXY
          value: http://egress.internal:3128
        - name: NO_PROXY
          value: kubernetes.default.svc,10.0.0.0/8
        # A Runner tuning knob the chart does not set: allowed.
        - name: ONEUPTIME_RUNNER_CONCURRENCY
          value: "2"
        # Contains a reserved name but is not one: allowed.
        - name: MY_ONEUPTIME_KUBECTL_ALLOW_WRITES
          value: "true"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            value: http://egress.internal:3128
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
            value: kubernetes.default.svc,10.0.0.0/8
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_RUNNER_CONCURRENCY
            value: "2"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_ONEUPTIME_KUBECTL_ALLOW_WRITES
            value: "true"
      # The chart's own write switch is still there, once, and still false.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_WRITES
            value: "false"
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBERNETES_CLUSTER_NAME
            value: prod-us

  # The kubelet keeps the LAST definition of a duplicate env name, and
  # extraEnv renders after the chart's own entries, so each of these would
  # silently replace the chart's value. The render must fail instead, and say
  # which value to change.
  - it: refuses an extraEnv that would override the Runner's write switch
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.extraEnv:
        - name: ONEUPTIME_KUBECTL_ALLOW_WRITES
          value: "true"
    asserts:
      - failedTemplate:
          errorPattern: "aiAccess.extraEnv must not set ONEUPTIME_KUBECTL_ALLOW_WRITES: the chart sets it from aiAccess.remediation.enabled"

  - it: refuses an extraEnv that would override the Runner's write namespaces
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.remediation.enabled: true
      aiAccess.remediation.namespaces:
        - web
      aiAccess.extraEnv:
        - name: ONEUPTIME_KUBECTL_WRITE_NAMESPACES
          value: ""
    asserts:
      - failedTemplate:
          errorPattern: "aiAccess.extraEnv must not set ONEUPTIME_KUBECTL_WRITE_NAMESPACES: the chart sets it from aiAccess.remediation.namespaces"

  - it: refuses an extraEnv that would turn the Runner's node operations back on
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.remediation.enabled: true
      aiAccess.remediation.nodeOperations: false
      aiAccess.extraEnv:
        - name: ONEUPTIME_KUBECTL_ALLOW_NODE_OPERATIONS
          value: "true"
    asserts:
      # With no node role rendered, "true" would have the Runner run node
      # operations that can only fail Forbidden.
      - failedTemplate:
          errorPattern: "aiAccess.extraEnv must not set ONEUPTIME_KUBECTL_ALLOW_NODE_OPERATIONS: the chart sets it from aiAccess.remediation.nodeOperations"

  - it: refuses an extraEnv that would override the Runner's own namespace
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.extraEnv:
        - name: ONEUPTIME_RUNNER_POD_NAMESPACE
          value: somewhere-else
    asserts:
      - failedTemplate:
          errorPattern: "aiAccess.extraEnv must not set ONEUPTIME_RUNNER_POD_NAMESPACE: the chart sets it to the Runner pod's own namespace"

  - it: refuses an extraEnv that would override the cluster name
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.extraEnv:
        - name: ONEUPTIME_KUBERNETES_CLUSTER_NAME
          value: other-cluster
    asserts:
      - failedTemplate:
          errorPattern: "aiAccess.extraEnv must not set ONEUPTIME_KUBERNETES_CLUSTER_NAME: the chart sets it from clusterName"

  - it: refuses an extraEnv that would override the ingestion key
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.extraEnv:
        - name: ONEUPTIME_INGESTION_KEY
          value: another-key
    asserts:
      - failedTemplate:
          errorPattern: "aiAccess.extraEnv must not set ONEUPTIME_INGESTION_KEY: the chart sets it from oneuptime.apiKey"

  - it: refuses an extraEnv that would override the OneUptime URL
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.extraEnv:
        - name: ONEUPTIME_URL
          value: https://elsewhere.example.com
    asserts:
      - failedTemplate:
          errorPattern: "aiAccess.extraEnv must not set ONEUPTIME_URL: the chart sets it from oneuptime.url"

  - it: refuses an extraEnv that would give the Runner a dashboard-issued identity
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.extraEnv:
        - name: ONEUPTIME_RUNNER_ID
          value: 5f1c0000-0000-0000-0000-000000000000
    asserts:
      - failedTemplate:
          errorPattern: "aiAccess.extraEnv must not set ONEUPTIME_RUNNER_ID: this Runner registers itself with oneuptime.apiKey"

  - it: refuses an extraEnv that would move kubectl's writable HOME or the health port
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.extraEnv:
        - name: PORT
          value: "8080"
    asserts:
      - failedTemplate:
          errorPattern: "aiAccess.extraEnv must not set PORT: the chart sets it to the port the health probes use"

  - it: refuses an extraEnv entry with no name
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.extraEnv:
        - nme: HTTPS_PROXY
          value: http://egress.internal:3128
    asserts:
      - failedTemplate: {}

  - it: refuses a non-string extraEnv value instead of rendering one the API server rejects
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.extraEnv:
        - name: FEATURE_FLAG
          value: true
    asserts:
      - failedTemplate:
          errorPattern: "aiAccess.extraEnv.0.value"

  # ---- values.schema.json --------------------------------------------------

  - it: refuses a string where the remediation switch expects a boolean
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.remediation.enabled: "true"
    asserts:
      # Rendered as-is, "true" and "false" would both be truthy strings.
      - failedTemplate:
          errorPattern: "aiAccess.remediation.enabled"

  - it: refuses aiAccess values the chart does not support
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.nodeSelector:
        a: b
    asserts:
      - failedTemplate:
          errorPattern: "nodeSelector"

  - it: honours an operator who removes the resource requests and limits
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      # Helm coalesces tables key by key, so the way to clear a default map
      # is to null its keys; that must reach the pod as "no resources", not
      # be replaced by the chart's defaults again.
      aiAccess.resources.requests: null
      aiAccess.resources.limits: null
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isNullOrEmpty:
          path: spec.template.spec.containers[0].resources
