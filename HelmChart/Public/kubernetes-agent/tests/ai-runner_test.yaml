          path: spec.template.spec.containers[0].image
          value: oneuptime/runner:9.1.0
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: honours an explicit aiAccess.image.pullPolicy on a pinned tag
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.image.tag: 9.1.0
      aiAccess.image.pullPolicy: Always
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: honours an explicit aiAccess.image.pullPolicy on the moving tag
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.image.pullPolicy: IfNotPresent
    documentSelector:
