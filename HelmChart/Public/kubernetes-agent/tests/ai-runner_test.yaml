      oneuptime.apiKey: key-123
      aiAccess.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # The chart is published before that version's images are, and a
      # source render carries appVersion 1.0.0; like the chart's other
      # OneUptime images, the Runner tracks `release` unless pinned.
      - equal:
          path: spec.template.spec.containers[0].image
          value: oneuptime/runner:release

