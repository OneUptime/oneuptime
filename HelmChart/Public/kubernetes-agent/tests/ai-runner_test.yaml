# OneUptime AI access: the in-cluster Runner that lets OneUptime AI run
# kubectl on this cluster. Off by default, so an install that never heard of
# it renders exactly what it rendered before. On, it must:
#
#   * register with the SAME ingestion key the collector ships telemetry with
#     and the SAME cluster name — that pairing is what binds the Runner to the
#     cluster in OneUptime with no dashboard steps;
#   * hold READ-ONLY RBAC unless aiAccess.remediation.enabled, and even then
#     never exec, attach, port-forward, read secrets, touch CRDs, or delete
#     anything but pods and jobs — never namespaces, nodes or volumes;
#   * tell the Runner what RBAC it got (ONEUPTIME_KUBECTL_ALLOW_WRITES) so the
#     policy inside the Runner never disagrees with the cluster's RBAC;
#   * render on a release whose stored values predate the block: `helm
#     upgrade --reuse-values` feeds the templates the previous release's
#     values, so on a pre-0.7.0 install `.Values.aiAccess` is nil or holds
#     only what --set passed. The documented one-flag upgrade must not abort
#     with "nil pointer evaluating interface {}".
#
# RBAC is asserted by rendering, not by reading the template: a verb that
# creeps into the read-only role is exactly the kind of mistake that surfaces
# as an AI change nobody approved, never as a failed deploy. Each mode pins
# the WHOLE `rules` array with `equal`: a create moved out of the remediation
# block, a delete gaining nodes, a wildcard, or secrets appearing anywhere
# changes the array and fails. (Raw regex asserts are not used on the
# manifests: helm-unittest hands them nil for a multi-document template, so a
# `notMatchRegexRaw` there passes whatever the role says. They are only used
# on NOTES.txt, where they do see the rendered text. Wildcard-path regex
# asserts such as `notMatchRegex` on `rules[*].verbs[*]` are not used either:
# helm-unittest 0.5.x tests only the FIRST value the path matches, so a
# forbidden verb in the last rule passes.)
suite: ai access runner
release:
  name: oneuptime-agent
  namespace: oneuptime
templates:
  - templates/ai-runner.yaml
tests:
  - it: renders nothing by default
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      - hasDocuments:
          count: 0

  - it: deploys the Runner with its own ServiceAccount, ClusterRole and binding when enabled
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 0
        isKind:
          of: ServiceAccount
      - documentIndex: 0
        equal:
          path: metadata.name
          value: oneuptime-agent-kubernetes-agent-ai-runner
      - documentIndex: 1
        isKind:
          of: ClusterRole
      - documentIndex: 2
        isKind:
          of: ClusterRoleBinding
      - documentIndex: 2
        equal:
          path: subjects[0].name
          value: oneuptime-agent-kubernetes-agent-ai-runner
      - documentIndex: 2
        equal:
          path: roleRef.name
          value: oneuptime-agent-kubernetes-agent-ai-runner
      - documentIndex: 3
        isKind:
          of: Deployment
      - documentIndex: 3
        equal:
          path: spec.template.spec.serviceAccountName
          value: oneuptime-agent-kubernetes-agent-ai-runner
      - documentIndex: 3
        equal:
          path: spec.replicas
          value: 1

  - it: registers with the collector's ingestion key and the cluster name
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
    asserts:
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_URL
            value: https://oneuptime.example.com
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_INGESTION_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-agent-kubernetes-agent
                key: api-key
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBERNETES_CLUSTER_NAME
            value: prod-us
      # Never a dashboard-issued identity: that is the whole point.
      - documentIndex: 3
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_RUNNER_ID
          any: true
      # This Runner runs kubectl for OneUptime AI and nothing else.
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_RUNNER_ENABLE_RUNBOOKS
            value: "false"
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_RUNNER_ENABLE_CODE_FIXES
            value: "false"

  # The read-only role, rule by rule. The anchors are reused below so the
  # remediation role is asserted to be exactly these rules plus the write
  # rules, and the legacy-values renders to be exactly these again.
  - it: is read-only by default and tells the Runner so
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
    asserts:
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_WRITES
            value: "false"
      # Every rule is get/list/watch, except the create-only access reviews
      # `kubectl auth can-i` needs. No other create, and no patch, update,
      # delete or deletecollection anywhere: the array is exact.
      - documentIndex: 1
        equal:
          path: rules
          value:
            - &readCore
              apiGroups: [""]
              resources:
                - pods
                - pods/log
                - pods/status
                - nodes
                - nodes/status
                - services
                - endpoints
                - namespaces
                - events
                - replicationcontrollers
                - resourcequotas
                - limitranges
                - configmaps
                - persistentvolumeclaims
                - persistentvolumes
                - serviceaccounts
              verbs: ["get", "list", "watch"]
            - &readApps
              apiGroups: ["apps"]
              resources:
                - deployments
                - deployments/status
                - replicasets
                - replicasets/status
                - statefulsets
                - statefulsets/status
                - daemonsets
                - daemonsets/status
                # rollout history / undo on a DaemonSet or StatefulSet list
                # its ControllerRevisions; without this they fail Forbidden.
                - controllerrevisions
              verbs: ["get", "list", "watch"]
            - &readBatch
              apiGroups: ["batch"]
              resources:
                - jobs
                - jobs/status
                - cronjobs
              verbs: ["get", "list", "watch"]
            - &readAutoscaling
              apiGroups: ["autoscaling"]
              resources:
                - horizontalpodautoscalers
              verbs: ["get", "list", "watch"]
            - &readNetworking
              apiGroups: ["networking.k8s.io"]
              resources:
                - ingresses
                - networkpolicies
              verbs: ["get", "list", "watch"]
            - &readPolicy
              apiGroups: ["policy"]
              resources:
                - poddisruptionbudgets
              verbs: ["get", "list", "watch"]
            - &readStorage
              apiGroups: ["storage.k8s.io"]
              resources:
                - storageclasses
              verbs: ["get", "list", "watch"]
            - &readEvents
              apiGroups: ["events.k8s.io"]
              resources:
                - events
              verbs: ["get", "list", "watch"]
            - &readMetrics
              apiGroups: ["metrics.k8s.io"]
              resources:
                - pods
                - nodes
              verbs: ["get", "list"]
            - &accessReviews
              apiGroups: ["authorization.k8s.io"]
              resources:
                - selfsubjectaccessreviews
                - selfsubjectrulesreviews
              verbs: ["create"]

  - it: grants the fix verbs, and only those, with remediation enabled
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.remediation.enabled: true
    asserts:
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_WRITES
            value: "true"
      # Exactly the read-only rules plus these write rules. Whatever the
      # policy says, this role can never: exec, attach or port-forward into a
      # pod; read or write secrets; touch CRDs; use a wildcard; deletecollection
      # anything; or delete anything but a pod or a job — never a namespace,
      # node or volume.
      - documentIndex: 1
        equal:
          path: rules
          value:
            - *readCore
            - *readApps
            - *readBatch
            - *readAutoscaling
            - *readNetworking
            - *readPolicy
            - *readStorage
            - *readEvents
            - *readMetrics
            - *accessReviews
            # rollout restart/undo/pause/resume, set image, patch: PATCH/UPDATE
            # on the workload. No deployments/rollback: the subresource does
            # not exist in apps/v1 and kubectl never calls it.
            - apiGroups: ["apps"]
              resources:
                - deployments
                - statefulsets
                - daemonsets
                - replicasets
              verbs: ["patch", "update"]
            # kubectl scale --current-replicas GETs the scale subresource
            # before it UPDATEs it; `get` on the workload does not cover it.
            - apiGroups: ["apps"]
              resources:
                - deployments/scale
                - statefulsets/scale
                - replicasets/scale
              verbs: ["get", "patch", "update"]
            - apiGroups: ["batch"]
              resources:
                - jobs
                - cronjobs
              verbs: ["patch", "update"]
            # kubectl create job --from=cronjob/...
            - apiGroups: ["batch"]
              resources:
                - jobs
              verbs: ["create"]
            # delete a NAMED pod or job so its controller recreates it.
            - apiGroups: [""]
              resources:
                - pods
              verbs: ["delete"]
            - apiGroups: ["batch"]
              resources:
                - jobs
              verbs: ["delete"]
            # cordon/uncordon/taint/label/annotate.
            - apiGroups: [""]
              resources:
                - nodes
                - pods
              verbs: ["patch", "update"]
            # kubectl drain evicts pods.
            - apiGroups: [""]
              resources:
                - pods/eviction
              verbs: ["create"]
            - apiGroups: ["autoscaling"]
              resources:
                - horizontalpodautoscalers
              verbs: ["patch", "update", "create"]

  - it: never grants a delete verb to namespaces, nodes or volumes, in either mode
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.remediation.enabled: true
    asserts:
      # The exact arrays above are the real guard. These spell the claim out
      # for the reader in the shape a careless edit would take: the only
      # core-group rules that touch nodes or pods with a write verb are the
      # patch/update one and the pods-only delete one, and neither exists
      # with namespaces or volumes in it.
      - documentIndex: 1
        contains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - pods
            verbs: ["delete"]
          count: 1
      - documentIndex: 1
        notContains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - nodes
            verbs: ["delete"]
      - documentIndex: 1
        notContains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - nodes
              - pods
            verbs: ["delete"]
      - documentIndex: 1
        notContains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - pods
              - nodes
            verbs: ["delete"]
      - documentIndex: 1
        notContains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - namespaces
            verbs: ["delete"]
      - documentIndex: 1
        notContains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - persistentvolumes
            verbs: ["delete"]
      - documentIndex: 1
        notContains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - persistentvolumeclaims
            verbs: ["delete"]

  # kubectl rollout history / undo on a DaemonSet or StatefulSet list the
  # workload's ControllerRevisions before doing anything. The policy tiers
  # history as Read and undo as SafeWrite, so both must work in read-only
  # mode (history) and unattended in automatic mode (undo).
  - it: lets rollout history and undo read DaemonSet and StatefulSet history without write RBAC
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
    asserts:
      - documentIndex: 1
        contains:
          path: rules
          content: *readApps

  - it: lets kubectl scale read the scale subresource it updates
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.remediation.enabled: true
    asserts:
      # `kubectl scale --current-replicas=N` (the guard the model is
      # encouraged to use) is a GET then an UPDATE on the subresource.
      - documentIndex: 1
        contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources:
              - deployments/scale
              - statefulsets/scale
              - replicasets/scale
            verbs: ["get", "patch", "update"]
          count: 1

  # ---- Upgrading a release installed before aiAccess existed --------------

  - it: renders the documented one-flag upgrade on a pre-0.7.0 release (--reuse-values keeps no aiAccess defaults)
    values:
      - values/legacy-pre-0.7.0-ai-enabled.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      - hasDocuments:
          count: 4
      # The same pod a fresh install gets: the template's fallbacks must
      # match values.yaml.
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].image
          value: oneuptime/runner:release
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_WRITES
            value: "false"
      # And the same read-only role.
      - documentIndex: 1
        equal:
          path: rules
          value:
            - *readCore
            - *readApps
            - *readBatch
            - *readAutoscaling
            - *readNetworking
            - *readPolicy
            - *readStorage
            - *readEvents
            - *readMetrics
            - *accessReviews

  - it: renders the two-flag upgrade on a pre-0.7.0 release with write RBAC and no image or resources values
    values:
      - values/legacy-pre-0.7.0-ai-remediation.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].image
          value: oneuptime/runner:release
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_WRITES
            value: "true"
      - documentIndex: 1
        contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources:
              - deployments/scale
              - statefulsets/scale
              - replicasets/scale
            verbs: ["get", "patch", "update"]
      - documentIndex: 1
        contains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - pods
            verbs: ["delete"]

  - it: falls back to the default repository and pull policy when a pre-0.7.0 release pins only the image tag
    values:
      - values/legacy-pre-0.7.0-ai-enabled-pinned-tag.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      - hasDocuments:
          count: 4
      # `.Values.aiAccess.image` is {tag: 9.1.0} and nothing else.
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].image
          value: oneuptime/runner:9.1.0
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: honours a partial aiAccess.resources on a pre-0.7.0 release as given (--reuse-values never fills in defaults)
    values:
      - values/legacy-pre-0.7.0-ai-enabled-partial-resources.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      - hasDocuments:
          count: 4
      # An explicit resources map is the operator's, whole: no limits and no
      # memory request appear from the chart's defaults. That is what
      # --reuse-values means, and why the docs point at
      # --reset-then-reuse-values for anyone who wants the defaults too.
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m

  - it: renders nothing, and does not abort, on a pre-0.7.0 release upgraded with plain --reuse-values
    values:
      - values/legacy-pre-0.7.0-no-ai.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      - hasDocuments:
          count: 0

  # ---- The documented aiAccess.* values -----------------------------------

  - it: runs as a locked-down non-root pod with a writable scratch volume for kubectl
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
    asserts:
      - documentIndex: 3
        equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: scratch
            mountPath: /tmp
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBECACHEDIR
            value: /tmp/kube-cache
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].image
          value: oneuptime/runner:release

  - it: pins the image tag when one is given
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.image.tag: 9.1.0
    asserts:
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].image
          value: oneuptime/runner:9.1.0

  - it: honours aiAccess.image.pullPolicy
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.image.pullPolicy: Always
    asserts:
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: passes aiAccess.extraEnv into the Runner container
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.extraEnv:
        - name: HTTPS_PROXY
          value: http://egress.internal:3128
        - name: NO_PROXY
          value: kubernetes.default.svc,10.0.0.0/8
    asserts:
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            value: http://egress.internal:3128
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
            value: kubernetes.default.svc,10.0.0.0/8
      # extraEnv adds to the Runner's own environment, it never replaces it.
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBERNETES_CLUSTER_NAME
            value: prod-us

  - it: honours an operator who removes the resource requests and limits
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      # Helm coalesces tables key by key, so the way to clear a default map
      # is to null its keys; that must reach the pod as "no resources", not
      # be replaced by the chart's defaults again.
      aiAccess.resources.requests: null
      aiAccess.resources.limits: null
    asserts:
      - documentIndex: 3
        isNullOrEmpty:
          path: spec.template.spec.containers[0].resources
