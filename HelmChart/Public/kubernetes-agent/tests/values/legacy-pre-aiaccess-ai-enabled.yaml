# What `helm upgrade --reuse-values --set aiAccess.enabled=true` feeds the
# templates on a release installed from a chart without aiAccess (every
# published kubernetes-agent chart before the OneUptime release that added it;
# published charts carry the OneUptime version, not Chart.yaml's): the
# previous release's coalesced values, which never heard of aiAccess, plus the
# one flag.
#
# helm-unittest always coalesces a values file over this chart's values.yaml,
# so this chart's aiAccess defaults are removed here with nulls (Helm deletes
# a key whose user value is null when it coalesces). After coalescing,
# .Values.aiAccess is exactly {enabled: true} — the same map a real upgrade
# renders with.
aiAccess:
  enabled: true
  remediation: null
  image: null
  resources: null
  extraEnv: null
