# oneuptime.existingSecretName: the ingestion key read from a Secret the
# operator created, instead of from oneuptime.apiKey. It is how the Amazon EKS
# add-on (HelmChart/Marketplace) takes the key - EKS shows an add-on's
# configuration values in plain text - and how a Helm user keeps the key out
# of the values Helm stores with every revision. So:
#   - the chart then renders no Secret of its own, and every workload that
#     sends to OneUptime reads api-key from the operator's Secret;
#   - without it nothing changes: the chart's own Secret holds apiKey;
#   - both set is refused, saying which one to clear.
suite: ingestion key from an existing Secret
release:
  name: oneuptime-agent
  namespace: oneuptime
set:
  clusterName: prod-us
  oneuptime.url: https://oneuptime.example.com
tests:
  - it: keeps apiKey in a Secret of the chart's own by default
    template: templates/secret.yaml
    set:
      oneuptime.apiKey: key-123
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: oneuptime-agent-kubernetes-agent
      - equal:
          path: data["api-key"]
          value: a2V5LTEyMw==

  - it: renders no Secret of its own when the key is in the operator's Secret
    template: templates/secret.yaml
    set:
      oneuptime.existingSecretName: oneuptime-ingestion-key
    asserts:
      - hasDocuments:
          count: 0

  - it: reads the key from the chart's own Secret by default
    template: templates/deployment.yaml
    set:
      oneuptime.apiKey: key-123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_API_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-agent-kubernetes-agent
                key: api-key

  - it: the cluster collector reads the key from the operator's Secret
    template: templates/deployment.yaml
    set:
      oneuptime.existingSecretName: oneuptime-ingestion-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_API_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-ingestion-key
                key: api-key

  - it: the node collector reads the key from the operator's Secret
    template: templates/daemonset.yaml
    set:
      oneuptime.existingSecretName: oneuptime-ingestion-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_API_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-ingestion-key
                key: api-key

  - it: the Kubernetes AI agent reads the key from the operator's Secret
    template: templates/ai-agent.yaml
    set:
      oneuptime.existingSecretName: oneuptime-ingestion-key
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_API_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-ingestion-key
                key: api-key

  - it: the log tailer reads the key from the operator's Secret
    template: templates/deployment-logs-api.yaml
    set:
      preset: eks-fargate
      oneuptime.existingSecretName: oneuptime-ingestion-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_API_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-ingestion-key
                key: api-key

  - it: the cost poller reads the key from the operator's Secret
    template: templates/deployment-cost-agent.yaml
    set:
      cost.enabled: true
      oneuptime.existingSecretName: oneuptime-ingestion-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_API_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-ingestion-key
                key: api-key

  - it: the profiler reads the key from the operator's Secret
    template: templates/daemonset-profiling.yaml
    set:
      profiling.enabled: true
      oneuptime.existingSecretName: oneuptime-ingestion-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_API_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-ingestion-key
                key: api-key

  - it: takes the Secret's name trimmed, as kubectl would have created it
    template: templates/deployment.yaml
    set:
      oneuptime.existingSecretName: "  oneuptime-ingestion-key  "
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_API_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-ingestion-key
                key: api-key

  # templates/secret.yaml always renders and always asks, so the whole release
  # fails there, whichever other templates also ask.
  - it: refuses apiKey and existingSecretName together, and says which to clear
    template: templates/secret.yaml
    set:
      oneuptime.apiKey: key-123
      oneuptime.existingSecretName: oneuptime-ingestion-key
    asserts:
      - failedTemplate:
          errorPattern: "oneuptime.apiKey and oneuptime.existingSecretName are both set. Set one of them: to read the ingestion key from the Secret oneuptime-ingestion-key, clear apiKey"

  - it: writes managed-by out, never from a Release object Amazon EKS refuses
    template: templates/secret.yaml
    set:
      oneuptime.apiKey: key-123
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
