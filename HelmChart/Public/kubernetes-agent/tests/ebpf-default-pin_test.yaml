# The chart's own OBI pin, rendered as an install without overrides gets it.
#
# The chart pins v0.14.0, the first release that identifies Node.js 26+ as
# Node.js, and renders what it needs: the span-attribute selection (a
# non-empty include list replaces OBI's defaults, so the list repeats them
# next to service.peer.name, which v0.14 made opt-in). Pinning an older OBI
# back must still work: it gets no selection and keeps its own defaults,
# which send service.peer.name anyway.
suite: the chart's default OBI pin gets a config it can run
release:
  name: oneuptime-agent
  namespace: oneuptime
templates:
  - templates/configmap-ebpf.yaml
  - templates/daemonset-ebpf.yaml
set:
  clusterName: prod-us
  oneuptime.url: https://oneuptime.example.com
  oneuptime.apiKey: key-123
tests:
  - it: pins a published OBI release
    asserts:
      - template: templates/daemonset-ebpf.yaml
        equal:
          path: spec.template.spec.containers[0].image
          value: otel/ebpf-instrument:v0.14.0

  - it: selects the span attributes on the pinned release
    asserts:
      - template: templates/configmap-ebpf.yaml
        matchRegex:
          path: data["obi-config.yaml"]
          pattern: "\\nattributes:\\n  select:\\n    traces:\\n      include:\\n(?:        - \"[^\"]+\"\\n){10}$"
      - template: templates/configmap-ebpf.yaml
        matchRegex:
          path: data["obi-config.yaml"]
          pattern: "\\n        - \"service\\.peer\\.name\"\\n"

  - it: still selects the instrumented processes and skips the excluded ones
    asserts:
      - template: templates/configmap-ebpf.yaml
        matchRegex:
          path: data["obi-config.yaml"]
          pattern: "^discovery:\\n  instrument:\\n    - exe_path: \"\\*\"\\n      k8s_namespace: \"\\*\"\\n  exclude_instrument:\\n"
      - template: templates/configmap-ebpf.yaml
        matchRegex:
          path: data["obi-config.yaml"]
          pattern: "\\n    - exe_path: \"\\*/clickhouse\"\\n"

  - it: leaves span attributes to OBI's own defaults when pinned back to v0.13.0
    set:
      ebpf.image.tag: v0.13.0
    asserts:
      - template: templates/daemonset-ebpf.yaml
        equal:
          path: spec.template.spec.containers[0].image
          value: otel/ebpf-instrument:v0.13.0
      - template: templates/configmap-ebpf.yaml
        notMatchRegex:
          path: data["obi-config.yaml"]
          pattern: "(?m)^attributes:"
