# The chart's own OBI pin, rendered as an install without overrides gets it.
#
# The chart pins v0.13.0 until v0.14.0 is published, but already renders
# what v0.14 needs. Those parts must be harmless on the pinned release:
#   - the span-attribute selection is v0.14's list (a non-empty include list
#     replaces OBI's defaults), so it is left out for an older OBI, which
#     sends service.peer.name anyway;
#   - OTEL_EBPF_BPF_POPULATE_TRACE_CONTEXT is unknown to v0.13 and ignored
#     (v0.13 always fills the map the profiler reads).
suite: the chart's default OBI pin gets a config it can run
release:
  name: oneuptime-agent
  namespace: oneuptime
templates:
  - templates/configmap-ebpf.yaml
  - templates/daemonset-ebpf.yaml
set:
  clusterName: prod-us
  oneuptime.url: https://oneuptime.example.com
  oneuptime.apiKey: key-123
tests:
  - it: pins a published OBI release
    asserts:
      - template: templates/daemonset-ebpf.yaml
        equal:
          path: spec.template.spec.containers[0].image
          value: otel/ebpf-instrument:v0.13.0

  - it: leaves span attributes to the pinned OBI's own defaults
    asserts:
      - template: templates/configmap-ebpf.yaml
        notMatchRegex:
          path: data["obi-config.yaml"]
          pattern: "(?m)^attributes:"

  - it: still selects the instrumented processes and skips the excluded ones
    asserts:
      - template: templates/configmap-ebpf.yaml
        matchRegex:
          path: data["obi-config.yaml"]
          pattern: "^discovery:\\n  instrument:\\n    - exe_path: \"\\*\"\\n      k8s_namespace: \"\\*\"\\n  exclude_instrument:\\n"
      - template: templates/configmap-ebpf.yaml
        matchRegex:
          path: data["obi-config.yaml"]
          pattern: "\\n    - exe_path: \"\\*/clickhouse\"\\n"

  - it: selects the span attributes once the tag moves to v0.14
    set:
      ebpf.image.tag: v0.14.0
    asserts:
      - template: templates/configmap-ebpf.yaml
        matchRegex:
          path: data["obi-config.yaml"]
          pattern: "\\nattributes:\\n  select:\\n    traces:\\n      include:\\n(?:        - \"[^\"]+\"\\n){10}$"
