# OneUptime's Kubernetes metric catalog, alert templates and dashboard
# template name metrics exactly as the upstream receivers emit them —
# `k8s.deployment.available`, `k8s.deployment.desired`,
# `k8s.statefulset.ready_pods` — because nothing between the receivers and
# the exporter renames a metric. They once assumed otherwise
# (`k8s.deployment.available_replicas`, `...unavailable_replicas`), and every
# chart and alert built on those names watched a series that never arrived.
#
# These assertions keep that premise true: neither collector config runs a
# processor that changes a metric's NAME, with three exceptions, pinned below.
# The kubeletstats receiver stopped sending k8s.node.cpu.utilization,
# k8s.pod.cpu.utilization and container.cpu.utilization (collector 0.125.0),
# and OneUptime reads them, so the node collector's transform/cpu-utilization
# sends them again from *.cpu.usage: two copies and one rename, back to the
# names collector 0.96.0 sent. And the cluster collector's
# metrics/restarts-increase pipeline renames ITS OWN COPY of
# k8s.container.restarts to k8s.container.restarts.increase, the restarts
# since each sample (tests/restarts-increase_test.yaml), and hands the copy
# to the metrics pipeline under that name; the metrics pipeline still sends
# k8s.container.restarts as the receiver names it. And the
# cluster collector's transform/job-failures-increase sends a COPY of
# k8s.job.failed_pods as k8s.job.failed_pods.increase, the failures since
# each sample (tests/job-failures-increase_test.yaml); the count itself goes
# on under its own name. Every other metric statement sets a resource
# attribute (service.name). If another rename is ever wanted, add it here
# deliberately and update
# packages/Common/Tests/Types/Monitor/Utils/KubernetesAgentEmittedMetrics.ts,
# which lists the names the Common tests pin to.
suite: collectors forward receiver metric names, renaming only kubelet CPU and the restarts and Job failures copies
release:
  name: oneuptime-agent
  namespace: oneuptime
tests:
  - it: the cluster collector reads workload metrics from k8s_cluster and renames none but the restarts and Job failures copies
    templates:
      - templates/configmap-deployment.yaml
    # Every optional receiver and pipeline on, so a rename hidden behind a
    # flag still renders.
    set:
      clusterName: prod-us
      ebpf.enabled: true
      kubeStateMetrics.enabled: true
      controlPlane.enabled: true
      coreDns.enabled: true
      filters.metrics.exclude: ["k8s.pod.network.errors"]
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "metrics:\\s*\\n\\s*receivers:\\s*\\n\\s*- k8s_cluster"
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "metricstransform"
      # transform/severity is logs-only, and transform/pod-level-* work on
      # resource attributes. The metric-context groups are
      # transform/restarts-increase's, whose one rename is of the copy its
      # own pipeline gets, and transform/job-failures-increase's two, which
      # copy k8s.job.failed_pods under a name of its own and make the copy
      # a sum: three in all.
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "\\n  transform/restarts-increase:\\n    error_mode: ignore\\n    metric_statements:\\n      - context: resource\\n        statements:\\n          - delete_key\\(attributes, \"container\\.id\"\\)\\n      - context: metric\\n        statements:\\n          - set\\(name, \"k8s\\.container\\.restarts\\.increase\"\\) where name == \"k8s\\.container\\.restarts\"\\n"
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "\\n  transform/job-failures-increase:\\n    error_mode: ignore\\n    metric_statements:\\n      - context: metric\\n        statements:\\n          - copy_metric\\(name=\"k8s\\.job\\.failed_pods\\.increase\", description=\"[^\"\\n]*\"\\) where name == \"k8s\\.job\\.failed_pods\"\\n      - context: metric\\n        statements:\\n          - convert_gauge_to_sum\\(\"cumulative\", true\\) where name == \"k8s\\.job\\.failed_pods\\.increase\"\\n"
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "(?:context:\\s*(?:metric|datapoint)\\b[\\s\\S]*){4}"
      # One copy, the Job failures', and nothing else copies a metric.
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "copy_metric\\([\\s\\S]*copy_metric\\("
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "set\\(\\s*(metric\\.)?name\\s*,[\\s\\S]*set\\(\\s*(metric\\.)?name\\s*,"
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "\\n    metrics/restarts-increase:\\n      receivers:\\n        - k8s_cluster\\n      processors:\\n        - memory_limiter\\n        - filter/restarts-increase-source\\n        - transform/restarts-increase\\n"
      # A `metrics:` override under k8s_cluster could switch these off.
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "k8s\\.(deployment|statefulset)\\.[a-z_]+:\\s*\\n\\s*enabled:"

  - it: the node collector renames only kubelet CPU, back to the names OneUptime reads
    templates:
      - templates/configmap-daemonset.yaml
    set:
      clusterName: prod-us
      cadvisor.enabled: true
      hostMetrics.enabled: true
      filters.metrics.exclude: ["k8s.pod.network.errors"]
    asserts:
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "metricstransform"
      # The receiver's own *.cpu.utilization (0.96.0 still sends them) go
      # first, so the copies never double them...
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "\\n  filter/cpu-utilization:\\n    error_mode: ignore\\n    metrics:\\n      metric:\\n        - 'name == \"k8s\\.node\\.cpu\\.utilization\" or name == \"k8s\\.pod\\.cpu\\.utilization\"'\\n"
      # ...then these five statements are the whole of it: node and pod CPU
      # copied (the *.cpu.usage originals stay), container CPU renamed.
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "\\n  transform/cpu-utilization:\\n    error_mode: ignore\\n    metric_statements:\\n      - context: metric\\n        statements:\\n          - copy_metric\\(name=\"k8s\\.node\\.cpu\\.utilization\", description=\"Node CPU utilization\", unit=\"1\"\\) where name == \"k8s\\.node\\.cpu\\.usage\"\\n          - copy_metric\\(name=\"k8s\\.pod\\.cpu\\.utilization\", description=\"Pod CPU utilization\", unit=\"1\"\\) where name == \"k8s\\.pod\\.cpu\\.usage\"\\n          - set\\(description, \"Container CPU utilization\"\\) where name == \"container\\.cpu\\.usage\"\\n          - set\\(unit, \"1\"\\) where name == \"container\\.cpu\\.usage\"\\n          - set\\(name, \"container\\.cpu\\.utilization\"\\) where name == \"container\\.cpu\\.usage\"\\n\\n"
      # No other metric-context statements, copies or renames anywhere.
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "context:\\s*(metric|datapoint)\\b[\\s\\S]*context:\\s*(metric|datapoint)\\b"
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "copy_metric\\([\\s\\S]*copy_metric\\([\\s\\S]*copy_metric\\("
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "set\\(\\s*(metric\\.)?name\\s*,[\\s\\S]*set\\(\\s*(metric\\.)?name\\s*,"
      # Ahead of everything that reads a metric's name, the telemetry
      # filters (filters.metrics) included, filter before transform.
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: "\\n      processors:\\n        - memory_limiter\\n        # In this order: the filter clears the way for the copies\\.\\n        - filter/cpu-utilization\\n        - transform/cpu-utilization\\n(?:        #[^\\n]*\\n)*        - transform/pod-level-mark\\n        - k8sattributes\\n"
