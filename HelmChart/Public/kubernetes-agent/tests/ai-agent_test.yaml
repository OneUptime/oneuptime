  # ---- Upgrading a release from an older chart --------------------------------
  #
  # `helm upgrade --reuse-values` renders with the previous release's values,
  # never this chart's values.yaml. The fixtures in tests/values/ are those
  # stored values (with nulls removing this chart's defaults, since
  # helm-unittest always coalesces over values.yaml).

  - it: comes up on and read-only, with every default, on a release from a chart before aiAccess upgraded with plain --reuse-values
    values:
      - values/pre-ai-no-ai-values.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      # The same pod a fresh install gets: the template's fallbacks must
      # match values.yaml.
      - hasDocuments:
          count: 4
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].image
          value: oneuptime/kubernetes-ai-agent:release
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - documentIndex: 3
        notExists:
          path: spec.template.spec.imagePullSecrets
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_WRITES
            value: "false"
      - documentIndex: 1
        equal:
          path: rules
          value:
            - *readCore
            - *readApps
            - *readBatch
            - *readAutoscaling
            - *readNetworking
            - *readPolicy
            - *readStorage
            - *readEvents
            - *readMetrics
            - *accessReviews

  - it: renders the documented --set aiAgent.remediation.enabled=true on a release from a chart before aiAccess, cluster-wide with node operations on
    values:
      - values/pre-ai-set-remediation.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      # No namespaces and no nodeOperations key: the same eight documents a
      # fresh `--set aiAgent.remediation.enabled=true` renders, and the same
      # image and resources.
      - hasDocuments:
          count: 8
      - documentIndex: 3
        equal:
          path: rules
          value: *remediationRules
      - documentIndex: 4
        isKind:
          of: ClusterRoleBinding
      - documentIndex: 5
        equal:
          path: rules
          value: *nodeRules
      - documentIndex: 7
        equal:
          path: spec.template.spec.containers[0].image
          value: oneuptime/kubernetes-ai-agent:release
      - documentIndex: 7
        equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi
      - documentIndex: 7
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_NODE_OPERATIONS
            value: "true"

  - it: comes up on, read-only, with the NEW image on a 14.0.x release that stored aiAccess.enabled=false and the Runner image
    values:
      - values/aiaccess-14.0.x-defaults.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      # aiAccess.enabled=false was every 14.0.x release's stored default, so
      # it is not an opt-out.
      - hasDocuments:
          count: 4
      # Never the stored oneuptime/runner image or its 128Mi/512Mi defaults.
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].image
          value: oneuptime/kubernetes-ai-agent:release
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_WRITES
            value: "false"
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_NODE_OPERATIONS
            value: "false"

  - it: replaces a 14.0.x read-only Runner with a read-only agent
    values:
      - values/aiaccess-14.0.x-read-only.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 3
        equal:
          path: metadata.name
          value: oneuptime-agent-kubernetes-agent-ai-agent
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].image
          value: oneuptime/kubernetes-ai-agent:release
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_WRITES
            value: "false"

  - it: carries a 14.0.x release's cluster-wide write access over to the agent
    values:
      - values/aiaccess-14.0.x-remediation-cluster-wide.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      - hasDocuments:
          count: 8
      - documentIndex: 3
        equal:
          path: metadata.name
          value: oneuptime-agent-kubernetes-agent-ai-agent-remediation
      - documentIndex: 3
        equal:
          path: rules
          value: *remediationRules
      - documentIndex: 4
        isKind:
          of: ClusterRoleBinding
      - documentIndex: 4
        equal:
          path: roleRef.name
          value: oneuptime-agent-kubernetes-agent-ai-agent-remediation
      - documentIndex: 5
        equal:
          path: rules
          value: *nodeRules
      - documentIndex: 7
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_WRITES
            value: "true"
      - documentIndex: 7
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_WRITE_NAMESPACES
            value: ""
      - documentIndex: 7
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_NODE_OPERATIONS
            value: "true"
      - documentIndex: 7
        equal:
          path: spec.template.spec.containers[0].image
          value: oneuptime/kubernetes-ai-agent:release

  - it: carries a 14.0.x release's scoped write access, node-operations opt-out and proxy env over, but never its Runner image, pull policy or resources
    values:
      - values/aiaccess-14.0.x-remediation-scoped.yaml
    set:
