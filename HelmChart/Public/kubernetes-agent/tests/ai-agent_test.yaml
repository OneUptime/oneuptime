      - documentIndex: 6
        equal:
          path: rules
          value: *nodeRules
      - documentIndex: 7
        isKind:
          of: ClusterRoleBinding
      - documentIndex: 8
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_NODE_OPERATIONS
            value: "true"
      - documentIndex: 8
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_WRITE_NAMESPACES
            value: web,api

  - it: widens a stored namespace list to cluster-wide with an explicit empty aiAgent.remediation.namespaces
