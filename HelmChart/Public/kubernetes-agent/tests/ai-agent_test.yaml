      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      # SA, read role + binding, remediation role, RoleBindings in web and
      # api, Deployment: no node role (stored nodeOperations: false).
      - hasDocuments:
          count: 7
      - documentIndex: 4
        isKind:
          of: RoleBinding
      - documentIndex: 4
        equal:
          path: metadata.namespace
          value: web
      - documentIndex: 5
        isKind:
          of: RoleBinding
      - documentIndex: 5
        equal:
          path: metadata.namespace
          value: api
      - documentIndex: 6
        isKind:
          of: Deployment
      - documentIndex: 6
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_WRITE_NAMESPACES
            value: web,api
      - documentIndex: 6
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_KUBECTL_ALLOW_NODE_OPERATIONS
            value: "false"
      - documentIndex: 6
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            value: http://egress.internal:3128
      - documentIndex: 6
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
            value: kubernetes.default.svc,10.0.0.0/8
      # The stored image is the Runner's (oneuptime/runner:14.0.8,
      # IfNotPresent) and its resources the Runner's: none of it applies.
      - documentIndex: 6
        equal:
          path: spec.template.spec.containers[0].image
          value: oneuptime/kubernetes-ai-agent:release
      - documentIndex: 6
        equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - documentIndex: 6
        equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

  - it: does not carry a stored aiAccess.remediation.enabled over when aiAccess.enabled stayed false
    values:
      - values/aiaccess-14.0.x-remediation-without-access.yaml
    set:
      clusterName: prod-us
