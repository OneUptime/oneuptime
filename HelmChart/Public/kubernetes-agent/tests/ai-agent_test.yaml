            - *readBatch
            - *readAutoscaling
            - *readNetworking
            - *readPolicy
            - *readStorage
            - *readEvents
            - *readMetrics
            - *accessReviews
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
