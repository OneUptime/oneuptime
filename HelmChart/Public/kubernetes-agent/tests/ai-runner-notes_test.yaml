# NOTES.txt for OneUptime AI access. The notes are the one place every
# operator reads after `helm upgrade`, so they must:
#   (a) render at all on a release whose stored values predate aiAccess —
#       `--reuse-values` feeds the templates the previous release's values,
#       and a bare `.Values.aiAccess.enabled` aborts the whole upgrade with
#       "nil pointer evaluating interface {}";
#   (b) describe what the server actually does with the remediation switch:
#       it sets "ask for approval" only on a cluster's FIRST registration, and
#       never flips the mode of a cluster that was registered before;
#   (c) offer an upgrade command that works on an existing install:
#       `helm repo update` first (an old local index serves a chart whose
#       schema rejects aiAccess.*), then the release's own name and namespace;
#   (d) say what write access amounts to and where it is bound, and never
#       call RBAC an outer bound: patch on workloads and pods is as good as
#       running any image as any ServiceAccount in that namespace. Nor may
#       they claim the policy refuses every command that does that: `set
#       image` runs a new image as the workload's own ServiceAccount and is
#       a riskier change a human approves (or that Bypass approval runs);
#   (e) say that every listed namespace must already exist (a missing one
#       fails every upgrade), that a drain, a taint or a patch of a node
#       always waits for a human, and that nodeOperations=false reaches the
#       Runner too;
#   (f) keep the settings an operator picked on the AI page before the
#       install, and point at the Runner's log for a refused registration —
#       and say that a deleted Runner's fresh replacement must be selected on
#       the cluster's AI page, because a registration never re-binds a
#       cluster that had a Runner bound;
#   (g) name `--set-json 'aiAccess.remediation.namespaces=[]'` as the way
#       back to cluster-wide. The upgrade lines here use --reuse-values, and
#       under it Helm drops `--set aiAccess.remediation.namespaces=null`
#       whenever the stored values hold the key (the stored list survives),
#       and on a release from a chart without aiAccess the null reaches the
#       schema and fails the upgrade. helm-unittest renders from values
#       files, so it cannot show either; the real helm binary against a
#       stored release (HELM_DRIVER=memory) does.
#
# helm-unittest only hands raw text to the regex asserts for NOTES.txt (for a
# manifest template they see nil), which is why these live in their own suite
# rather than next to the RBAC assertions in ai-runner_test.yaml.
suite: ai access notes
release:
  name: oneuptime-agent
  namespace: oneuptime
tests:
  - it: NOTES render on a release from a chart without aiAccess upgraded with plain --reuse-values and offer the one-flag upgrade after a repo update
    templates:
      - templates/NOTES.txt
    values:
      - values/legacy-pre-aiaccess-no-ai.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      # `helm repo update` on the line right before the upgrade, and the
      # upgrade names this release and namespace.
      - matchRegexRaw:
          pattern: "  helm repo update\n  helm upgrade oneuptime-agent oneuptime/kubernetes-agent -n oneuptime --reuse-values --set aiAccess.enabled=true\n"
      # Write access is a separate, optional step, not part of the command.
      - matchRegexRaw:
          pattern: "To also let it fix what it finds, add --set aiAccess.remediation.enabled=true"
      - notMatchRegexRaw:
          pattern: "--set aiAccess.enabled=true --set aiAccess.remediation.enabled=true"
      - matchRegexRaw:
          pattern: "--reset-then-reuse-values is the safer flag"
      - notMatchRegexRaw:
          pattern: "OneUptime AI access: an in-cluster Runner"
      # Chart 0.7.0 is never published: released charts carry the OneUptime
      # version, so a version number here would only mislead.
      - notMatchRegexRaw:
          pattern: "0\\.7\\.0"

  - it: NOTES tell a read-only install how to grant writes
    templates:
      - templates/NOTES.txt
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "read-only kubectl while investigating incidents and alerts \\(add --set aiAccess.remediation.enabled=true to let it fix them too\\)"
      - matchRegexRaw:
          pattern: "kubectl logs -n oneuptime -l component=ai-runner --tail=100"
      # Nothing about write scope on a read-only install.
      - notMatchRegexRaw:
          pattern: "Write access is bound"
      - notMatchRegexRaw:
          pattern: "Node operations"

  - it: NOTES never promise that an already-registered cluster flips to ask-for-approval
    templates:
      - templates/NOTES.txt
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.remediation.enabled: true
    asserts:
      # The server sets "ask for approval" only on a cluster's FIRST
      # registration; a cluster registered earlier keeps the mode on its AI
      # page. The copy must say both halves and not the old blanket claim.
      - matchRegexRaw:
          pattern: 'a cluster registering for the first time starts in "ask for approval"'
      - matchRegexRaw:
          pattern: "a cluster that was already registered keeps the AI remediation mode chosen on its AI page"
      - notMatchRegexRaw:
          pattern: "ask for approval by default"
      # Settings an operator picked before installing the chart survive the
      # first registration (the Runner is bound, nothing is flipped).
      - matchRegexRaw:
          pattern: "unless AI settings were already picked on its AI page before the install, which are kept as chosen"
      # A refused registration explains itself in the Runner's log.
      - matchRegexRaw:
          pattern: "A refused\nregistration says whether it clears on its own or what to change \\(an\ningestion key with a Pinned Service Name cannot register the Runner\\)"
      # Deleting the Runner leaves the cluster unbound (the binding's foreign
      # key nulls it, and registration never re-binds such a cluster), so the
      # step after the delete is selecting the fresh Runner.
      - matchRegexRaw:
          pattern: "If you delete the Runner so the agent registers a fresh one, select the new\nRunner on the cluster's AI page afterwards: a registration never re-binds a\ncluster that had a Runner bound."

  - it: NOTES say what cluster-wide write access amounts to and what holds the line in the system namespaces
    templates:
      - templates/NOTES.txt
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.remediation.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "patch on workloads and pods \\(and\ncreate on jobs\\) in a namespace is as good as running any image as any\nServiceAccount there and reading its Secrets"
      - matchRegexRaw:
          pattern: "Write access is bound cluster-wide. RBAC cannot keep it out of kube-system,\nkube-public, kube-node-lease or oneuptime"
      - matchRegexRaw:
          pattern: "--set \"aiAccess.remediation.namespaces=\\{web,api\\}\""
      - matchRegexRaw:
          pattern: "Node operations \\(cordon, uncordon, taint, drain\\) are on, cluster-wide"
      # RBAC is not an outer bound on code execution or Secret access.
      - notMatchRegexRaw:
          pattern: "outer bound"
      # The policy refuses SOME ways to run another image, not all of them:
      # `set image` is a riskier change that Bypass approval or an allowlist
      # entry runs unattended. The old copy claimed the list was complete.
      - notMatchRegexRaw:
          pattern: "refuses the commands that would do that"
      - matchRegexRaw:
          pattern: "It still allows changing an image \\(set image, or a patch of an\nimage field\\) as a riskier change: the new image runs as the workload's own\nServiceAccount, with its Secrets, and a human approves it unless the cluster\nbypasses approvals or its allowlist names the command."
      - matchRegexRaw:
          pattern: "create deployment/cronjob/job --image, patch bodies that are\nnot JSON"
      # --overrides decides what kind of object `kubectl expose` creates (a
      # Job with any pod spec, say), so the policy refuses it.
      - matchRegexRaw:
          pattern: "patches that replace the pod spec or a whole containers list,\nexpose --overrides\\)"
      # The cluster-wide branch suggests listing namespaces; they must exist.
      - matchRegexRaw:
          pattern: "\\(every listed namespace must already exist\\):\n  --set \"aiAccess.remediation.namespaces=\\{web,api\\}\""
      # A drain evicts pods everywhere, and a taint — whether `kubectl taint`
      # or a patch of the node writes it — can too, so none of them runs
      # unattended.
      - matchRegexRaw:
          pattern: "A drain\nevicts pods in every namespace, kube-system and oneuptime included, so a drain,\na taint or a patch of a node always waits for a human, in every mode"

  - it: NOTES name the namespaces write access is bound in when they are listed
    templates:
      - templates/NOTES.txt
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
      aiAccess.enabled: true
      aiAccess.remediation.enabled: true
      aiAccess.remediation.namespaces:
        - prod
        - web
      aiAccess.remediation.nodeOperations: false
    asserts:
      - matchRegexRaw:
          pattern: "Write access is bound only in: prod, web \\(aiAccess.remediation.namespaces\\)."
      - notMatchRegexRaw:
          pattern: "bound cluster-wide"
      # A RoleBinding in a namespace that does not exist fails the upgrade;
      # say so, and how to go back to cluster-wide.
      - matchRegexRaw:
          pattern: "Each listed namespace must already exist: the chart creates a RoleBinding in\neach and never creates a namespace, so a missing one fails every install or\nupgrade with 'namespaces \"<name>\" not found'."
      # The reset that works under --reuse-values, which every upgrade line
      # these notes print uses; `=null` is named only as what does not work.
      - matchRegexRaw:
          pattern: "Take a namespace off the list\nbefore you delete it; --set-json 'aiAccess.remediation.namespaces=\\[\\]' goes\nback to cluster-wide \\(--set aiAccess.remediation.namespaces=null does not\nreset a stored list under --reuse-values\\)."
      # The old advice, which kept the stored list (and so the upgrade that
      # failed on a deleted namespace kept failing).
      - notMatchRegexRaw:
          pattern: "namespaces=null goes back"
      # The Runner refuses node operations too, not only RBAC.
      - matchRegexRaw:
          pattern: "Node operations \\(cordon, uncordon, taint, drain\\) are off: the chart grants no\nnode RBAC, and the Runner refuses them before it runs kubectl."

  # The same two upgrades on a release whose stored values predate aiAccess:
  # `.Values.aiAccess` holds only what --set passed, and NOTES must still
  # render the right branch rather than abort.
  - it: NOTES render the read-only branch on a release from a chart without aiAccess upgraded with the one flag
    templates:
      - templates/NOTES.txt
    values:
      - values/legacy-pre-aiaccess-ai-enabled.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      - matchRegexRaw:
          pattern: "read-only kubectl while investigating incidents and alerts \\(add --set aiAccess.remediation.enabled=true to let it fix them too\\)"
      - matchRegexRaw:
          pattern: "kubectl logs -n oneuptime -l component=ai-runner --tail=100"
      - notMatchRegexRaw:
          pattern: "investigate AND fix incidents"
      # The "upgrade with --set aiAccess.enabled=true" prompt is for installs
      # that have not enabled it.
      - notMatchRegexRaw:
          pattern: "--reuse-values --set aiAccess.enabled=true"

  - it: NOTES render the write branch on a release from a chart without aiAccess upgraded with both flags, without the blanket approval claim
    templates:
      - templates/NOTES.txt
    values:
      - values/legacy-pre-aiaccess-ai-remediation.yaml
    set:
      clusterName: prod-us
      oneuptime.url: https://oneuptime.example.com
      oneuptime.apiKey: key-123
    asserts:
      - matchRegexRaw:
          pattern: "investigate AND fix incidents"
      - matchRegexRaw:
          pattern: 'a cluster registering for the first time starts in "ask for approval"'
      - matchRegexRaw:
          pattern: "a cluster that was already registered keeps the AI remediation mode chosen on its AI page"
      - notMatchRegexRaw:
          pattern: "ask for approval by default"
      # No namespaces and no nodeOperations key in the stored values: the
      # same fallbacks as templates/ai-runner.yaml.
      - matchRegexRaw:
          pattern: "Write access is bound cluster-wide"
      - matchRegexRaw:
          pattern: "Node operations \\(cordon, uncordon, taint, drain\\) are on, cluster-wide"
