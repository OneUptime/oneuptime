{{- if .Values.ebpf.enabled }}
# OBI YAML configuration, mounted into the eBPF DaemonSet and named by
# OTEL_EBPF_CONFIG_PATH. Most of OBI's settings are OTEL_EBPF_* env vars on
# the DaemonSet; this file holds the ones OBI only reads from YAML:
#
#   - discovery.instrument / discovery.exclude_instrument — which processes
#     are instrumented, from ebpf.autoTargetExe, ebpf.excludeExePaths and the
#     `ebpfDiscovery` namespace rules. There is no env var for exclusions.
#   - routes — HTTP route naming, from ebpf.routes, when set.
#   - attributes.select.traces.include — the span attributes OBI exports,
#     for OBI v0.14 and later: OBI's defaults plus service.peer.name (opt-in
#     since v0.14, and what the service map names a called service by), then
#     ebpf.extraSpanAttributes. Listing any attribute replaces OBI's
#     defaults, hence the repetition; see kubernetes-agent.obiSpanAttributes.
#     An older OBI keeps its own defaults.
#   - ebpf.log_enricher.services — the trace↔log correlation process
#     selector, when ebpf.logToTraceCorrelation is on (see the warning there:
#     LD_PRELOAD-based APM agents like Dynatrace conflict with the log enricher
#     and crash with SIGSEGV).
#
# OBI reads this file on top of its defaults and then applies env vars, which
# win on conflict. The DaemonSet carries a checksum of this ConfigMap, so a
# change here rolls the eBPF pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubernetes-agent.fullname" . }}-ebpf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-agent.labels" . | nindent 4 }}
data:
  obi-config.yaml: |
    {{- include "kubernetes-agent.obiConfig" . | nindent 4 }}
{{- end }}
