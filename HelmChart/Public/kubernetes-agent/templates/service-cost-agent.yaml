{{- if eq (include "kubernetes-agent.costMetricsFromAgent" .) "true" }}
# The cost agent's health port, for the collector's cost-engine job: it asks
# the agent where the engine the agent reads serves its price metrics
# (/scrape-targets, Prometheus http_sd), since a Kubecost frontend answers
# /metrics with its web page (#9776), and the bundled OpenCost's are not the
# prices of a cluster the agent prices with its own engine (#9852).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubernetes-agent.fullname" . }}-cost
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-agent.labels" . | nindent 4 }}
    component: cost-agent
spec:
  type: ClusterIP
  # The agent reports Not Ready while its allocations stall (/healthz), and
  # the price metrics do not wait on them: the collector asks it either way.
  publishNotReadyAddresses: true
  selector:
    {{- include "kubernetes-agent.selectorLabels" . | nindent 4 }}
    component: cost-agent
  ports:
    - name: health
      port: 13134
      targetPort: health
      protocol: TCP
{{- end }}
