{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubernetes-agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- /*
On the openshift preset the node pods run as service accounts of their own,
the only ones that may use the SCCs templates/openshift-scc.yaml creates
(kubernetes-agent.nodeServiceAccounts). They read the cluster as the main one
does: the ClusterRoleBinding below binds them to the same ClusterRole.
*/}}
{{- if eq (include "kubernetes-agent.nodeServiceAccounts" .) "true" }}
{{- if eq (include "kubernetes-agent.daemonSetEnabled" .) "true" }}
---
{{ include "kubernetes-agent.nodeServiceAccount" (dict "root" . "name" (include "kubernetes-agent.nodeCollectorServiceAccountName" .)) }}
{{- end }}
{{- if eq (include "kubernetes-agent.ebpfPodsEnabled" .) "true" }}
---
{{ include "kubernetes-agent.nodeServiceAccount" (dict "root" . "name" (include "kubernetes-agent.ebpfServiceAccountName" .)) }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubernetes-agent.fullname" . }}
  labels:
    {{- include "kubernetes-agent.labels" . | nindent 4 }}
rules:
  # For k8s_cluster receiver and k8sattributes processor
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - nodes/proxy
      - nodes/stats
      - services
      - endpoints
      - namespaces
      - events
      - replicationcontrollers
      - resourcequotas
      - limitranges
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch"]
{{- if eq (include "kubernetes-agent.logTailerEnabled" .) "true" }}
  # For API-mode log collection — stream pod logs via the Kubernetes API
  # (same permission `kubectl logs` needs). Only granted when the log tailer
  # Deployment is enabled (full api mode, or the Windows-only hybrid).
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get", "list"]
{{- end }}
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  # For k8sobjects receiver to watch events
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling.k8s.io"]
    resources:
      - verticalpodautoscalers
    verbs: ["get", "list", "watch"]
{{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.provider "istio") }}
  - apiGroups: ["networking.istio.io"]
    resources:
      - virtualservices
      - destinationrules
      - gateways
      - serviceentries
    verbs: ["get", "list", "watch"]
  - apiGroups: ["security.istio.io"]
    resources:
      - peerauthentications
      - authorizationpolicies
    verbs: ["get", "list", "watch"]
{{- end }}
{{- if eq (include "kubernetes-agent.costEngineBundled" .) "true" }}
  # For the bundled OpenCost engine — it reads workload topology the
  # rules above already grant, plus these two: storage classes (PV
  # pricing) and pod disruption budgets (its cluster inventory).
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
{{- end }}
  # For the cAdvisor scrape in the DaemonSet collector: it reads
  # /metrics/cadvisor off the local kubelet on NODE_IP:10250, and the
  # kubelet authorizes that path as the nodes/metrics subresource.
  - apiGroups: [""]
    resources:
      - nodes/metrics
    verbs: ["get"]
  # For endpoints the API server itself serves. The bundled cost
  # Prometheus reaches cAdvisor through the API-server node proxy, which
  # the nodes/proxy grant above covers; nonResourceURLs never apply to
  # the kubelet, which authorizes by resource + subresource instead.
  - nonResourceURLs:
      - /metrics
      - /metrics/cadvisor
    verbs: ["get"]
{{- if eq (include "kubernetes-agent.openshift" .) "true" }}
  # For the collector's openshift resource detector
  # (kubernetes-agent.openshiftDetector): which cloud the cluster runs on,
  # from the status of the cluster's one Infrastructure object.
  - apiGroups: ["config.openshift.io"]
    resources:
      - infrastructures/status
    resourceNames:
      - cluster
    verbs: ["get"]
{{- end }}
{{- if eq (include "kubernetes-agent.openshiftObjectsEnabled" .) "true" }}
  # For the k8sobjects/openshift receiver (configmap-deployment.yaml):
  # OpenShift's own objects, read only. A Route's TLS key is replaced before
  # its record leaves the cluster (transform/openshift-route-tls).
  - apiGroups: ["config.openshift.io"]
    resources:
      - clusteroperators
      - clusterversions
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources:
      - routes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps.openshift.io"]
    resources:
      - deploymentconfigs
    verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubernetes-agent.fullname" . }}
  labels:
    {{- include "kubernetes-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubernetes-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubernetes-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if eq (include "kubernetes-agent.nodeServiceAccounts" .) "true" }}
{{- if eq (include "kubernetes-agent.daemonSetEnabled" .) "true" }}
  - kind: ServiceAccount
    name: {{ include "kubernetes-agent.nodeCollectorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if eq (include "kubernetes-agent.ebpfPodsEnabled" .) "true" }}
  - kind: ServiceAccount
    name: {{ include "kubernetes-agent.ebpfServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
