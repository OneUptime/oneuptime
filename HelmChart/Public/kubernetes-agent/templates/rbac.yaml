{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubernetes-agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- /*
Where the chart creates SCCs (the openshift preset), the node pods run as
service accounts of their own, the only ones that may use the SCCs
templates/openshift-scc.yaml creates (kubernetes-agent.nodeServiceAccounts).
They read the cluster as the main one does: the ClusterRoleBinding below binds
them to the same ClusterRole.
*/}}
{{- if eq (include "kubernetes-agent.nodeServiceAccounts" .) "true" }}
{{- if eq (include "kubernetes-agent.daemonSetEnabled" .) "true" }}
---
{{ include "kubernetes-agent.nodeServiceAccount" (dict "root" . "name" (include "kubernetes-agent.nodeCollectorServiceAccountName" .)) }}
{{- end }}
{{- if eq (include "kubernetes-agent.ebpfPodsEnabled" .) "true" }}
---
{{ include "kubernetes-agent.nodeServiceAccount" (dict "root" . "name" (include "kubernetes-agent.ebpfServiceAccountName" .)) }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubernetes-agent.fullname" . }}
  labels:
    {{- include "kubernetes-agent.labels" . | nindent 4 }}
    {{- with include "kubernetes-agent.nodesProxyReasons" . }}
    # Why the rule at the end grants nodes/proxy: the cluster's Compliance
    # page reads it to say why this role fails CIS Kubernetes Benchmark
    # 5.1.10, and how to drop it.
    oneuptime.com/nodes-proxy: {{ . | quote }}
    {{- end }}
rules:
  # For k8s_cluster receiver and k8sattributes processor
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - services
      - endpoints
      - namespaces
      - events
      - replicationcontrollers
      - resourcequotas
      - limitranges
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch"]
{{- if eq (include "kubernetes-agent.logTailerEnabled" .) "true" }}
  # For API-mode log collection — stream pod logs via the Kubernetes API
  # (same permission `kubectl logs` needs). Only granted when the log tailer
  # Deployment is enabled (full api mode, or the Windows-only hybrid).
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get", "list"]
{{- end }}
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  # For k8sobjects receiver to watch events
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling.k8s.io"]
    resources:
      - verticalpodautoscalers
    verbs: ["get", "list", "watch"]
{{- if and .Values.serviceMesh.enabled (eq .Values.serviceMesh.provider "istio") }}
  - apiGroups: ["networking.istio.io"]
    resources:
      - virtualservices
      - destinationrules
      - gateways
      - serviceentries
    verbs: ["get", "list", "watch"]
  - apiGroups: ["security.istio.io"]
    resources:
      - peerauthentications
      - authorizationpolicies
    verbs: ["get", "list", "watch"]
{{- end }}
{{- if eq (include "kubernetes-agent.costEngineBundled" .) "true" }}
  # For the bundled OpenCost engine — it reads workload topology the
  # rules above already grant, plus these two: storage classes (PV
  # pricing) and pod disruption budgets (its cluster inventory).
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
{{- end }}
  # For the kubelet's own API (port 10250), which authorizes each path as a
  # subresource of nodes, never by these rules' verbs but a GET's:
  #   - nodes/stats: /stats/summary, the node collector's kubeletstats;
  #   - nodes/metrics: /metrics/cadvisor, the node collector's cAdvisor
  #     scrape of its own node, and the bundled cost Prometheus's of every
  #     node (templates/prometheus-cost.yaml);
  #   - nodes/pods: /pods, the node's pod list kubeletstats reads each
  #     container's ID, each volume's claim and its utilization metrics'
  #     requests and limits from - on a kubelet from Kubernetes 1.33 on
  #     (KubeletFineGrainedAuthz). An older kubelet asks for nodes/proxy,
  #     granted at the end of this role only where it is needed.
  - apiGroups: [""]
    resources:
      - nodes/stats
      - nodes/metrics
      - nodes/pods
    verbs: ["get"]
  # For the API server's own metrics, which the control plane scrape reads
  # (configmap-deployment.yaml). A non-resource URL is the API server's
  # alone: the kubelet authorizes by the subresources above.
  - nonResourceURLs:
      - /metrics
    verbs: ["get"]
{{- if eq (include "kubernetes-agent.openshift" .) "true" }}
  # For the collector's openshift resource detector
  # (kubernetes-agent.openshiftDetector): which cloud the cluster runs on,
  # from the status of the cluster's one Infrastructure object.
  - apiGroups: ["config.openshift.io"]
    resources:
      - infrastructures/status
    resourceNames:
      - cluster
    verbs: ["get"]
{{- end }}
{{- if eq (include "kubernetes-agent.openshiftObjectsEnabled" .) "true" }}
  # For the k8sobjects/openshift receiver (configmap-deployment.yaml):
  # OpenShift's own objects, read only. A Route's TLS key is replaced before
  # its record leaves the cluster (transform/openshift-route-tls).
  - apiGroups: ["config.openshift.io"]
    resources:
      - clusteroperators
      - clusterversions
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources:
      - routes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps.openshift.io"]
    resources:
      - deploymentconfigs
    verbs: ["get", "list", "watch"]
{{- end }}
{{- if eq (include "kubernetes-agent.complianceObjectsEnabled" .) "true" }}
  # For the k8sobjects/compliance receiver (configmap-deployment.yaml): what
  # the CIS Kubernetes Benchmark's policy controls read, for the cluster's
  # Compliance page, read only. No Secret is read: a ServiceAccount only
  # names its token Secrets, and OneUptime drops even the names.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs: ["get", "list", "watch"]
{{- end }}
{{- if eq (include "kubernetes-agent.controlPlaneDiscovery" .) "true" }}
  # For the control-plane scrapes on OpenShift (configmap-deployment.yaml):
  # service discovery finds each replica in its Service's EndpointSlices. It
  # reads the Services and pods beside them through the rules above.
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
{{- end }}
{{- with include "kubernetes-agent.nodesProxyReasons" . }}
  # nodes/proxy reaches the whole kubelet API - a GET on it can run commands
  # in any container of the node - and CIS Kubernetes Benchmark 5.1.10 fails
  # every binding that grants it. Granted only where nothing narrower works,
  # as the oneuptime.com/nodes-proxy label above says:
  #   - kubelet-pods: a kubelet older than Kubernetes 1.33 lets the node
  #     collector read its pod list only with it (kubeletstats.nodesProxy);
  #   - cost-prometheus: the bundled cost Prometheus reads cAdvisor through
  #     the API server's node proxy, as EKS Fargate needs
  #     (cost.prometheus.nodesProxy).
  - apiGroups: [""]
    resources:
      - nodes/proxy
    verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubernetes-agent.fullname" . }}
  labels:
    {{- include "kubernetes-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubernetes-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubernetes-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if eq (include "kubernetes-agent.nodeServiceAccounts" .) "true" }}
{{- if eq (include "kubernetes-agent.daemonSetEnabled" .) "true" }}
  - kind: ServiceAccount
    name: {{ include "kubernetes-agent.nodeCollectorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if eq (include "kubernetes-agent.ebpfPodsEnabled" .) "true" }}
  - kind: ServiceAccount
    name: {{ include "kubernetes-agent.ebpfServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
