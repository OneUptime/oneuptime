{{- if .Values.ebpf.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kubernetes-agent.fullname" . }}-ebpf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-agent.labels" . | nindent 4 }}
    component: ebpf-instrument
spec:
  selector:
    matchLabels:
      {{- include "kubernetes-agent.selectorLabels" . | nindent 6 }}
      component: ebpf-instrument
  template:
    metadata:
      labels:
        {{- include "kubernetes-agent.selectorLabels" . | nindent 8 }}
        component: ebpf-instrument
      annotations:
        # OBI reads its config file once, at startup, so roll the pods when
        # it changes. Hashes the config itself (the helper configmap-ebpf.yaml
        # renders), so only a change OBI would see rolls them.
        checksum/config: {{ include "kubernetes-agent.obiConfig" . | sha256sum }}
    spec:
      serviceAccountName: {{ include "kubernetes-agent.serviceAccountName" . }}
      hostPID: true
      # kubernetes.io/os=linux is always merged in (user keys win): the
      # image is linux-only and eBPF needs a Linux kernel, and the blanket
      # toleration below would otherwise land pods on Windows nodes in
      # permanent ImagePullBackOff.
      nodeSelector:
        {{- include "kubernetes-agent.nodeSelector" .Values.ebpf.nodeSelector | nindent 8 }}
      {{- with .Values.ebpf.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Defaults to `operator: Exists` (tolerate every taint) so the DaemonSet
      # covers all nodes. Override ebpf.tolerations with a narrower list to keep
      # the agent OFF tainted nodes — e.g. a DB-only db-pool — otherwise the
      # blanket toleration lets it co-locate with (and instrument) the databases.
      tolerations:
        {{- toYaml .Values.ebpf.tolerations | nindent 8 }}
      {{- if .Values.ebpf.priorityClassName }}
      priorityClassName: {{ .Values.ebpf.priorityClassName | quote }}
      {{- end }}
      containers:
        - name: ebpf-instrument
          image: "{{ .Values.ebpf.image.repository }}:{{ .Values.ebpf.image.tag }}"
          imagePullPolicy: {{ .Values.ebpf.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            privileged: true
            readOnlyRootFilesystem: true
          env:
            # The YAML config holds what OBI does not accept as env vars:
            # which processes to instrument and which to skip
            # (discovery.instrument / exclude_instrument), route naming, the
            # span attributes, and the log enricher's selector. See
            # templates/configmap-ebpf.yaml.
            # Env vars on this container still win on conflict.
            - name: OTEL_EBPF_CONFIG_PATH
              value: "/etc/obi/obi-config.yaml"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Which executables OBI instruments (ebpf.autoTargetExe) and skips
            # (ebpf.excludeExePaths) is in the config file, NOT in
            # OTEL_EBPF_AUTO_TARGET_EXE: OBI ORs that variable in as one more
            # selector, which would undo the namespace include rules.
            - name: OTEL_EBPF_KUBE_METADATA_ENABLE
              value: "true"
            # OBI emits a warning unless this is set explicitly — without it,
            # k8s.cluster.name is missing from network metrics. It is also the
            # k8s.cluster.name OBI puts on every pod's spans and metrics
            # (since v0.14 it outranks OTEL_RESOURCE_ATTRIBUTES below).
            - name: OTEL_EBPF_KUBE_CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: OTEL_EBPF_LOG_LEVEL
              value: {{ .Values.ebpf.logLevel | quote }}
            {{- if .Values.ebpf.printTraces }}
            - name: OTEL_EBPF_TRACE_PRINTER
              value: "text"
            {{- end }}
            # Which metric families OBI emits from the captured traffic.
            # Built from .Values.ebpf.features.*; see values.yaml.
            - name: OTEL_EBPF_METRICS_FEATURES
              value: {{ include "kubernetes-agent.ebpfMetricsFeatures" . | quote }}
            # OBI's Node.js agent: links a Node request's outgoing calls to
            # it. (Route templates are read from the app's files by OBI
            # itself, with or without the agent.) See ebpf.nodejs.
            - name: OTEL_EBPF_NODEJS_ENABLED
              value: {{ ternary "false" "true" (eq (toString ((.Values.ebpf.nodejs | default dict).enabled)) "false") | quote }}
            # Stop exporting OBI telemetry for a process that exports OTLP
            # itself. See ebpf.excludeOtelInstrumentedServices.
            - name: OTEL_EBPF_EXCLUDE_OTEL_INSTRUMENTED_SERVICES
              value: {{ ternary "false" "true" (eq (toString .Values.ebpf.excludeOtelInstrumentedServices) "false") | quote }}
            {{- $profiling := .Values.profiling | default dict }}
            {{- if and $profiling.enabled (ne (toString $profiling.obiProcessContext) "false") }}
            # The profiler (profiling.obiProcessContext) tags each CPU sample
            # with the span its thread is serving, which it reads from OBI's
            # pinned traces_ctx_v1 map. Since v0.14 OBI leaves that map empty
            # unless asked: keeping it current costs a refresh on every async
            # context switch of an instrumented app (on Node.js, a hook on
            # every callback), and a reader outside OBI cannot announce
            # itself. Without this no flame graph is linked to a span. Set
            # only for the profiler; the log enricher
            # (ebpf.logToTraceCorrelation) turns it on by itself. An env var
            # rather than ebpf.populate_trace_context in the config file,
            # whose `ebpf:` key the log enricher block already owns. A values
            # file without obiProcessContext counts as true, its default.
            - name: OTEL_EBPF_BPF_POPULATE_TRACE_CONTEXT
              value: "true"
            {{- end }}
            {{- if .Values.ebpf.contextPropagation }}
            # Inject a W3C `traceparent` into outbound traffic so traces link
            # across services. OFF unless explicitly opted into, because every
            # mode rewrites traffic that is already in flight (in-place buffer
            # widening for plaintext HTTP, a TC-injected TCP option for TLS and
            # raw TCP) and a bad rewrite stalls the connection rather than just
            # losing a span. Mode comes from
            # `.Values.ebpf.contextPropagationMode` — `headers` (default, the
            # narrowest), `tcp`, or `all`. No kernel version makes this inert:
            # below 5.17 OBI falls back to bounded-scan variants and still
            # rewrites traffic. This pod is privileged, so the capability gate
            # that would otherwise stop injection is always open.
            - name: OTEL_EBPF_BPF_CONTEXT_PROPAGATION
              value: {{ .Values.ebpf.contextPropagationMode | default "headers" | quote }}
            {{- if .Values.ebpf.trackRequestHeaders }}
            - name: OTEL_EBPF_BPF_TRACK_REQUEST_HEADERS
              value: "true"
            {{- end }}
            {{- end }}
            # OTLP HTTP export to the in-cluster collector (the
            # metrics-collector Deployment). The collector adds k8sattributes
            # enrichment, batches, and forwards over OTLP HTTP to OneUptime.
            # Single egress + retry path for everything the agent collects.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ include "kubernetes-agent.fullname" . }}-otlp.{{ .Release.Namespace }}.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            # Cluster name as a fallback, so traces from this cluster are
            # filterable in the dashboard. Since v0.14 OBI ranks this variable
            # below what it resolves for a target and merges per key:
            # OTEL_EBPF_KUBE_CLUSTER_NAME above, a pod's
            # resource.opentelemetry.io/k8s.cluster.name annotation or a
            # container's own OTEL_RESOURCE_ATTRIBUTES win over it.
            # Per-service service.name is set by OBI from pod / workload
            # metadata, so we do NOT override it here.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.cluster.name={{ .Values.clusterName }}"
            # Namespace rules with the `ebpfDiscovery` scope are in the config
            # file too, as k8s_namespace selectors.
          resources:
            {{- toYaml .Values.ebpf.resources | nindent 12 }}
          volumeMounts:
            - name: var-run-obi
              mountPath: /var/run/obi
            # OBI pins eBPF maps to bpffs for features like log enrichment
            # and profile correlation. Without this mount it falls back to
            # in-memory maps with a warning.
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
            # tracefs / debugfs are required by the `stats` feature
            # (`OTEL_EBPF_METRICS_FEATURES` includes `stats_tcp_*`) so OBI can
            # attach to kernel tracepoints like `sock/inet_sock_set_state`
            # for TCP RTT, failed-connection, and retransmit metrics. The
            # mounts are no-ops on hosts that don't expose these, so it's
            # safe to always mount.
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: obi-config
              mountPath: /etc/obi
              readOnly: true
      volumes:
        - name: var-run-obi
          emptyDir: {}
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: obi-config
          configMap:
            name: {{ include "kubernetes-agent.fullname" . }}-ebpf
{{- end }}
