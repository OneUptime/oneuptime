{{- /*
  Config for the node collector. Rendered whenever that DaemonSet runs, which is
  now independent of logs: the filelog receiver and the logs pipeline are the
  only parts gated on pod-log collection. Everything else here is metrics.
*/}}
{{- $wantLogs := eq (include "kubernetes-agent.daemonSetLogsEnabled" .) "true" }}
{{- /*
  The types the renamed components go by on the collector this renders for:
  kubelet_stats, host_metrics, file_log, k8s_attributes, resource_detection
  and otlp_http, or the old types on a collector from before the rename
  (kubernetes-agent.componentType).
*/}}
{{- $kubeletStats := include "kubernetes-agent.componentType" (dict "root" . "type" "kubelet_stats") }}
{{- $hostMetrics := include "kubernetes-agent.componentType" (dict "root" . "type" "host_metrics") }}
{{- $fileLog := include "kubernetes-agent.componentType" (dict "root" . "type" "file_log") }}
{{- $k8sAttributes := include "kubernetes-agent.componentType" (dict "root" . "type" "k8s_attributes") }}
{{- $resourceDetection := include "kubernetes-agent.componentType" (dict "root" . "type" "resource_detection") }}
{{- $otlpHttp := include "kubernetes-agent.componentType" (dict "root" . "type" "otlp_http") }}
{{- if eq (include "kubernetes-agent.daemonSetEnabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubernetes-agent.fullname" . }}-daemonset
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-agent.labels" . | nindent 4 }}
data:
  otel-collector-config.yaml: |
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"

    receivers:
      # Collect node, pod, and container resource metrics from kubelet
      {{ $kubeletStats }}:
        collection_interval: {{ .Values.collectionInterval }}
        auth_type: serviceAccount
        endpoint: "https://${env:NODE_IP}:10250"
        insecure_skip_verify: true
        metric_groups:
          - node
          - pod
          - container
          {{- if .Values.kubeletstats.volumeMetrics.enabled }}
          - volume
          {{- end }}
        extra_metadata_labels:
          - container.id
          {{- if .Values.kubeletstats.volumeMetrics.enabled }}
          # Which claim a volume's usage belongs to. The kubelet's stats name a
          # volume only as its pod calls it ("data", "kube-api-access-x7k2p");
          # with this the receiver reads the pod's spec from the kubelet's pod
          # list, which container.id already reads, and gives each volume its
          # k8s.volume.type and, for a persistent volume claim, the claim's
          # name: k8s.persistentvolumeclaim.name. OneUptime files the usage
          # (k8s.volume.capacity, k8s.volume.available, k8s.volume.inodes*) under
          # that claim, as its Persistent Volume Claims pages show, and the
          # "PVC Almost Full" monitor template groups by it. Without it no
          # volume names its claim.
          - k8s.volume.type
          {{- end }}
        # No k8s_api_config. Set, the receiver also asks the API server for
        # each claim's PersistentVolume, then names an in-tree AWS, GCE or
        # local disk's k8s.volume.type for the disk instead of
        # persistentVolumeClaim, and drops the volume's metrics whenever that
        # read fails. OneUptime finds a claim by its name and type, which the
        # pod list already gives, and reads nothing else the PersistentVolume
        # adds.
        # One `metrics:` map for every optional metric this receiver turns
        # on. Keep it that way: a second `metrics:` key under kubeletstats
        # is a duplicate mapping key, and the collector refuses the config.
        metrics:
          # Node and pod CPU in use, in cores (`{cpu}`). Both are on by
          # default in collector 0.161.0 (`enabled: false` in 0.96.0, which
          # a --reuse-values upgrade keeps), and they are always on here
          # rather than behind a flag because OneUptime reads them:
          # the "High Node CPU Utilization" alert template (k8s-high-cpu)
          # divides `k8s.node.cpu.usage` by `k8s.node.allocatable_cpu`, and
          # the Kubernetes dashboard template charts both. Without them that
          # monitor has no numerator and can never fire, with no error
          # anywhere. tests/kubeletstats-cpu-usage_test.yaml keeps both on.
          #
          # They are also where OneUptime's `*.cpu.utilization` come from:
          # the receiver stopped sending those in 0.125.0 (a cores gauge
          # too, despite the name), and filter/cpu-utilization and
          # transform/cpu-utilization below send them again under their old
          # names. Container CPU goes out as `container.cpu.utilization`
          # only, as before: OneUptime reads no `container.cpu.usage`.
          k8s.node.cpu.usage:
            enabled: true
          k8s.pod.cpu.usage:
            enabled: true
          {{- if .Values.kubeletstats.utilizationMetrics.enabled }}
          # Saturation metrics — CPU/memory as a percentage of pod
          # limit/request. All disabled by default in the upstream
          # kubeletstats receiver because they require pod limits/requests
          # set; enabling them adds no extra scrape, just derived metric
          # families from data the receiver already collects.
          #
          # The receiver only exposes request/limit utilization at the
          # container and pod level — there is no node-level
          # `k8s.node.*.request_utilization` metric in any receiver
          # version (it's a pod-scheduling ratio, not a kubelet stat).
          # Node request saturation is derived downstream from
          # pod/container requests vs. node allocatable.
          k8s.container.cpu_limit_utilization:
            enabled: true
          k8s.container.cpu_request_utilization:
            enabled: true
          k8s.container.memory_limit_utilization:
            enabled: true
          k8s.container.memory_request_utilization:
            enabled: true
          k8s.pod.cpu_limit_utilization:
            enabled: true
          k8s.pod.cpu_request_utilization:
            enabled: true
          k8s.pod.memory_limit_utilization:
            enabled: true
          k8s.pod.memory_request_utilization:
            enabled: true
          {{- end }}

      {{- if .Values.cadvisor.enabled }}
      # Scrape this node's kubelet cAdvisor endpoint for container-level
      # metrics that the kubeletstats receiver doesn't translate (CFS
      # throttling, OOM kills). One scrape per node (DaemonSet pod →
      # local kubelet on NODE_IP:10250), no apiserver load.
      #
      # `metric_relabel_configs` drops everything except the configured
      # allowlist at the receiver — cAdvisor exposes hundreds of metrics
      # by default, so without this the per-container cardinality would
      # balloon the collector's memory and the OneUptime metric store.
      prometheus/cadvisor:
        config:
          scrape_configs:
            - job_name: cadvisor
              scrape_interval: {{ .Values.cadvisor.scrapeInterval }}
              scheme: https
              metrics_path: /metrics/cadvisor
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              static_configs:
                - targets:
                    - "${env:NODE_IP}:10250"
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "^({{ join "|" .Values.cadvisor.metricsAllowlist }})$"
                  action: keep
      {{- end }}

      {{- if eq (include "kubernetes-agent.hostMetricsEnabled" .) "true" }}
      # OS-level metrics that kubeletstats doesn't surface: disk I/O
      # queue depth, filesystem inode usage, NIC error counters, load
      # average, paging stats. Reads /proc and /sys directly (mounted
      # under /host).
      {{ $hostMetrics }}:
        collection_interval: {{ .Values.hostMetrics.collectionInterval }}
        root_path: /host
        scrapers:
          cpu:
            metrics:
              # Collector 0.157.0 sums system.cpu.time across logical CPUs
              # unless asked for the `cpu` attribute. Asked for, so the series
              # stay per CPU, as 0.96.0 sends them with no such key (and would
              # refuse one): a query that averages them, as OneUptime's AI
              # metric tools do, would otherwise read the CPU count times the
              # value. 0.157.0 also turned on a CPU count, which OneUptime
              # reads as a host's cores and never got from this agent.
              {{- if eq (include "kubernetes-agent.collectorAtLeast" (dict "root" . "version" "0.157.0")) "true" }}
              system.cpu.time:
                attributes: [cpu, state]
              {{- end }}
              system.cpu.logical.count:
                enabled: false
          load:
          memory:
          disk:
          filesystem:
            include_fs_types:
              fs_types: [ext4, ext3, ext2, xfs, btrfs, zfs]
              match_type: strict
          network:
          paging:
          processes:
      {{- end }}

      {{- if and .Values.auditLogs.enabled $wantLogs }}
      # Kubernetes API server audit log. Self-managed clusters only;
      # managed K8s (EKS / GKE / AKS / DOKS) routes audit logs to the
      # cloud provider's sink instead of writing them to a file.
      {{ $fileLog }}/audit:
        include:
          {{- range .Values.auditLogs.paths }}
          - {{ . | quote }}
          {{- end }}
        start_at: end
        include_file_path: true
        operators:
          - type: json_parser
            id: parse-audit-json
            on_error: send
          - type: severity_parser
            parse_from: attributes.level
            mapping:
              warn: warning
              error: ["panic", "error"]
              info: ["request", "requestresponse", "metadata"]
              debug: ["none"]
          - type: add
            field: resource["k8s.cluster.name"]
            value: {{ include "kubernetes-agent.clusterName" . | quote }}
          - type: add
            field: resource["service.name"]
            value: "kubernetes-audit"
      {{- end }}

      {{- if $wantLogs }}
      # Collect pod logs from /var/log/pods.
      #
      # The namespace is encoded in the pod-log directory name
      # (/var/log/pods/<namespace>_<pod>_<uid>/...), so podLogs-scoped
      # namespace rules are applied here as include/exclude path globs.
      # Filtered namespaces are never opened, and the same resolved lists
      # are passed to the API log-tailer when that mode is selected.
      # Exclude always wins over include.
      {{- $podLogInclude := include "kubernetes-agent.namespaceRulePatterns" (dict "root" . "action" "include" "scope" "podLogs") | fromJsonArray }}
      {{- $podLogExclude := include "kubernetes-agent.namespaceRulePatterns" (dict "root" . "action" "exclude" "scope" "podLogs") | fromJsonArray }}
      {{- $openStack := (.Values.logs).openStack | default dict }}
      {{- $openStackCloud := $openStack.cloudName | default "" }}
      {{ $fileLog }}:
        include:
          {{- if $podLogInclude }}
          {{- range $podLogInclude }}
          - /var/log/pods/{{ . }}_*/*/*.log
          {{- end }}
          {{- else }}
          - /var/log/pods/*/*/*.log
          {{- end }}
        exclude:
          # Always exclude the agent's own logs to avoid a feedback loop.
          - /var/log/pods/{{ .Release.Namespace }}_{{ include "kubernetes-agent.fullname" . }}*/**/*.log
          {{- range $podLogExclude }}
          - /var/log/pods/{{ . }}_*/*/*.log
          {{- end }}
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          # Parse CRI log format
          - type: router
            id: get-format
            routes:
              - output: parser-docker
                expr: 'body matches "^\\{"'
              - output: parser-cri
                expr: 'body matches "^[^ Z]+ "'
              - output: parser-containerd
                expr: 'body matches "^[^ Z]+Z"'
          # Docker JSON log format
          - type: json_parser
            id: parser-docker
            output: extract-metadata-from-filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          # CRI log format
          - type: regex_parser
            id: parser-cri
            regex: '^(?P<time>[^ Z]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract-metadata-from-filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%L%j'
          # Containerd log format
          - type: regex_parser
            id: parser-containerd
            regex: '^(?P<time>[^ ^Z]+Z) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract-metadata-from-filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          # Extract k8s metadata from file path
          - type: regex_parser
            id: extract-metadata-from-filepath
            regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]+)\/(?P<container_name>[^\._]+)\/(?P<restart_count>\d+)\.log$'
            parse_from: attributes["log.file.path"]
          - type: move
            from: attributes.log
            to: body
          {{- if and (eq (include "kubernetes-agent.ebpfEnabled" .) "true") .Values.ebpf.logToTraceCorrelation }}
          # OBI's log enricher zeroes out the original stdout buffer with
          # NULs (then re-emits the enriched line separately), so each
          # intercepted write leaves a placeholder line of NULs/whitespace
          # in the container log file. Drop those — the real enriched
          # line still comes through.
          - type: filter
            id: drop-obi-nul-placeholder
            expr: 'body matches "^[\\x00\\s]*$"'
          # Log ↔ trace correlation. OBI re-emits enriched JSON log lines
          # with `{"trace_id": "...", "span_id": "..."}` fields injected.
          # Pre-filter on the substring so we only run JSON parse on lines
          # that have a chance of containing trace context; the default
          # branch skips straight to the next normal operator. We stash
          # the parsed JSON under `attributes._obi`, lift trace_id /
          # span_id onto the LogRecord, then drop the temp attribute.
          - type: router
            id: ebpf-trace-route
            routes:
              - output: parse-ebpf-trace-json
                expr: 'body matches "\"trace_id\""'
              {{- if eq (include "kubernetes-agent.logEnricherPlainText" .) "true" }}
              # A plain-text line OBI annotated (ebpf.logEnricher.plainText):
              # " trace_id=<32 hex> span_id=<16 hex>" at its end. A line with
              # a trace id alone (no span) is left as written: trace_parser
              # would fail on the empty span id on every such line.
              - output: parse-ebpf-trace-text
                expr: 'body matches " trace_id=[0-9a-f]{32} span_id=[0-9a-f]{16}\\s*$"'
              {{- end }}
            default: recombine-multiline
          - type: json_parser
            id: parse-ebpf-trace-json
            parse_from: body
            parse_to: attributes._obi
            on_error: send
            output: lift-obi-trace-context
          - type: trace_parser
            id: lift-obi-trace-context
            trace_id:
              parse_from: attributes._obi.trace_id
            span_id:
              parse_from: attributes._obi.span_id
            output: cleanup-obi-attrs
          - type: remove
            id: cleanup-obi-attrs
            field: attributes._obi
            output: recombine-multiline
          {{- if eq (include "kubernetes-agent.logEnricherPlainText" .) "true" }}
          # The plain-text form: split the annotation off the line, lift its
          # ids onto the LogRecord, and put the line back as the app wrote it.
          - type: regex_parser
            id: parse-ebpf-trace-text
            parse_from: body
            parse_to: attributes._obi_text
            regex: '^(?P<message>[\s\S]*?) trace_id=(?P<trace_id>[0-9a-f]{32}) span_id=(?P<span_id>[0-9a-f]{16})\s*$'
            on_error: send
            output: lift-obi-text-trace-context
          - type: trace_parser
            id: lift-obi-text-trace-context
            trace_id:
              parse_from: attributes._obi_text.trace_id
            span_id:
              parse_from: attributes._obi_text.span_id
            output: restore-obi-text-body
          - type: move
            id: restore-obi-text-body
            from: attributes._obi_text.message
            to: body
            output: cleanup-obi-text-attrs
          - type: remove
            id: cleanup-obi-text-attrs
            field: attributes._obi_text
            output: recombine-multiline
          {{- end }}
          {{- end }}
          # Container runtimes write one log entry per newline, so a multi-line
          # event (a Java/Python/Node/.NET stack trace, a pretty-printed JSON
          # blob) arrives as many separate records and renders as many separate
          # lines on the OneUptime Logs page. Recombine continuation lines back
          # into the record they belong to so each exception is a single log.
          # A line starts a new record unless it begins with whitespace or a
          # closing bracket/brace/paren, which covers stack frames and wrapped
          # structured output. source_identifier keys on the per-container log
          # file path so records from different pods/containers never merge.
          # This mirrors the recombine operator the Docker agent already ships.
          - type: recombine
            id: recombine-multiline
            output: {{ if $openStackCloud }}openstack-route{{ else }}move-stream{{ end }}
            combine_field: body
            combine_with: "\n"
            is_first_entry: 'body matches "^[^\\s\\}\\)\\]]"'
            source_identifier: attributes["log.file.path"]
            force_flush_period: 5s
            max_log_size: 1048576
          {{- if $openStackCloud }}
          # OpenStack's services, on a cluster that runs them (OpenStack-Helm,
          # Atmosphere, Red Hat's distribution). oslo.log writes a stack trace one
          # line at a time, each with a prefix of its own, which the step above
          # takes for new records, so this joins them. And these records say which
          # cloud they are of: OneUptime parses them when they arrive, and files
          # them under the cloud with this name. Pods in other namespaces skip it.
          - type: router
            id: openstack-route
            routes:
              - output: openstack-recombine
                expr: 'attributes.namespace in {{ $openStack.namespaces | default (list "openstack") | toJson }}'
            default: move-stream
          - type: recombine
            id: openstack-recombine
            output: openstack-cloud-name
            combine_field: body
            combine_with: "\n"
            is_first_entry: 'not ((body matches "^(?:\\x1b\\[[0-9;]*m)*(?:\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}\\.\\d{3} \\d+ )?(?:ERROR|TRACE|CRITICAL) [A-Za-z0-9_.-]+ " and not (body matches "^(?:\\x1b\\[[0-9;]*m)*(?:\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}\\.\\d{3} \\d+ )?[A-Z]+ [A-Za-z0-9_.-]+ (?:\\x1b\\[[0-9;]*m)*\\[(?:\\x1b\\[[0-9;]*m)*(?:-|None|req-)")) or body matches "^(?:[ \\t]+\\S|Traceback \\(most recent call last\\):|[A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception|Timeout|Refused|Failure)(?:: |$))")'
            source_identifier: attributes["log.file.path"]
            force_flush_period: 5s
            max_log_size: 1048576
          - type: add
            id: openstack-cloud-name
            field: resource["openstack.cloud.name"]
            value: {{ $openStackCloud | quote }}
            output: move-stream
          {{- end }}
          - type: move
            id: move-stream
            from: attributes.stream
            to: attributes["log.iostream"]
          - type: move
            from: attributes.namespace
            to: resource["k8s.namespace.name"]
          - type: move
            from: attributes.pod_name
            to: resource["k8s.pod.name"]
          - type: move
            from: attributes.container_name
            to: resource["k8s.container.name"]
          - type: move
            from: attributes.uid
            to: resource["k8s.pod.uid"]
          # Container runtimes (Docker, containerd, CRI-O) record no severity on
          # a log line, only the stream it was written to, so OTel LogRecords
          # would arrive at OneUptime with severity_number=0. A router rather
          # than regex_parser's on_error keeps this compatible with OTel
          # Collector v0.96.0, which a --reuse-values upgrade keeps.
          #
          # Derive a severity: the router hands each line to the FIRST reader
          # that knows where its format keeps the level.
          #
          #   1. parse-klog-severity. klog and glog (every Kubernetes
          #      component, cert-manager, ingress-nginx's controller) put the
          #      level in the first letter, glued to the date: "I1123
          #      19:09:25.286486 1 solver.go:104] ..." is INFO, W is WARN, E
          #      ERROR, F FATAL.
          #   2. add-exception-severity. What a runtime prints for an exception
          #      names no level but is an error: Python's "Traceback (most
          #      recent call last):", Java's "Exception in thread ..." and
          #      "Caused by: ...", .NET's "Unhandled exception.", Rust's "thread
          #      'main' panicked at ...", and a line that starts with an
          #      exception's class ("TypeError: ...",
          #      "java.lang.IllegalStateException: ..."). ERROR.
          #   3. add-warning-severity. Python's warnings module and Node's
          #      process warnings name a category, not a level: "/app/x.py:3:
          #      DeprecationWarning: ..." and "(node:1) [DEP0005]
          #      DeprecationWarning: ...". WARN.
          #   4. parse-numeric-severity. pino and bunyan write the level as a
          #      number among the top-level fields, {"level":30,...}: 10 TRACE,
          #      20 DEBUG, 30 INFO, 40 WARN, 50 ERROR, 60 FATAL.
          #   5. The formats that keep the level in a place of their own, each
          #      read there and nowhere else (issue #11226), so a word that is a
          #      level only in its own format ("System", "Fine", a "#") is read
          #      in no other line:
          #        parse-mongodb-severity  MongoDB's "s" (F E W I, D1 to D5);
          #        parse-cnpg-severity     CloudNativePG's wrapped PostgreSQL
          #                                record: its "error_severity", not
          #                                the wrapper's "level";
          #        parse-clef-severity     Serilog's compact JSON: "@l";
          #        add-clef-information    ...which writes no "@l" for
          #                                Information: INFO;
          #        parse-redis-severity    Redis's and Valkey's symbol: .
          #                                debug, - verbose, * notice, #
          #                                warning;
          #        parse-nest-severity     NestJS's ConsoleLogger, after its
          #                                locale's time;
          #        parse-logrus-severity   logrus with colours: TRAC, DEBU,
          #                                ERRO, FATA, PANI;
          #        parse-mysql-severity    MySQL 8's [System] and its others;
          #        parse-jul-severity      java.util.logging's FINEST to
          #                                CONFIG, in capitals before a colon;
          #        parse-sidekiq-severity  Sidekiq 7's "pid=1 tid=x INFO:";
          #        parse-php-severity      PHP's error log, "PHP Warning:  ";
          #        parse-gitea-severity    Gitea's [I], after its caller.
          #   6. parse-severity-from-body. A level word, believed only where a
          #      level sits, not merely because the word turns up in the line:
          #        LINE PREAMBLE. The word is on the first line and everything
          #        before it is preamble: punctuation, digits, word tokens that
          #        end on a structural delimiter (. ] = - : / | ) }), colour
          #        codes, and a time at the very start, read with its letters
          #        (RFC 3339's T and Z, a zone such as UTC or GMT, ctime's day
          #        and month, zerolog's 3:04PM). That is "[ERROR] ...",
          #        Monolog's "app.INFO: ...", hclog's
          #        "2026-11-23T18:58:14.670Z [INFO] ...", Python's "... - myapp
          #        - INFO - ..." and PostgreSQL's "2026-11-23 18:53:14.906 GMT
          #        [27] LOG:  ...". Prose is not: "Connection error, retrying"
          #        stops at "Connection ", a bare word followed by a space. The
          #        repetition is lazy, so the first word in preamble position
          #        wins.
          #        LEVEL FIELD. The word is the value of a level key anywhere in
          #        the line, quoted or not, after ":" or "=": level, lvl,
          #        severity, severity_text, levelname, level_name, log.level,
          #        log_level, hclog's @level, Serilog's @l. That is zap, logrus
          #        and slog JSON, and logfmt.
          #      The preamble is anchored, so it beats a level field further
          #      along the line. The words are the OTel names, PSR-3's and
          #      syslog's, and the ones formats write for them: PostgreSQL's LOG
          #      (in capitals only: "Log rotated" is prose), MySQL's Note,
          #      java.util.logging's SEVERE, .NET's trce, dbug and fail,
          #      zerolog's and Serilog's three letters (INF, WRN, ...), log15's
          #      eror, zap's DPanic.
          #   7. parse-slog-severity. Go's log/slog between its four names,
          #      level=ERROR+4 or "level":"INFO+2", where the general read found
          #      no level, so a line that one reads keeps that level.
          #   8. add-fallback-severity. A line nothing read, on stdout: INFO, as
          #      stdout is a program's ordinary output.
          # A line nothing read on STDERR gets no severity at all (the router's
          # default, severity-unspecified). stderr is where programs write their
          # diagnostics, every level of them: klog, zap's production config,
          # logrus, hclog, Python's logging and PostgreSQL write everything
          # there. So the stream says nothing about such a line's level. It used
          # to make one ERROR, which stored every unread INFO and WARN line on
          # stderr as an Error (issue #10972). OneUptime shows it as
          # Unspecified, and a severity filter keeps it, having no level to
          # compare.
          #
          # Every text a reader lifts MUST resolve in `severity-parser` below:
          # stanza's built-in preset knows only
          # trace/debug/info/warn/warning/error/err/fatal, and an unmapped text
          # leaves the record Unspecified. The patterns are linear in
          # JavaScript's backtracking engine as well as in RE2, since the
          # Kubernetes agent's API-mode tailer runs the same source there: a
          # time is read once, at the start of the line, and only the
          # colour-code token consumes an ESC.
          # Tests/Ops/ContainerAgentLogSeverity.test.js pins all of it over a
          # corpus of real lines (Tests/Ops/Utils/LogSeverityCorpus.js), prose
          # that must not be read included, and
          # Tests/Ops/agent-log-severity-behaviour.sh runs that corpus through
          # the real collector.
          - type: router
            id: severity-router
            routes:
              - output: parse-klog-severity
                expr: 'body matches "^([IWEF])\\d{4}(?:\\d{4})? \\d\\d:\\d\\d:\\d\\d\\.\\d{6} +\\d+ [^ :\\]]+:\\d+\\]"'
              - output: add-exception-severity
                expr: 'body matches "^(?:Traceback \\(most recent call last\\):|Exception in thread \"|Caused by: |Unhandled [Ee]xception[.:]|thread \\x27[^\\x27]*\\x27 panicked at |(?:[A-Za-z_$][\\w$]*\\.)*(?:[A-Z][\\w$]*)?(?:Error|Exception)(?::(?:\\s|$)|[\\r\\n]|$))"'
              - output: add-warning-severity
                expr: 'body matches "^(?:\\S+:\\d+: |\\(node:\\d+\\) (?:\\[[A-Z]+\\d+\\] )?)[A-Z][A-Za-z]*Warning: "'
              - output: parse-numeric-severity
                expr: 'body matches "^\\{(?:\"(?:[^\"\\\\]|\\\\.)*\":(?:\"(?:[^\"\\\\]|\\\\.)*\"|-?\\d+(?:\\.\\d+)?|true|false|null),)*?\"level\":([1-6]0)[,}]"'
              - output: parse-mongodb-severity
                expr: 'body matches "^\\{\"t\":\\{\"[$]date\":\"[^\"]*\"\\},\"s\":\"([FEWI]|D[1-5])\""'
              - output: parse-cnpg-severity
                expr: 'body matches "^\\{\"level\":\"[a-z]+\",\"ts\":\"[^\"]*\",\"logger\":\"postgres\",\"msg\":\"record\",.*?\"error_severity\":\"(DEBUG|LOG|INFO|NOTICE|WARNING|ERROR|FATAL|PANIC)\""'
              - output: parse-clef-severity
                expr: 'body matches "^\\{\"@t\":\"[^\"\\\\]*\",\"@mt?\":\"(?:[^\"\\\\]|\\\\.)*\",(?:\"@r\":\\[(?:\"(?:[^\"\\\\]|\\\\.)*\",?)*\\],)?(?:\"@i\":\"[0-9a-f]+\",)?\"@l\":\"(Verbose|Debug|Information|Warning|Error|Fatal)\""'
              - output: add-clef-information
                expr: 'body matches "^\\{\"@t\":\"[^\"\\\\]*\",\"@mt?\":\""'
              - output: parse-redis-severity
                expr: 'body matches "^\\d+:[CMSX] \\d\\d? [A-Z][a-z]{2} \\d{4} \\d\\d:\\d\\d:\\d\\d\\.\\d{3} ([.*#-]) "'
              - output: parse-nest-severity
                expr: 'body matches "^(?:\\x1b\\[[0-9;]*m)?\\[Nest\\] \\d+  - (?:\\x1b\\[[0-9;]*m)?[^\\x1b\\n]*?\\d(?: ?[AP]M)? (?:\\x1b\\[[0-9;]*m)? *(VERBOSE|DEBUG|LOG|WARN|ERROR|FATAL)(?:\\x1b\\[[0-9;]*m)? "'
              - output: parse-logrus-severity
                expr: 'body matches "^\\x1b\\[\\d+m(TRAC|DEBU|INFO|WARN|ERRO|FATA|PANI)\\x1b\\[0m\\[[^\\]\\n]*\\] "'
              - output: parse-mysql-severity
                expr: 'body matches "^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d\\.\\d{6}(?:Z|[+-]\\d\\d:\\d\\d) \\d+ \\[(System|ERROR|Warning|Note)\\] \\[MY-\\d{6}\\] "'
              - output: parse-jul-severity
                expr: 'body matches "^(FINEST|FINER|FINE|CONFIG): "'
              - output: parse-sidekiq-severity
                expr: 'body matches "^(?:\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d\\.\\d{3}Z )?pid=\\d+ tid=[a-z0-9]+(?: [a-z_]+=[^ =]+)* (DEBUG|INFO|WARN|ERROR|FATAL): "'
              - output: parse-php-severity
                expr: 'body matches "^PHP (Fatal error|Parse error|Recoverable fatal error|Warning|Notice|Deprecated):  "'
              - output: parse-gitea-severity
                expr: 'body matches "^\\d{4}/\\d\\d/\\d\\d \\d\\d:\\d\\d:\\d\\d(?:\\.\\d+)? (?:\\S+\\(\\) )?\\[([TDIWEF])\\] "'
              - output: parse-severity-from-body
                expr: 'body matches "(?i)(?:^(?:(?:\\x1b\\[[0-9;]*m)*(?:\\[(?:\\x1b\\[[0-9;]*m)*)?(?:\\d{4}-\\d\\d-\\d\\d[T ]\\d\\d:\\d\\d(?::\\d\\d(?:[.,]\\d+)?)?(?:Z|[+-]\\d\\d(?::?\\d\\d)?)?(?:[ \\t]+(?-i:UTC|GMT|CET|CEST|EET|EEST|WET|WEST|BST|IST|MSK|EST|EDT|CST|CDT|MST|MDT|PST|PDT|HST|AKST|AKDT|JST|KST|HKT|SGT|AEST|AEDT|ACST|ACDT|AWST|NZST|NZDT))?|(?-i:Mon|Tue|Wed|Thu|Fri|Sat|Sun) (?-i:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) +\\d\\d? \\d\\d:\\d\\d:\\d\\d(?:\\.\\d+)? \\d{4}|\\d\\d?:\\d\\d(?-i:AM|PM)))?(?:[^A-Za-z\"\\n\\x1b]|\\x1b\\[[0-9;]*m|[A-Za-z][A-Za-z0-9_]*[ \\t]*[.:=,/>|)}\\]-])*?|(?:^|[\\s,{\\[])\"?(?:@?(?:log[._]?level|severity_?text|severity|level_?name|level|lvl)|@l)\"?[ \\t]*[:=][ \\t]*\"?)(TRACE|TRCE|TRC|DEBUG|DBUG|DBG|VRB|INFORMATION|INFO|INF|NOTICE|NOTE|(?-i:LOG)|WARNING|WARN|WRN|EMERGENCY|EMERG|ALERT|CRITICAL|CRIT|ERROR|EROR|ERR|FAIL|SEVERE|DPANIC|FATAL|FTL|PANIC|PNC)(?:$|[\\s\\]:=,)\"}|>\\x1b]|/[A-Za-z][A-Za-z0-9_-]*\\])"'
              - output: parse-slog-severity
                expr: 'body matches "(?:^|[\\s{,])\"?level\"?[=:]\"?(DEBUG-[1-4]|DEBUG\\+[1-3]|INFO\\+[1-3]|WARN\\+[1-3]|ERROR\\+[1-7])(?:$|[\\s\",}])"'
              - output: add-fallback-severity
                expr: 'attributes["log.iostream"] != "stderr"'
            default: severity-unspecified
          # 1. klog and glog: the first letter is the level.
          - type: regex_parser
            id: parse-klog-severity
            regex: '^(?P<severity_text>[IWEF])\d{4}(?:\d{4})? \d\d:\d\d:\d\d\.\d{6} +\d+ [^ :\]]+:\d+\]'
            parse_from: body
            output: severity-parser
          # 2. An exception's header: an error, though it names no level.
          - type: add
            id: add-exception-severity
            field: attributes.severity_text
            value: ERROR
            output: severity-parser
          # 3. A Python or Node warning category: a warning.
          - type: add
            id: add-warning-severity
            field: attributes.severity_text
            value: WARN
            output: severity-parser
          # 4. pino and bunyan: a number among the top-level fields.
          - type: regex_parser
            id: parse-numeric-severity
            regex: '^\{(?:"(?:[^"\\]|\\.)*":(?:"(?:[^"\\]|\\.)*"|-?\d+(?:\.\d+)?|true|false|null),)*?"level":(?P<severity_text>[1-6]0)[,}]'
            parse_from: body
            output: severity-parser
          # 5. MongoDB's JSON: the "s" right after the time (F E W I, D1-D5).
          - type: regex_parser
            id: parse-mongodb-severity
            regex: '^\{"t":\{"[$]date":"[^"]*"\},"s":"(?P<severity_text>[FEWI]|D[1-5])"'
            parse_from: body
            output: severity-parser
          # 6. CloudNativePG wraps each PostgreSQL record in a line of its own
          #    manager, whose "level" says only that it logged one: the record's
          #    "error_severity" is the level.
          - type: regex_parser
            id: parse-cnpg-severity
            regex: '^\{"level":"[a-z]+","ts":"[^"]*","logger":"postgres","msg":"record",.*?"error_severity":"(?P<severity_text>DEBUG|LOG|INFO|NOTICE|WARNING|ERROR|FATAL|PANIC)"'
            parse_from: body
            output: severity-parser
          # 7. Serilog's compact JSON (CLEF): "@l" after the message.
          - type: regex_parser
            id: parse-clef-severity
            regex: '^\{"@t":"[^"\\]*","@mt?":"(?:[^"\\]|\\.)*",(?:"@r":\[(?:"(?:[^"\\]|\\.)*",?)*\],)?(?:"@i":"[0-9a-f]+",)?"@l":"(?P<severity_text>Verbose|Debug|Information|Warning|Error|Fatal)"'
            parse_from: body
            output: severity-parser
          # 8. ...which leaves "@l" out for Information.
          - type: add
            id: add-clef-information
            field: attributes.severity_text
            value: INFO
            output: severity-parser
          # 9. Redis and Valkey: a symbol after the time.
          - type: regex_parser
            id: parse-redis-severity
            regex: '^\d+:[CMSX] \d\d? [A-Z][a-z]{2} \d{4} \d\d:\d\d:\d\d\.\d{3} (?P<severity_text>[.*#-]) '
            parse_from: body
            output: severity-parser
          # 10. NestJS's ConsoleLogger: the level after its locale's time.
          - type: regex_parser
            id: parse-nest-severity
            regex: '^(?:\x1b\[[0-9;]*m)?\[Nest\] \d+  - (?:\x1b\[[0-9;]*m)?[^\x1b\n]*?\d(?: ?[AP]M)? (?:\x1b\[[0-9;]*m)? *(?P<severity_text>VERBOSE|DEBUG|LOG|WARN|ERROR|FATAL)(?:\x1b\[[0-9;]*m)? '
            parse_from: body
            output: severity-parser
          # 11. logrus with colours: four letters, then the time in brackets.
          - type: regex_parser
            id: parse-logrus-severity
            regex: '^\x1b\[\d+m(?P<severity_text>TRAC|DEBU|INFO|WARN|ERRO|FATA|PANI)\x1b\[0m\[[^\]\n]*\] '
            parse_from: body
            output: severity-parser
          # 12. MySQL 8's error log, [System] among its levels.
          - type: regex_parser
            id: parse-mysql-severity
            regex: '^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{6}(?:Z|[+-]\d\d:\d\d) \d+ \[(?P<severity_text>System|ERROR|Warning|Note)\] \[MY-\d{6}\] '
            parse_from: body
            output: severity-parser
          # 13. java.util.logging's lower levels, in capitals before a colon.
          - type: regex_parser
            id: parse-jul-severity
            regex: '^(?P<severity_text>FINEST|FINER|FINE|CONFIG): '
            parse_from: body
            output: severity-parser
          # 14. Sidekiq 7: the level after its pid, thread and job.
          - type: regex_parser
            id: parse-sidekiq-severity
            regex: '^(?:\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z )?pid=\d+ tid=[a-z0-9]+(?: [a-z_]+=[^ =]+)* (?P<severity_text>DEBUG|INFO|WARN|ERROR|FATAL): '
            parse_from: body
            output: severity-parser
          # 15. PHP's own error log line.
          - type: regex_parser
            id: parse-php-severity
            regex: '^PHP (?P<severity_text>Fatal error|Parse error|Recoverable fatal error|Warning|Notice|Deprecated):  '
            parse_from: body
            output: severity-parser
          # 16. Gitea: a letter in brackets, after its caller.
          - type: regex_parser
            id: parse-gitea-severity
            regex: '^\d{4}/\d\d/\d\d \d\d:\d\d:\d\d(?:\.\d+)? (?:\S+\(\) )?\[(?P<severity_text>[TDIWEF])\] '
            parse_from: body
            output: severity-parser
          # 17. A level word where a level sits.
          - type: regex_parser
            id: parse-severity-from-body
            regex: '(?i)(?:^(?:(?:\x1b\[[0-9;]*m)*(?:\[(?:\x1b\[[0-9;]*m)*)?(?:\d{4}-\d\d-\d\d[T ]\d\d:\d\d(?::\d\d(?:[.,]\d+)?)?(?:Z|[+-]\d\d(?::?\d\d)?)?(?:[ \t]+(?-i:UTC|GMT|CET|CEST|EET|EEST|WET|WEST|BST|IST|MSK|EST|EDT|CST|CDT|MST|MDT|PST|PDT|HST|AKST|AKDT|JST|KST|HKT|SGT|AEST|AEDT|ACST|ACDT|AWST|NZST|NZDT))?|(?-i:Mon|Tue|Wed|Thu|Fri|Sat|Sun) (?-i:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) +\d\d? \d\d:\d\d:\d\d(?:\.\d+)? \d{4}|\d\d?:\d\d(?-i:AM|PM)))?(?:[^A-Za-z"\n\x1b]|\x1b\[[0-9;]*m|[A-Za-z][A-Za-z0-9_]*[ \t]*[.:=,/>|)}\]-])*?|(?:^|[\s,{\[])"?(?:@?(?:log[._]?level|severity_?text|severity|level_?name|level|lvl)|@l)"?[ \t]*[:=][ \t]*"?)(?P<severity_text>TRACE|TRCE|TRC|DEBUG|DBUG|DBG|VRB|INFORMATION|INFO|INF|NOTICE|NOTE|(?-i:LOG)|WARNING|WARN|WRN|EMERGENCY|EMERG|ALERT|CRITICAL|CRIT|ERROR|EROR|ERR|FAIL|SEVERE|DPANIC|FATAL|FTL|PANIC|PNC)(?:$|[\s\]:=,)"}|>\x1b]|/[A-Za-z][A-Za-z0-9_-]*\])'
            parse_from: body
            output: severity-parser
          # 18. Go's log/slog between its four names: level=ERROR+4.
          - type: regex_parser
            id: parse-slog-severity
            regex: '(?:^|[\s{,])"?level"?[=:]"?(?P<severity_text>DEBUG-[1-4]|DEBUG\+[1-3]|INFO\+[1-3]|WARN\+[1-3]|ERROR\+[1-7])(?:$|[\s",}])'
            parse_from: body
            output: severity-parser
          # 19. Nothing read, on stdout: a program's ordinary output.
          - type: add
            id: add-fallback-severity
            field: attributes.severity_text
            value: INFO
            output: severity-parser
          # Promote the text onto the LogRecord, so OTel consumers see a real
          # severity_number. Each text is stored at the number OneUptime's
          # ingest stores the same word at (LOG_SEVERITY_NUMBER_BY_TEXT in
          # packages/Common/Types/Log/LogSeverity.ts, issue #11228), so a line
          # is stored the same way whether it comes through this agent or a
          # Fluent or OTLP sender: Tests/Ops/LogSeverityOneTable.test.js holds
          # this block to that table, number for number. Each alias is under one
          # level only: stanza reads this block as a map, in no set order.
          - type: severity_parser
            id: severity-parser
            parse_from: attributes.severity_text
            preset: default
            mapping:
              # .NET's trce, zerolog's TRC, logrus's TRAC, java.util.logging's
              # FINEST, Gitea's T; pino's 10. And Go's log/slog between its
              # names, at its level plus 9, as OpenTelemetry's slog bridge
              # numbers it.
              trace:
                - trce
                - trc
                - trac
                - finest
                - t
                - "10"
                - debug-4
              trace2:
                - debug-3
              trace3:
                - debug-2
              trace4:
                - debug-1
              # .NET's dbug, zerolog's DBG, Serilog's VRB and Verbose, NestJS's
              # VERBOSE, logrus's DEBU, java.util.logging's FINER, Gitea's D,
              # MongoDB's D1 to D5, Redis's "."; pino's 20.
              debug:
                - dbug
                - dbg
                - vrb
                - verbose
                - debu
                - finer
                - d
                - d1
                - d2
                - d3
                - d4
                - d5
                - "."
                - "20"
              # Redis's "-" (verbose, above its debug), java.util.logging's
              # FINE.
              debug2:
                - "-"
                - fine
                - debug+1
              # java.util.logging's CONFIG.
              debug3:
                - config
                - debug+2
              debug4:
                - debug+3
              # MySQL's Note and System, PostgreSQL's and NestJS's LOG,
              # zerolog's INF, .NET's and Serilog's Information; klog's I,
              # pino's 30.
              info:
                - note
                - system
                - log
                - inf
                - information
                - i
                - "30"
              # syslog's notice and Redis's "*" (its notice): INFO2, above INFO,
              # as Appendix B maps notice.
              info2:
                - notice
                - "*"
                - info+1
              info3:
                - info+2
              info4:
                - info+3
              # zerolog's WRN, Redis's "#", PHP's Deprecated; klog's W, pino's
              # 40.
              warn:
                - warning
                - wrn
                - "#"
                - deprecated
                - w
                - "40"
              warn2:
                - warn+1
              warn3:
                - warn+2
              warn4:
                - warn+3
              # log15's eror, logrus's ERRO, .NET's fail, java.util.logging's
              # SEVERE, PHP's Recoverable fatal error; klog's E, pino's 50.
              error:
                - err
                - eror
                - erro
                - fail
                - severe
                - recoverable fatal error
                - e
                - "50"
              # syslog's crit, and zap's DPanic (it panics only in development):
              # ERROR2.
              error2:
                - crit
                - dpanic
                - error+1
              # syslog's and PSR-3's alert: ERROR3, an error that asks for
              # action.
              error3:
                - alert
                - error+2
              error4:
                - error+3
              # A crash, or an application logger's top level: Python's and
              # .NET's critical, a panic (Go's, PostgreSQL's, logrus's PANI,
              # zerolog's PNC), logrus's FATA, PHP's Fatal error and Parse
              # error, syslog's emerg; zerolog's FTL; klog's F, pino's 60.
              fatal:
                - critical
                - panic
                - pnc
                - pani
                - fata
                - fatal error
                - parse error
                - ftl
                - emerg
                - emergency
                - f
                - "60"
                - error+4
              fatal2:
                - error+5
              fatal3:
                - error+6
              fatal4:
                - error+7
          # Remove the now-redundant attribute so the value is not duplicated as
          # an attribute beside the record's own severity.
          - type: remove
            id: remove-severity-attr
            field: attributes.severity_text
          # Nothing read, on stderr: the router's default, which leaves the
          # record with no severity. The end of the chain, after the cleanup.
          - type: noop
            id: severity-unspecified
      {{- end }}

    processors:
      {{- if .Values.kubeletstats.volumeMetrics.enabled }}
      # The volume series nobody reads, dropped before they leave the node
      # (issues #9644, #9842). The volume group reports every volume a pod
      # mounts, five series each, on every pod: its service account token,
      # and its configMap, secret and downwardAPI volumes. Those hold a few
      # small files on a memory-backed filesystem, so their capacity says
      # nothing about any disk, and they were most of the group's series.
      # Kept: a claim's volume (k8s.persistentvolumeclaim.name), an emptyDir
      # and a hostPath, which fill a node's disk, and every volume this
      # cannot name, among them a generic ephemeral volume's claim, which
      # OneUptime files under the claim its pod made, `<pod>-<volume>`.
      #
      # The receiver gives a volume k8s.volume.type from its pod's spec
      # (extra_metadata_labels above) for configMap, secret, downwardAPI,
      # emptyDir, hostPath and persistentVolumeClaim volumes. It gives a
      # projected or an `ephemeral:` volume none: collector 0.165.0 has no
      # case for either in its setResourcesFromVolume, and
      # opentelemetry-collector-contrib#52198 asks for `projected` and
      # `ephemeral`. So:
      #   - a volume typed `projected` is dropped by its type, whatever it is
      #     called, once the collector names it;
      #   - until then a projected token is told by its name: the service
      #     account token Kubernetes mounts in every pod
      #     (kube-api-access-<suffix>), and the tokens the EKS (IRSA, Pod
      #     Identity), Azure Workload Identity, Istio and Linkerd webhooks
      #     add. On such a collector a projected volume of any other name is
      #     still sent;
      #   - a volume typed `ephemeral` is a claim's, and is kept.
      #
      # Twice, once for each name a volume can go by (#10055): the receiver
      # names it k8s.volume.name and k8s.volume.type, and semantic
      # conventions now name them k8s.pod.volume.name and k8s.pod.volume.type
      # (semantic-conventions#4272), which the receiver is to follow,
      # perhaps sending both names for a while. A volume of either name, or
      # both, is dropped once, and kept by the same rules; it counts as typed
      # when either name types it, so a token's name drops only a volume no
      # name types.
      #
      # The same OTTL runs on collector 0.96.0, which --reuse-values keeps.
      # tests/volume-series-filter_test.yaml pins it, and
      # Tests/Ops/agent-volume-series-behaviour.sh runs it, on volumes named
      # both ways.
      filter/volume-series:
        error_mode: ignore
        metrics:
          metric:
            - 'resource.attributes["k8s.volume.name"] != nil and resource.attributes["k8s.persistentvolumeclaim.name"] == nil and (resource.attributes["k8s.volume.type"] == "configMap" or resource.attributes["k8s.volume.type"] == "secret" or resource.attributes["k8s.volume.type"] == "downwardAPI" or resource.attributes["k8s.volume.type"] == "projected" or (resource.attributes["k8s.volume.type"] == nil and resource.attributes["k8s.pod.volume.type"] == nil and IsMatch(resource.attributes["k8s.volume.name"], "^(kube-api-access-[a-z0-9]+|aws-iam-token|eks-pod-identity-token|azure-identity-token|istio-token|linkerd-identity-token)$")))'
            - 'resource.attributes["k8s.pod.volume.name"] != nil and resource.attributes["k8s.persistentvolumeclaim.name"] == nil and (resource.attributes["k8s.pod.volume.type"] == "configMap" or resource.attributes["k8s.pod.volume.type"] == "secret" or resource.attributes["k8s.pod.volume.type"] == "downwardAPI" or resource.attributes["k8s.pod.volume.type"] == "projected" or (resource.attributes["k8s.pod.volume.type"] == nil and resource.attributes["k8s.volume.type"] == nil and IsMatch(resource.attributes["k8s.pod.volume.name"], "^(kube-api-access-[a-z0-9]+|aws-iam-token|eks-pod-identity-token|azure-identity-token|istio-token|linkerd-identity-token)$")))'
      {{- end }}

      # kubelet CPU under the names OneUptime reads. The kubeletstats
      # receiver stopped sending k8s.node.cpu.utilization,
      # k8s.pod.cpu.utilization and container.cpu.utilization in collector
      # 0.125.0; the same measure (cores in use; from 0.161.0 averaged over
      # the interval between two scrapes) comes as *.cpu.usage. OneUptime's
      # ingest, Kubernetes pages, dashboards and monitors read the old names,
      # so the two processors below send them again, as 0.96.0 did:
      #   - k8s.node.cpu.utilization and k8s.pod.cpu.utilization as copies of
      #     k8s.node.cpu.usage and k8s.pod.cpu.usage, which are kept;
      #   - container.cpu.usage renamed to container.cpu.utilization (0.96.0
      #     sent no container.cpu.usage).
      # The filter drops the receiver's own *.cpu.utilization first, so the
      # same config also runs on 0.96.0 (which a --reuse-values upgrade
      # keeps): there the copies replace originals of the same value, and
      # there is no container.cpu.usage to rename. Both run first, so the
      # telemetry filters (filters.metrics) see the names OneUptime does.
      filter/cpu-utilization:
        error_mode: ignore
        metrics:
          metric:
            - 'name == "k8s.node.cpu.utilization" or name == "k8s.pod.cpu.utilization"'
      transform/cpu-utilization:
        error_mode: ignore
        metric_statements:
          - context: metric
            statements:
              - copy_metric(name="k8s.node.cpu.utilization", description="Node CPU utilization", unit="1") where name == "k8s.node.cpu.usage"
              - copy_metric(name="k8s.pod.cpu.utilization", description="Pod CPU utilization", unit="1") where name == "k8s.pod.cpu.usage"
              - set(description, "Container CPU utilization") where name == "container.cpu.usage"
              - set(unit, "1") where name == "container.cpu.usage"
              - set(name, "container.cpu.utilization") where name == "container.cpu.usage"

      # Pod-level telemetry stays pod-level. Since collector 0.118.0,
      # k8sattributes gives telemetry that names no container (here a pod's
      # own kubelet metrics, k8s.pod.* and k8s.volume.*) the container of a
      # pod that has only one, as k8s.container.name; 0.96.0 did not.
      # OneUptime's Kubernetes monitors read that attribute as the container
      # an alert is about ("Container x in pod y"), and it would split a
      # pod's rows. So the first marks what names neither a container nor a
      # container.id before k8sattributes runs, and the second takes back
      # the container name k8sattributes gave it, and the mark. A
      # container.id resolved to its name is kept: 0.96.0 did that too.
      transform/pod-level-mark:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(attributes["oneuptime.k8s.pod_level"], true) where attributes["k8s.container.name"] == nil and attributes["container.id"] == nil
      transform/pod-level-unmark:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - delete_key(attributes, "k8s.container.name") where attributes["oneuptime.k8s.pod_level"] == true
              - delete_key(attributes, "oneuptime.k8s.pod_level")

      # Enrich with K8s metadata
      {{ $k8sAttributes }}:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.node.name
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.container.name
          labels:
            - tag_name: k8s.pod.label.app
              key: app
              from: pod
            - tag_name: k8s.pod.label.app.kubernetes.io/name
              key: app.kubernetes.io/name
              from: pod
            {{- if eq (include "kubernetes-agent.openshift" .) "true" }}
            {{- include "kubernetes-agent.deploymentConfigPodLabel" . | nindent 12 }}
            {{- end }}
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      # Stamp with cluster name and default service name. Any keys under
      # .Values.oneuptime.labels are also stamped here as
      # `oneuptime.label.<key>=<value>` resource attributes — the OneUptime
      # ingest pipeline promotes those into project Labels.
      resource:
        attributes:
          - key: k8s.cluster.name
            value: {{ include "kubernetes-agent.clusterName" . | quote }}
            action: upsert
          - key: service.name
            value: {{ printf "kubernetes-agent-%s" (include "kubernetes-agent.clusterName" .) | quote }}
            action: upsert
          # Node identity. Every receiver in this collector reads
          # node-local data — /proc and /sys for hostmetrics, this node's
          # kubelet for kubeletstats and the cAdvisor scrape,
          # /var/log/pods for filelog — so the node this pod is scheduled
          # on owns all of it. kubeletstats stamps `k8s.node.name`
          # itself, but hostmetrics and the Prometheus cAdvisor scrape do
          # not, so without this every node's `system.*` series arrives
          # with no node attribution at all and all of them collapse into
          # one meaningless series. `insert` leaves a receiver-supplied
          # (or k8sattributes-resolved) value alone.
          #
          # It has to be `k8s.node.name`, not `host.name`: OneUptime keys
          # the k8s.node entity on k8s.cluster.name + k8s.node.name, and
          # it suppresses Host identity on any resource that already
          # carries a Kubernetes identity — so a `host.name` here would
          # populate no entity at all.
          - key: k8s.node.name
            value: "${env:NODE_NAME}"
            action: insert
          - key: oneuptime.agent.version
            value: {{ .Chart.AppVersion | quote }}
            action: upsert
          {{- if eq (include "kubernetes-agent.openshift" .) "true" }}
          {{- include "kubernetes-agent.distributionAttribute" (dict "action" "upsert") | nindent 10 }}
          {{- end }}
          {{- include "kubernetes-agent.oneuptimeLabels" (dict "labels" .Values.oneuptime.labels "action" "upsert") | nindent 10 }}
      {{- if eq (include "kubernetes-agent.openshift" .) "true" }}
      {{- include "kubernetes-agent.openshiftDetector" . | nindent 6 }}
      {{- end }}

      # Set service.name from deployment/statefulset/daemonset name when available
      transform:
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil and attributes["k8s.deployment.name"] != ""
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["k8s.statefulset.name"] != nil and attributes["k8s.statefulset.name"] != "" and attributes["k8s.deployment.name"] == nil
              - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["k8s.daemonset.name"] != nil and attributes["k8s.daemonset.name"] != "" and attributes["k8s.deployment.name"] == nil and attributes["k8s.statefulset.name"] == nil
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil and attributes["k8s.deployment.name"] != ""
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["k8s.statefulset.name"] != nil and attributes["k8s.statefulset.name"] != "" and attributes["k8s.deployment.name"] == nil
              - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["k8s.daemonset.name"] != nil and attributes["k8s.daemonset.name"] != "" and attributes["k8s.deployment.name"] == nil and attributes["k8s.statefulset.name"] == nil

      {{- if or (eq (include "kubernetes-agent.logFiltersEnabled" .) "true") (eq (include "kubernetes-agent.metricFiltersEnabled" .) "true") }}
      {{- include "kubernetes-agent.filterProcessor" (dict "root" . "signals" (list "logs" "metrics")) | nindent 6 }}
      {{- end }}

      batch:
        send_batch_size: 1024
        timeout: 10s

      # Memory ceiling for the collector. limit_mib / spike_limit_mib are
      # derived from the container memory limit
      # (.Values.logs.resources.limits.memory, wired into the DaemonSet at
      # templates/daemonset.yaml) so the limiter always trips *below* the
      # cgroup limit — otherwise the kernel OOMKills the pod before the
      # limiter can shed load. limit_mib ≈ 80% of the container limit,
      # spike_limit_mib ≈ 20% of limit_mib (OTel guidance). See the
      # `kubernetes-agent.memoryLimiter` helper.
      memory_limiter:
        {{- include "kubernetes-agent.memoryLimiter" (.Values.logs.resources.limits.memory | default "512Mi") | nindent 8 }}

    exporters:
      {{ $otlpHttp }}:
        endpoint: "{{ .Values.oneuptime.url }}/otlp"
        headers:
          x-oneuptime-token: "${env:ONEUPTIME_API_KEY}"
        # Bound how much un-exported telemetry can buffer in RAM when the
        # OneUptime backend is slow or unreachable. Without an explicit queue
        # and retry window the exporter falls back to the OTel defaults
        # (queue_size 1000, retry for up to 300s), which on this
        # memory-constrained DaemonSet pod can buffer past the container limit
        # and get the pod OOMKilled before memory_limiter / GOMEMLIMIT can
        # react (the original symptom: crashes on backend 502 /
        # context-deadline-exceeded). A small queue plus a short retry window
        # sheds (drops) excess logs during an outage instead of crashing; the
        # pod keeps running and resumes exporting when the backend recovers.
        # For zero-loss buffering across longer outages, swap this for a
        # file_storage-backed persistent queue (needs the file_storage
        # extension and a writable volume).
        sending_queue:
          enabled: true
          num_consumers: 5
          queue_size: 256
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s

    service:
      extensions:
        - health_check
      pipelines:
        metrics:
          receivers:
            - {{ $kubeletStats }}
            {{- if .Values.cadvisor.enabled }}
            - prometheus/cadvisor
            {{- end }}
            {{- if eq (include "kubernetes-agent.hostMetricsEnabled" .) "true" }}
            - {{ $hostMetrics }}
            {{- end }}
          processors:
            - memory_limiter
            {{- if .Values.kubeletstats.volumeMetrics.enabled }}
            # First: a dropped volume series costs nothing further down.
            - filter/volume-series
            {{- end }}
            # In this order: the filter clears the way for the copies.
            - filter/cpu-utilization
            - transform/cpu-utilization
            # Around k8sattributes: pod-level telemetry stays pod-level.
            - transform/pod-level-mark
            - {{ $k8sAttributes }}
            - transform/pod-level-unmark
            {{- if eq (include "kubernetes-agent.metricFiltersEnabled" .) "true" }}
            # After k8sattributes so namespace conditions can match; before
            # batch so dropped series never leave the node.
            - filter/telemetry
            {{- end }}
            - resource
            {{- if eq (include "kubernetes-agent.openshift" .) "true" }}
            - {{ $resourceDetection }}/openshift
            {{- end }}
            - transform
            - batch
          exporters:
            - {{ $otlpHttp }}
        {{- if $wantLogs }}
        logs:
          receivers:
            - {{ $fileLog }}
            {{- if .Values.auditLogs.enabled }}
            - {{ $fileLog }}/audit
            {{- end }}
          processors:
            - memory_limiter
            - {{ $k8sAttributes }}
            {{- if eq (include "kubernetes-agent.logFiltersEnabled" .) "true" }}
            # Severity is set by the receiver's operator chain above, so the
            # filter sees a real severity_number by the time it runs here.
            - filter/telemetry
            {{- end }}
            - resource
            {{- if eq (include "kubernetes-agent.openshift" .) "true" }}
            - {{ $resourceDetection }}/openshift
            {{- end }}
            - transform
            - batch
          exporters:
            - {{ $otlpHttp }}
        {{- end }}
{{- end }}
