{{- /*
With oneuptime.existingSecretName, every workload reads the key from that Secret instead.
The key is stored without the whitespace around it: one read from a file
(helm --set-file, Terraform's file()) usually ends in a newline, and every
workload sends the key in a header, where a newline can never go (#7337).
*/ -}}
{{- if not (include "kubernetes-agent.existingSecretName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubernetes-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-agent.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ toString (.Values.oneuptime.apiKey | default "") | trim | b64enc | quote }}
{{- end }}
