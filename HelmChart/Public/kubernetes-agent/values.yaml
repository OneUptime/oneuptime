# OneUptime Kubernetes Agent Configuration

# Preset for the kind of cluster you're installing into. Sets compatible
# defaults for log collection and security context — so you don't have to
# think about hostPath, Pod Security Standards, or which log collection mode
# to pick.
#
#   standard      — Self-managed, EKS (EC2), GKE Standard, AKS. hostPath
#                   is available, so logs are collected via a DaemonSet
#                   tailing /var/log/pods (lowest overhead).
#
#   gke-autopilot — GKE Autopilot. hostPath is blocked, so logs are
#                   collected via the Kubernetes API from a Deployment.
#                   A hardened security context is applied.
#
#   eks-fargate   — EKS Fargate. Same config as gke-autopilot (no host
#                   access, no DaemonSets on Fargate).
#
# If unset, "standard" is assumed. Individual values (logs.mode, etc.) can
# still be overridden explicitly — they always win over preset defaults.
preset: ""

# Required: Your OneUptime instance connection details
oneuptime:
  # URL of your OneUptime instance (e.g., https://oneuptime.example.com)
  url: ""
  # Telemetry ingestion key from OneUptime (Project Settings > Telemetry &
  # APM > Ingestion Keys). The agent sends it as the x-oneuptime-token
  # header, so a project API key (Settings > API Keys) does not work here.
  apiKey: ""
  # Optional: Auto-tag every record this agent emits with project Labels.
  #
  # Each key/value pair becomes a resource attribute of the form
  # `oneuptime.label.<key>=<value>`. The OneUptime ingest pipeline promotes
  # any attribute prefixed with `oneuptime.label.` into a project Label
  # named `<key>:<value>` and attaches it to the host, service, and
  # telemetry records that arrived with it — see
  # Common/Server/Utils/Telemetry/OneuptimeLabel.ts.
  #
  # Example:
  #   --set oneuptime.labels.team=payments \
  #   --set oneuptime.labels.env=production \
  #   --set oneuptime.labels.region=us-east-1
  #
  # Labels are matched case-insensitively against existing labels, so a
  # manually-created "Production" label is reused rather than duplicated.
  # Labels added in the OneUptime UI are never removed by the agent.
  labels: {}

# Required: Unique name for this cluster (used as k8s.cluster.name attribute).
#
# Enforced at render time — the chart refuses to install without it. This is not
# just a label: OneUptime folds k8s.cluster.name into the identity of every
# Kubernetes entity it derives, so it is the only thing separating this
# cluster's `worker-1` and `default` namespace from another cluster's. Two
# clusters installed without it are silently merged into one estate.
clusterName: ""

# Namespace filters — scoped rules for deciding which namespaces are observed.
#
# Each rule has an action (`include` or `exclude`), one or more namespace
# patterns, and the scopes it applies to. Patterns are full-name matches with
# `*` as the only wildcard: `team-*` matches `team-a` but not `my-team-a`.
# If a scope has any include rules, only matching namespaces are kept. Exclude
# rules are applied afterward and always win.
#
# Scopes map to where filtering can happen efficiently:
#
#   podLogs       — pod stdout/stderr only, at the filelog/API source. This does
#                   not affect Kubernetes events or audit logs.
#   ebpfDiscovery — OBI process discovery, before instrumentation. Excluding a
#                   namespace here stops both its eBPF traces and eBPF metrics.
#   metrics       — collector-side filter after Kubernetes metadata enrichment.
#                   Node/cluster metrics without a namespace are always kept.
#   traces        — collector-side filter after Kubernetes metadata enrichment.
#                   Applies to both eBPF and application-pushed OTLP spans.
#
# The default preserves the low-cost system-namespace behavior: kube-system
# pod logs are not opened and its workloads are not auto-instrumented, while
# ordinary pod/container metrics remain available.
namespaceFilters:
  rules:
    - action: exclude
      namespaces:
        - kube-system
      scopes:
        - podLogs
        - ebpfDiscovery

  # Example: stop duplicate pod logs from teams that ship logs directly while
  # retaining their eBPF traces, service-map metrics and pod metrics.
  # rules:
  #   - action: exclude
  #     namespaces: [kube-system]
  #     scopes: [podLogs, ebpfDiscovery]
  #   - action: exclude
  #     namespaces: [team-a, "team-b-*"]
  #     scopes: [podLogs]

# Telemetry filters — drop records at the agent, before export.
#
# These render into a `filter` processor placed after the metadata
# processors (so it can see k8s.namespace.name) and before `batch` (so a
# dropped record never occupies a batch slot or leaves the node). That
# makes this the cheapest place to cut volume: it saves egress, collector
# memory, and OneUptime ingest cost at once.
#
# It is also the least reversible place. A record dropped here is gone —
# there is no server-side copy to recover, and any monitor or dashboard
# that depends on it goes quiet. OneUptime's server-side Drop Filters
# (Logs → Settings → Drop Filters) and Metric Pipeline Rules
# (Metrics → Settings → Pipeline Rules) are the reversible alternative:
# they cost egress but can be changed after the fact without a redeploy.
#
# Cheaper still is not collecting at all — see `cadvisor.metricsAllowlist`
# and `kubeStateMetrics.metricsAllowlist`, which drop metrics at the
# receiver so they are never even parsed. Reach for those first when they
# cover your case; use this block for everything that spans receivers.
filters:
  logs:
    # Drop POD LOG records below this severity. "" (default) keeps
    # everything. One of: TRACE, DEBUG, INFO, WARN, ERROR, FATAL.
    #
    # `minSeverity: WARN` keeps WARN, ERROR and FATAL and drops INFO,
    # DEBUG and TRACE.
    #
    # Scope: pod logs only. Kubernetes events and resource specs are NOT
    # filtered by this — they are a low-volume, high-value signal that
    # arrives with no severity of its own, so a threshold would delete the
    # whole feed rather than trim it. Use the OneUptime dashboard's
    # server-side Drop Filters if you need to thin those out.
    #
    # Severity comes from the log line itself: the agent parses a level out
    # of the text ("[ERROR]", "WARN:", "level=info", ...). What happens to a
    # line with no recognisable level differs by log mode, because the two
    # modes have different information available:
    #
    #   daemonset — the container runtime records which stream each line came
    #     from, so an unlabelled line falls back to stderr→ERROR /
    #     stdout→INFO. An unlabelled stdout line is therefore treated as INFO
    #     and IS dropped by a WARN threshold.
    #
    #   api — the Kubernetes pods/log API merges stdout and stderr into one
    #     stream with no per-line marker, so that fallback is not available.
    #     Rather than guess, unlabelled lines are KEPT. This mode drops
    #     strictly less; it will never silently delete a stack trace it could
    #     not classify.
    minSeverity: ""
  metrics:
    # Allowlist. When non-empty, ONLY metrics whose name matches are sent;
    # everything else is dropped.
    #
    # This is a big hammer: it spans every receiver in the pipeline, so an
    # allowlist that forgets a metric silently removes the monitors built
    # on it. Prefer `exclude` unless you genuinely want a closed set.
    include: []
    # Denylist. Metrics whose name matches are dropped.
    # Applied on top of `include`, so exclude always wins.
    exclude: []
    # How `include` / `exclude` entries are matched:
    #   strict — the exact metric name.
    #   regexp — an RE2 regular expression, UNANCHORED: `system.cpu`
    #            matches `system.cpu.time` and anything containing it.
    #            Anchor it yourself (`^system\.cpu$`) when you mean exact.
    #            RE2 has no lookahead, so `^(?!x)` will not compile — use
    #            `include` to express "everything except".
    #
    # A pattern is compiled by the collector at STARTUP, not per record, so
    # an invalid one is not a filter that quietly misbehaves: the collector
    # refuses to start and CrashLoopBackOffs, taking that collector's LOGS
    # down with the metrics. Helm cannot compile RE2, so `helm upgrade` will
    # accept a bad pattern happily. Test a pattern before you roll it out.
    matchType: strict

# Trace sampling — keep a fraction of traces and drop the rest at the agent,
# before export.
#
# This is the one volume lever here that does not blind you. `filters` and
# `namespaceFilters` remove a CATEGORY of telemetry, so whatever they drop is
# gone from every trace forever. Sampling keeps every category and thins the
# population instead: the traces you do get are whole and representative,
# which is usually what you want from traces, where the hundredth identical
# /healthz span teaches you nothing the first one didn't.
#
# The decision is a hash of the trace ID, not a coin flip, so it is
# CONSISTENT: every span of a trace is kept or dropped together, by every
# collector that sees it. You get whole traces, not fragments — which is the
# thing that makes this safe to turn on. (OneUptime's server-side Trace Drop
# Filters sample per-span instead, so they thin spans rather than traces.
# Prefer this knob when you want traces you can actually read.)
#
# What sampling does NOT touch, and this is the point: the eBPF RED metrics —
# request rate, error rate, duration — are a METRICS family. OBI computes them
# from every request and they ride the metrics pipeline, which this sampler is
# not in. `percentage: 10` gives you a tenth of the traces and 100% accurate
# rate/error/latency, so the dashboards and monitors built on those metrics do
# not move.
#
# What it DOES touch, and you have to know this before you turn it on: anything
# OneUptime derives from the spans themselves scales down with the rate.
# Traces monitors on Span Count, and Exceptions monitors on Exception Count,
# count ingested spans — at `percentage: 10` they see a tenth of what they saw
# yesterday and a threshold tuned on the old volume simply stops firing, with
# no error anywhere. Retune those thresholds by the same factor when you set
# this. Error GROUPING degrades worse than linearly: a common exception still
# shows up, a rare one-off is more likely to vanish entirely than to appear a
# tenth as often.
sampling:
  traces:
    # Percentage of traces to KEEP, 0-100. 100 (default) keeps everything and
    # leaves the sampler out of the pipeline entirely, so an install that
    # never sets this renders exactly the config it renders today.
    #
    # 10 keeps a tenth. 0 keeps NONE — it is a real rate, not an off switch,
    # and it deletes every trace while the eBPF DaemonSet keeps running and
    # costing you. If you want no traces at all, `ebpf.enabled: false` is what
    # you actually want; if you want no traces but still want RED metrics and
    # the service map, keep eBPF on and set this to 0.
    #
    # Only applies when `ebpf.enabled` — the traces pipeline does not exist
    # otherwise, and spans reach the agent only through it.
    #
    # Fractions are allowed (0.5 keeps one trace in two hundred), but `--set`
    # cannot express them: Helm parses `--set ...percentage=0.5` as the STRING
    # "0.5" and the schema rejects it. Whole numbers are fine with `--set`;
    # for a fraction use `--set-json ...percentage=0.5` or a values file.
    #
    # Fractions have a FLOOR of about 0.0061. The sampler quantises the rate
    # into 16384 buckets (`uint32(percentage * 163.84)`), so anything smaller
    # rounds down to zero buckets and behaves exactly like `percentage: 0` —
    # every trace dropped, no error, collector healthy, RED metrics still
    # flowing to hide it. 0.01 (one in ten thousand) is the smallest value
    # that does what it says.
    #
    # Traces only, deliberately. The OTel sampler cannot sample metrics at
    # all. It can sample logs, but it draws its randomness from the trace ID,
    # and pod logs do not have one: on this collector version every
    # trace-ID-less record hashes to the same bucket, so a log rate would not
    # thin the feed — it would keep all of it or delete all of it, flipping on
    # the seed. That is a data-loss trap, so there is no `sampling.logs` here.
    # Thin logs with `filters.logs.minSeverity` and `namespaceFilters`, which
    # are precise about what they remove.
    #
    # One consequence of logs NOT being sampled: with
    # `ebpf.logToTraceCorrelation: true`, pod logs are stamped with the trace
    # ID of 100% of requests but only `percentage`% of the traces they point at
    # are kept. So roughly (100 - percentage)% of log records will show a trace
    # link that dead-ends. Trace → logs navigation is unaffected; it is only
    # logs → trace that can miss.
    percentage: 100
    # Seed for the trace-ID hash. Collectors that need to agree on which
    # traces to keep must share this value AND `percentage` — that is what
    # keeps a trace whole across two clusters, or across this agent and a
    # downstream gateway. Both default to the same everywhere, so multi-cluster
    # traces survive without touching this.
    #
    # Change it only to deliberately DECORRELATE two sampling tiers. Because
    # the decision is a threshold on the same hash, the same seed at different
    # rates NESTS: every trace that survives 10% also survives 50%, so a second
    # tier just re-picks the first tier's traces instead of drawing
    # independently. Different seeds make the draws independent.
    hashSeed: 22

# OTel Collector image configuration
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.96.0"
  pullPolicy: IfNotPresent

# Debug sidecar — drops a shell + network tools (curl, dig, nc, tcpdump, …)
# into the agent pods so you can `kubectl exec` in to troubleshoot.
#
# The collector images above are distroless (built FROM scratch): they ship
# ONLY the collector binary, so there is no /bin/sh, bash, or curl and you
# cannot `kubectl exec` into them. Enabling this injects a sidecar container
# (default: nicolaka/netshoot) into the metrics Deployment and the logs
# DaemonSet, and turns on shareProcessNamespace so that sidecar can see the
# collector's processes and /proc. The network namespace is already shared by
# every container in a pod, so a curl from the sidecar follows the exact same
# egress path — NetworkPolicy, DNS, proxy, TLS — that the collector uses:
#
#   kubectl exec -it <agent-pod> -c debug -- bash
#   curl -v "$ONEUPTIME_URL/otlp/v1/metrics"
#
# OFF by default. When enabled it adds an always-running container to every
# agent pod (extra resources + attack surface), so turn it on to reproduce an
# issue, then turn it back off. For a one-off you usually don't need this at
# all — prefer an ephemeral container, which leaves no permanent footprint:
#
#   kubectl debug -it <agent-pod> --image=nicolaka/netshoot \
#     --target=otel-collector -- bash
debug:
  enabled: false
  image:
    repository: nicolaka/netshoot
    tag: "v0.13"
    pullPolicy: IfNotPresent
  # Share the pod's PID namespace so the sidecar can see and inspect the
  # collector process (ps, /proc/<pid>/root, strace). The network namespace is
  # shared by all pod containers regardless, so curl already follows the
  # collector's egress path. Set false if your Pod Security policy forbids it.
  shareProcessNamespace: true
  # The sidecar idles on this command until you exec in (see the note in
  # _helpers.tpl). Overridable if you swap in an image without `sleep`.
  command: ["sleep", "infinity"]
  # curl/dig/nslookup need nothing special. ping/traceroute/tcpdump need raw
  # sockets — uncomment to grant them:
  #   securityContext:
  #     capabilities:
  #       add: ["NET_RAW", "NET_ADMIN"]
  securityContext: {}
  # The sidecar sits near-idle; it only does work while you're exec'd in.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Deployment (metrics + events collector) resource configuration
deployment:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 4Gi

# Control plane monitoring (etcd, API server, scheduler, controller manager)
# Disabled by default — enable for self-managed clusters.
# Managed K8s (EKS, GKE, AKS) typically don't expose control plane metrics.
controlPlane:
  enabled: false
  etcd:
    # Endpoints to scrape etcd metrics from
    endpoints:
      - https://localhost:2379/metrics
    # TLS configuration for etcd
    insecureSkipVerify: true
  apiServer:
    endpoints:
      - https://localhost:6443/metrics
    insecureSkipVerify: true
  scheduler:
    endpoints:
      - https://localhost:10259/metrics
    insecureSkipVerify: true
  controllerManager:
    endpoints:
      - https://localhost:10257/metrics
    insecureSkipVerify: true

# Pod log collection.
#
# Two modes are supported:
#
#   daemonset — (default) Runs an OTel Collector DaemonSet that tails pod
#     log files from /var/log/pods via a hostPath mount. Lower overhead and
#     works on most clusters, but hostPath is blocked on GKE Autopilot and
#     some other managed offerings.
#
#   api — Runs a single Deployment (the oneuptime-kubernetes-log-tailer image)
#     that streams logs via the Kubernetes API (pods/log endpoint). No
#     hostPath, no host access, fully GKE-Autopilot compatible. Scales well
#     up to a few thousand containers per replica; shard by namespace for
#     larger clusters.
#
#   disabled — no log collection at all (use if you ship logs another way).
logs:
  enabled: true
  # Leave empty to let the `preset` choose: "standard" -> daemonset,
  # "gke-autopilot" / "eks-fargate" -> api. Override explicitly if you know
  # what you want: "daemonset" | "api" | "disabled".
  mode: ""
  # Hybrid mode for clusters with Windows node pools. The DaemonSet collector
  # only runs on Linux nodes (its images are linux-only), so in daemonset log
  # mode pods on Windows nodes get no log collection. Enabling this runs the
  # API log tailer (configured under `api` below) ALONGSIDE the DaemonSet,
  # restricted to pods on Windows nodes — Linux pods keep the cheap node-local
  # file tailing, and the two collectors never ship the same line twice. No
  # effect in api mode (the tailer already covers every pod) or when logs are
  # disabled.
  #
  # Two caveats:
  #   - The restriction lives in the tailer image (NODE_OS_INCLUDE), which
  #     ships with the same OneUptime release as this chart. An OLDER tailer
  #     image ignores it and tails EVERY pod — silently shipping every Linux
  #     pod's logs twice. If `api.image.tag` pins a version, make sure it is
  #     no older than this chart's release; if a node may have cached a stale
  #     `release` tag, set `api.image.pullPolicy: Always` for the upgrade.
  #   - `filters.logs.minSeverity` drops lines with NO recognizable severity
  #     differently on the two paths: the DaemonSet sees the stdout/stderr
  #     marker on disk and assigns INFO/ERROR fallbacks (then filters), while
  #     the log API strips that marker, so the tailer errs toward KEEPING
  #     unrecognizable lines. Under a severity filter, Windows pods can ship
  #     more keyword-less lines than Linux pods.
  windowsPods:
    enabled: false
  # The OTel memory_limiter (templates/configmap-daemonset.yaml) and the
  # container's GOMEMLIMIT are derived from limits.memory — limit_mib is ≈80%
  # of it — so the limiter and Go GC always engage *before* the kernel
  # OOMKills the pod. Raising limits.memory gives the collector more headroom
  # on busy nodes and the limiter scales with it automatically; there's no
  # separate limiter knob to keep in sync. Keep requests.memory near
  # steady-state usage so the kubelet doesn't evict the pod under node memory
  # pressure (usage routinely runs above requests once logs/hostmetrics flow).
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi
  # Only used when mode == "api"
  api:
    image:
      repository: oneuptime/kubernetes-log-tailer
      # Leave empty to track `release` — the moving tag the release pipeline
      # republishes for every OneUptime version. Set this to a version
      # (e.g. "11.6.1") to pin. The chart's appVersion is not used as the
      # tag: the release pipeline does stamp the published chart with the
      # OneUptime version, but a render from a git checkout carries the
      # placeholder 1.0.0, and the chart is published before that version's
      # images are.
      tag: ""
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    # Batching and retry tuning. See KubernetesLogTailer/README.md for details.
    batchMaxRecords: 500
    batchMaxMs: 5000
    exportMaxRetries: 5
    sinceSecondsOnStart: 10
    logLevel: "info"

# Resource spec collection — pulls full K8s resource objects (pods, nodes,
# deployments, etc.) for displaying labels, annotations, env vars, status,
# and other details in the dashboard.
resourceSpecs:
  enabled: true
  interval: 300s  # How often to pull full resource specs (default: 5 minutes)
  vpa: false  # Enable VPA collection (requires VPA CRDs installed in the cluster)

# Collection intervals
collectionInterval: 30s

# Extra metrics from the kubelet that aren't enabled by default in the
# OTel `kubeletstats` receiver. Both groups run inside the existing
# DaemonSet collector — no new pods, no new scrapes — they just expand
# what kubeletstats reports.
#
# Separately, and with no flag, the chart always enables node and pod CPU
# usage in cores (`k8s.node.cpu.usage`, `k8s.pod.cpu.usage`), which
# kubeletstats also leaves off by default. The "High Node CPU Utilization"
# monitor divides `k8s.node.cpu.usage` by the node's allocatable CPU and
# never fires without it, so switching these groups off never removes it.
# To drop the series anyway, list them in `filters.metrics.exclude`.
kubeletstats:
  # Saturation metrics — container & pod CPU/memory expressed as a
  # percentage of request and limit. Enables the "Container CPU vs
  # Limit", "Container Memory vs Limit", "Container CPU/Memory Request"
  # saturation monitors.
  #
  # Enables 8 derived metric families (4 container-level, 4 pod-level)
  # from data the receiver already collects — no extra scrape. Always 0
  # when a pod has no request/limit set, so it's harmless on clusters
  # that don't use them.
  #
  # The receiver exposes request/limit utilization only at the
  # container and pod level — there is NO node-level
  # `k8s.node.*.request_utilization` metric in any kubeletstats version
  # (it's a pod-scheduling ratio, not a kubelet stat). Node request
  # saturation must be derived downstream from pod/container requests
  # vs. node allocatable (e.g. via kube-state-metrics).
  utilizationMetrics:
    enabled: true
  # Per-PVC disk usage (`k8s.volume.available`, `k8s.volume.capacity`).
  # Enables the "PVC Low Disk Space" monitor — running out of PVC space
  # is otherwise a silent killer.
  #
  # Emits one series per PVC per pod, which is bounded for most clusters
  # but can be substantial on stateful workloads (Kafka, databases) with
  # thousands of PVCs — turn off there if cardinality is a concern.
  volumeMetrics:
    enabled: true

# Scrape the kubelet's cAdvisor endpoint (`/metrics/cadvisor`) for the
# container-level metrics that the kubeletstats receiver doesn't
# translate: CFS throttling counters and OOM kill events. Runs as a
# Prometheus scrape in every DaemonSet collector, against its own node's
# kubelet (authorized by the nodes/metrics grant in templates/rbac.yaml).
#
# Enables: OOM Kills, High CPU Throttling, CPU Throttle Ratio monitors.
#
# cAdvisor exposes hundreds of metrics by default — `metricsAllowlist`
# drops everything except the named metrics at the receiver, so
# collector memory and the OneUptime metric store stay bounded.
cadvisor:
  enabled: true
  scrapeInterval: 30s
  # Keep this list tight. Each metric is kept per-container, so adding
  # one entry here multiplies cardinality by the cluster's container
  # count. Override via `--set-string` / `--set-json` if you need more.
  metricsAllowlist:
    - container_cpu_cfs_throttled_seconds_total
    - container_cpu_cfs_periods_total
    - container_oom_events_total

# Cluster-state metrics from kube-state-metrics (KSM). Powers the
# monitors that need to know *why* a pod is unhealthy, not just that
# it's unhealthy:
#
#   - CrashLoopBackOff (kube_pod_container_status_waiting_reason)
#   - ImagePullBackOff  (kube_pod_container_status_waiting_reason)
#   - Pods Stuck Terminating / Pending (kube_pod_status_phase)
#   - Pods Failing to Schedule (kube_pod_status_scheduled)
#   - Namespace ResourceQuota saturation (kube_resourcequota)
#
# **Off by default** because the `bundled` mode adds a Deployment to
# the chart's footprint. If you already run KSM elsewhere in the
# cluster, set `mode: external` and point `endpoint` at it instead.
kubeStateMetrics:
  enabled: false
  # "bundled"  — chart deploys a small KSM Deployment + Service.
  # "external" — chart only adds a Prometheus scrape job; you must
  #              provide `endpoint` pointing at your existing KSM.
  mode: bundled
  # Only used when mode == "external", where it is required. The URL of
  # your KSM's metrics endpoint, scraped where it points:
  #   - `https://` is scraped over TLS; `http://`, or no scheme at all, in
  #     plain HTTP.
  #   - A path other than /metrics is scraped at that path (a KSM published
  #     under an ingress prefix, say). No path means /metrics.
  # Credentials (user:password@), a query string and a fragment cannot be
  # carried into the scrape, so the chart refuses to render a URL that has
  # them instead of dropping them quietly.
  # An https endpoint has to present a certificate from a public CA: the
  # collector checks it against the CA bundle in its image, and there is no
  # setting yet to trust a private CA, skip the check, or send credentials
  # (so a KSM behind kube-rbac-proxy cannot be scraped).
  # Example: http://kube-state-metrics.kube-system.svc.cluster.local:8080/metrics
  endpoint: ""
  scrapeInterval: 30s
  # Which Kubernetes objects the bundled KSM watches. This is a hard
  # ceiling on `metricsAllowlist` below: KSM cannot emit a metric for an
  # object it never watched, so an allowlist entry outside this list
  # yields nothing — no error, no series. Broaden the two together.
  #
  # Adding a resource costs memory and CPU proportional to how many of
  # those objects your cluster has, which is why this is narrow by
  # default rather than KSM's "watch everything".
  #
  # Ignored when `mode: external` — there the allowlist alone applies,
  # since you own that KSM's own flags.
  #
  # Example — also chart deployment rollout health:
  #   --set-json 'kubeStateMetrics.collectResources=["pods","resourcequotas","deployments"]' \
  #   --set-json 'kubeStateMetrics.metricsAllowlist=["kube_pod_status_phase","kube_deployment_status_replicas_unavailable"]'
  collectResources:
    - pods
    - resourcequotas
  # Allowlist that gates which KSM metrics are forwarded to OneUptime.
  # KSM exports ~100 metric families by default; only keep the ones
  # that power monitors.
  #
  # Each entry is used as a prefix: `.*` is appended to it, so
  # `kube_pod_status` also keeps `kube_pod_status_phase`. Anchor by
  # writing the full name when you want just the one metric.
  #
  # In `bundled` mode an entry only produces series if its object is in
  # `collectResources` above.
  metricsAllowlist:
    - kube_pod_status_phase
    - kube_pod_status_scheduled
    - kube_pod_container_status_waiting_reason
    - kube_resourcequota
  # Bundled-mode KSM Deployment configuration. Ignored when
  # mode == "external".
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: "v2.13.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Kubernetes cost observability. Ships pre-priced workload cost
# allocations to OneUptime, where they power the cluster "Costs" pages
# and the Kubernetes Cost dashboard template.
#
# **One command**: `--set cost.enabled=true` is a complete install. The
# chart bundles the open-source OpenCost engine (Apache-2.0, CNCF) plus
# a minimal, dedicated Prometheus it needs for usage history — two small
# pods, invisible plumbing. OpenCost prices nodes/volumes from your
# cloud provider's public list prices automatically (no credentials);
# on-prem clusters can set `cost.opencost.customPricing` rates instead.
#
# Already running Kubecost or OpenCost? Set `cost.engine.url` to its
# Service and nothing is bundled — the chart just reads from it:
#
#   OpenCost:  http://opencost.opencost.svc.cluster.local:9003
#   Kubecost:  http://kubecost-cost-analyzer.kubecost.svc.cluster.local:9090
#
# Two collection paths, both driven by the same engine:
#
#   1. `cost.agent`   — a small Deployment that polls the engine's
#      Allocation API once per closed window (hourly by default) and
#      POSTs per-workload cost rows (cpu/ram/gpu/pv/network/idle,
#      efficiency) to OneUptime's /kubernetes-cost/ingest endpoint.
#      This is the source of record for the Costs UI.
#   2. `cost.metrics` — a Prometheus-receiver scrape of the engine's
#      /metrics (node_total_hourly_cost, container_cpu_allocation, ...)
#      through the existing OTLP pipeline, for charting raw cost
#      metrics in Metric Explorer and dashboards.
cost:
  enabled: false
  engine:
    # Base URL of an EXISTING cost engine. Empty (the default) bundles
    # OpenCost + a minimal Prometheus instead; setting it disables the
    # bundle and reads from your engine.
    #
    # `http://` or `https://`. The poller and the metrics scrape both follow
    # the scheme, and both verify an https engine's certificate against
    # public CAs only: there is no setting yet to trust a private one.
    url: ""
    # Allocation API path. Empty auto-detects by probing, in order:
    # /model/allocation (Kubecost), /allocation/compute (OpenCost),
    # /allocation (older OpenCost).
    allocationPath: ""
    # Prometheus the cost agent reads per-container memory PEAKS from,
    # which right-sizing needs and the Allocation API cannot give: engines
    # report averages, and an hourly mean hides the burst that OOMKills a
    # container.
    #
    # Empty (the default) resolves to the bundled Prometheus when the
    # engine is bundled, and to NOTHING when you point at an external
    # engine — set it explicitly in that case if you want memory
    # recommendations. Without it, CPU recommendations still work (they
    # come from stored hourly averages) and memory ones are unavailable.
    prometheusUrl: ""
    # Prometheus job label of the cAdvisor scrape. The bundled config uses
    # kubernetes-nodes-cadvisor; override when reusing your own Prometheus,
    # whose job will be named differently.
    prometheusCadvisorJob: ""
  # Bundled OpenCost engine. Deployed only when `cost.enabled` is true
  # and `cost.engine.url` is empty.
  opencost:
    image:
      repository: ghcr.io/opencost/opencost
      tag: "1.121.0"
      pullPolicy: IfNotPresent
    logLevel: info
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # Rate card for clusters whose nodes have no public cloud list
    # price (on-prem, bare metal, air-gapped). When enabled, OpenCost
    # prices every resource from these figures instead of a provider
    # API. All values are USD per resource-HOUR (the defaults are the
    # cost-model's GCP-us-central1-derived defaults: $0.031611/core-hr
    # ~= $23/core-month).
    customPricing:
      enabled: false
      cpuPerCoreHour: "0.031611"
      spotCpuPerCoreHour: "0.006655"
      ramPerGiBHour: "0.004237"
      spotRamPerGiBHour: "0.000892"
      gpuPerHour: "0.95"
      storagePerGBHour: "0.00005479452"
      zoneNetworkEgressPerGB: "0.01"
      regionNetworkEgressPerGB: "0.01"
      internetNetworkEgressPerGB: "0.12"
  # Minimal Prometheus for the bundled engine — OpenCost hard-requires a
  # PromQL endpoint for usage/price history; this one exists solely for
  # that. Single replica, short retention, scrapes exactly two targets
  # (cAdvisor via the API-server node proxy, and OpenCost itself — which
  # emits its own KSM-style request metrics, so no kube-state-metrics is
  # needed). Deployed only alongside the bundled engine; never scraped
  # into OneUptime and never reachable outside the cluster.
  prometheus:
    image:
      repository: quay.io/prometheus/prometheus
      tag: "v2.55.1"
      pullPolicy: IfNotPresent
    # The cost poller only queries recently-closed hourly windows, so a
    # few days is all this TSDB needs for spend alone. It is set to 7d
    # because right-sizing reads memory peaks back over a multi-day
    # lookback, and a window older than retention returns no peak at all —
    # the recommendation silently loses that day's evidence.
    retention: 7d
    scrapeInterval: 60s
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # Off by default: data sits in an emptyDir, so a pod restart loses a
    # few hours of usage/price history (the poller then ships smaller
    # allocations for those windows). Enable for a small PVC if that
    # matters to you.
    persistence:
      enabled: false
      size: 10Gi
      storageClass: ""
  # Allocation poller Deployment (oneuptime/kubernetes-cost-agent).
  agent:
    enabled: true
    image:
      repository: oneuptime/kubernetes-cost-agent
      # Leave empty to track `release` — the moving tag the release pipeline
      # republishes for every OneUptime version. Set this to a version
      # (e.g. "11.6.1") to pin.
      tag: ""
      pullPolicy: IfNotPresent
    # Allocation window length. Hourly is the engines' native ETL
    # resolution; a longer window loses granularity, a shorter one is
    # interpolated by the engine anyway.
    windowSeconds: 3600
    # How often to check whether a new closed window is ready.
    pollIntervalSeconds: 300
    # Wait after a window closes before querying it, so the engine has
    # finished pricing/reconciling it.
    engineSettleSeconds: 120
    # Closed windows to (re-)ship on startup. The server skips windows
    # that already have rows, so restarts cannot double-count.
    lookbackWindows: 2
    # Ship the engine's __idle__ allocation so idle spend is queryable.
    includeIdle: true
    # Currency code forwarded with every payload (informational).
    currency: USD
    logLevel: info
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  # Prometheus scrape of the engine's cost metrics through the
  # deployment collector's existing OTLP export.
  metrics:
    enabled: true
    # Metrics endpoint. Empty defaults to <cost.engine.url>/metrics.
    #
    # Set it when the engine serves its metrics somewhere else. It is a
    # URL and is scraped where it points: `https://` over TLS, and a path
    # other than /metrics at that path. As with kubeStateMetrics.endpoint,
    # a URL with credentials, a query string or a fragment is refused; so
    # is such a cost.engine.url while this is empty and stands in for it.
    endpoint: ""
    scrapeInterval: 60s
    # Exact-match allowlist — the engine exports many more series, and
    # per-container allocation metrics multiply cardinality by the
    # cluster's container count. Keep it tight.
    metricsAllowlist:
      - node_cpu_hourly_cost
      - node_gpu_hourly_cost
      - node_ram_hourly_cost
      - node_total_hourly_cost
      - container_cpu_allocation
      - container_gpu_allocation
      - container_memory_allocation_bytes
      - pod_pvc_allocation
      - pv_hourly_cost
      - kubecost_cluster_management_cost
      - kubecost_load_balancer_cost
      - kubecost_network_zone_egress_cost
      - kubecost_network_region_egress_cost
      - kubecost_network_internet_egress_cost

# Application traces & HTTP request metrics via OpenTelemetry eBPF
# Instrumentation (OBI — the upstream OpenTelemetry project that took over
# Grafana Beyla).
#
# Runs as a DaemonSet (one pod per node) that loads eBPF programs into the
# kernel and auto-instruments every supported runtime on the node — no code
# changes, no SDK, no sidecar. Captures HTTP/HTTPS, gRPC, and SQL/Redis
# calls from Go, .NET, Java, Node.js, Python, Ruby, and Rust workloads and
# ships them to OneUptime as OTLP traces plus RED-style request metrics.
#
# **Enabled by default.** Turn off with `--set ebpf.enabled=false` if you
# don't want auto-instrumentation, are already exporting traces via OTel
# SDKs, or are running on a kernel that doesn't support eBPF.
#
# Requirements:
#   - Linux kernel 5.8+ with BTF (default on Debian 11+, Ubuntu 20.10+,
#     Fedora 34+, RHEL/Stream 9+). Kernel 4.18+ also works on RHEL-family
#     distros with vendor backports.
#   - The DaemonSet runs in privileged mode so it can load eBPF programs.
#     If your cluster's Pod Security Standard rejects privileged pods (e.g.
#     GKE Autopilot, EKS Fargate), set `ebpf.enabled: false`.
ebpf:
  enabled: true
  image:
    repository: otel/ebpf-instrument
    # v0.14.0, for what changed since the v0.9.0 this chart used to run:
    #   - Node.js 26 and later are identified as Node.js (v0.14). Their
    #     binaries contain Rust code, and older OBI checked for Rust first, so
    #     it skipped its Node.js agent and their requests were not linked to
    #     the calls they make.
    #   - Redis replies to blocking commands (BullMQ's BZPOPMIN) are no longer
    #     parsed as new requests flowing the wrong way, which made a fake
    #     one-span "trace" named after the key (v0.11).
    #   - Go clients only get a `traceparent` injected when contextPropagation
    #     asks for it; v0.9.0 injected it regardless (v0.11).
    #   - service.peer.name is opt-in (v0.14); the chart selects it, see
    #     ebpf.extraSpanAttributes. The trace context the profiler reads is
    #     only kept when asked (v0.14); the chart asks when profiling is on,
    #     see profiling.obiProcessContext.
    #
    # Pinning back to v0.13.0 works: the v0.14-only span-attribute selection
    # is left out below v0.14.0, so that OBI keeps its own defaults.
    #
    # OBI is pre-1.0: read its release notes before moving this, and check
    # the feature names in kubernetes-agent.ebpfMetricsFeatures still exist —
    # OBI refuses to start on one it does not know.
    tag: "v0.14.0"
    pullPolicy: IfNotPresent
  # OBI's memory scales with the number of processes it instruments and the
  # traffic through them, so the busiest nodes (databases + app tier packed
  # together) need more headroom than a lightly-loaded node. 1Gi OOM-loops on
  # those — 2Gi gives the limit room; request raised so the scheduler accounts
  # for steady-state on heavy nodes. CPU also scales with process CHURN: on nodes
  # running short-lived-process workloads (e.g. Playwright/Firefox synthetic-probe
  # pods) OBI pegs a 1-core limit attaching/detaching uprobes, and a CPU-throttled
  # agent can stall the node's container runtime (containerd CRI calls time out →
  # pods stuck Init/Terminating). 2 cores gives headroom. If a node still OOMs or
  # pegs CPU, narrow what OBI attaches to via `autoTargetExe` / `excludeExePaths`
  # (the default already skips browser binaries) rather than raising this
  # unboundedly.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  # Scheduling controls. By DEFAULT the agent tolerates every taint (operator:
  # Exists) so the DaemonSet covers all nodes. To keep it OFF a tainted DB-only
  # pool — so it doesn't compete with or instrument the database tier — override
  # `tolerations` with a narrower list and/or set `nodeSelector` / `affinity`.
  # `kubernetes.io/os: linux` is always merged into the nodeSelector (keys set
  # here win on conflict) — eBPF needs a Linux kernel and the image is
  # linux-only, so Windows nodes (e.g. AKS Windows pools) are never scheduled.
  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}
  # Optional PriorityClass for the agent pods (empty = none).
  priorityClassName: ""
  # Comma-separated globs of executable paths to instrument. "*" means "every
  # process OBI can recognize". Set to a narrower list (e.g. "*/python,*/java")
  # if you only want specific runtimes. `*` matches across `/`, so `*/java`
  # matches /usr/bin/java and /opt/jdk/bin/java alike.
  #
  # How this reaches OBI: each entry becomes one `discovery.instrument` selector
  # in the OBI config file this chart renders (templates/configmap-ebpf.yaml).
  # OBI compiles a selector as ONE glob, in which a comma is a literal
  # character — so the list has to be split here, and is. (Earlier versions of
  # this chart passed the whole string to OTEL_EBPF_AUTO_TARGET_EXE unsplit,
  # where "*/python,*/java" matched nothing at all.)
  autoTargetExe: "*"
  # Comma-separated globs of executables to skip. Each entry becomes one
  # `discovery.exclude_instrument` selector in the OBI config file, next to
  # OBI's own built-in exclusions (itself, OTel collectors, kube-system and the
  # other system namespaces).
  #
  # (Earlier versions of this chart passed this list as
  # OTEL_EBPF_EXCLUDE_AUTO_TARGET_EXE, which is not an OBI setting — no OBI
  # release has read it — so NOTHING on it was ever excluded. OBI only reads
  # exclusions from its YAML config.)
  #
  # Defaults filter out:
  #   - Shell / coreutils noise (sh, bash, awk, sed, ...) so transient
  #     pod execs don't show up as one-off services.
  #   - Cluster plumbing (kubelet, kube-proxy, containerd, runc, dockerd,
  #     coredns, etcd) and the OBI/collector pods themselves.
  #   - Service-mesh data-plane sidecars (linkerd2-proxy, envoy,
  #     istio/pilot-agent) and CNI agents (cilium-*, calico-node,
  #     kube-router). Attaching uprobes to these binaries can stall or
  #     restart them — and most of them already export their own
  #     Prometheus metrics that the chart can scrape via
  #     `serviceMesh.enabled: true` instead.
  #   - Browser binaries (firefox, chrome, chromium, headless_shell, webkit,
  #     and Chrome's crash reporter chrome_crashpad_handler, which every
  #     Playwright browser launch spawns) so synthetic-monitoring / Playwright
  #     probe pods don't bury OBI in short-lived-process churn — a CPU-peg +
  #     container-runtime-stall risk on any node co-located with probes.
  #   - ClickHouse (clickhouse): its server binary runs a self-integrity
  #     checksum at startup and REFUSES to boot the instant OBI attaches a
  #     uprobe and patches its in-memory text — it aborts with "Calculated
  #     checksum of the executable does not correspond to the reference
  #     checksum" (CORRUPTED_DATA / Code 246) and crash-loops. OneUptime's own
  #     telemetry store IS ClickHouse, so leaving this un-excluded takes down the
  #     platform's database. DB servers are best observed via native metrics +
  #     client-side traces, not uprobes, so skip the binary outright.
  #
  # CAUTION when adding your own entries: each pattern is an "if matched,
  # skip" rule, so a broad glob like `*/proxy` will also exclude any of
  # YOUR own binaries named `*-proxy` (auth-proxy, oauth2-proxy, …) and
  # silently drop their traces. Prefer specific basenames over wildcards.
  # (Note: `*/node` is intentionally NOT excluded — it would drop traces for
  # every Node.js service, including your own apps; the browser basenames above
  # are what cover Playwright.)
  excludeExePaths: "*/sh,*/bash,*/dash,*/busybox,*/sleep,*/grep,*/awk,*/sed,*/ps,*/cat,*/find,*/runc,*/containerd*,*/dockerd,*/kubelet,*/kube-proxy,*/coredns,*/etcd,*/otelcol*,*/ebpf-instrument,*/obi,*/linkerd2-proxy,*/envoy,*/istio-pilot-agent,*/pilot-agent,*/cilium-agent,*/cilium-operator,*/cilium-envoy,*/calico-node,*/kube-router,*/firefox,*/firefox-bin,*/headless_shell,*/chrome,*/chrome_crashpad_handler,*/chromium,*/webkit,*/clickhouse"
  # OBI log level: debug, info, warn, error
  logLevel: "info"
  # Print spans to stdout in addition to OTLP export — useful for confirming
  # OBI is seeing traffic before you go look at the OneUptime dashboard.
  printTraces: false

  # Which signals OBI extracts from the captured traffic. Each maps to an
  # OBI "metrics feature" — disabling one drops that family of metrics but
  # leaves traces and the other families intact. All on by default.
  features:
    # HTTP/gRPC RED metrics (request rate, latency, errors) per service.
    # OBI emits `http.server.request.duration` and gRPC equivalents as
    # OpenTelemetry histograms. Maps to feature: `application`.
    httpMetrics: true
    # Span metrics: a call counter and a duration histogram per service,
    # span name (route or DB operation), span kind and status code —
    # `traces.span.metrics.calls` and `traces.span.metrics.duration`
    # (seconds). Maps to feature: `application_span_otel`. Earlier charts
    # asked for OBI's deprecated `application_span`, which names the same
    # series `traces_spanmetrics_calls_total` and
    # `traces_spanmetrics_latency`; a dashboard or monitor on those names
    # has to move to the new ones (README, "Upgrading").
    spanMetrics: true
    # Service graph metrics — for every observed caller→callee edge OBI
    # emits request rate and latency histograms, which power the service
    # map view. Maps to feature: `application_service_graph`.
    serviceGraph: true
    # No longer has any effect, and kept only so values files that set it
    # still install. It mapped to OBI's `application_host` feature, which
    # only ever emitted a host-info gauge (`traces_host_info`) — never the
    # per-process CPU and memory this used to promise — and which OBI v0.14
    # removed. Current OBI (since v0.11) refuses to start on a feature it
    # does not know, so the chart no longer passes it. Per-node CPU, memory, disk and network
    # metrics come from the top-level `hostMetrics` (the collector's
    # hostmetrics receiver), which is unrelated.
    hostMetrics: false
    # Pod-to-pod TCP/UDP network flow metrics — byte and packet counts
    # for every observed connection, with k8s pod/service/namespace
    # attributes. Maps to feature: `network`.
    networkMetrics: true
    # Inter-zone variant of `networkMetrics` — emits an extra metric
    # series keyed on k8s topology zone labels. Off by default: doubles
    # network-flow metric cardinality and only useful if you actually
    # use zone-based scheduling. Maps to feature: `network_inter_zone`.
    networkInterZoneMetrics: false
    # Node-level TCP statistics: RTT histograms, failed connection
    # counts, and retransmits. Aggregated across all processes on the
    # node, not per-service. Maps to features `stats_tcp_rtt`,
    # `stats_tcp_failed_connections` and `stats_tcp_retransmits` — not
    # `stats`, which in current OBI also turns on `stats_tcp_io` (a probe on
    # every TCP send and receive) and successful-connection counts.
    tcpStats: true

  # Distributed trace context propagation. OBI injects a W3C `traceparent`
  # into outbound requests so a call crossing pod A → pod B shows up as ONE
  # trace in the dashboard, with no SDK changes in either app.
  #
  # **OFF by default — opt in.** This matches OBI's own default
  # (`OTEL_EBPF_BPF_CONTEXT_PROPAGATION` is disabled upstream), and it is off
  # here because EVERY mode mutates traffic that is already in flight:
  #
  #   - For plaintext HTTP, OBI grows the outbound request buffer in place
  #     (`bpf_probe_write_user`) to fit the extra header.
  #   - For TLS and for raw TCP it appends a TCP option from a Linux Traffic
  #     Control hook, which means rewriting the packet and its checksum.
  #
  # Either way the kernel's byte accounting for that connection has to be
  # fixed up, and getting it wrong desynchronizes the stream rather than
  # dropping a span. Reported symptom when it goes wrong: transfers through
  # an L7 proxy (nginx) hang mid-body once the response exceeds the point
  # where the rewrite has to span segments (~64KB), holding the connection
  # open until it times out. Because the failure is per-connection and
  # size-dependent, it looks like an application or proxy bug, not like an
  # agent bug — it cost one user a three-week hunt.
  #
  # Turn it on deliberately, on a non-production cluster first, and leave it
  # off on any node whose traffic you cannot afford to have stall. Traces,
  # RED metrics, and the service map all still work without it; what you
  # lose is only the automatic stitching of spans across a service boundary
  # for apps that don't propagate `traceparent` themselves.
  #
  # There is NO kernel version at which turning this on is inert, so do not
  # rule the agent out as a suspect because a node is "too old". Kernel 5.17
  # buys `bpf_loop` for network-level header parsing; below it OBI silently
  # falls back to bounded-scan program variants and keeps rewriting traffic
  # exactly the same way. The gate that actually decides whether injection
  # happens is CAP_SYS_ADMIN plus the absence of kernel lockdown — and this
  # DaemonSet runs privileged, so that gate is always open. `tcp`/`all`
  # additionally load Traffic Control programs (CAP_NET_ADMIN); `headers`
  # loads none.
  contextPropagation: false
  # How OBI injects the `traceparent`. Maps directly to OBI's
  # `OTEL_EBPF_BPF_CONTEXT_PROPAGATION`. Only read when
  # `contextPropagation: true`.
  #
  #   headers — Write the `traceparent` into outgoing HTTP/1.1 request
  #     headers. Narrowest blast radius of the three, and the right starting
  #     point — but note it is NOT packet-free: for plaintext HTTP this is an
  #     in-place widening of the request buffer, and for HTTPS OBI cannot see
  #     the headers so it falls back to the TCP-option path anyway. HTTPS
  #     propagation only reaches other OBI-instrumented services and is
  #     broken by proxies and L7 load balancers in between.
  #
  #   tcp — Carry the context in a TCP option, injected via Linux Traffic
  #     Control. Covers non-HTTP and encrypted traffic OBI can't parse, but
  #     the option is connection-scoped, is frequently stripped by
  #     middleboxes and NATs, and has to chain correctly with any other TC
  #     program on the node (Cilium, Calico). Not used for gRPC.
  #
  #   all — Both `headers` and `tcp`. Most coverage, most traffic rewriting.
  #     Avoid in clusters running a service mesh: the TCP-option half
  #     corrupts bytes that linkerd2-proxy / envoy validate, which can make
  #     application pods fail or restart.
  #
  # (OBI also accepts `disabled`; use `contextPropagation: false` for that
  # instead. The legacy `ip` value was removed upstream and now does nothing
  # — this chart rejects it so a stale override fails loudly at install time
  # rather than silently disabling propagation.)
  contextPropagationMode: "headers"
  # Track HTTP request headers in kernel for traceparent extraction on
  # the receiving side via kprobes. Needed for propagation to work across
  # plain (non-Go, non-TLS) HTTP servers. Only takes effect if
  # `contextPropagation` is true.
  trackRequestHeaders: true

  # OBI's Node.js support. For a process OBI identifies as Node.js it sends
  # SIGUSR1, which opens Node's inspector on 127.0.0.1:9229 inside the pod's
  # network namespace, and injects a small agent that follows async context.
  # That agent is what makes a Node.js request's outgoing HTTP, SQL and Redis
  # calls children of the request instead of separate one-span traces — Node
  # runs every request on one thread, so the kernel alone cannot tell which
  # request a call belongs to. Maps to `OTEL_EBPF_NODEJS_ENABLED`. (Route
  # templates — "POST /api/items/:id" — do not come from this agent: OBI reads
  # them from the app's files whether it is on or not; see `routes` below.)
  #
  # The inspector is open only while the agent is injected — about a second,
  # a few on a loaded node — and closed again; it is never reachable from
  # outside the pod. Node itself prints that it was, so each app logs
  # "Debugger listening on ws://127.0.0.1:9229/…" and "Debugger attached." to
  # its stderr once, when OBI first finds it. That is this, not an intrusion.
  # OBI v0.14 also records its own requests to the inspector as the app's;
  # see dropNodeInspectorMetrics below.
  #
  # OBI skips the injection for a process that handles SIGUSR1 itself. Turn
  # this off if your security policy forbids an inspector socket in your pods,
  # even a brief loopback-only one; Node.js traces then keep working,
  # unlinked.
  nodejs:
    enabled: true

  # OBI stops exporting its own traces (and metrics) for a process once it
  # sees that process export OTLP itself — it watches the process's outgoing
  # requests for OTLP exports (e.g. to `*/v1/traces`) — so an app that already
  # has an OpenTelemetry SDK is not traced twice. Maps to
  # `OTEL_EBPF_EXCLUDE_OTEL_INSTRUMENTED_SERVICES` (OBI's default: true).
  #
  # Set false when those apps' SDKs report somewhere else — another OneUptime
  # project, another backend — and you want this cluster's project to have
  # eBPF traces for them too.
  excludeOtelInstrumentedServices: true

  # How OBI names HTTP spans. A span is named "<METHOD> <route>"; when the
  # route template is not known, OBI derives one from the URL path. OBI v0.14
  # knows the templates of Go (net/http, Gorilla mux, Gin), Java (Spring,
  # JAX-RS), Node.js (Express, Fastify, Koa, NestJS, Next.js), Python (Django,
  # FastAPI, Flask), Ruby (Rails), .NET (ASP.NET Core attribute routes) and PHP
  # (Symfony, Laravel, Slim) apps, read from the running app or its files.
  # Maps to OBI's `routes` config.
  routes:
    # Route templates to match URL paths against, e.g.
    # ["/api/items/{id}", "/otlp/v1/{signal}"]. A matching path gets that
    # route (and span name) verbatim. Use this for frameworks OBI cannot
    # harvest routes from.
    patterns: []
    # What to do with a path no pattern matches. "" keeps OBI's default
    # (`heuristic`: replace segments that look like ids with `*`). Others:
    # `low-cardinality` (heuristic, plus a cap on distinct routes),
    # `wildcard` (every unmatched route is `/**`), `path` (the raw path —
    # unbounded cardinality, avoid), `unset` (no route; the span is named
    # after the method alone).
    unmatched: ""

  # Span attributes to export beyond the ones the chart always asks OBI for.
  # Those are OBI's own default span attributes plus `service.peer.name`,
  # which OBI v0.14 made opt-in and which the service map uses to name the
  # service a call went to. (Asking OBI for any attribute replaces its
  # defaults, so the chart lists them too.) Add OBI's opt-in ones by name:
  #   - http.request.body.size, http.response.body.size — sent by default
  #     before OBI v0.14.
  #   - obi.http.response.observed
  #   - db.query.text — the full SQL or Redis command, including any literal
  #     values in it (personal data, tokens). Think before turning it on.
  # Entries are trimmed; blanks and repeats are dropped, and "*" is ignored:
  # it would turn on every optional attribute, db.query.text and gen_ai
  # prompt and completion payloads included. OBI matches entries as globs.
  # Maps to OBI's `attributes.select.traces.include`, which the chart only
  # renders for OBI v0.14 and later (ebpf.image.tag): older OBI has other
  # defaults and sends service.peer.name anyway.
  extraSpanAttributes: []

  # Drop eBPF database spans that are not part of any trace.
  #
  # OBI records a span for every database command it sees — on the client
  # that sends it AND on the database server that receives it. When the
  # command is made while handling a request, the client span is a child of
  # that request and shows up inside its trace. But most database traffic is
  # not like that, and each of these becomes a "trace" of exactly one span
  # named after the bare command — `set`, `evalsha`, `SELECT`. On a cluster
  # with a busy queue they are the large majority of everything OBI sends,
  # burying the request traces you actually want to read.
  #
  # Each switch makes the agent's collector drop one kind of eBPF database
  # span (`db.system.name` set). An application's database calls inside a
  # request trace are always kept. Only OBI's spans are considered —
  # spans that applications push to the agent's OTLP endpoint from their own
  # SDKs are never touched. Database RED metrics
  # (`db.client.operation.duration`, …) are computed by OBI before export, so
  # they still count every command.
  #
  # The span OBI records inside a database server (Valkey/Redis, PostgreSQL,
  # MySQL, MongoDB, ...), linked or not. It always duplicates the client span
  # the caller already recorded. Database wire protocols carry no trace
  # context, so when the caller runs on another node it is a trace of one;
  # when they share a node OBI links it under the call, which doubles every
  # database call in the request trace — and leaves it pointing at a missing
  # parent whenever dropUnlinkedDatabaseCalls drops the call it hangs from.
  # Nothing in OneUptime reads it.
  dropDatabaseServerSpans: true
  # An application's own database call that belongs to no trace: work no
  # request triggered — queue workers polling Redis (BRPOP / BZPOPMIN /
  # EVALSHA), connection-pool pings, cron jobs — and calls OBI could not
  # place in their request's trace.
  #
  # Trade-off: OneUptime discovers databases, and draws them on the service
  # map, from database client spans. A database that ONLY background work
  # talks to is then no longer discovered from traces (an existing entry
  # stops being seen and is eventually archived) and shows on the service
  # map as a remote endpoint rather than a database. Its metrics are
  # unaffected. Set false to keep these spans — and the one-span traces.
  dropUnlinkedDatabaseCalls: true
  # OBI's other client calls that belong to no trace: the HTTP, gRPC and
  # other calls (not database, messaging or GenAI calls) made by work no
  # request triggered — a worker querying ClickHouse over HTTP, a controller
  # renewing its Kubernetes lease, a poller, a monitor checking a website —
  # and calls OBI could not place in their request's trace, which look the
  # same. Each reaches OneUptime as a trace of one span named after the bare
  # request (`POST /`, `PUT /apis/*/...`).
  #
  # OFF by default, because the agent's collector decides span by span and
  # cannot see what hangs under a span, so dropping these costs data:
  #   - When the service a call went to runs on the same node and OBI traces
  #     it, OBI links the request it served under the call. With
  #     `contextPropagation` on, that happens on any node, and also when the
  #     service runs its own OpenTelemetry SDK, which reads the `traceparent`
  #     OBI injected. The call is then the root of a whole trace (a cron
  #     job's call into your API and everything the API did for it), and
  #     dropping it leaves that trace without its root: it no longer shows
  #     in the Traces list's root-span view, and the service map loses the
  #     traced edge between the two (OBI's service graph metrics still draw
  #     it, without latency). On the cluster this was measured on, with
  #     `contextPropagation` off, between one in twenty and one in ten of the
  #     calls this drops were such roots, depending on the hour; with it on,
  #     more are.
  #   - The service map reads these calls. A service or endpoint that only
  #     background work calls (an external API a worker syncs with) is then
  #     drawn from OBI's service graph metrics alone — under the name OBI gives
  #     it there, which for an address outside the cluster that OBI knows
  #     only by IP is `outgoing` — and an edge also seen inside requests
  #     counts only those calls: its rate, errors and latency describe the
  #     request traffic, not all of it.
  #   - A service's overview (Requests, Error rate, Latency p95) counts its
  #     spans. A worker, runner or probe whose spans are mostly these calls
  #     shows far fewer requests (none if it does nothing else), and its
  #     error rate and p95 then cover only the spans that are left.
  #   - Trace searches and trace monitors find none of these calls, failed
  #     ones included: the status does not matter.
  # Only OBI's spans are dropped, never spans your apps push from their own
  # SDKs, and only CLIENT spans without a parent. Database calls are
  # dropUnlinkedDatabaseCalls's business, and messaging calls (queue
  # discovery reads them) and GenAI calls, MCP ones included (LLM cost and
  # token figures come from them), are always kept. OBI's metrics are
  # unaffected: `http.client.request.duration`, `rpc.client.call.duration`
  # and the service graph counters still count every call.
  #
  # Only an explicit true turns it on: a key missing from your values (a
  # release upgraded with --reuse-values) counts as off.
  dropUnlinkedClientCalls: false

  # Drop the HTTP metrics OBI records for its own Node.js agent injection
  # (see `nodejs` above). OBI v0.14 starts tracing a Node.js process before
  # it injects the agent, so its own requests to the app's inspector —
  # GET /json/list (and GET /json/version when the inspector was already
  # open) and the WebSocket upgrade that follows, from 127.0.0.1 to port
  # 9229 — are counted as the app's: routes `/json/list`, `/json/version`
  # and `/*` (status 101) show up in its http.server.* request metrics.
  #
  # The agent's collector drops OBI's http.server.* datapoints for GET on
  # port 9229 with one of those routes (`/*` only when answered 101). A
  # datapoint carries no client address, so an app's own GET /json/list or
  # /json/version on port 9229, and its own WebSocket upgrades there that
  # OBI names `/*` (no route template), lose their datapoints too; set false
  # if that is yours. Those route names are OBI's default naming
  # (`routes.unmatched` heuristic): with another `routes.unmatched`, or a
  # `routes.patterns` entry that matches those paths, some or all of the
  # injection's datapoints are kept. Nothing is dropped with `nodejs.enabled`
  # false, since OBI then never injects.
  #
  # Only the http.server.* request metrics are filtered. OBI's span metrics
  # (`features.spanMetrics`) carry neither the port nor the HTTP status, so
  # they still count a GET /json/list call per injection (and a GET
  # /json/version for an app started with --inspect) and add the upgrade to
  # the app's GET /*. Spans are not this switch's business: OneUptime drops
  # the injection's traces itself on ingest, where the client address is
  # known.
  dropNodeInspectorMetrics: true

  # Log ↔ trace correlation. OBI's log enricher attaches a uprobe to
  # the `write()` syscall in every instrumented process, looks up the
  # active trace/span for the writing thread, and:
  #   - For JSON-format logs: re-emits the line with `trace_id` and
  #     `span_id` fields injected (existing fields are preserved).
  #   - For non-JSON logs: passes the line through unchanged.
  #
  # The filelog DaemonSet then lifts those fields onto the standard
  # OpenTelemetry LogRecord TraceId/SpanId slots, so clicking a span
  # in the trace view jumps to the logs from that request and vice
  # versa.
  #
  # **Off by default — opt in.** The feature is highly invasive
  # (uprobe on every `write()`, in-process buffer rewriting) and
  # incompatible with a small but common set of APM agents. Two
  # reasons to leave it off:
  #
  #   1. **LD_PRELOAD-based APM agents** — Dynatrace OneAgent
  #      (`liboneagentproc.so`), New Relic, AppDynamics, Datadog
  #      (`libdd*.so`), Instana. These wrap libc `write()` and hold
  #      pointers into the caller's stdout buffer. OBI's log
  #      enricher zeroes the original buffer with NULs (then
  #      re-emits the enriched line separately) — that buffer
  #      rewrite races with the APM agent's write wrapper and
  #      crashes the application process (typically SIGSEGV / exit
  #      139 in .NET workloads). It also stalls the APM agent's own
  #      watchdog `write()` calls past their liveness threshold,
  #      sending the agent into a restart loop.
  #
  #   2. **JSON logs are required** for `trace_id` to actually
  #      appear, and buffered-stdout runtimes need extra setup
  #      (`PYTHONUNBUFFERED=1` for Python,
  #      `Console.Out.AutoFlush = true` for .NET). Plain-text or
  #      buffered logs pass through unchanged, so the feature is
  #      silently useless for many apps.
  #
  # Enable explicitly when you've confirmed (a) no LD_PRELOAD APM
  # agent runs in the same pods (or you've scoped `logEnricher`
  # below to skip those pods), and (b) your apps emit JSON to
  # stdout. The other eBPF features (RED metrics, span metrics,
  # service graph, network metrics, context propagation) keep
  # working regardless of this setting.
  logToTraceCorrelation: false

  # Log enricher process selector. Only consulted when
  # `logToTraceCorrelation` is true. Each entry under `services`
  # matches one or more processes; OBI enables the log enricher
  # (and the `write()` uprobe + buffer rewrite) on every matched
  # process.
  #
  # Default `exe_path: "*"` matches every process OBI auto-discovers
  # — the broadest possible scope. Narrow it when you opt the
  # feature in, especially if any pods in the cluster run an
  # LD_PRELOAD-based APM agent (see the warning on
  # `logToTraceCorrelation` above).
  #
  # Each entry under `service:` is an OBI GlobAttributes selector
  # and accepts any of:
  #   - exe_path:            glob over the process executable path
  #   - languages:           comma-separated runtimes (go, java,
  #                          python, dotnet, ruby, nodejs, rust)
  #   - k8s_pod_labels:      map of pod-label glob matchers
  #   - k8s_pod_annotations: map of pod-annotation glob matchers
  #   - open_ports:          comma-separated ports / ranges
  #   - cmd_args:            glob over the process command line
  #
  # OBI ORs entries together (a process is enriched if it matches
  # ANY entry). Combine selectors inside a single `service:` block
  # to AND them.
  #
  # OBI does NOT support `exclude_services` on the log_enricher
  # block (only on `discovery`) — so you cannot express
  # "everything except X" directly. Instead, list positive
  # selectors that include only the workloads you want enriched.
  # Example scoping recipes:
  #
  #   # Enrich only pods labeled apm-agent=none
  #   logEnricher:
  #     services:
  #       - service:
  #           - k8s_pod_labels:
  #               apm-agent: "none"
  #
  #   # Enrich only Python and Go services (skip .NET where
  #   # Dynatrace LD_PRELOAD typically lives)
  #   logEnricher:
  #     services:
  #       - service:
  #           - languages: "python,go"
  #
  #   # Enrich everything in the 'analytics' namespace
  #   logEnricher:
  #     services:
  #       - service:
  #           - k8s_pod_labels:
  #               "kubernetes.io/metadata.name": "analytics"
  logEnricher:
    services:
      - service:
          - exe_path: "*"

# Continuous profiling via the OpenTelemetry eBPF Profiler.
#
# Runs as a DaemonSet (one pod per node) using a dedicated build of the
# OTel Collector — `otel/opentelemetry-collector-ebpf-profiler` — that
# bundles the official OpenTelemetry eBPF Profiler receiver. It samples
# CPU stacks on the host via perf events at ~19Hz, unwinds them for
# every supported runtime (Go, Java, .NET, Python, Ruby, Node, PHP,
# Perl, C/C++, Rust), and ships them as OTLP profiles directly to
# OneUptime. Click a slow trace → jump to the flame graph for that pod.
#
# Sent direct to OneUptime (not via the in-cluster collector) — the
# OneUptime-side collector that handles k8s metrics/logs/traces is on
# an older OTel Collector version that predates the OTLP profiles
# signal. The profiler image is 0.152.0 and exports natively.
#
# **Disabled by default.** Continuous profiling is heavier than the
# OBI auto-instrumentation (more CPU per node, larger memory footprint)
# and not everyone wants always-on flame graphs. Opt in with
# `--set profiling.enabled=true` when you want more telemetry.
#
# Requirements:
#   - Linux kernel 5.10+ (newer than the 5.8 OBI needs).
#   - Privileged pod with hostPID — same constraints as the eBPF
#     auto-instrumentation DaemonSet, so it lights up on the same
#     clusters and fails on the same ones (GKE Autopilot, EKS Fargate).
#   - Nodes whose hostPID is the kernel's root PID namespace, as any
#     VM or bare-metal node's is. The profiler looks a sample's process
#     up by its root-namespace PID in the node's /proc, with no
#     PID-namespace translation, so on nodes that are themselves
#     containers (KinD, k3d, container-based Docker Desktop nodes) it
#     attributes samples to the wrong processes and almost no sample
#     links to a span.
profiling:
  enabled: false
  image:
    repository: otel/opentelemetry-collector-ebpf-profiler
    tag: "0.152.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  # Sampling frequency in Hz. 19 is the upstream default — picked
  # because it doesn't align with common timer frequencies (avoids
  # accidentally sampling only one phase of a loop). Raise for more
  # detail at the cost of CPU; lower if the profiler itself shows up
  # heavy on the flame graphs.
  samplesPerSecond: 19
  # How often (seconds) batches of profiles are reported. 5s is the
  # upstream default.
  reporterInterval: "5s"
  # Off-CPU profiling threshold. 0 disables; values in (0, 1] enable
  # off-CPU profiling at the given sampling probability — useful for
  # diagnosing lock contention and blocking I/O, but adds tracepoint
  # overhead. Default off.
  offCpuThreshold: 0
  # Which language-specific tracers to load. Empty string means "all".
  # Narrow this (e.g. "go,python") if you only want specific runtimes.
  tracers: ""
  # If true, the profiler correlates CPU samples with OBI's trace
  # context via the shared bpffs map (`traces_ctx_v1`) — so flame
  # graphs carry trace_id/span_id and individual spans get their own
  # flame graph in the OneUptime UI. Requires `ebpf.enabled: true`.
  # With this and `profiling.enabled` on, the chart also sets
  # OTEL_EBPF_BPF_POPULATE_TRACE_CONTEXT=true on the eBPF DaemonSet: since
  # v0.14 OBI leaves that map empty unless asked, because keeping it
  # current costs a refresh on every async context switch of the
  # instrumented apps (on Node.js, a hook on every callback). Set false
  # to skip both the correlation and that cost.
  obiProcessContext: true

# Per-node OS-level metrics. The Kubernetes-aware `kubeletstats`
# receiver covers what Kubernetes itself knows (per-pod / per-container
# CPU, memory, network, filesystem), but it misses things that matter
# in production: disk I/O queue depth, filesystem inode usage, NIC
# error counters, paging, load average, etc. The OTel `hostmetrics`
# receiver fills those gaps by reading /proc and /sys directly.
#
# Runs inside the existing log-collector DaemonSet (which already has
# hostPath access to /var/log/pods on every node), so no extra pods.
# Every `system.*` series is stamped with the collecting node's
# `k8s.node.name`, so it groups and alerts per node exactly like the
# `kubeletstats` node metrics do.
hostMetrics:
  enabled: true
  # How often each node is scraped. Every scraper runs on this interval,
  # and every enabled scraper emits several series per node — so this is
  # the main lever on how many rows host metrics cost. Raise it (60s,
  # 120s) on large clusters where per-node OS metrics don't need 30s
  # resolution.
  collectionInterval: 30s

# Kubernetes API server audit logs. Captures every API request — who
# did what to which resource. Useful for security audits and
# "who deleted this StatefulSet at 3am" investigations.
#
# **Off by default.** Most managed Kubernetes platforms (EKS, GKE,
# AKS, DOKS) route the audit log to a cloud-provider sink, not to a
# file the agent can read. Enable on self-managed clusters where you
# control the API server config and have set `--audit-log-path` to a
# file under /var/log/kubernetes/.
auditLogs:
  enabled: false
  # File globs to tail. Defaults match the kubeadm convention.
  paths:
    - /var/log/kubernetes/audit.log
    - /var/log/kubernetes/audit-*.log

# CSI (storage driver) metrics. Most CSI drivers expose Prometheus
# metrics on a `:metrics` port (volume attach/detach latency,
# provisioning failures, IOPS, etc.) but each driver names the port
# differently. The chart auto-discovers driver pods labeled with
# `app.kubernetes.io/component: csi-driver` or `app: csi-driver` and
# scrapes their `metrics` port via the prometheus receiver's
# kubernetes_sd_configs.
#
# **Off by default.** Enable if you've installed a CSI driver that
# exposes Prometheus metrics. Most cloud-provider CSI drivers do.
csi:
  enabled: false
  scrapeInterval: 30s

# CoreDNS metrics. CoreDNS exposes Prometheus metrics on
# `:9153/metrics` by default (DNS query rate, latency, cache hits,
# error rates). Useful for diagnosing slow DNS resolution — a common
# silent killer of P99 latency.
#
# **Off by default** because you need to know the Service name; with
# the default settings it scrapes the kube-system/kube-dns Service
# which is the standard convention. Override if your cluster names
# its CoreDNS Service differently.
coreDns:
  enabled: false
  namespace: kube-system
  service: kube-dns
  port: 9153
  scrapeInterval: 30s

# Service mesh observability (Istio / Linkerd sidecar metrics)
serviceMesh:
  enabled: false
  # Supported providers: "istio", "linkerd"
  provider: "istio"
  istio:
    scrapeInterval: 15s
  linkerd:
    scrapeInterval: 15s

# Service account configuration
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Kubernetes AI agent — lets OneUptime AI run kubectl on this cluster.
#
# On by default, read-only. When an incident or alert is raised on this
# cluster, OneUptime AI investigates it. With the agent it also runs
# read-only kubectl the way an on-call engineer would (describe the failing
# pod, read its events, tail the crashing container's logs) and shows every
# command it ran. Fixes are a separate opt-in (aiAgent.remediation below).
#
# It is one small pod (oneuptime/kubernetes-ai-agent) that connects with this
# chart's oneuptime.apiKey and clusterName, so there is nothing to set up in
# the dashboard: the cluster's AI → Agent page shows it as Connected within a
# minute. An API key with a Pinned Service Name cannot register it. If it does
# not connect, its log says whether a refusal clears on its own or what to
# change:  kubectl logs -n <namespace> -l component=ai-agent --tail=100
# Self-hosted OneUptime: the agent needs a OneUptime server of this chart's
# version or newer, so upgrade the server first. It is not a OneUptime Runner,
# and not related to the "AI Agent" retired in OneUptime 12.
#
# Turn it off with --set aiAgent.enabled=false.
#
# What it may do is decided in two places:
#   * RBAC, here. Read-only by default: get/list/watch and pod logs,
#     cluster-wide. aiAgent.fixes (any level but off) adds the write verbs
#     fixes use: patch/update on Deployments, StatefulSets, DaemonSets, ReplicaSets
#     (and their scale subresource), Jobs, CronJobs, Pods and HPAs; create on
#     Jobs (`create job --from=cronjob/...`) and HPAs; delete on Pods and Jobs
#     only; and, with remediation.nodeOperations, cordon/uncordon/taint/drain
#     on nodes. Never secrets, exec, attach, port-forward, CRDs or RBAC writes.
#     Be clear about what write access is: patch/update on workloads, pods and
#     CronJobs (and create on Jobs) in a namespace is equivalent to running
#     any image as any ServiceAccount in that namespace and reading its
#     Secrets. So RBAC bounds WHERE the agent may write
#     (remediation.namespaces), not what a write may do.
#   * Policy, in OneUptime, re-checked by the agent before it runs kubectl.
#     It refuses changing which ServiceAccount, security settings, volumes,
#     command or Secret wiring a pod runs with (patches of host ports,
#     hostUsers or runtimeClassName, and patches that replace the pod spec or
#     a whole containers list, included), `expose --overrides`, Secret
#     objects, RBAC writes, exec, attach, apply and edit, in every mode. It
#     does not refuse changing an image: `set image` is a riskier change a
#     human approves unless the cluster bypasses approvals or its allowlist
#     names the command.
#     In every mode, a write in kube-system, kube-public or kube-node-lease (a
#     custom resource is judged by its namespace), a drain, a taint and a
#     patch of a node always wait for a human, and the agent never changes its
#     own namespace, anything outside remediation.namespaces, or a node when
#     remediation.nodeOperations is false. OneUptime refuses such a fix
#     already when it is proposed or approved.
#     How fixes run is set here, with aiAgent.fixes below: off;
#     ask-for-approval (a human approves the exact kubectl plan); automatic
#     (safe changes run on their own; a round that could only find riskier
#     fixes ends by proposing exactly those for one-click approval, and
#     otherwise a riskier fix waits for the follow-up round, which asks); or
#     bypass-approval (AI does not ask, except when the hourly circuit
#     breaker trips, when another unattended OneUptime AI round is still
#     changing or verifying the same cluster, or after a fix whose rollback
#     did not complete). The cluster's AI → Agent page shows it, with the
#     command that changes it. The chart README has the details.
#
# Let AI fix things too (list the namespaces it may change; each must
# already exist):
#   helm repo update
#   helm upgrade <release> oneuptime/kubernetes-agent -n <namespace> \
#     --reuse-values --set aiAgent.investigation=true \
#     --set aiAgent.fixes=ask-for-approval \
#     --set "aiAgent.remediation.namespaces={web,api}"
aiAgent:
  enabled: true
  # What OneUptime AI may do on this cluster. The cluster's AI → Agent page
  # shows these two and offers no way to change them there: change them
  # here. They are left unset on purpose. A release that sets neither lets
  # the agent use its defaults (investigation on; fixes ask-for-approval
  # when the deprecated aiAgent.remediation.enabled is true, else off), and
  # OneUptime applies those only to a cluster whose settings nobody chose on
  # its AI → Agent page — a default here would replace such a choice on
  # every upgrade that takes this chart's defaults.
  #
  # # AI runs read-only kubectl (get, describe, logs, events, top) while it
  # # investigates an incident or alert on this cluster. false: it still
  # # investigates, with the data OneUptime already has.
  # investigation: true
  #
  # # What AI does when it finds a fix: off (never proposes or runs a
  # # change; the agent stays read-only), ask-for-approval (a person approves
  # # the exact kubectl plan before it runs), automatic (safe changes run on
  # # their own, riskier ones ask) or bypass-approval (every change the
  # # policy allows runs on its own). Every level but off grants the agent
  # # the write RBAC described above, bound where remediation.namespaces
  # # says; off grants none. Quote it in a values file ("off"): YAML reads a
  # # bare off as false, which the chart also reads as off.
  # fixes: "off"
  image:
    repository: oneuptime/kubernetes-ai-agent
    # Leave empty to track `release` — the moving tag the release pipeline
    # re-points at every OneUptime version, like this chart's other OneUptime
    # images. Pin a OneUptime version (e.g. "14.1.0") to hold it. To use a
    # mirror, set repository (e.g. registry.example.com/oneuptime/kubernetes-ai-agent).
    tag: ""
    # Leave empty for Always while the tag is the moving `release` (so a node
    # that cached an older agent, and its policy re-check, never keeps running
    # it after an upgrade) and IfNotPresent for a pinned tag.
    pullPolicy: ""
  # Pull secrets for a private registry or mirror, e.g.
  #   imagePullSecrets:
  #     - name: my-registry-secret
  imagePullSecrets: []
  # The agent idles between commands; a kubectl call is a short burst.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # The keys below are left unset on purpose. A release that used the
  # previous aiAccess block keeps its aiAccess.remediation.* and
  # aiAccess.extraEnv until the matching aiAgent key is set; a default here
  # would silently replace them. Set them with --set as usual.
  #
  # remediation:
  #   # Deprecated: set aiAgent.fixes instead, which grants the same write
  #   # RBAC with every level but off. Read only while aiAgent.fixes is unset:
  #   # true grants write RBAC, and the agent's default fixes are then
  #   # ask-for-approval.
  #   enabled: false
  #   # Where the write role applies. List namespaces to bind it with one
  #   # RoleBinding in each and nowhere else; the agent refuses a write
  #   # outside the list before it runs kubectl, and OneUptime refuses it
  #   # already when it is proposed or approved. Every listed namespace must
  #   # already exist: the chart never creates one, so a missing one fails the
  #   # whole install or upgrade with `namespaces "<name>" not found`. This
  #   # release's own namespace may not be listed.
  #   # Empty binds it cluster-wide with a ClusterRoleBinding, which RBAC
  #   # cannot keep out of kube-system, kube-public, kube-node-lease or this
  #   # release's namespace: there the policy and the agent hold the line.
  #   # Under --reuse-values, leaving the flag out keeps a stored list; go back
  #   # to cluster-wide with --set-json 'aiAgent.remediation.namespaces=[]'
  #   # (not `={}`, which Helm reads as one empty name).
  #   namespaces: []
  #   # Node operations: cordon/uncordon/taint (patch on nodes) and drain
  #   # (create on pods/eviction), cluster-wide in a role of their own. A
  #   # drain, a taint or a patch of a node always waits for a human. Set
  #   # false to keep fixes off nodes: no node RBAC, and
  #   # ONEUPTIME_KUBECTL_ALLOW_NODE_OPERATIONS=false tells the agent to refuse
  #   # them before it runs kubectl.
  #   nodeOperations: true
  #
  # # Extra environment for the agent container, e.g. HTTPS_PROXY and
  # # NO_PROXY when the cluster reaches OneUptime through an egress proxy.
  # # Names the chart sets itself (ONEUPTIME_URL, ONEUPTIME_API_KEY,
  # # ONEUPTIME_KUBERNETES_CLUSTER_NAME, ONEUPTIME_KUBERNETES_AGENT_CHART_VERSION,
  # # ONEUPTIME_KUBECTL_ALLOW_WRITES, ONEUPTIME_KUBECTL_WRITE_NAMESPACES,
  # # ONEUPTIME_KUBECTL_ALLOW_NODE_OPERATIONS, ONEUPTIME_AI_AGENT_POD_NAMESPACE,
  # # ONEUPTIME_AI_INVESTIGATION, ONEUPTIME_AI_FIXES,
  # # HOME, KUBECACHEDIR, PORT) fail the render instead of silently replacing
  # # the chart's value. Unset, a stored aiAccess.extraEnv carries over; clear
  # # it with --set-json 'aiAgent.extraEnv=[]'.
  # extraEnv: []

# aiAccess (charts 14.0.2 to 14.0.8) is deprecated: use aiAgent. It stays in
# values.schema.json so releases that stored it still upgrade. The chart
# carries aiAccess.remediation.* and aiAccess.extraEnv over while the
# matching aiAgent key is unset, and ignores aiAccess.enabled, aiAccess.image
# and aiAccess.resources.
