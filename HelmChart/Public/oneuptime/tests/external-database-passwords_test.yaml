# The password of a database you run yourself, read from a file (#7911).
#
# People set externalPostgres.password, externalValkey.password and
# externalClickhouse.password from a file (helm --set-file, Terraform's
# file()), and such a file ends in a line ending. templates/secrets.yaml stored
# the password with it, and every pod reads its password from that Secret
# (DATABASE_PASSWORD, CLICKHOUSE_PASSWORD, VALKEY_PASSWORD and REDIS_PASSWORD,
# and pgbouncer's PGB_DB_PASSWORD), so the app presented "password\n", which
# the database refused, while the username beside it, read through
# oneuptime.envValue, worked.
#
# oneuptime.passwordValue stores it without that one line ending, "\n" or
# "\r\n", and otherwise exactly as written: unlike a key, a password may begin
# or end with a space on purpose, and the database knows it with that space.
#
# The built-in databases' passwords are left as they are: their server and the
# pods read the same Secret, so a password kept with a newline works, and the
# server keeps the password it started with. The cache's username and host go
# without the whitespace around them, as the Postgres and ClickHouse ones
# already did. Tests/Ops/HelmEnvValuesQuoted.test.js renders the whole chart
# and reads every pod's password through its secretKeyRef.
suite: passwords of the databases you run yourself
release:
  name: ou
  namespace: oneuptime
tests:
  # ---------------------------------------------------------------------------
  # Read from a file: stored without the file's line ending
  # ---------------------------------------------------------------------------
  - it: stores the external Postgres password without the newline of the file it was read from
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-postgres
    set:
      postgresql.enabled: false
      externalPostgres.host: db.example.com
      externalPostgres.password: "pg-password-from-a-file\n"
    asserts:
      - equal:
          path: stringData.password
          value: pg-password-from-a-file

  - it: stores the external ClickHouse password without the newline of the file it was read from
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-clickhouse
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
      externalClickhouse.password: "ch-password-from-a-file\n"
    asserts:
      - equal:
          path: stringData.password
          value: ch-password-from-a-file

  - it: stores the external Valkey password without the newline of the file it was read from
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-valkey
    set:
      valkey.enabled: false
      externalValkey.host: cache.example.com
      externalValkey.password: "valkey-password-from-a-file\n"
    asserts:
      - equal:
          path: stringData.password
          value: valkey-password-from-a-file

  - it: stores the password of externalRedis, the external cache's name until 13.0.0, the same way
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-valkey
    set:
      valkey.enabled: false
      externalRedis.host: cache.example.com
      externalRedis.password: "redis-password-from-a-file\n"
    asserts:
      - equal:
          path: stringData.password
          value: redis-password-from-a-file

  - it: takes off a Windows line ending, "\r\n", as one line ending
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-postgres
    set:
      postgresql.enabled: false
      externalPostgres.host: db.example.com
      externalPostgres.password: "pg-password-from-a-file\r\n"
    asserts:
      - equal:
          path: stringData.password
          value: pg-password-from-a-file

  - it: takes off one line ending only, as a file of two lines keeps its first line's
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-clickhouse
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
      externalClickhouse.password: "ch-password\n\n"
    asserts:
      - equal:
          path: stringData.password
          value: "ch-password\n"

  # ---------------------------------------------------------------------------
  # Everything else is kept as written
  # ---------------------------------------------------------------------------
  - it: keeps the spaces a password begins and ends with, which the database knows it by
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-postgres
    set:
      postgresql.enabled: false
      externalPostgres.host: db.example.com
      externalPostgres.password: "  a password with spaces  "
    asserts:
      - equal:
          path: stringData.password
          value: "  a password with spaces  "

  - it: keeps the spaces before the line ending of the file it was read from
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-valkey
    set:
      valkey.enabled: false
      externalValkey.host: cache.example.com
      externalValkey.password: "\tvalkey password \n"
    asserts:
      - equal:
          path: stringData.password
          value: "\tvalkey password "

  - it: keeps a line ending inside a password
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-clickhouse
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
      externalClickhouse.password: "first\nsecond"
    asserts:
      - equal:
          path: stringData.password
          value: "first\nsecond"

  - it: keeps the inside of a password as it is, quotes and YAML's syntax included
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-postgres
    set:
      postgresql.enabled: false
      externalPostgres.host: db.example.com
      externalPostgres.password: "*a: b #c 'd' \"e\" \\f\n"
    asserts:
      - equal:
          path: stringData.password
          value: "*a: b #c 'd' \"e\" \\f"

  - it: stores a password with no line ending exactly as it was stored before
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-postgres
    set:
      postgresql.enabled: false
      externalPostgres.host: db.example.com
      externalPostgres.password: clean-password
    asserts:
      - equal:
          path: stringData.password
          value: clean-password

  - it: stores a password YAML would read as a number as the text it is
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-clickhouse
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
      externalClickhouse.password: "123456"
    asserts:
      - equal:
          path: stringData.password
          value: "123456"

  - it: stores no password key when none is set, as before
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-external-postgres
    set:
      postgresql.enabled: false
      externalPostgres.host: db.example.com
    asserts:
      - notExists:
          path: stringData.password

  # ---------------------------------------------------------------------------
  # The pods read the stored password
  # ---------------------------------------------------------------------------
  - it: the app reads each external password from the Secret that stores it
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      postgresql.enabled: false
      clickhouse.enabled: false
      valkey.enabled: false
      pgbouncer.enabled: false
      externalPostgres.host: db.example.com
      externalPostgres.password: "pg-password-from-a-file\n"
      externalClickhouse.host: clickhouse.example.com
      externalClickhouse.password: "ch-password-from-a-file\n"
      externalValkey.host: cache.example.com
      externalValkey.password: "valkey-password-from-a-file\n"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ou-external-postgres
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ou-external-clickhouse
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ou-external-valkey
                key: password

  - it: pgbouncer reads the external Postgres password from the same Secret
    templates:
      - templates/pgbouncer.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      postgresql.enabled: false
      pgbouncer.enabled: true
      externalPostgres.host: db.example.com
      externalPostgres.password: "pg-password-from-a-file\n"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGB_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ou-external-postgres
                key: password

  # ---------------------------------------------------------------------------
  # The cache's username and host, without the whitespace around them, as the
  # Postgres and ClickHouse ones already were (oneuptime.envValue)
  # ---------------------------------------------------------------------------
  - it: connects to your own cache as the username and at the host without the newline of the file they were read from
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      valkey.enabled: false
      externalValkey.host: " cache.example.com\n"
      externalValkey.username: "oneuptime-user\n"
      externalValkey.password: "valkey-password\n"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_HOST
            value: cache.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_USERNAME
            value: oneuptime-user
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_USERNAME
            value: oneuptime-user

  - it: keeps the built-in cache's host and its default username
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_HOST
            value: ou-valkey-master.oneuptime.svc.cluster.local
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_USERNAME
            value: default

  - it: leaves an unset cache username empty, as it was
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      valkey.enabled: false
      externalValkey.host: cache.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_USERNAME
            value: ""

  # ---------------------------------------------------------------------------
  # The built-in databases keep their passwords as set
  # ---------------------------------------------------------------------------
  - it: leaves the built-in Postgres password as set, which its server started with
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-postgresql
    set:
      postgresql.auth.postgresPassword: "built-in-pg-password\n"
    asserts:
      - equal:
          path: stringData.postgres-password
          value: "built-in-pg-password\n"

  - it: leaves the built-in ClickHouse password as set
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-clickhouse
    set:
      clickhouse.auth.password: "built-in-ch-password\n"
    asserts:
      - equal:
          path: stringData.admin-password
          value: "built-in-ch-password\n"

  - it: leaves the built-in Valkey password as set
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: ou-valkey
    set:
      valkey.auth.password: "built-in-valkey-password\n"
    asserts:
      - equal:
          path: stringData.valkey-password
          value: "built-in-valkey-password\n"
