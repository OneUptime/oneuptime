# vapid.existingSecret: the VAPID private key, which signs every web push, read
# from a Secret the operator manages instead of from vapid.privateKey - so the
# key stays out of the values Helm stores with every revision, and out of the
# Git repository an Argo CD or Flux install renders from. So:
#   - every workload given VAPID_PRIVATE_KEY (oneuptime.env.runtime: app,
#     worker, telemetry writer, nginx, home, test server and the migrate Job)
#     reads it from that Secret, under privateKey unless
#     vapid.existingSecret.privateKeyKey names another key, and none of them
#     also renders it as a plain value;
#   - without it nothing changes: vapid.privateKey is a plain value, exactly as
#     before (HelmChart/Tests/suites/vapid-existing-secret.sh renders the whole
#     chart to hold that, and to check that no workload was missed);
#   - both set is refused, saying which one to clear;
#   - the public key and the subject stay plain values: every browser is given
#     the public key, so there is nothing to keep secret;
#   - the schema refuses a block of the wrong shape.
suite: VAPID private key from an existing Secret
release:
  name: oneuptime
  namespace: oneuptime
tests:
  # ---------------------------------------------------------------------------
  # app
  # ---------------------------------------------------------------------------
  - it: app reads the private key from vapid.privateKey when no Secret is named
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: &plainKey
      vapid:
        privateKey: private-key-123
    asserts: &plainKeyAsserts
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAPID_PRIVATE_KEY
            value: private-key-123
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAPID_PRIVATE_KEY
          any: true
          count: 1

  - it: app reads the private key from the operator's Secret, and never as a plain value too
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: &existingSecret
      vapid:
        existingSecret:
          name: oneuptime-vapid
    asserts: &existingSecretAsserts
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAPID_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-vapid
                key: privateKey
      # One VAPID_PRIVATE_KEY, and it has no plain value beside the Secret's.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAPID_PRIVATE_KEY
          any: true
          count: 1
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "VAPID_PRIVATE_KEY")].value

  - it: app renders an empty private key when neither is set, as it always did
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts: &noKeyAsserts
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAPID_PRIVATE_KEY
            value: null
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "VAPID_PRIVATE_KEY")].valueFrom

  - it: app reads the key privateKey when vapid.existingSecret.privateKeyKey is left empty
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: &emptyKeyName
      vapid:
        existingSecret:
          name: oneuptime-vapid
          privateKeyKey: ""
    asserts: *existingSecretAsserts

  # A render stops at the first template that fails, and helm-unittest
  # reports the error of that template only. So each refusal leaves its
  # workload the only one rendering oneuptime.env.runtime (app, nginx and the
  # migrate Job render by default); HelmChart/Tests/suites/vapid-existing-secret.sh
  # checks that helm template refuses the whole release.
  - it: app refuses privateKey and existingSecret together, and says which to clear
    templates:
      - templates/app.yaml
    set:
      vapid: &bothSet
        privateKey: private-key-123
        existingSecret:
          name: oneuptime-vapid
      nginx:
        enabled: false
      migrate:
        enabled: false
    asserts: &bothSetAsserts
      - failedTemplate:
          errorMessage: 'vapid.privateKey and vapid.existingSecret.name are both set. Set one of them: to read the VAPID private key from the Secret oneuptime-vapid, clear privateKey (--set vapid.privateKey="").'

  # ---------------------------------------------------------------------------
  # worker
  # ---------------------------------------------------------------------------
  - it: worker reads the private key from vapid.privateKey when no Secret is named
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *plainKey
      worker:
        enabled: true
    asserts: *plainKeyAsserts

  - it: worker reads the private key from the operator's Secret, and never as a plain value too
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *existingSecret
      worker:
        enabled: true
    asserts: *existingSecretAsserts

  - it: worker renders an empty private key when neither is set
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      worker:
        enabled: true
    asserts: *noKeyAsserts

  - it: worker reads the key privateKey when vapid.existingSecret.privateKeyKey is left empty
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *emptyKeyName
      worker:
        enabled: true
    asserts: *existingSecretAsserts

  - it: worker refuses privateKey and existingSecret together
    templates:
      - templates/worker.yaml
    set:
      vapid: *bothSet
      worker:
        enabled: true
      app:
        enabled: false
      nginx:
        enabled: false
      migrate:
        enabled: false
    asserts: *bothSetAsserts

  # ---------------------------------------------------------------------------
  # telemetry writer
  # ---------------------------------------------------------------------------
  - it: the telemetry writer reads the private key from vapid.privateKey when no Secret is named
    templates:
      - templates/telemetry-writer.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *plainKey
      telemetryWriter:
        enabled: true
    asserts: *plainKeyAsserts

  - it: the telemetry writer reads the private key from the operator's Secret, and never as a plain value too
    templates:
      - templates/telemetry-writer.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *existingSecret
      telemetryWriter:
        enabled: true
    asserts: *existingSecretAsserts

  - it: the telemetry writer renders an empty private key when neither is set
    templates:
      - templates/telemetry-writer.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      telemetryWriter:
        enabled: true
    asserts: *noKeyAsserts

  - it: the telemetry writer reads the key privateKey when vapid.existingSecret.privateKeyKey is left empty
    templates:
      - templates/telemetry-writer.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *emptyKeyName
      telemetryWriter:
        enabled: true
    asserts: *existingSecretAsserts

  - it: the telemetry writer refuses privateKey and existingSecret together
    templates:
      - templates/telemetry-writer.yaml
    set:
      vapid: *bothSet
      telemetryWriter:
        enabled: true
      app:
        enabled: false
      nginx:
        enabled: false
      migrate:
        enabled: false
    asserts: *bothSetAsserts

  # ---------------------------------------------------------------------------
  # nginx (the ingress gateway runs the same env helper)
  # ---------------------------------------------------------------------------
  - it: nginx reads the private key from vapid.privateKey when no Secret is named
    templates:
      - templates/nginx.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: *plainKey
    asserts: *plainKeyAsserts

  - it: nginx reads the private key from the operator's Secret, and never as a plain value too
    templates:
      - templates/nginx.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: *existingSecret
    asserts: *existingSecretAsserts

  - it: nginx renders an empty private key when neither is set
    templates:
      - templates/nginx.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts: *noKeyAsserts

  - it: nginx reads the key privateKey when vapid.existingSecret.privateKeyKey is left empty
    templates:
      - templates/nginx.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: *emptyKeyName
    asserts: *existingSecretAsserts

  - it: nginx refuses privateKey and existingSecret together
    templates:
      - templates/nginx.yaml
    set:
      vapid: *bothSet
      app:
        enabled: false
      migrate:
        enabled: false
    asserts: *bothSetAsserts

  # ---------------------------------------------------------------------------
  # home
  # ---------------------------------------------------------------------------
  - it: home reads the private key from vapid.privateKey when no Secret is named
    templates:
      - templates/home.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *plainKey
      home:
        enabled: true
    asserts: *plainKeyAsserts

  - it: home reads the private key from the operator's Secret, and never as a plain value too
    templates:
      - templates/home.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *existingSecret
      home:
        enabled: true
    asserts: *existingSecretAsserts

  - it: home renders an empty private key when neither is set
    templates:
      - templates/home.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      home:
        enabled: true
    asserts: *noKeyAsserts

  - it: home reads the key privateKey when vapid.existingSecret.privateKeyKey is left empty
    templates:
      - templates/home.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *emptyKeyName
      home:
        enabled: true
    asserts: *existingSecretAsserts

  - it: home refuses privateKey and existingSecret together
    templates:
      - templates/home.yaml
    set:
      vapid: *bothSet
      home:
        enabled: true
      app:
        enabled: false
      nginx:
        enabled: false
      migrate:
        enabled: false
    asserts: *bothSetAsserts

  # ---------------------------------------------------------------------------
  # test server (built by the shared oneuptime.deployment helper)
  # ---------------------------------------------------------------------------
  - it: the test server reads the private key from vapid.privateKey when no Secret is named
    templates:
      - templates/test-server.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *plainKey
      testServer:
        enabled: true
    asserts: *plainKeyAsserts

  - it: the test server reads the private key from the operator's Secret, and never as a plain value too
    templates:
      - templates/test-server.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *existingSecret
      testServer:
        enabled: true
    asserts: *existingSecretAsserts

  - it: the test server renders an empty private key when neither is set
    templates:
      - templates/test-server.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      testServer:
        enabled: true
    asserts: *noKeyAsserts

  - it: the test server reads the key privateKey when vapid.existingSecret.privateKeyKey is left empty
    templates:
      - templates/test-server.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *emptyKeyName
      testServer:
        enabled: true
    asserts: *existingSecretAsserts

  - it: the test server refuses privateKey and existingSecret together
    templates:
      - templates/test-server.yaml
    set:
      vapid: *bothSet
      testServer:
        enabled: true
      app:
        enabled: false
      nginx:
        enabled: false
      migrate:
        enabled: false
    asserts: *bothSetAsserts

  # ---------------------------------------------------------------------------
  # migrate Job (as a regular Job, and as the pre-upgrade hook)
  # ---------------------------------------------------------------------------
  - it: the migrate Job reads the private key from vapid.privateKey when no Secret is named
    templates:
      - templates/migrate-job.yaml
    documentSelector:
      path: kind
      value: Job
    set: *plainKey
    asserts: *plainKeyAsserts

  - it: the migrate Job reads the private key from the operator's Secret, and never as a plain value too
    templates:
      - templates/migrate-job.yaml
    documentSelector:
      path: kind
      value: Job
    set: *existingSecret
    asserts: *existingSecretAsserts

  # The operator's Secret exists before the release does, so the hook's pod -
  # which runs before the release's own resources are applied - can read it.
  - it: the migrate hook reads the private key from the operator's Secret too
    templates:
      - templates/migrate-job.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      <<: *existingSecret
      migrate:
        hook: true
    asserts: *existingSecretAsserts

  - it: the migrate Job renders an empty private key when neither is set
    templates:
      - templates/migrate-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts: *noKeyAsserts

  - it: the migrate Job reads the key privateKey when vapid.existingSecret.privateKeyKey is left empty
    templates:
      - templates/migrate-job.yaml
    documentSelector:
      path: kind
      value: Job
    set: *emptyKeyName
    asserts: *existingSecretAsserts

  - it: the migrate Job refuses privateKey and existingSecret together
    templates:
      - templates/migrate-job.yaml
    set:
      vapid: *bothSet
      app:
        enabled: false
      nginx:
        enabled: false
    asserts: *bothSetAsserts

  # ---------------------------------------------------------------------------
  # The Secret's name and key
  # ---------------------------------------------------------------------------
  - it: reads the key vapid.existingSecret.privateKeyKey names
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      vapid:
        existingSecret:
          name: web-push-keys
          privateKeyKey: vapid-private-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAPID_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: web-push-keys
                key: vapid-private-key

  - it: takes the Secret's name and key trimmed, as kubectl would have created them
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      vapid:
        existingSecret:
          name: "  oneuptime-vapid  "
          privateKeyKey: " vapid-private-key "
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAPID_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-vapid
                key: vapid-private-key

  - it: reads the key privateKey when vapid.existingSecret.privateKeyKey is only spaces
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      vapid:
        existingSecret:
          name: oneuptime-vapid
          privateKeyKey: "   "
    asserts: *existingSecretAsserts

  - it: reads the key privateKey when vapid.existingSecret.privateKeyKey is null
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      vapid:
        existingSecret:
          name: oneuptime-vapid
          privateKeyKey: null
    asserts: *existingSecretAsserts

  - it: quotes a Secret name YAML would otherwise read as something other than text
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      vapid:
        existingSecret:
          name: "true"
          privateKeyKey: "1234"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAPID_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: "true"
                key: "1234"

  # ---------------------------------------------------------------------------
  # What does not turn it on
  # ---------------------------------------------------------------------------
  - it: treats an empty Secret name as not configured
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      vapid:
        privateKey: private-key-123
        existingSecret:
          name: ""
    asserts: *plainKeyAsserts

  - it: treats a Secret name of only spaces as not configured
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      vapid:
        privateKey: private-key-123
        existingSecret:
          name: "   "
    asserts: *plainKeyAsserts

  - it: a key name alone, with no Secret named, changes nothing
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      vapid:
        privateKey: private-key-123
        existingSecret:
          privateKeyKey: vapid-private-key
    asserts: *plainKeyAsserts

  # helm upgrade --reuse-values renders the new chart with the old release's
  # values, which have no vapid.existingSecret at all.
  - it: renders values from before vapid.existingSecret, with no such block at all
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      vapid:
        privateKey: private-key-123
        existingSecret: null
    asserts: *plainKeyAsserts

  - it: does not count a private key of only spaces as set beside the Secret
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      vapid:
        privateKey: "   "
        existingSecret:
          name: oneuptime-vapid
    asserts: *existingSecretAsserts

  - it: names the trimmed Secret in the refusal
    templates:
      - templates/app.yaml
    set:
      vapid:
        privateKey: private-key-123
        existingSecret:
          name: "  web-push-keys  "
      nginx:
        enabled: false
      migrate:
        enabled: false
    asserts:
      - failedTemplate:
          errorMessage: 'vapid.privateKey and vapid.existingSecret.name are both set. Set one of them: to read the VAPID private key from the Secret web-push-keys, clear privateKey (--set vapid.privateKey="").'

  # ---------------------------------------------------------------------------
  # What stays as it is
  # ---------------------------------------------------------------------------
  - it: keeps the public key and the subject as plain values beside the Secret
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      vapid:
        publicKey: public-key-456
        subject: mailto:oncall@example.com
        existingSecret:
          name: oneuptime-vapid
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAPID_PUBLIC_KEY
            value: public-key-456
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAPID_SUBJECT
            value: mailto:oncall@example.com
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "VAPID_PUBLIC_KEY")].valueFrom

  - it: gives the e2e CronJob the public key only, never the private key
    templates:
      - templates/e2e-cron.yml
    set:
      cronJobs:
        e2e:
          enabled: true
      vapid:
        publicKey: public-key-456
        existingSecret:
          name: oneuptime-vapid
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: VAPID_PUBLIC_KEY
            value: public-key-456
      - notExists:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[?(@.name == "VAPID_PRIVATE_KEY")]

  - it: never gives a probe the private key
    templates:
      - templates/probe.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: *existingSecret
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "VAPID_PRIVATE_KEY")]

  - it: never gives the shared Runner the private key
    templates:
      - templates/runner.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *existingSecret
      runner:
        enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "VAPID_PRIVATE_KEY")]

  - it: never gives the global Runner the private key
    templates:
      - templates/global-runner.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: *existingSecret
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "VAPID_PRIVATE_KEY")]

  # ---------------------------------------------------------------------------
  # The schema
  # ---------------------------------------------------------------------------
  - it: refuses passwordKey, the key name other blocks use, so a misnamed key is not silently ignored
    templates:
      - templates/app.yaml
    set:
      vapid:
        existingSecret:
          name: oneuptime-vapid
          passwordKey: privateKey
    asserts:
      - failedTemplate:
          errorPattern: "passwordKey"

  - it: refuses a Secret named as a string in place of the block
    templates:
      - templates/app.yaml
    set:
      vapid:
        existingSecret: oneuptime-vapid
    asserts:
      - failedTemplate:
          errorPattern: "existingSecret"

  - it: refuses a Secret name that is not text
    templates:
      - templates/app.yaml
    set:
      vapid:
        existingSecret:
          name: 1234
    asserts:
      - failedTemplate:
          errorPattern: "name"

  - it: refuses a key name that is a list
    templates:
      - templates/app.yaml
    set:
      vapid:
        existingSecret:
          name: oneuptime-vapid
          privateKeyKey:
            - privateKey
    asserts:
      - failedTemplate:
          errorPattern: "privateKeyKey"
