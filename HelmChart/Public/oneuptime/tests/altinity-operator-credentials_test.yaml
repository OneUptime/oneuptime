# The Altinity operator's own ClickHouse user gets a password of the
# installation's own.
#
# The operator manages every ClickHouseInstallation with a user of its own,
# "clickhouse_operator". The bundled operator chart's Secret for it ships one
# password to every installation, so this chart renders that Secret itself
# (altinity-clickhouse-operator.secret.create is false), under the name the
# operator reads it by, with a random password, a stored one, or one set in
# values.
#
# helm-unittest renders without a cluster, so `lookup` finds nothing here:
# these cover the values and the generate path. What an upgrade keeps is the
# KinD-backed HelmChart/Tests/suites/secrets-lifecycle.sh.
suite: Altinity operator credentials
templates:
  - templates/secrets.yaml
release:
  name: oneuptime
  namespace: oneuptime
tests:
  - it: renders the operator's Secret under the name the operator reads it by, with a random password
    documentSelector:
      path: metadata.name
      value: oneuptime-altinity-clickhouse-operator
    set:
      clickhouseOperator.altinity.enabled: true
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.namespace
          value: oneuptime
      - equal:
          path: stringData.username
          value: clickhouse_operator
      - matchRegex:
          path: stringData.password
          pattern: "^[a-zA-Z0-9]{32}$"
      # Generated or stored, it survives an uninstall like the chart's other secrets.
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: never renders the password the operator chart ships to every installation
    documentSelector:
      path: metadata.name
      value: oneuptime-altinity-clickhouse-operator
    set:
      clickhouseOperator.altinity.enabled: true
    asserts:
      - notEqual:
          path: stringData.password
          value: clickhouse_operator_password

  - it: renders it on an upgrade without a cluster to look up, too
    documentSelector:
      path: metadata.name
      value: oneuptime-altinity-clickhouse-operator
    release:
      name: oneuptime
      namespace: oneuptime
      upgrade: true
    set:
      clickhouseOperator.altinity.enabled: true
    asserts:
      - matchRegex:
          path: stringData.password
          pattern: "^[a-zA-Z0-9]{32}$"

  - it: uses the password set in values
    documentSelector:
      path: metadata.name
      value: oneuptime-altinity-clickhouse-operator
    set:
      clickhouseOperator.altinity.enabled: true
      altinity-clickhouse-operator.secret.password: 9f3c1a7e5b2d4f6a8c0e1b3d5f7a9c2e
    asserts:
      - equal:
          path: stringData.password
          value: 9f3c1a7e5b2d4f6a8c0e1b3d5f7a9c2e

  - it: keeps a password YAML would mangle as it is
    documentSelector:
      path: metadata.name
      value: oneuptime-altinity-clickhouse-operator
    set:
      clickhouseOperator.altinity.enabled: true
      altinity-clickhouse-operator.secret.password: "key: value # not-a-comment"
    asserts:
      - equal:
          path: stringData.password
          value: "key: value # not-a-comment"

  - it: uses the username set in values
    documentSelector:
      path: metadata.name
      value: oneuptime-altinity-clickhouse-operator
    set:
      clickhouseOperator.altinity.enabled: true
      altinity-clickhouse-operator.secret.username: chop
    asserts:
      - equal:
          path: stringData.username
          value: chop

  - it: follows the operator chart's own name and namespace overrides
    documentSelector:
      path: metadata.name
      value: my-operator
    set:
      clickhouseOperator.altinity.enabled: true
      altinity-clickhouse-operator.fullnameOverride: my-operator
      altinity-clickhouse-operator.namespaceOverride: clickhouse-system
    asserts:
      - equal:
          path: metadata.namespace
          value: clickhouse-system

  - it: follows the operator chart's nameOverride as its own fullname helper does
    documentSelector:
      path: metadata.name
      value: oneuptime-chop
    set:
      clickhouseOperator.altinity.enabled: true
      altinity-clickhouse-operator.nameOverride: chop
    asserts:
      - isKind:
          of: Secret

  - it: takes the release name alone when it already names the operator chart
    documentSelector:
      path: metadata.name
      value: my-altinity-clickhouse-operator-release
    release:
      name: my-altinity-clickhouse-operator-release
      namespace: oneuptime
    set:
      clickhouseOperator.altinity.enabled: true
    asserts:
      - isKind:
          of: Secret

  - it: renders no operator Secret when the operator is not enabled
    set:
      clickhouseOperator.altinity.enabled: false
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: oneuptime-altinity-clickhouse-operator
          any: true
        not: true

  - it: leaves the Secret to the operator chart when secret.create is turned back on with a password
    set:
      clickhouseOperator.altinity.enabled: true
      altinity-clickhouse-operator.secret.create: true
      altinity-clickhouse-operator.secret.password: 9f3c1a7e5b2d4f6a8c0e1b3d5f7a9c2e
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: oneuptime-altinity-clickhouse-operator
          any: true
        not: true

  - it: refuses secret.create turned back on with no password, which would leave the operator's user without one
    set:
      clickhouseOperator.altinity.enabled: true
      altinity-clickhouse-operator.secret.create: true
    asserts:
      - failedTemplate:
          errorMessage: "altinity-clickhouse-operator.secret.create is true, so the operator's own chart renders its credentials Secret, but altinity-clickhouse-operator.secret.password is empty. Set it to a long random value, or leave secret.create false to have this chart make one."
