    documentSelector:
      path: kind
      value: Deployment
    set:
      openTelemetryExporter:
        endpoint: https://collector.example.com/otlp
        headers: "x-path=C:\\temp\\new"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS
            value: "x-path=C:\\temp\\new"

  - it: "hands the app an endpoint with an IPv6 host, a query and a fragment whole"
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      openTelemetryExporter:
        endpoint: "https://[fd00::4318]:4318/otlp?tenant=eu&tier=1#exporter"
        headers: x-oneuptime-token=server-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT
            value: "https://[fd00::4318]:4318/otlp?tenant=eu&tier=1#exporter"

  # --- the worker ----------------------------------------------------------------
