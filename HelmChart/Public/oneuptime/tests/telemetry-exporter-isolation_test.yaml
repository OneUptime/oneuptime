    documentSelector:
      path: kind
      value: Deployment
    set:
      openTelemetryExporter:
        endpoint: https://collector.example.com/otlp
        headers: "x-tenant={\"region\": \"eu\", \"tier\": 1}"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS
            value: "x-tenant={\"region\": \"eu\", \"tier\": 1}"

  - it: "hands the app a header list holding a backslash whole"
    templates:
