# Backend OTLP headers can contain unrestricted Server ingestion keys or
# arbitrary collector credentials. They must remain separate from the
# deliberately public Browser ingestion key rendered into frontend env.js.
suite: telemetry exporter isolation
release:
  name: oneuptime
  namespace: oneuptime
tests:
  - it: emits no exporter variables by default
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUBLIC_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUBLIC_OPENTELEMETRY_EXPORTER_OTLP_BROWSER_INGESTION_KEY

  - it: keeps server exporter settings under server-only environment names
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      openTelemetryExporter:
        endpoint: https://server-collector.internal:4318
        headers: authorization=Bearer server-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT
            value: https://server-collector.internal:4318
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS
            value: authorization=Bearer server-secret
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUBLIC_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUBLIC_OPENTELEMETRY_EXPORTER_OTLP_BROWSER_INGESTION_KEY

  # A Basic Authorization value ends in base64 padding, and many tokens end
  # in '='. The server reads each header up to its FIRST '=' as the name, so
  # the chart must hand the value over whole, padding and all, and every
  # workload that exports its own telemetry must get the same value.
  - it: hands a header value that holds '=' to the app whole
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      worker:
        enabled: true
      openTelemetryExporter:
        endpoint: https://collector.example.com/otlp
        headers: Authorization=Basic dXNlcjpwYXNzd29yZA==;x-scope=tenant=eu
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS
            value: Authorization=Basic dXNlcjpwYXNzd29yZA==;x-scope=tenant=eu

  - it: hands a header value that holds '=' to the worker whole
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      worker:
        enabled: true
      openTelemetryExporter:
        endpoint: https://collector.example.com/otlp
        headers: Authorization=Basic dXNlcjpwYXNzd29yZA==;x-scope=tenant=eu
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS
            value: Authorization=Basic dXNlcjpwYXNzd29yZA==;x-scope=tenant=eu

  - it: keeps public browser settings under browser-only environment names
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      browserOpenTelemetryExporter:
        endpoint: https://browser-collector.example.com:4318
        browserIngestionKey: origin-bound-browser-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUBLIC_OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT
            value: https://browser-collector.example.com:4318
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUBLIC_OPENTELEMETRY_EXPORTER_OTLP_BROWSER_INGESTION_KEY
            value: origin-bound-browser-key
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS

  - it: renders both channels independently when both are configured
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      openTelemetryExporter:
        endpoint: https://server-collector.internal:4318
        headers: x-oneuptime-token=server-key
      browserOpenTelemetryExporter:
        endpoint: https://browser-collector.example.com:4318
        browserIngestionKey: browser-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS
            value: x-oneuptime-token=server-key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUBLIC_OPENTELEMETRY_EXPORTER_OTLP_BROWSER_INGESTION_KEY
            value: browser-key

  - it: does not synthesize a public Browser key from a configured server key
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      openTelemetryExporter:
        headers: x-oneuptime-token=server-only-key
      browserOpenTelemetryExporter:
        endpoint: https://browser-collector.example.com:4318
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS
            value: x-oneuptime-token=server-only-key
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUBLIC_OPENTELEMETRY_EXPORTER_OTLP_BROWSER_INGESTION_KEY

  # ---------------------------------------------------------------------------
  # The headers are often a credential, and many credentials hold characters
  # YAML reads as its own syntax when a value is written unquoted: ': ' makes
  # the line a mapping (the render fails), ' #' starts a comment (everything
  # after it is silently dropped, so the collector refuses a shortened key),
  # and a leading '*', '&' or '!' is an alias, anchor or tag. Every template
  # that hands a workload the exporter settings writes them through the
  # chart's oneuptime.envValue helper, a quoted string, so each value below
  # must reach the app, the worker, every probe and the global runner exactly
  # as it was set. Tests/Ops/HelmEnvValuesQuoted.test.js holds every other env
  # value of the chart to the same rule.
  # ---------------------------------------------------------------------------
  - it: renders the probe's exporter variables empty when none is set
    templates:
      - templates/probe.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS
            value: null
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT
            value: null

  - it: renders the global runner's exporter variables empty when none is set
    templates:
      - templates/global-runner.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS
            value: null
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT
            value: null

  # --- the app -------------------------------------------------------------------
  - it: "hands the app a header list holding ': ' (a colon and a space) whole"
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      openTelemetryExporter:
        endpoint: https://collector.example.com/otlp
        headers: "x-tenant=region: eu-west"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS
            value: "x-tenant=region: eu-west"

  - it: "hands the app a header list holding ' #' (a space and a hash) whole"
    templates:
