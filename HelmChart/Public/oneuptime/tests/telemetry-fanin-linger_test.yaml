# How long the fan-in telemetry writer lets a table's first row wait for more
# before inserting the table (TELEMETRY_FANIN_LINGER_MS, issue #6086). Ingest
# jobs wait for their rows' insert while holding a worker slot, so this is how
# long each job waits: at the old 5 s window one pod finished about 22 OTLP
# batches a second whatever its CPU. Every pod that inserts telemetry gets the
# knob - the app (which ingests unless worker.enabled), the worker and the
# telemetry-writer tier - with the code's default, 200, and an operator's own
# value reaches the container. TELEMETRY_FANIN_MAX_WAIT_MS stays the most a
# row waits, now only while every insert slot is busy.
suite: telemetry fan-in linger
release:
  name: oneuptime
  namespace: oneuptime
tests:
  - it: gives the app the code default, beside the longest wait
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_FANIN_LINGER_MS
            value: "200"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_FANIN_MAX_WAIT_MS
            value: "5000"

  - it: passes the app's own linger through
    templates:
      - templates/app.yaml
    set:
      app.telemetryFanInLingerMs: 50
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_FANIN_LINGER_MS
            value: "50"

  - it: gives the worker the code default and passes its own through
    templates:
      - templates/worker.yaml
    set:
      worker.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_FANIN_LINGER_MS
            value: "200"

  - it: passes the worker's own linger through
    templates:
      - templates/worker.yaml
    set:
      worker.enabled: true
      worker.telemetryFanInLingerMs: 400
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_FANIN_LINGER_MS
            value: "400"

  - it: gives the telemetry-writer tier the code default and passes its own through
    templates:
      - templates/telemetry-writer.yaml
    set:
      telemetryWriter.enabled: true
      telemetryWriter.telemetryFanInLingerMs: 100
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_FANIN_LINGER_MS
            value: "100"

  - it: falls back to the code default when the value is emptied
    templates:
      - templates/telemetry-writer.yaml
    set:
      telemetryWriter.enabled: true
      telemetryWriter.telemetryFanInLingerMs: null
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_FANIN_LINGER_MS
            value: "200"
