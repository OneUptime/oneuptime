# The service account the OneUptime app and worker pods run as
# (serviceAccount). On Amazon EKS the AWS Marketplace edition bills through
# AWS Marketplace with the IAM role of that account (IAM roles for service
# accounts), usually one the buyer created with eksctl (name, create false).
# Nothing changes for an installation that sets nothing: the pods run as the
# namespace's default service account, as before.
suite: service account
release:
  name: oneuptime
  namespace: oneuptime
set:
  worker:
    enabled: true
tests:
  - it: runs the app and the worker as the default service account by default (app)
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: runs the app and the worker as the default service account by default (worker)
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: creates no service account by default
    templates:
      - templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: runs the app and the worker as an existing service account (app)
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      serviceAccount.name: oneuptime-marketplace
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: oneuptime-marketplace

  - it: runs the app and the worker as an existing service account (worker)
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      serviceAccount.name: oneuptime-marketplace
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: oneuptime-marketplace

  - it: creates nothing when it is told to use an existing one
    templates:
      - templates/serviceaccount.yaml
    set:
      serviceAccount.name: oneuptime-marketplace
    asserts:
      - hasDocuments:
          count: 0

  - it: creates the service account with its annotations, named after the release
    templates:
      - templates/serviceaccount.yaml
    set:
      serviceAccount.create: true
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/oneuptime
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: oneuptime-oneuptime
      - equal:
          path: metadata.namespace
          value: oneuptime
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::111122223333:role/oneuptime

  - it: runs the app and the worker as the service account it creates (app)
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      serviceAccount.create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: oneuptime-oneuptime

  - it: runs the app and the worker as the service account it creates (worker)
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      serviceAccount.create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: oneuptime-oneuptime

  - it: gives a created service account the name it is asked for
    templates:
      - templates/serviceaccount.yaml
    set:
      serviceAccount.create: true
      serviceAccount.name: oneuptime-metering
    asserts:
      - equal:
          path: metadata.name
          value: oneuptime-metering

  - it: leaves nginx, the probes and the global Runner on the default service account (nginx)
    templates:
      - templates/nginx.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      serviceAccount.name: oneuptime-marketplace
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: leaves nginx, the probes and the global Runner on the default service account (probe)
    templates:
      - templates/probe.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      serviceAccount.name: oneuptime-marketplace
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: leaves nginx, the probes and the global Runner on the default service account (global Runner)
    templates:
      - templates/global-runner.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      serviceAccount.name: oneuptime-marketplace
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName
