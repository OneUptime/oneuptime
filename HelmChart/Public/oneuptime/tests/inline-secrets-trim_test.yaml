# An inline key read from a file is stored exactly as the pods use it (#7337).
#
# Many people set oneuptimeSecret, encryptionSecret, registerProbeKey and the
# probes' keys from a file (helm --set-file, Terraform's file()), and such a
# file usually ends in a newline. Every pod gets the inline value through
# oneuptime.envValue, which drops the whitespace around it, as YAML always did
# for an unquoted value. templates/secrets.yaml stored it with the newline, so
# the Secret held a key no pod used:
#
#   - KEDA's TriggerAuthentication reads the cluster key from that Secret, so
#     it presented "key\n" while the app compared it with "key", was refused,
#     and the tier stopped autoscaling;
#   - taking the value out of the values later (to keep it out of a values
#     file) switched the pods to the Secret's copy, newline and all: a new
#     ENCRYPTION_SECRET that could not read what the old one encrypted, a
#     probe key that no longer matched, a cluster key the services refused.
#
# The other copies of a setting the chart keeps outside the pods' env are held
# here to the same rule: the global Runner's key (the server trims it before
# it keeps the Runner's row), vLLM's API key and Hugging Face token (both
# sides read the Secret, and no header can hold a newline), the built-in
# ClickHouse user, the Postgres and CloudNativePG database, and the Altinity
# user. tests/inline-secrets-trim-upgrade_test.yaml holds the upgrades of a
# release whose live Secret already holds a key, and the repo-root
# Tests/Ops/HelmEnvValuesQuoted.test.js renders the whole chart and compares
# every copy with every workload's env.
suite: inline keys stored as the pods use them
release:
  name: oneuptime
  namespace: oneuptime
tests:
  # ---------------------------------------------------------------------------
  # The release Secret, on install and on upgrade (two branches of
  # secrets.yaml; `lookup` finds no live Secret here, see the upgrade suite).
  # ---------------------------------------------------------------------------
  - it: stores each inline key without the whitespace around it, on install
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    set: &keysFromFiles
      oneuptimeSecret: "  cluster-key-from-a-file\n"
      encryptionSecret: "\tencryption-key-from-a-file\r\n"
      registerProbeKey: " register-key-from-a-file \n"
      probes:
        one:
          key: "probe-key-from-a-file\n\n"
    asserts: &keysStoredTrimmed
      - equal:
          path: stringData.oneuptime-secret
          value: cluster-key-from-a-file
      - equal:
          path: stringData.encryption-secret
          value: encryption-key-from-a-file
      - equal:
          path: stringData.register-probe-key
          value: register-key-from-a-file
      - equal:
          path: stringData.probe-one
          value: probe-key-from-a-file

  - it: stores each inline key without the whitespace around it, on upgrade
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    release:
      name: oneuptime
      namespace: oneuptime
      upgrade: true
    set: *keysFromFiles
    asserts: *keysStoredTrimmed

  - it: stores a key of every probe without the whitespace around it, on install and upgrade alike
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    release:
      name: oneuptime
      namespace: oneuptime
      upgrade: true
    set:
      probes:
        one:
          key: " probe-one-key\n"
        two:
          name: Probe Two
          key: "probe-two-key \n"
    asserts:
      - equal:
          path: stringData.probe-one
          value: probe-one-key
      - equal:
          path: stringData.probe-two
          value: probe-two-key

  - it: keeps the inside of a key as it is, quotes and YAML's syntax included
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    set:
      oneuptimeSecret: " a: b #c 'd' \"e\" \\f \n"
      encryptionSecret: "*anchor & !tag"
    asserts:
      - equal:
          path: stringData.oneuptime-secret
          value: "a: b #c 'd' \"e\" \\f"
      - equal:
          path: stringData.encryption-secret
          value: "*anchor & !tag"

  - it: leaves a key without whitespace around it exactly as it was stored before
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    set:
      oneuptimeSecret: already-clean-key
      encryptionSecret: "123456"
      registerProbeKey: "true"
      probes.one.key: clean-probe-key
    asserts:
      - equal:
          path: stringData.oneuptime-secret
          value: already-clean-key
      - equal:
          path: stringData.encryption-secret
          value: "123456"
      - equal:
          path: stringData.register-probe-key
          value: "true"
      - equal:
          path: stringData.probe-one
          value: clean-probe-key

  # ---------------------------------------------------------------------------
  # What the pods get: the same keys, so the Secret and the env agree.
  # ---------------------------------------------------------------------------
  - it: gives the app the keys the Secret stores
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: *keysFromFiles
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_SECRET
            value: cluster-key-from-a-file
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENCRYPTION_SECRET
            value: encryption-key-from-a-file
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTER_PROBE_KEY
            value: register-key-from-a-file

  - it: gives the worker the keys the Secret stores
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      worker.enabled: true
      oneuptimeSecret: "  cluster-key-from-a-file\n"
      encryptionSecret: "\tencryption-key-from-a-file\r\n"
      registerProbeKey: " register-key-from-a-file \n"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_SECRET
            value: cluster-key-from-a-file
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENCRYPTION_SECRET
            value: encryption-key-from-a-file
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REGISTER_PROBE_KEY
            value: register-key-from-a-file

  - it: gives the probe the key the Secret stores
    templates:
      - templates/probe.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: *keysFromFiles
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_KEY
            value: probe-key-from-a-file

  # ---------------------------------------------------------------------------
  # KEDA's TriggerAuthentication reads the cluster key the app compares.
  # ---------------------------------------------------------------------------
  - it: KEDA reads the release Secret's cluster key, which is the app's ONEUPTIME_SECRET, when the key is set inline
    templates:
      - templates/keda-scaledobjects.yaml
    documentSelector:
      path: kind
      value: TriggerAuthentication
    set:
      keda.enabled: true
      app.keda.enabled: true
      oneuptimeSecret: "  cluster-key-from-a-file\n"
    asserts:
      - equal:
          path: spec.secretTargetRef
          value:
            - parameter: clusterkey
              name: oneuptime-secrets
              key: oneuptime-secret

  - it: KEDA reads the release Secret when the key is set inline beside a Secret of the user's, since the app uses the inline key
    templates:
      - templates/keda-scaledobjects.yaml
    documentSelector:
      path: kind
      value: TriggerAuthentication
    set:
      keda.enabled: true
      app.keda.enabled: true
      oneuptimeSecret: "  cluster-key-from-a-file\n"
      externalSecrets.oneuptimeSecret.existingSecret.name: my-keys
      externalSecrets.oneuptimeSecret.existingSecret.passwordKey: cluster-key
    asserts:
      - equal:
          path: spec.secretTargetRef
          value:
            - parameter: clusterkey
              name: oneuptime-secrets
              key: oneuptime-secret

  - it: the release Secret then holds the inline key, so KEDA presents the app's ONEUPTIME_SECRET
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    set:
      oneuptimeSecret: "  cluster-key-from-a-file\n"
      externalSecrets.oneuptimeSecret.existingSecret.name: my-keys
      externalSecrets.oneuptimeSecret.existingSecret.passwordKey: cluster-key
    asserts:
      - equal:
          path: stringData.oneuptime-secret
          value: cluster-key-from-a-file

  - it: the app uses the inline key over a Secret of the user's, as KEDA does
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      oneuptimeSecret: "  cluster-key-from-a-file\n"
      externalSecrets.oneuptimeSecret.existingSecret.name: my-keys
      externalSecrets.oneuptimeSecret.existingSecret.passwordKey: cluster-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_SECRET
            value: cluster-key-from-a-file

  - it: KEDA reads a Secret of the user's when no key is set inline, as the app does
    templates:
      - templates/keda-scaledobjects.yaml
    documentSelector:
      path: kind
      value: TriggerAuthentication
    set:
      keda.enabled: true
      app.keda.enabled: true
      externalSecrets.oneuptimeSecret.existingSecret.name: my-keys
      externalSecrets.oneuptimeSecret.existingSecret.passwordKey: cluster-key
    asserts:
      - equal:
          path: spec.secretTargetRef
          value:
            - parameter: clusterkey
              name: my-keys
              key: cluster-key

  - it: KEDA reads the generated cluster key when none is given, as the app does
    templates:
      - templates/keda-scaledobjects.yaml
    documentSelector:
      path: kind
      value: TriggerAuthentication
    set:
      keda.enabled: true
      app.keda.enabled: true
    asserts:
      - equal:
          path: spec.secretTargetRef
          value:
            - parameter: clusterkey
              name: oneuptime-secrets
              key: oneuptime-secret

  # ---------------------------------------------------------------------------
  # The global Runner's key: the server trims GLOBAL_RUNNER_KEY before it keeps
  # the Runner's row, so the Runner must present the same key.
  # ---------------------------------------------------------------------------
  - it: gives the global Runner the key the server keeps, without the whitespace around it
    templates:
      - templates/global-runner.yaml
    set:
      globalRunner.key: "  runner-key-from-a-file\n"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_RUNNER_KEY
            value: runner-key-from-a-file

  - it: gives the server the same global Runner key
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      globalRunner.key: "  runner-key-from-a-file\n"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GLOBAL_RUNNER_KEY
            value: runner-key-from-a-file

  # ---------------------------------------------------------------------------
  # vLLM's Secret: vLLM and the app both read api-key from it, and the key is
  # sent in an Authorization header, which cannot hold a newline.
  # ---------------------------------------------------------------------------
  - it: stores vLLM's API key and Hugging Face token without the whitespace around them
    templates:
      - templates/vllm.yaml
    documentSelector:
      path: kind
      value: Secret
    set:
      vllm.enabled: true
      vllm.apiKey: "  my-vllm-key\n"
      vllm.huggingFace.token: "hf_token\n"
    asserts:
      - equal:
          path: stringData.api-key
          value: my-vllm-key
      - equal:
          path: stringData.hf-token
          value: hf_token

  - it: rolls the vLLM pods for a key that loses its whitespace, hashing what the Secret stores
    templates:
      - templates/vllm.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    set:
      vllm.enabled: true
      vllm.apiKey: "  my-vllm-key\n"
    asserts:
      # sha256("my-vllm-key|"): the checksum of the same key written without
      # the whitespace, so the two installs hash alike.
      - equal:
          path: spec.template.metadata.annotations["checksum/vllm-secret"]
          value: 782f67f01fab3ec7157f2c2d44ebc96759c39aff2c06171b32fbd4cc8bb1a4fc

  - it: hashes a key without whitespace as it always did, so its pods do not roll on upgrade
    templates:
      - templates/vllm.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    set:
      vllm.enabled: true
      vllm.apiKey: my-vllm-key
    asserts:
      # sha256("my-vllm-key|"), what printf "%s|%s" of the raw values hashed.
      - equal:
          path: spec.template.metadata.annotations["checksum/vllm-secret"]
          value: 782f67f01fab3ec7157f2c2d44ebc96759c39aff2c06171b32fbd4cc8bb1a4fc

  - it: hashes an unset API key beside a token as it always did
    templates:
      - templates/vllm.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    set:
      vllm.enabled: true
      vllm.apiKey: null
      vllm.huggingFace.token: hf_token
    asserts:
      # sha256("%!s(<nil>)|hf_token"): printf's text for a nil value, which
      # the checksum has always hashed for an API key left empty in a values
      # file.
      - equal:
          path: spec.template.metadata.annotations["checksum/vllm-secret"]
          value: 4e7e3d484afc6c9bf819d0fe7841f707e800efb8f79ba9f006868a22c4355fc0

  # ---------------------------------------------------------------------------
  # The databases' own names for what the app connects as and to.
  # ---------------------------------------------------------------------------
  - it: creates the built-in ClickHouse user the app connects as, in the config and the server
    templates:
      - templates/clickhouse-statefulset.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    set:
      clickhouse.auth.username: "  oneuptime-user\n"
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: CLICKHOUSE_USER
            value: oneuptime-user
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_USER
            value: oneuptime-user

  - it: the app connects to ClickHouse as that user
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      clickhouse.auth.username: "  oneuptime-user\n"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_USER
            value: oneuptime-user

  - it: creates the built-in Postgres database the app connects to, and checks that one
    templates:
      - templates/postgresql-statefulset.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    set:
      postgresql.auth.database: " oneuptime-db\n"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DB
            value: oneuptime-db
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          value: exec pg_isready -U "postgres" -d "dbname=oneuptime-db" -h 127.0.0.1 -p 5432
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          value: exec pg_isready -U "postgres" -d "dbname=oneuptime-db" -h 127.0.0.1 -p 5432

  - it: the app connects to that Postgres database
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      postgresql.auth.database: " oneuptime-db\n"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_NAME
            value: oneuptime-db

  - it: creates the CloudNativePG database the app connects to
    templates:
      - templates/postgresql-cnpg-cluster.yaml
    set:
      postgresOperator.cnpg.enabled: true
      postgresOperator.cnpg.database: " oneuptime-db\n"
    asserts:
      - equal:
          path: spec.bootstrap.initdb.database
          value: oneuptime-db

  - it: the app connects to that CloudNativePG database
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      postgresOperator.cnpg.enabled: true
      postgresOperator.cnpg.database: " oneuptime-db\n"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_NAME
            value: oneuptime-db

  - it: creates the Altinity installation's user the app connects as
    templates:
      - templates/clickhouse-altinity-chi.yaml
    set:
      clickhouseOperator.altinity.enabled: true
      clickhouseOperator.altinity.auth.username: "  oneuptime-user\n"
    asserts:
      - exists:
          path: spec.configuration.users["oneuptime-user/password"]
      - equal:
          path: spec.configuration.users["oneuptime-user/access_management"]
          value: "1"

  - it: the app connects to the Altinity installation as that user
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      clickhouseOperator.altinity.enabled: true
      clickhouseOperator.altinity.auth.username: "  oneuptime-user\n"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_USER
            value: oneuptime-user
