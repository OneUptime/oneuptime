# imagePullSecrets reaches every pod the chart defines - not only the
# OneUptime services, but the bundled PostgreSQL, ClickHouse and Valkey, the
# `helm test` hook, the cleanup and e2e CronJobs, the ClickHouse Keeper, and
# the PostgreSQL cluster and ClickHouse installation the operators run.
#
# An install that pulls from a registry asking for credentials - an
# air-gapped install above all (oneuptime.com/enterprise/air-gapped) - can
# then pull every image the chart runs. The datastores and the test hook
# used to be left out, so their pods could not pull from such a registry.
# HelmChart/Tests/suites/air-gapped.sh checks the same across a whole render,
# so a workload added later without the pull secret fails there too.
suite: image pull secrets
release:
  name: oneuptime
  namespace: oneuptime
set:
  imagePullSecrets:
    - name: internal-registry
    - name: second-registry
tests:
  - it: gives the bundled PostgreSQL the pull secrets
    templates:
      - templates/postgresql-statefulset.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: internal-registry
            - name: second-registry

  - it: gives the bundled ClickHouse the pull secrets
    templates:
      - templates/clickhouse-statefulset.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: internal-registry
            - name: second-registry

  - it: gives the bundled Valkey the pull secrets
    templates:
      - templates/valkey-statefulset.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: internal-registry
            - name: second-registry

  - it: gives the helm test hook the pull secrets
    templates:
      - templates/tests/test.yaml
    asserts:
      - equal:
          path: spec.imagePullSecrets
          value:
            - name: internal-registry
            - name: second-registry

  - it: gives the cleanup CronJob for crash-looping pods the pull secrets
    templates:
      - templates/cleanup-cron-job.yaml
    set:
      cronJobs:
        cleanup:
          enabled: true
    documentSelector:
      path: metadata.name
      value: cleanup-crashloopbackoff-pods
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          value:
            - name: internal-registry
            - name: second-registry

  - it: gives the cleanup CronJob for completed pods the pull secrets
    templates:
      - templates/cleanup-cron-job.yaml
    set:
      cronJobs:
        cleanup:
          enabled: true
    documentSelector:
      path: metadata.name
      value: cleanup-completed-pods
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          value:
            - name: internal-registry
            - name: second-registry

  - it: gives the e2e CronJob the pull secrets
    templates:
      - templates/e2e-cron.yml
    set:
      cronJobs:
        e2e:
          enabled: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          value:
            - name: internal-registry
            - name: second-registry

  - it: gives the ClickHouse Keeper the pull secrets
    templates:
      - templates/clickhouse-keeper.yaml
    set:
      clickhouse:
        enabled: false
      clickhouseOperator:
        altinity:
          enabled: true
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: internal-registry
            - name: second-registry

  - it: gives the pods of the ClickHouse installation the pull secrets
    templates:
      - templates/clickhouse-altinity-chi.yaml
    set:
      clickhouse:
        enabled: false
      clickhouseOperator:
        altinity:
          enabled: true
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.imagePullSecrets
          value:
            - name: internal-registry
            - name: second-registry

  - it: gives the CloudNativePG cluster the pull secrets
    templates:
      - templates/postgresql-cnpg-cluster.yaml
    set:
      postgresql:
        enabled: false
      postgresOperator:
        cnpg:
          enabled: true
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: spec.imagePullSecrets
          value:
            - name: internal-registry
            - name: second-registry

  # Unset, nothing is written: an install that never set imagePullSecrets
  # renders exactly as before.
  - it: writes no pull secrets into the bundled PostgreSQL when none are set
    templates:
      - templates/postgresql-statefulset.yaml
    set:
      imagePullSecrets: null
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: writes no pull secrets into the bundled ClickHouse when none are set
    templates:
      - templates/clickhouse-statefulset.yaml
    set:
      imagePullSecrets: null
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: writes no pull secrets into the bundled Valkey when none are set
    templates:
      - templates/valkey-statefulset.yaml
    set:
      imagePullSecrets: null
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: writes no pull secrets into the helm test hook when none are set
    templates:
      - templates/tests/test.yaml
    set:
      imagePullSecrets: null
    asserts:
      - notExists:
          path: spec.imagePullSecrets

  - it: writes no pull secrets into the cleanup CronJobs when none are set
    templates:
      - templates/cleanup-cron-job.yaml
    set:
      imagePullSecrets: null
      cronJobs:
        cleanup:
          enabled: true
    documentSelector:
      path: metadata.name
      value: cleanup-crashloopbackoff-pods
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets

  - it: writes no pull secrets into the e2e CronJob when none are set
    templates:
      - templates/e2e-cron.yml
    set:
      imagePullSecrets: null
      cronJobs:
        e2e:
          enabled: true
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets

  - it: writes no pull secrets into the ClickHouse Keeper when none are set
    templates:
      - templates/clickhouse-keeper.yaml
    set:
      imagePullSecrets: null
      clickhouse:
        enabled: false
      clickhouseOperator:
        altinity:
          enabled: true
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: writes no pull secrets into the ClickHouse installation when none are set
    templates:
      - templates/clickhouse-altinity-chi.yaml
    set:
      imagePullSecrets: null
      clickhouse:
        enabled: false
      clickhouseOperator:
        altinity:
          enabled: true
    documentSelector:
      path: kind
      value: ClickHouseInstallation
    asserts:
      - notExists:
          path: spec.templates.podTemplates[0].spec.imagePullSecrets

  - it: writes no pull secrets into the CloudNativePG cluster when none are set
    templates:
      - templates/postgresql-cnpg-cluster.yaml
    set:
      imagePullSecrets: null
      postgresql:
        enabled: false
      postgresOperator:
        cnpg:
          enabled: true
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - notExists:
          path: spec.imagePullSecrets
