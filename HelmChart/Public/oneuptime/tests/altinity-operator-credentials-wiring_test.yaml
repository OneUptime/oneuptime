# How the Altinity operator meets the credentials Secret this chart renders
# for its own ClickHouse user (altinity-operator-credentials_test.yaml), and
# what `helm install` / `helm upgrade` say about it.
#
#   - The operator chart's own Secret, which ships one password to every
#     installation, is not rendered: secret.create is false.
#   - The operator still reads its credentials from a Secret of that name in
#     its namespace (its config.yaml's clickhouse.access.secret), which is the
#     one this chart renders, and has none inline.
#   - NOTES.txt tells an installation whose operator password is still the one
#     that chart ships what to do; one with a password of its own hears nothing.
#
# The operator chart is only part of the release while
# clickhouseOperator.altinity.enabled is true, so every case on its templates
# enables it.
suite: Altinity operator credentials wiring
release:
  name: oneuptime
  namespace: oneuptime
tests:
  - it: the operator chart renders no credentials Secret of its own
    templates:
      - charts/altinity-clickhouse-operator/templates/generated/Secret-clickhouse-operator.yaml
    set:
      clickhouseOperator.altinity.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: the operator reads its credentials from the Secret this chart renders, in its own namespace, and has none inline
    templates:
      - charts/altinity-clickhouse-operator/templates/generated/ConfigMap-etc-clickhouse-operator-files.yaml
    set:
      clickhouseOperator.altinity.enabled: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'secret:\n\s+name: ''oneuptime-altinity-clickhouse-operator''\n\s+namespace: ""\n'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'access:\n\s+password: ""\n'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '\n\s+username: ""\n'

  - it: with an overridden name, the operator reads the Secret this chart renders under that name
    templates:
      - charts/altinity-clickhouse-operator/templates/generated/ConfigMap-etc-clickhouse-operator-files.yaml
    set:
      clickhouseOperator.altinity.enabled: true
      altinity-clickhouse-operator.fullnameOverride: my-operator
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'secret:\n\s+name: ''my-operator''\n'

  - it: NOTES tells an installation whose operator password is still the shipped one what to do
    templates:
      - templates/NOTES.txt
    set:
      clickhouseOperator.altinity.enabled: true
      altinity-clickhouse-operator.secret.password: clickhouse_operator_password
    asserts:
      - matchRegexRaw:
          pattern: 'ACTION RECOMMENDED -- the ClickHouse operator''s own user still has the password\s+its chart ships to every installation\.'
      - matchRegexRaw:
          pattern: 'Set altinity-clickhouse-operator\.secret\.password\s+to a long random value'
      - matchRegexRaw:
          pattern: 'kubectl rollout restart deployment/oneuptime-altinity-clickhouse-operator --namespace=oneuptime'

  - it: NOTES names the operator's deployment and namespace as the operator chart does
    templates:
      - templates/NOTES.txt
    set:
      clickhouseOperator.altinity.enabled: true
      altinity-clickhouse-operator.secret.password: clickhouse_operator_password
      altinity-clickhouse-operator.fullnameOverride: my-operator
      altinity-clickhouse-operator.namespaceOverride: clickhouse-system
    asserts:
      - matchRegexRaw:
          pattern: 'kubectl rollout restart deployment/my-operator --namespace=clickhouse-system'

  - it: NOTES says nothing about the operator password to a new installation
    templates:
      - templates/NOTES.txt
    set:
      clickhouseOperator.altinity.enabled: true
    asserts:
      - notMatchRegexRaw:
          pattern: 'clickhouse_operator'

  - it: NOTES says nothing about it to an installation with a password of its own
    templates:
      - templates/NOTES.txt
    set:
      clickhouseOperator.altinity.enabled: true
      altinity-clickhouse-operator.secret.password: 9f3c1a7e5b2d4f6a8c0e1b3d5f7a9c2e
    asserts:
      - notMatchRegexRaw:
          pattern: 'clickhouse_operator'

  - it: NOTES says nothing about it when the operator is not enabled
    templates:
      - templates/NOTES.txt
    set:
      altinity-clickhouse-operator.secret.password: clickhouse_operator_password
    asserts:
      - notMatchRegexRaw:
          pattern: 'clickhouse_operator'
