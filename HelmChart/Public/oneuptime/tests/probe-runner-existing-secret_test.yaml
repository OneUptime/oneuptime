# Tests for `probes.<name>.existingSecret` (PROBE_KEY) and
# `globalRunner.existingSecret` (the bundled global Runner's key: its
# ONEUPTIME_RUNNER_KEY, and GLOBAL_RUNNER_KEY on the server's pods).
#
# These two keys ARE the probe's / global Runner's identity: the server
# registers a brand-new probe the first time it sees a key it does not
# recognise. Under `helm template` (Argo CD, Flux) the chart's install branch is
# always taken, so the chart-generated `randAlphaNum` differs on every render and
# the previous probe is orphaned — and because a monitor's probe list is fixed
# when the monitor is created and never back-filled, the monitor keeps pointing at
# the dead probe and monitoring silently stops. These options let an operator own
# the two values instead. (The shared Runner, whose `runner.existingSecret` this
# file used to cover, is gone: the global Runner does its AI code fixes.)
#
# The bar here is the one the older `externalSecrets` options already clear, and
# it has two halves:
#   * tests/external-secrets-env_test.yaml — the consumer side: the pod reads the
#     key from the user's Secret.
#   * tests/secrets-external-secrets_test.yaml — the producer side: the
#     chart-managed `<release>-secrets` must NOT also generate that key, or the
#     unused `randAlphaNum` re-randomises on every render and `helm diff` /
#     Argo CD claim the secrets are rotating (issue #3121).
# Both halves are asserted below, on install and on upgrade.
suite: probe and global Runner existingSecret
release:
  name: oneuptime
  namespace: oneuptime
tests:
  # ---------------------------------------------------------------------------
  # PROBE_KEY — consumer side (templates/probe.yaml)
  # ---------------------------------------------------------------------------
  - it: points PROBE_KEY at the chart-managed secret by default
    templates:
      - templates/probe.yaml
    # probe.yaml renders a Service and a Deployment per probe under the same
    # name, so select the Deployment by kind.
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-secrets
                key: probe-one

  - it: points PROBE_KEY at the existing secret
    templates:
      - templates/probe.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      probes.one.existingSecret.name: probe-identities
      probes.one.existingSecret.passwordKey: probe-one-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_KEY
            valueFrom:
              secretKeyRef:
                name: probe-identities
                key: probe-one-key

  # Mirrors "prefers an inline oneuptimeSecret over the external secret".
  - it: prefers an inline probe key over the existing secret
    templates:
      - templates/probe.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      probes.one.key: inline-probe-key
      probes.one.existingSecret.name: probe-identities
      probes.one.existingSecret.passwordKey: probe-one-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_KEY
            value: inline-probe-key

  # Mirrors "treats an empty existingSecret name as not configured".
  - it: treats an empty probe existingSecret name as not configured
    templates:
      - templates/probe.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      probes.one.existingSecret.name: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-secrets
                key: probe-one

  # The accessor is parenthesised so a nil at ANY level is safe, matching
  # "renders when a single externalSecrets sub-key is nil".
  - it: renders when the probe existingSecret block is nil
    templates:
      - templates/probe.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      probes.one.existingSecret: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-secrets
                key: probe-one

  # `existingSecret` is per-probe, so one probe opting in must not drag the rest
  # of the fleet off the chart-managed secret.
  - it: wires only the opted-in probe to its existing secret
    templates:
      - templates/probe.yaml
    # Two probes means two Deployments AND two Services, so `kind` is no longer a
    # unique selector; the pod-template label is Deployment-only.
    documentSelector:
      path: spec.template.metadata.labels.app
      value: oneuptime-probe-one
    set:
      probes.two.name: Probe Two
      probes.two.enabled: true
      probes.one.existingSecret.name: probe-identities
      probes.one.existingSecret.passwordKey: probe-one-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_KEY
            valueFrom:
              secretKeyRef:
                name: probe-identities
                key: probe-one-key

  - it: keeps other probes on the chart-managed secret
    templates:
      - templates/probe.yaml
    documentSelector:
      path: spec.template.metadata.labels.app
      value: oneuptime-probe-two
    set:
      probes.two.name: Probe Two
      probes.two.enabled: true
      probes.one.existingSecret.name: probe-identities
      probes.one.existingSecret.passwordKey: probe-one-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-secrets
                key: probe-two

  # ---------------------------------------------------------------------------
  # The global Runner's key — consumer side (templates/global-runner.yaml, and
  # templates/app.yaml: the server keeps the global Runner's row from the same
  # key, so it reads it from the same place). The default, the existing secret
  # and a literal key are in tests/global-runner_test.yaml; the precedence and
  # the empty and nil blocks are here, as they are for the probes above.
  # ---------------------------------------------------------------------------
  - it: prefers an inline global Runner key over the existing secret
    templates:
      - templates/global-runner.yaml
    set:
      globalRunner.key: inline-global-runner-key
      globalRunner.existingSecret.name: runner-identity
      globalRunner.existingSecret.passwordKey: global-runner-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_RUNNER_KEY
            value: inline-global-runner-key

  - it: gives the app the inline global Runner key too, over the existing secret
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      globalRunner.key: inline-global-runner-key
      globalRunner.existingSecret.name: runner-identity
      globalRunner.existingSecret.passwordKey: global-runner-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GLOBAL_RUNNER_KEY
            value: inline-global-runner-key

  - it: treats an empty global Runner existingSecret name as not configured
    templates:
      - templates/global-runner.yaml
    set:
      globalRunner.existingSecret.name: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_RUNNER_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-secrets
                key: global-runner-key

  - it: renders when the global Runner existingSecret block is nil
    templates:
      - templates/global-runner.yaml
    set:
      globalRunner.existingSecret: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_RUNNER_KEY
            valueFrom:
              secretKeyRef:
                name: oneuptime-secrets
                key: global-runner-key

  # ---------------------------------------------------------------------------
  # The other half of issue #3121: a key the user serves must not ALSO be
  # generated into the chart-managed Secret, or it is re-randomised on every
  # render and `helm diff` reports it as rotating — which is the churn these
  # options exist to remove.
  # ---------------------------------------------------------------------------
  - it: still generates both identity keys when neither option is set
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    asserts:
      - matchRegex:
          path: stringData.probe-one
          pattern: "^[a-zA-Z0-9]{32}$"
      - matchRegex:
          path: stringData.global-runner-key
          pattern: "^[a-zA-Z0-9]{32}$"

  - it: skips probe-one when that probe uses an existing secret
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    set:
      probes.one.existingSecret.name: probe-identities
      probes.one.existingSecret.passwordKey: probe-one-key
    asserts:
      - notExists:
          path: stringData.probe-one

  - it: skips global-runner-key when the global Runner uses an existing secret
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    set:
      globalRunner.existingSecret.name: runner-identity
      globalRunner.existingSecret.passwordKey: global-runner-key
    asserts:
      - notExists:
          path: stringData.global-runner-key

  # The guard sits INSIDE the `range`, so it must be decided per probe.
  - it: still generates the probe keys the chart owns
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    set:
      probes.two.name: Probe Two
      probes.two.enabled: true
      probes.one.existingSecret.name: probe-identities
      probes.one.existingSecret.passwordKey: probe-one-key
    asserts:
      - notExists:
          path: stringData.probe-one
      - matchRegex:
          path: stringData.probe-two
          pattern: "^[a-zA-Z0-9]{32}$"

  # Precedence in the Secret has to match the precedence in the Deployment: an
  # inline `key` short-circuits `existingSecret`, so the chart still owns it.
  - it: writes an inline probe key even when existingSecret is also set
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    set:
      probes.one.key: inline-probe-key
      probes.one.existingSecret.name: probe-identities
      probes.one.existingSecret.passwordKey: probe-one-key
    asserts:
      - equal:
          path: stringData.probe-one
          value: inline-probe-key

  - it: skips both identity keys on upgrade too
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    release:
      name: oneuptime
      namespace: oneuptime
      upgrade: true
    set:
      probes.one.existingSecret.name: probe-identities
      probes.one.existingSecret.passwordKey: probe-one-key
      globalRunner.existingSecret.name: runner-identity
      globalRunner.existingSecret.passwordKey: global-runner-key
    asserts:
      - notExists:
          path: stringData.probe-one
      - notExists:
          path: stringData.global-runner-key
      # Keys the chart still owns are untouched.
      - matchRegex:
          path: stringData.oneuptime-secret
          pattern: "^[a-zA-Z0-9]{32}$"

  # With every key served elsewhere the chart has nothing left to generate. The
  # resulting Secret has no stringData at all, which is valid.
  - it: renders a keyless secret when every key is externally managed
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    set:
      externalSecrets.oneuptimeSecret.existingSecret.name: one-uptime
      externalSecrets.oneuptimeSecret.existingSecret.passwordKey: one-uptime-secret
      externalSecrets.encryptionSecret.existingSecret.name: one-uptime
      externalSecrets.encryptionSecret.existingSecret.passwordKey: encryption-secret
      externalSecrets.registerProbeKey.existingSecret.name: one-uptime
      externalSecrets.registerProbeKey.existingSecret.passwordKey: register-probe-key
      probes.one.existingSecret.name: probe-identities
      probes.one.existingSecret.passwordKey: probe-one-key
      globalRunner.existingSecret.name: runner-identity
      globalRunner.existingSecret.passwordKey: global-runner-key
    asserts:
      - isKind:
          of: Secret
      - isNullOrEmpty:
          path: stringData
