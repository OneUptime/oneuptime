# inboundEmail.existingSecret: the incoming email webhook secret - the last
# part of the Destination URL SendGrid's Inbound Parse posts every email to -
# read from a Secret the operator manages instead of from
# inboundEmail.webhookSecret, so the secret stays out of the values Helm stores
# with every revision, and out of the Git repository an Argo CD or Flux install
# renders from. So:
#   - every workload given INBOUND_EMAIL_WEBHOOK_SECRET (oneuptime.env.common:
#     app, worker, telemetry writer, nginx, home, test server, the migrate Job
#     and the e2e CronJob) reads it from that Secret, under webhookSecret unless
#     inboundEmail.existingSecret.webhookSecretKey names another key, and none
#     of them also renders it as a plain value;
#   - without it nothing changes: inboundEmail.webhookSecret is a plain value,
#     exactly as before (HelmChart/Tests/suites/inbound-email-existing-secret.sh
#     renders the whole chart to hold that, and to check that no workload was
#     missed);
#   - both set is refused, saying which one to clear;
#   - the schema refuses a block of the wrong shape.
# NOTES.txt's warning about a missing secret is in
# inbound-email-webhook-secret_test.yaml.
suite: incoming email webhook secret from an existing Secret
release:
  name: oneuptime
  namespace: oneuptime
tests:
  # ---------------------------------------------------------------------------
  # app
  # ---------------------------------------------------------------------------
  - it: app reads the webhook secret from inboundEmail.webhookSecret when no Secret is named
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: &plainKey
      inboundEmail:
        webhookSecret: webhook-secret-123
    asserts: &plainKeyAsserts
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_EMAIL_WEBHOOK_SECRET
            value: webhook-secret-123
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_EMAIL_WEBHOOK_SECRET
          any: true
          count: 1

  - it: app reads the webhook secret from the operator's Secret, and never as a plain value too
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: &existingSecret
      inboundEmail:
        existingSecret:
          name: oneuptime-inbound-email
    asserts: &existingSecretAsserts
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_EMAIL_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: oneuptime-inbound-email
                key: webhookSecret
      # One INBOUND_EMAIL_WEBHOOK_SECRET, and it has no plain value beside the Secret's.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_EMAIL_WEBHOOK_SECRET
          any: true
          count: 1
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "INBOUND_EMAIL_WEBHOOK_SECRET")].value

  - it: app renders an empty webhook secret when neither is set, as it always did
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts: &noKeyAsserts
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_EMAIL_WEBHOOK_SECRET
            value: ""
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "INBOUND_EMAIL_WEBHOOK_SECRET")].valueFrom

  - it: app reads the key webhookSecret when inboundEmail.existingSecret.webhookSecretKey is left empty
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: &emptyKeyName
      inboundEmail:
        existingSecret:
          name: oneuptime-inbound-email
          webhookSecretKey: ""
    asserts: *existingSecretAsserts

  # A render stops at the first template that fails, and helm-unittest
  # reports the error of that template only. So each refusal leaves its
  # workload the only one rendering oneuptime.env.common (app, nginx and the
  # migrate Job render by default); HelmChart/Tests/suites/inbound-email-existing-secret.sh
  # checks that helm template refuses the whole release.
  - it: app refuses webhookSecret and existingSecret together, and says which to clear
    templates:
      - templates/app.yaml
    set:
      inboundEmail: &bothSet
        webhookSecret: webhook-secret-123
        existingSecret:
          name: oneuptime-inbound-email
      nginx:
        enabled: false
      migrate:
        enabled: false
    asserts: &bothSetAsserts
      - failedTemplate:
          errorMessage: 'inboundEmail.webhookSecret and inboundEmail.existingSecret.name are both set. Set one of them: to read the webhook secret from the Secret oneuptime-inbound-email, clear webhookSecret (--set inboundEmail.webhookSecret="").'

  # ---------------------------------------------------------------------------
  # worker
  # ---------------------------------------------------------------------------
  - it: worker reads the webhook secret from inboundEmail.webhookSecret when no Secret is named
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *plainKey
      worker:
        enabled: true
    asserts: *plainKeyAsserts

  - it: worker reads the webhook secret from the operator's Secret, and never as a plain value too
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *existingSecret
      worker:
        enabled: true
    asserts: *existingSecretAsserts

  - it: worker renders an empty webhook secret when neither is set
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      worker:
        enabled: true
    asserts: *noKeyAsserts

  - it: worker reads the key webhookSecret when inboundEmail.existingSecret.webhookSecretKey is left empty
    templates:
      - templates/worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *emptyKeyName
      worker:
        enabled: true
    asserts: *existingSecretAsserts

  - it: worker refuses webhookSecret and existingSecret together
    templates:
      - templates/worker.yaml
    set:
      inboundEmail: *bothSet
      worker:
        enabled: true
      app:
        enabled: false
      nginx:
        enabled: false
      migrate:
        enabled: false
    asserts: *bothSetAsserts

  # ---------------------------------------------------------------------------
  # telemetry writer
  # ---------------------------------------------------------------------------
  - it: the telemetry writer reads the webhook secret from inboundEmail.webhookSecret when no Secret is named
    templates:
      - templates/telemetry-writer.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *plainKey
      telemetryWriter:
        enabled: true
    asserts: *plainKeyAsserts

  - it: the telemetry writer reads the webhook secret from the operator's Secret, and never as a plain value too
    templates:
      - templates/telemetry-writer.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *existingSecret
      telemetryWriter:
        enabled: true
    asserts: *existingSecretAsserts

  - it: the telemetry writer renders an empty webhook secret when neither is set
    templates:
      - templates/telemetry-writer.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      telemetryWriter:
        enabled: true
    asserts: *noKeyAsserts

  - it: the telemetry writer reads the key webhookSecret when inboundEmail.existingSecret.webhookSecretKey is left empty
    templates:
      - templates/telemetry-writer.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *emptyKeyName
      telemetryWriter:
        enabled: true
    asserts: *existingSecretAsserts

  - it: the telemetry writer refuses webhookSecret and existingSecret together
    templates:
      - templates/telemetry-writer.yaml
    set:
      inboundEmail: *bothSet
      telemetryWriter:
        enabled: true
      app:
        enabled: false
      nginx:
        enabled: false
      migrate:
        enabled: false
    asserts: *bothSetAsserts

  # ---------------------------------------------------------------------------
  # nginx (the ingress gateway runs the same env helper)
  # ---------------------------------------------------------------------------
  - it: nginx reads the webhook secret from inboundEmail.webhookSecret when no Secret is named
    templates:
      - templates/nginx.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: *plainKey
    asserts: *plainKeyAsserts

  - it: nginx reads the webhook secret from the operator's Secret, and never as a plain value too
    templates:
      - templates/nginx.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: *existingSecret
    asserts: *existingSecretAsserts

  - it: nginx renders an empty webhook secret when neither is set
    templates:
      - templates/nginx.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts: *noKeyAsserts

  - it: nginx reads the key webhookSecret when inboundEmail.existingSecret.webhookSecretKey is left empty
    templates:
      - templates/nginx.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: *emptyKeyName
    asserts: *existingSecretAsserts

  - it: nginx refuses webhookSecret and existingSecret together
    templates:
      - templates/nginx.yaml
    set:
      inboundEmail: *bothSet
      app:
        enabled: false
      migrate:
        enabled: false
    asserts: *bothSetAsserts

  # ---------------------------------------------------------------------------
  # home
  # ---------------------------------------------------------------------------
  - it: home reads the webhook secret from inboundEmail.webhookSecret when no Secret is named
    templates:
      - templates/home.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *plainKey
      home:
        enabled: true
    asserts: *plainKeyAsserts

  - it: home reads the webhook secret from the operator's Secret, and never as a plain value too
    templates:
      - templates/home.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *existingSecret
      home:
        enabled: true
    asserts: *existingSecretAsserts

  - it: home renders an empty webhook secret when neither is set
    templates:
      - templates/home.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      home:
        enabled: true
    asserts: *noKeyAsserts

  - it: home reads the key webhookSecret when inboundEmail.existingSecret.webhookSecretKey is left empty
    templates:
      - templates/home.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *emptyKeyName
      home:
        enabled: true
    asserts: *existingSecretAsserts

  - it: home refuses webhookSecret and existingSecret together
    templates:
      - templates/home.yaml
    set:
      inboundEmail: *bothSet
      home:
        enabled: true
      app:
        enabled: false
      nginx:
        enabled: false
      migrate:
        enabled: false
    asserts: *bothSetAsserts

  # ---------------------------------------------------------------------------
  # test server (built by the shared oneuptime.deployment helper)
  # ---------------------------------------------------------------------------
  - it: the test server reads the webhook secret from inboundEmail.webhookSecret when no Secret is named
    templates:
      - templates/test-server.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *plainKey
      testServer:
        enabled: true
    asserts: *plainKeyAsserts

  - it: the test server reads the webhook secret from the operator's Secret, and never as a plain value too
    templates:
      - templates/test-server.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *existingSecret
      testServer:
        enabled: true
    asserts: *existingSecretAsserts

  - it: the test server renders an empty webhook secret when neither is set
    templates:
      - templates/test-server.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      testServer:
        enabled: true
    asserts: *noKeyAsserts

  - it: the test server reads the key webhookSecret when inboundEmail.existingSecret.webhookSecretKey is left empty
    templates:
      - templates/test-server.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      <<: *emptyKeyName
      testServer:
        enabled: true
    asserts: *existingSecretAsserts

  - it: the test server refuses webhookSecret and existingSecret together
    templates:
      - templates/test-server.yaml
    set:
      inboundEmail: *bothSet
      testServer:
        enabled: true
      app:
        enabled: false
      nginx:
        enabled: false
      migrate:
        enabled: false
    asserts: *bothSetAsserts

  # ---------------------------------------------------------------------------
  # migrate Job (as a regular Job, and as the pre-upgrade hook)
  # ---------------------------------------------------------------------------
  - it: the migrate Job reads the webhook secret from inboundEmail.webhookSecret when no Secret is named
    templates:
      - templates/migrate-job.yaml
    documentSelector:
      path: kind
      value: Job
    set: *plainKey
    asserts: *plainKeyAsserts

  - it: the migrate Job reads the webhook secret from the operator's Secret, and never as a plain value too
    templates:
      - templates/migrate-job.yaml
    documentSelector:
      path: kind
      value: Job
    set: *existingSecret
    asserts: *existingSecretAsserts

  # The operator's Secret exists before the release does, so the hook's pod -
  # which runs before the release's own resources are applied - can read it.
  - it: the migrate hook reads the webhook secret from the operator's Secret too
    templates:
      - templates/migrate-job.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      <<: *existingSecret
      migrate:
        hook: true
    asserts: *existingSecretAsserts

  - it: the migrate Job renders an empty webhook secret when neither is set
    templates:
      - templates/migrate-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts: *noKeyAsserts

  - it: the migrate Job reads the key webhookSecret when inboundEmail.existingSecret.webhookSecretKey is left empty
    templates:
      - templates/migrate-job.yaml
    documentSelector:
      path: kind
      value: Job
    set: *emptyKeyName
    asserts: *existingSecretAsserts

  - it: the migrate Job refuses webhookSecret and existingSecret together
    templates:
      - templates/migrate-job.yaml
    set:
      inboundEmail: *bothSet
      app:
        enabled: false
      nginx:
        enabled: false
    asserts: *bothSetAsserts

  # ---------------------------------------------------------------------------
  # The Secret's name and key
  # ---------------------------------------------------------------------------
  - it: reads the key inboundEmail.existingSecret.webhookSecretKey names
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      inboundEmail:
        existingSecret:
          name: inbound-email-keys
          webhookSecretKey: inbound-email-webhook-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_EMAIL_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: inbound-email-keys
                key: inbound-email-webhook-secret

  - it: takes the Secret's name and key trimmed, as kubectl would have created them
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      inboundEmail:
        existingSecret:
          name: "  oneuptime-inbound-email  "
          webhookSecretKey: " inbound-email-webhook-secret "
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_EMAIL_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: oneuptime-inbound-email
                key: inbound-email-webhook-secret

  - it: reads the key webhookSecret when inboundEmail.existingSecret.webhookSecretKey is only spaces
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      inboundEmail:
        existingSecret:
          name: oneuptime-inbound-email
          webhookSecretKey: "   "
    asserts: *existingSecretAsserts

  - it: reads the key webhookSecret when inboundEmail.existingSecret.webhookSecretKey is null
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      inboundEmail:
        existingSecret:
          name: oneuptime-inbound-email
          webhookSecretKey: null
    asserts: *existingSecretAsserts

  - it: quotes a Secret name YAML would otherwise read as something other than text
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      inboundEmail:
        existingSecret:
          name: "true"
          webhookSecretKey: "1234"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_EMAIL_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: "true"
                key: "1234"

  # ---------------------------------------------------------------------------
  # What does not turn it on
  # ---------------------------------------------------------------------------
  - it: treats an empty Secret name as not configured
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      inboundEmail:
        webhookSecret: webhook-secret-123
        existingSecret:
          name: ""
    asserts: *plainKeyAsserts

  - it: treats a Secret name of only spaces as not configured
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      inboundEmail:
        webhookSecret: webhook-secret-123
        existingSecret:
          name: "   "
    asserts: *plainKeyAsserts

  - it: a key name alone, with no Secret named, changes nothing
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      inboundEmail:
        webhookSecret: webhook-secret-123
        existingSecret:
          webhookSecretKey: inbound-email-webhook-secret
    asserts: *plainKeyAsserts

  # helm upgrade --reuse-values renders the new chart with the old release's
  # values, which have no inboundEmail.existingSecret at all.
  - it: renders values from before inboundEmail.existingSecret, with no such block at all
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      inboundEmail:
        webhookSecret: webhook-secret-123
        existingSecret: null
    asserts: *plainKeyAsserts

  - it: does not count a webhook secret of only spaces as set beside the Secret
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      inboundEmail:
        webhookSecret: "   "
        existingSecret:
          name: oneuptime-inbound-email
    asserts: *existingSecretAsserts

  - it: names the trimmed Secret in the refusal
    templates:
      - templates/app.yaml
    set:
      inboundEmail:
        webhookSecret: webhook-secret-123
        existingSecret:
          name: "  inbound-email-keys  "
      nginx:
        enabled: false
      migrate:
        enabled: false
    asserts:
      - failedTemplate:
          errorMessage: 'inboundEmail.webhookSecret and inboundEmail.existingSecret.name are both set. Set one of them: to read the webhook secret from the Secret inbound-email-keys, clear webhookSecret (--set inboundEmail.webhookSecret="").'

  # ---------------------------------------------------------------------------
  # The e2e CronJob, probes and the global Runner
  # ---------------------------------------------------------------------------
  # The e2e CronJob runs the shared env helper too, so it reads the secret from
  # the operator's Secret like every other workload that is given it.
  - it: the e2e CronJob reads the webhook secret from the operator's Secret too
    templates:
      - templates/e2e-cron.yml
    set:
      <<: *existingSecret
      cronJobs:
        e2e:
          enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: INBOUND_EMAIL_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: oneuptime-inbound-email
                key: webhookSecret
      - notExists:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[?(@.name == "INBOUND_EMAIL_WEBHOOK_SECRET")].value

  - it: never gives a probe the webhook secret
    templates:
      - templates/probe.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: *existingSecret
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "INBOUND_EMAIL_WEBHOOK_SECRET")]

  - it: never gives the global Runner the webhook secret
    templates:
      - templates/global-runner.yaml
    documentSelector:
      path: kind
      value: Deployment
    set: *existingSecret
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "INBOUND_EMAIL_WEBHOOK_SECRET")]

  # ---------------------------------------------------------------------------
  # The schema
  # ---------------------------------------------------------------------------
  - it: refuses passwordKey, the key name other blocks use, so a misnamed key is not silently ignored
    templates:
      - templates/app.yaml
    set:
      inboundEmail:
        existingSecret:
          name: oneuptime-inbound-email
          passwordKey: webhookSecret
    asserts:
      - failedTemplate:
          errorPattern: "passwordKey"

  - it: refuses a Secret named as a string in place of the block
    templates:
      - templates/app.yaml
    set:
      inboundEmail:
        existingSecret: oneuptime-inbound-email
    asserts:
      - failedTemplate:
          errorPattern: "existingSecret"

  - it: refuses a Secret name that is not text
    templates:
      - templates/app.yaml
    set:
      inboundEmail:
        existingSecret:
          name: 1234
    asserts:
      - failedTemplate:
          errorPattern: "name"

  - it: refuses a key name that is a list
    templates:
      - templates/app.yaml
    set:
      inboundEmail:
        existingSecret:
          name: oneuptime-inbound-email
          webhookSecretKey:
            - webhookSecret
    asserts:
      - failedTemplate:
          errorPattern: "webhookSecretKey"
