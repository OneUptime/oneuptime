# CAL_WEBHOOK_SECRET is what stands between the public internet and the
# MarketingConversion ledger: App/API/CalWebhook.ts verifies every Cal booking
# webhook against it, and answers 503 when it is empty. Two things have to hold:
#
#   - the variable reaches the app pod at all. Without it the endpoint is dead
#     in a Helm install and every Cal delivery fails, silently losing bookings.
#   - a chart installed without the value still renders. `marketing` is an
#     optional block, so an unguarded .Values.marketing.cal.webhookSecret would
#     fail the whole template for every operator who never set it.
suite: cal webhook secret
release:
  name: oneuptime
  namespace: oneuptime
tests:
  - it: renders an empty secret when the operator never set one
    templates:
      - templates/app.yaml
    # app.yaml renders both a Service and a Deployment under the same name,
    # so select the Deployment by kind.
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CAL_WEBHOOK_SECRET
            value: ""

  - it: passes a configured secret to the app pod
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      marketing:
        cal:
          webhookSecret: cal-secret-value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CAL_WEBHOOK_SECRET
            value: cal-secret-value

  # A secret that is all digits must not be emitted as a YAML number.
  - it: quotes a numeric secret so it stays a string
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      marketing:
        cal:
          webhookSecret: "1234567890"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CAL_WEBHOOK_SECRET
            value: "1234567890"
