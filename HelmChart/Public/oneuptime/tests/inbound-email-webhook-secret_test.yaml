# Incoming email (inboundEmail.domain) takes an email from SendGrid only when
# the webhook URL ends with the installation's own inboundEmail.webhookSecret.
# Without one - empty, "secret", a config.example.env placeholder, or a
# placeholder the setup guide prints, in any case - the app refuses every
# email, and the provider tells no one. So `helm install` / `helm upgrade` say
# so, with what to set, in NOTES.txt; and the chart hands the value to the
# app as INBOUND_EMAIL_WEBHOOK_SECRET, exactly as given.
#
# The values that count as no secret mirror
# EnvironmentConfig.getUsableInboundEmailWebhookSecret (Common tests hold that
# one; InboundEmailWebhookSecretUpgradeDocs holds this warning's words).
suite: inbound email webhook secret
release:
  name: ou
  namespace: oneuptime
tests:
  - it: warns when incoming email is on and the webhook secret is empty
    set:
      inboundEmail.domain: inbound.example.com
    templates:
      - templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'ACTION REQUIRED -- incoming email is refused until inboundEmail\.webhookSecret is set\.'
      - matchRegexRaw:
          pattern: 'already ends with\s+a long random value of your own, set inboundEmail\.webhookSecret to that value'
      - matchRegexRaw:
          pattern: 'Otherwise change that URL first, to end with a new long\s+random value'
      - matchRegexRaw:
          pattern: '/incoming-email/sendgrid/<the new value>\s+then set inboundEmail\.webhookSecret to the same value and run helm upgrade\.'

  - it: warns for a webhook secret of whitespace alone
    set:
      inboundEmail.domain: inbound.example.com
      inboundEmail.webhookSecret: "   "
    templates:
      - templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'ACTION REQUIRED -- incoming email is refused'

  - it: warns for the value the code used to fall back to
    set:
      inboundEmail.domain: inbound.example.com
      inboundEmail.webhookSecret: secret
    templates:
      - templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'ACTION REQUIRED -- incoming email is refused'

  - it: warns for a config.example.env placeholder
    set:
      inboundEmail.domain: inbound.example.com
      inboundEmail.webhookSecret: please-change-this-to-random-value
    templates:
      - templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'ACTION REQUIRED -- incoming email is refused'

  - it: warns for the setup guide's values placeholder
    set:
      inboundEmail.domain: inbound.example.com
      inboundEmail.webhookSecret: replace-with-a-strong-random-secret
    templates:
      - templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'ACTION REQUIRED -- incoming email is refused'

  - it: warns for the setup guide's URL placeholder, whatever its case
    set:
      inboundEmail.domain: inbound.example.com
      inboundEmail.webhookSecret: YOUR_SECRET
    templates:
      - templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'ACTION REQUIRED -- incoming email is refused'

  - it: warns for the setup guide's example, padded
    set:
      inboundEmail.domain: inbound.example.com
      inboundEmail.webhookSecret: " Your-Secret "
    templates:
      - templates/NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'ACTION REQUIRED -- incoming email is refused'

  - it: says nothing once the webhook secret is the installation's own
    set:
      inboundEmail.domain: inbound.example.com
      inboundEmail.webhookSecret: 6f1c9a2e8b4d7f30a5c1e9b2d6f8a0c4e7b1d3f5a9c2e6b8
    templates:
      - templates/NOTES.txt
    asserts:
      - notMatchRegexRaw:
          pattern: 'incoming email is refused'

  - it: says nothing while incoming email is off
    templates:
      - templates/NOTES.txt
    asserts:
      - notMatchRegexRaw:
          pattern: 'incoming email is refused'

  - it: says nothing while incoming email is off, even with a placeholder secret
    set:
      inboundEmail.webhookSecret: YOUR_SECRET
    templates:
      - templates/NOTES.txt
    asserts:
      - notMatchRegexRaw:
          pattern: 'incoming email is refused'

  - it: hands the webhook secret to the app as it is given
    set:
      inboundEmail.domain: inbound.example.com
      inboundEmail.webhookSecret: 6f1c9a2e8b4d7f30a5c1e9b2d6f8a0c4e7b1d3f5a9c2e6b8
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_EMAIL_WEBHOOK_SECRET
            value: 6f1c9a2e8b4d7f30a5c1e9b2d6f8a0c4e7b1d3f5a9c2e6b8
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INBOUND_EMAIL_DOMAIN
            value: inbound.example.com
