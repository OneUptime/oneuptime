# The Probe supervisor intentionally remains root: it forks each untrusted
# synthetic execution with a fresh, low-privilege UID/GID. These assertions
# prevent chart changes from either breaking that UID drop or silently restoring
# the broad default container capability set.
suite: probe security context
templates:
  - templates/probe.yaml
release:
  name: oneuptime
  namespace: oneuptime
tests:
  - it: applies the safe operational defaults without forcing the supervisor non-root
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          value:
            - CHOWN
            - DAC_OVERRIDE
            - KILL
            - NET_RAW
            - SETGID
            - SETUID
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_SYNTHETIC_MONITOR_CHROMIUM_SANDBOX_ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_SYNTHETIC_MONITOR_MAX_PROCESS_TREE_RSS_BYTES
            value: "1610612736"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_SYNTHETIC_MONITOR_MAX_DISK_BYTES
            value: "268435456"
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: synthetic-runtime-tmp
            mountPath: /tmp
      - equal:
          path: spec.template.spec.volumes[0].emptyDir.sizeLimit
          value: 2Gi

  - it: renders custom per-run and pod-wide disk ceilings
    documentSelector:
      path: kind
      value: Deployment
    set:
      probes.one.syntheticMonitorMaxDiskBytes: 536870912
      probes.one.syntheticMonitorTempStorageSizeLimit: 3Gi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_SYNTHETIC_MONITOR_MAX_DISK_BYTES
            value: "536870912"
      - equal:
          path: spec.template.spec.volumes[0].emptyDir.sizeLimit
          value: 3Gi

  - it: permits an explicit service-account token opt-in
    documentSelector:
      path: kind
      value: Deployment
    set:
      probes.one.automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: accepts a Localhost Chromium profile while retaining the other defaults
    documentSelector:
      path: kind
      value: Deployment
    set:
      probes.one.containerSecurityContext.seccompProfile.type: Localhost
      probes.one.containerSecurityContext.seccompProfile.localhostProfile: profiles/oneuptime-playwright.json
      probes.one.syntheticMonitorChromiumSandboxEnabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: Localhost
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.localhostProfile
          value: profiles/oneuptime-playwright.json
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: SETUID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROBE_SYNTHETIC_MONITOR_CHROMIUM_SANDBOX_ENABLED
            value: "true"

  - it: replaces union-like seccomp profiles instead of retaining invalid stale fields
    documentSelector:
      path: kind
      value: Deployment
    set:
      containerSecurityContext.readOnlyRootFilesystem: false
      containerSecurityContext.seccompProfile.type: Localhost
      containerSecurityContext.seccompProfile.localhostProfile: profiles/global-playwright.json
      probes.one.containerSecurityContext.seccompProfile.type: RuntimeDefault
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - notExists:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.localhostProfile
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
