# The ClickHouse pods' own service account (clickhouse.serviceAccount.create).
# Kept by default, exactly as before. The Google Cloud Marketplace edition
# turns it off because Google does not let a chart create service accounts;
# the pods then run as the namespace's default one.
suite: clickhouse service account
release:
  name: oneuptime
  namespace: oneuptime
tests:
  - it: creates the ClickHouse service account by default
    templates:
      - templates/clickhouse-service.yaml
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - equal:
          path: metadata.name
          value: oneuptime-clickhouse

  - it: runs ClickHouse as that service account by default
    templates:
      - templates/clickhouse-statefulset.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: oneuptime-clickhouse

  - it: creates no service account when told not to
    templates:
      - templates/clickhouse-service.yaml
    set:
      clickhouse.serviceAccount.create: false
    asserts:
      # Only the two Services (the client one and the headless one) are left.
      - hasDocuments:
          count: 2
      - isKind:
          of: Service

  - it: runs ClickHouse as the default service account when told not to create one
    templates:
      - templates/clickhouse-statefulset.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    set:
      clickhouse.serviceAccount.create: false
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName
