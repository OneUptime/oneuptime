# Upgrading a release whose live Secret holds keys stored with the final
# newline of the file they were read from, as templates/secrets.yaml stored an
# inline key before #7337 (tests/inline-secrets-trim_test.yaml has the rest).
#
#   - An upgrade that still sets the inline keys rewrites the stored copies to
#     the keys without the whitespace around them: what every pod has used all
#     along, since pods read an inline key straight from the values.
#   - An upgrade that no longer sets them carries the stored copies over as
#     they are. The pods then read the keys from this Secret, so a stored
#     copy is never changed under them.
suite: inline keys stored as the pods use them, on upgrade
release:
  name: oneuptime
  namespace: oneuptime
  upgrade: true
# The release Secret as an earlier release left it, each key with a newline.
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: "v1"
        resource: "secrets"
      namespaced: true
  objects:
    - kind: Secret
      apiVersion: v1
      metadata:
        name: oneuptime-secrets
        namespace: oneuptime
      data:
        # "old-cluster-key\n"
        oneuptime-secret: b2xkLWNsdXN0ZXIta2V5Cg==
        # "old-encryption-key\n"
        encryption-secret: b2xkLWVuY3J5cHRpb24ta2V5Cg==
        # "old-register-key\n"
        register-probe-key: b2xkLXJlZ2lzdGVyLWtleQo=
        # "old-probe-key\n"
        probe-one: b2xkLXByb2JlLWtleQo=
tests:
  - it: rewrites each stored key to the inline key without its whitespace, the key the pods use
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    set:
      oneuptimeSecret: "old-cluster-key\n"
      encryptionSecret: "old-encryption-key\n"
      registerProbeKey: "old-register-key\n"
      probes.one.key: "old-probe-key\n"
    asserts:
      - equal:
          path: stringData.oneuptime-secret
          value: old-cluster-key
      - equal:
          path: stringData.encryption-secret
          value: old-encryption-key
      - equal:
          path: stringData.register-probe-key
          value: old-register-key
      - equal:
          path: stringData.probe-one
          value: old-probe-key

  - it: the pods use those same keys while the inline keys are set
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      oneuptimeSecret: "old-cluster-key\n"
      encryptionSecret: "old-encryption-key\n"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_SECRET
            value: old-cluster-key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENCRYPTION_SECRET
            value: old-encryption-key

  - it: carries each stored key over as it is once the inline keys are gone
    templates:
      - templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: oneuptime-secrets
    asserts:
      - equal:
          path: stringData.oneuptime-secret
          value: "old-cluster-key\n"
      - equal:
          path: stringData.encryption-secret
          value: "old-encryption-key\n"
      - equal:
          path: stringData.register-probe-key
          value: "old-register-key\n"
      - equal:
          path: stringData.probe-one
          value: "old-probe-key\n"

  - it: the pods then read the keys from that Secret
    templates:
      - templates/app.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ONEUPTIME_SECRET
            valueFrom:
              secretKeyRef:
                name: oneuptime-secrets
                key: oneuptime-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENCRYPTION_SECRET
            valueFrom:
              secretKeyRef:
                name: oneuptime-secrets
                key: encryption-secret
