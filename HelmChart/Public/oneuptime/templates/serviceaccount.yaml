{{- if and ($.Values.serviceAccount).create (not $.Values.deployment.disableDeployments) }}
# The service account the OneUptime app and worker pods run as
# (serviceAccount). On Amazon EKS, annotate it with the IAM role
# (eks.amazonaws.com/role-arn) that may bill this installation's users through
# AWS Marketplace; the AWS Marketplace edition usually runs as one the buyer
# created with eksctl instead (serviceAccount.name, create false).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oneuptime.serviceAccountName" $ | quote }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: oneuptime
    app.kubernetes.io/managed-by: Helm
    appname: oneuptime
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
