{{- if not $.Values.deployment.disableDeployments }}
{{- range $key, $val := $.Values.probes }}
{{- if or (not (hasKey $val "enabled")) $val.enabled }}
{{- $probeContainerSecurityContext := deepCopy (default (dict) $.Values.probeContainerSecurityContext) }}
{{- if $.Values.containerSecurityContext }}
{{- $probeContainerSecurityContext = mergeOverwrite $probeContainerSecurityContext $.Values.containerSecurityContext }}
{{- if hasKey $.Values.containerSecurityContext "seccompProfile" }}
{{- $_ := set $probeContainerSecurityContext "seccompProfile" (deepCopy $.Values.containerSecurityContext.seccompProfile) }}
{{- end }}
{{- end }}
{{- if $val.containerSecurityContext }}
{{- $probeContainerSecurityContext = mergeOverwrite $probeContainerSecurityContext $val.containerSecurityContext }}
{{- if hasKey $val.containerSecurityContext "seccompProfile" }}
{{- $_ := set $probeContainerSecurityContext "seccompProfile" (deepCopy $val.containerSecurityContext.seccompProfile) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $.Release.Name (printf "probe-%s" $key)  }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ printf "%s-%s" $.Release.Name (printf "probe-%s" $key)  }}
    app.kubernetes.io/part-of: oneuptime
    app.kubernetes.io/managed-by: Helm
    appname: oneuptime
    {{- if $.Values.deployment.includeTimestampLabel }}
    date: "{{ now | unixEpoch }}"
    {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ printf "%s-%s" $.Release.Name (printf "probe-%s" $key)  }}
  {{- if and (ne $val.replicaCount nil) $val.disableAutoscaler }}
  replicas: {{ $val.replicaCount }}
  {{- else }}
  {{- if or (not (eq (include "oneuptime.autoscalingEnabled" (dict "Values" $.Values "Override" $val.autoscaling)) "true")) ($val.disableAutoscaler) }}
  replicas: {{ $.Values.deployment.replicaCount }}
  {{- end }}
  {{- end }}
  strategy: {{- toYaml $.Values.deployment.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        app: {{ printf "%s-%s" $.Release.Name (printf "probe-%s" $key)  }}
        {{- if $.Values.deployment.includeTimestampLabel }}
        date: "{{ now | unixEpoch }}"
        {{- end }}
        appname: oneuptime
    spec:
      automountServiceAccountToken: {{ default false $val.automountServiceAccountToken }}
      # DNS resolution for probe pods. Probes resolve mostly EXTERNAL hostnames,
      # so the cluster default (ndots:5 + a multi-entry search list) fans every
      # lookup out into ~7 queries and funnels them through a single upstream
      # resolver, causing intermittent "getaddrinfo EAI_AGAIN" failures (false
      # monitor-down alerts) under load. The dnsConfig values (per-probe override
      # if set, otherwise the chart-wide `dnsConfig` default) set ndots:1 and add
      # fallback nameservers. dnsPolicy stays ClusterFirst (default) so the
      # in-cluster API (ONEUPTIME_URL, *.svc.cluster.local) keeps resolving.
      {{- if $val.dnsPolicy }}
      dnsPolicy: {{ $val.dnsPolicy }}
      {{- else if $.Values.dnsPolicy }}
      dnsPolicy: {{ $.Values.dnsPolicy }}
      {{- end }}
      {{- if $val.dnsConfig }}
      dnsConfig:
        {{- toYaml $val.dnsConfig | nindent 8 }}
      {{- else if $.Values.dnsConfig }}
      dnsConfig:
        {{- toYaml $.Values.dnsConfig | nindent 8 }}
      {{- end }}
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if $val.podSecurityContext }}
      securityContext:
        {{- toYaml $val.podSecurityContext | nindent 8 }}
      {{- else if $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if $val.hostAliases }}
      hostAliases:
        {{- toYaml $val.hostAliases | nindent 8 }}
      {{- else if $.Values.hostAliases }}
      hostAliases:
        {{- toYaml $.Values.hostAliases | nindent 8 }}
      {{- end }}
      {{- if $.Values.affinity }}
      affinity: {{- $.Values.affinity | toYaml | nindent 8 }}
      {{- end }}
      {{- if $.Values.tolerations }}
      tolerations: {{- $.Values.tolerations | toYaml | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- include "oneuptime.nodeSelector" ($val.nodeSelector | default $.Values.nodeSelector) | nindent 8 }}
      containers:
        - image: {{ include "oneuptime.image" (dict "Values" $.Values "ServiceName" "probe") }}
          name: {{ printf "%s-%s" $.Release.Name (printf "probe-%s" $key)  }}
          {{- if $probeContainerSecurityContext }}
          securityContext:
            {{- toYaml $probeContainerSecurityContext | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          volumeMounts:
            - name: synthetic-runtime-tmp
              mountPath: /tmp
            {{- with (default $.Values.extraVolumeMounts $val.extraVolumeMounts) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: BILLING_ENABLED
              value: {{ $.Values.billing.enabled | squote }}
            - name: LOG_LEVEL
              value: {{ $.Values.logLevel }}
            - name: PORT
              {{- if and $val.ports $val.ports.http }}
              value: {{ $val.ports.http | squote }}
              {{- else }}
              value: "3874"
              {{- end }}
            - name: OPENTELEMETRY_EXPORTER_OTLP_HEADERS
              value: {{ $.Values.openTelemetryExporter.headers }}
            - name: OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.openTelemetryExporter.endpoint }}
            - name: ONEUPTIME_URL
              value: http://{{ $.Release.Name }}-app.{{ $.Release.Namespace }}.svc.{{ $.Values.global.clusterDomain }}:{{ $.Values.app.ports.http }}
            - name: PROBE_NAME
              value: {{ $val.name }}
            - name: PROBE_DESCRIPTION
              value: {{ $val.description }}
            - name: PROBE_MONITORING_WORKERS
              value: {{ $val.monitoringWorkers | squote }}
              {{- if $val.monitorRetryLimit }}
            - name: PROBE_MONITOR_RETRY_LIMIT
              value: {{ $val.monitorRetryLimit | squote }}
              {{- else }}
            - name: PROBE_MONITOR_RETRY_LIMIT
              value: {{ 3 | squote }}
              {{- end }}
            # syntheticMonitorScriptTimeoutInMs
            - name: PROBE_SYNTHETIC_MONITOR_SCRIPT_TIMEOUT_IN_MS
              value: {{ $val.syntheticMonitorScriptTimeoutInMs | squote }}
            - name: PROBE_SYNTHETIC_MONITOR_MAX_CONCURRENCY
              value: {{ default 4 $val.syntheticMonitorMaxConcurrency | squote }}
            - name: PROBE_SYNTHETIC_MONITOR_MAX_PROCESS_TREE_RSS_BYTES
              value: {{ printf "%.0f" (float64 (default 1610612736 $val.syntheticMonitorMaxProcessTreeRssBytes)) | squote }}
            - name: PROBE_SYNTHETIC_MONITOR_MAX_DISK_BYTES
              value: {{ printf "%.0f" (float64 (default 268435456 $val.syntheticMonitorMaxDiskBytes)) | squote }}
            - name: PROBE_SYNTHETIC_MONITOR_CHROMIUM_SANDBOX_ENABLED
              value: {{ default false $val.syntheticMonitorChromiumSandboxEnabled | squote }}
            # Whether API, Website, External Status Page and Custom JavaScript
            # Code monitors on this private probe may reach private network
            # addresses. Ignored by auto-registered global probes.
            - name: PROBE_ALLOW_PRIVATE_NETWORK_MONITORS
              value: {{ default false $val.allowPrivateNetworkMonitors | squote }}
            - name: PROBE_CUSTOM_CODE_MONITOR_SCRIPT_TIMEOUT_IN_MS
              value: {{ $val.customCodeMonitorScriptTimeoutInMs | squote }}
            - name: PROBE_KEY
              {{- if $val.key }}
              value: {{ $val.key }}
              {{- else if (($val.existingSecret).name) }}
              valueFrom:
                secretKeyRef:
                  name: {{ $val.existingSecret.name }}
                  key: {{ $val.existingSecret.passwordKey }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-%s" $.Release.Name "secrets"  }}
                  key: {{printf "probe-%s" $key}}
              {{- end }}
            - name: PROBE_MONITOR_FETCH_LIMIT
              value: {{ $val.monitorFetchLimit | squote }}
            {{- if $val.networkDevicePollConcurrency }}
            - name: PROBE_NETWORK_DEVICE_POLL_CONCURRENCY
              value: {{ $val.networkDevicePollConcurrency | squote }}
            {{- end }}
            {{- if $val.snmpGetChunkSize }}
            - name: PROBE_SNMP_GET_CHUNK_SIZE
              value: {{ $val.snmpGetChunkSize | squote }}
            {{- end }}
            {{- if $val.disableTelemetryCollection }}
            - name: DISABLE_TELEMETRY
              value: {{ $val.disableTelemetryCollection | quote }}
            {{- end }}
            {{- if $val.enableProfiling }}
            - name: ENABLE_PROFILING
              value: {{ $val.enableProfiling | quote }}
            {{- end }}
            {{- if and $val.proxy $val.proxy.httpProxyUrl }}
            - name: HTTP_PROXY_URL
              value: {{ $val.proxy.httpProxyUrl | squote }}
            {{- end }}
            {{- if and $val.proxy $val.proxy.httpsProxyUrl }}
            - name: HTTPS_PROXY_URL
              value: {{ $val.proxy.httpsProxyUrl | squote }}
            {{- end }}
            {{- if and $val.proxy $val.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ $val.proxy.noProxy | squote }}
            {{- end }}
            {{- include "oneuptime.env.registerProbeKey" (dict "Values" $.Values "Release" $.Release) | nindent 12 }}
            {{- with (default $.Values.extraEnv $val.extraEnv) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ if and $val.ports $val.ports.http }}{{ $val.ports.http }}{{ else }}3874{{ end }}
              protocol: TCP
              name: http
          {{- if $val.resources }}
          resources:
            {{- toYaml $val.resources | nindent 12 }}
          {{- end }}
        {{- if $val.additionalContainers }}
        {{ toYaml $val.additionalContainers | nindent 8 }}
        {{- end }}
      volumes:
        - name: synthetic-runtime-tmp
          emptyDir:
            sizeLimit: {{ default "2Gi" $val.syntheticMonitorTempStorageSizeLimit | quote }}
        {{- with (default $.Values.extraVolumes $val.extraVolumes) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      restartPolicy: {{ $.Values.image.restartPolicy }}
---

{{- if and (not $val.disableAutoscaler) (not (and $.Values.keda.enabled (and $val.keda $val.keda.enabled))) }}
# OneUptime probe autoscaler
{{- $probeAutoScalerArgs := dict "ServiceName" (printf "probe-%s" $key) "Release" $.Release "Values" $.Values "Override" $val.autoscaling -}}
{{- include "oneuptime.autoscaler" $probeAutoScalerArgs }}
{{- end }}
---

# OneUptime probe PodDisruptionBudget
{{- include "oneuptime.pdb" (dict "ServiceName" (printf "probe-%s" $key) "Override" $val.podDisruptionBudget "Release" $.Release "Values" $.Values) }}
---

{{- end }}

# OneUptime probe Service
{{- $probePort := 3874 }}
{{- if and $val.ports $val.ports.http }}
{{- $probePort = $val.ports.http }}
{{- end }}
{{- $probePorts := dict "port" $probePort -}}
{{- $probeServiceArgs := dict "ServiceName" (printf "probe-%s" $key) "Ports" $probePorts "Release" $.Release "Values" $.Values -}}
{{- include "oneuptime.service" $probeServiceArgs }}
---

{{- end }}
{{- end }}
