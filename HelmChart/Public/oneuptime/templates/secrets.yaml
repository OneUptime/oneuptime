---

{{- /*
  The Altinity operator's own ClickHouse user ("clickhouse_operator"), which it
  manages every ClickHouseInstallation with. Its chart's Secret ships the same
  password to every installation, so this chart renders the Secret instead
  (altinity-clickhouse-operator.secret.create is false), under the name the
  operator reads it by, with a password of the installation's own.

  The operator reads it only when it starts, and gives it to each
  ClickHouseInstallation as it reconciles them, so a stored password is never
  changed here: one set in values wins, then the stored one, then a new random
  one.
*/}}
{{- $operatorValues := index .Values "altinity-clickhouse-operator" | default dict }}
{{- $operatorSecret := $operatorValues.secret | default dict }}
{{- if and $altinity.enabled $operatorSecret.create (not $operatorSecret.password) }}
{{- fail "altinity-clickhouse-operator.secret.create is true, so the operator's own chart renders its credentials Secret, but altinity-clickhouse-operator.secret.password is empty. Set it to a long random value, or leave secret.create false to have this chart make one." }}
{{- end }}
{{- if and $altinity.enabled (not $operatorSecret.create) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oneuptime.altinityOperator.fullname" . }}
  namespace: {{ include "oneuptime.altinityOperator.namespace" . }}
  labels:
    app.kubernetes.io/name: altinity-clickhouse-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: clickhouse-operator
    app.kubernetes.io/part-of: oneuptime
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  username: {{ $operatorSecret.username | default "clickhouse_operator" | quote }}
  password: {{ include "oneuptime.altinityOperator.password" . | default (randAlphaNum 32) | quote }}
{{- end }}

---


# Clickhouse Configuration
