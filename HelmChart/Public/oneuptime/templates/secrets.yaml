{{- /*
  Keys that are served by a Secret the user manages must NOT be generated here.
  Every pod reads them straight from that Secret, so generating them anyway
  leaves unused random values in the chart-managed Secret that get re-randomised
  on every render — which makes `helm diff`/`helm upgrade` claim the secrets are
  about to be rotated. See https://github.com/OneUptime/oneuptime/issues/3121

  Three of these live in the `externalSecrets` block; the probe and runner
  identity keys are per-component, so they live beside the literal value they
  replace, at `probes.<name>.existingSecret`, `runner.existingSecret` and
  `globalRunner.existingSecret`.

  An explicit `.Values.<secret>` still wins over either, because that is the
  precedence the env helpers in _helpers.tpl and the deployments use.
*/ -}}
{{- $externalOneuptimeSecret := ((($.Values.externalSecrets).oneuptimeSecret).existingSecret).name }}
{{- $externalRegisterProbeKey := ((($.Values.externalSecrets).registerProbeKey).existingSecret).name }}
{{- $externalEncryptionSecret := ((($.Values.externalSecrets).encryptionSecret).existingSecret).name }}
{{- $externalRunnerKey := (($.Values.runner.existingSecret).name) }}
{{- $externalGlobalRunnerKey := ((($.Values.globalRunner).existingSecret).name) }}
{{- /*
  Existing chart-managed Secret, looked up once. `lookup` returns an empty dict
  on install (and on client-side dry runs), so guard every read with `default dict`
  instead of dereferencing `.data` directly.
*/ -}}
{{- $existingSecretData := ((lookup "v1" "Secret" $.Release.Namespace (printf "%s-secrets" $.Release.Name)).data) | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" $.Release.Name "secrets"  }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  ## Secrets Change when the release is upgraded
  ## https://github.com/helm/helm-www/issues/1259
  ## This is a workaround to keep the secrets unchanged
  {{- if .Release.IsUpgrade }}

  {{- if .Values.oneuptimeSecret }}
  oneuptime-secret: {{ .Values.oneuptimeSecret | quote }}
  {{- else if not $externalOneuptimeSecret }}
  {{- if (index $existingSecretData "oneuptime-secret") }}
  oneuptime-secret: {{ index $existingSecretData "oneuptime-secret" | b64dec | quote }}
  {{- else }}
  oneuptime-secret: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.registerProbeKey }}
  register-probe-key: {{ .Values.registerProbeKey | quote }}
  {{- else if not $externalRegisterProbeKey }}
  {{- if (index $existingSecretData "register-probe-key") }}
  register-probe-key: {{ index $existingSecretData "register-probe-key" | b64dec | quote }}
  {{- else }}
  register-probe-key: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.encryptionSecret }}
  encryption-secret: {{ .Values.encryptionSecret | quote }}
  {{- else if not $externalEncryptionSecret }}
  {{- if (index $existingSecretData "encryption-secret") }}
  encryption-secret: {{ index $existingSecretData "encryption-secret" | b64dec | quote }}
  {{- else }}
  encryption-secret: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}

  {{- range $key, $val := $.Values.probes }}
  {{- if $val.key }}
  {{printf "probe-%s" $key}}: {{ $val.key | quote }}
  {{- else if (($val.existingSecret).name) }}
  {{- /* served by the user's own Secret — emit nothing */}}
  {{- else if (index $existingSecretData (printf "probe-%s" $key)) }}
  {{printf "probe-%s" $key}}: {{ index $existingSecretData (printf "probe-%s" $key) | b64dec | quote }}
  {{- else }}
  {{printf "probe-%s" $key}}: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}

  {{- if and $.Values.runner.enabled (not $.Values.runner.key) (not $externalRunnerKey) }}
  {{- if (index $existingSecretData "runner-key") }}
  runner-key: {{ index $existingSecretData "runner-key" | b64dec | quote }}
  {{- else }}
  runner-key: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}

  {{- if and (($.Values.globalRunner).enabled) (not (($.Values.globalRunner).key)) (not $externalGlobalRunnerKey) }}
  {{- if (index $existingSecretData "global-runner-key") }}
  global-runner-key: {{ index $existingSecretData "global-runner-key" | b64dec | quote }}
  {{- else }}
  global-runner-key: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}

  {{ else }} # install operation

  {{- if .Values.oneuptimeSecret }}
  oneuptime-secret: {{ .Values.oneuptimeSecret | quote }}
  {{- else if not $externalOneuptimeSecret }}
  oneuptime-secret: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.registerProbeKey }}
  register-probe-key: {{ .Values.registerProbeKey | quote }}
  {{- else if not $externalRegisterProbeKey }}
  register-probe-key: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.encryptionSecret }}
  encryption-secret: {{ .Values.encryptionSecret | quote }}
  {{- else if not $externalEncryptionSecret }}
  encryption-secret: {{ randAlphaNum 32 | quote }}
  {{- end }}

  {{- range $key, $val := $.Values.probes }}
  {{- if $val.key }}
  {{printf "probe-%s" $key}}: {{ $val.key | quote }}
  {{- else if (($val.existingSecret).name) }}
  {{- /* served by the user's own Secret — emit nothing */}}
  {{- else if (index $existingSecretData (printf "probe-%s" $key)) }}
  {{printf "probe-%s" $key}}: {{ index $existingSecretData (printf "probe-%s" $key) | b64dec | quote }}
  {{- else }}
  {{printf "probe-%s" $key}}: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}

  {{- if and $.Values.runner.enabled (not $.Values.runner.key) (not $externalRunnerKey) }}
  runner-key: {{ randAlphaNum 32 | quote }}
  {{- end }}

  {{- if and (($.Values.globalRunner).enabled) (not (($.Values.globalRunner).key)) (not $externalGlobalRunnerKey) }}
  global-runner-key: {{ randAlphaNum 32 | quote }}
  {{- end }}

  {{ end }}

---

{{- $valkey := include "oneuptime.valkey" . | fromYaml }}
{{- if and $valkey.enabled (not $valkey.auth.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-valkey
    app.kubernetes.io/part-of: oneuptime
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: valkey
    appname: oneuptime
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  {{- if .Release.IsUpgrade }}
  {{/*
    Both secrets are looked up, because this one was called <release>-redis with
    a `redis-password` key until 13.0.0. An upgrade across that rename finds
    nothing under the new name and would otherwise mint a fresh random password
    -- which the app pods and the Valkey pod would both pick up, so nothing
    would visibly fail, it would just silently invalidate every externally
    configured copy of that credential. Carrying the old value over is what
    makes the rename a no-op for an existing release.

    The old secret is annotated resource-policy: keep, so it is still there to
    be read (and stays behind afterwards -- delete it once the upgrade sticks).
  */}}
  {{- $existingValkeySecretData := ((lookup "v1" "Secret" $.Release.Namespace (printf "%s-valkey" $.Release.Name)).data) | default dict }}
  {{- $existingRedisSecretData := ((lookup "v1" "Secret" $.Release.Namespace (printf "%s-redis" $.Release.Name)).data) | default dict }}
  {{- if $valkey.auth.password }}
  valkey-password: {{ $valkey.auth.password | quote }}
  {{- else if (index $existingValkeySecretData "valkey-password") }}
  valkey-password: {{ index $existingValkeySecretData "valkey-password" | b64dec | quote }}
  {{- else if (index $existingRedisSecretData "redis-password") }}
  valkey-password: {{ index $existingRedisSecretData "redis-password" | b64dec | quote }}
  {{- else }}
  valkey-password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- else }}
  {{- if $valkey.auth.password }}
  valkey-password: {{ $valkey.auth.password | quote }}
  {{- else }}
  valkey-password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
{{- end }}

---

{{- if and (not $.Values.postgresql.enabled) (not $.Values.postgresOperator.cnpg.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" $.Release.Name "external-postgres"  }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:

  key: "postgres"

  {{- if $.Values.externalPostgres.password }}
  ## Add secret here for externalPostgresPassword
  password: {{ $.Values.externalPostgres.password | quote }}
  {{- end }}

  {{- if $.Values.externalPostgres.ssl.enabled -}}
  ## Add secret here for externalPostgresPassword
  {{- if $.Values.externalPostgres.ssl.ca }}
  ssl-ca: {{ printf "%s" $.Values.externalPostgres.ssl.ca | quote }}
  {{- end }}

  {{- if $.Values.externalPostgres.ssl.cert }}
  ssl-cert: {{ printf "%s" $.Values.externalPostgres.ssl.cert | quote }}
  {{- end }}

  {{- if $.Values.externalPostgres.ssl.key }}
  ssl-key: {{ printf "%s" $.Values.externalPostgres.ssl.key | quote }}
  {{- end }}

  {{- end -}}

{{- end }}
---


## External cache (Valkey / any Redis-protocol server) configuration
{{- $valkey := include "oneuptime.valkey" . | fromYaml }}
{{- $externalValkey := include "oneuptime.externalValkey" . | fromYaml }}
{{- if not $valkey.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" $.Release.Name "external-valkey"  }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:

  key: "valkey"
  {{- if $externalValkey.password }}
  ## Add secret here for externalValkey password
  password: {{ $externalValkey.password | quote }}
  {{- end }}

  {{- if $externalValkey.tls.enabled -}}

  {{- if $externalValkey.tls.ca }}
  tls-ca: {{ printf "%s" $externalValkey.tls.ca | quote }}
  {{- end }}


  {{- if $externalValkey.tls.cert }}
  tls-cert: {{ printf "%s" $externalValkey.tls.cert | quote }}
  {{- end }}

  {{- if $externalValkey.tls.key }}
  tls-key: {{ printf "%s" $externalValkey.tls.key | quote }}
  {{- end }}

  {{- end -}}

{{- end }}
---

{{- if and .Values.postgresql.enabled (not .Values.postgresOperator.cnpg.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-postgresql
    app.kubernetes.io/part-of: oneuptime
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: postgresql
    appname: oneuptime
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  {{- if .Release.IsUpgrade }}
  {{- $existingPostgresSecretData := ((lookup "v1" "Secret" $.Release.Namespace (printf "%s-postgresql" $.Release.Name)).data) | default dict }}
  {{- if .Values.postgresql.auth.postgresPassword }}
  postgres-password: {{ .Values.postgresql.auth.postgresPassword | quote }}
  {{- else if .Values.postgresql.auth.password }}
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  {{- else }}
  {{- if (index $existingPostgresSecretData "postgres-password") }}
  postgres-password: {{ index $existingPostgresSecretData "postgres-password" | b64dec | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
  {{- else }}
  {{- if .Values.postgresql.auth.postgresPassword }}
  postgres-password: {{ .Values.postgresql.auth.postgresPassword | quote }}
  {{- else if .Values.postgresql.auth.password }}
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
{{- end }}

---

{{- $cnpg := .Values.postgresOperator.cnpg }}
{{- if $cnpg.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgresql-cnpg-superuser
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-postgresql
    app.kubernetes.io/part-of: oneuptime
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: postgresql
    appname: oneuptime
    cnpg.io/reload: "true"
  annotations:
    "helm.sh/resource-policy": "keep"
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  {{- if .Release.IsUpgrade }}
  {{- if $cnpg.postgresPassword }}
  password: {{ $cnpg.postgresPassword | quote }}
  {{- else }}
  {{- $existing := (lookup "v1" "Secret" $.Release.Namespace (printf "%s-postgresql-cnpg-superuser" $.Release.Name)) }}
  {{- $existingPw := index (($existing).data | default dict) "password" }}
  {{- if $existingPw }}
  password: {{ $existingPw | b64dec | quote }}
  {{- else }}
  password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
  {{- else }}
  {{- if $cnpg.postgresPassword }}
  password: {{ $cnpg.postgresPassword | quote }}
  {{- else }}
  password: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
{{- end }}

