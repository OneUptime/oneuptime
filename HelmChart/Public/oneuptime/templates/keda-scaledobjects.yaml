{{/*
KEDA ScaledObjects for various services
*/}}

{{/* Guard: the global keda.enabled flag gates BOTH the bundled KEDA operator
     subchart (`condition: keda.enabled` in Chart.yaml) and every ScaledObject
     below, and it ships false. A per-service keda.enabled that is true while
     the global flag is false is therefore a silent no-op on a fresh install —
     no ScaledObject is rendered at all — and worse on an upgrade from a release
     that had the global flag on: the operator is uninstalled while the
     ScaledObjects it was reconciling are left orphaned, which stops autoscaling
     on a live tier without any error. Fail the render instead.

     A tier with `disableAutoscaler: true` is NOT an offender: its ScaledObject
     is skipped by the render conditions below even with the global flag on, so
     there is nothing to orphan and nothing the global flag would change.
     Reporting it would send the operator to a "fix" that installs the three
     KEDA operator Deployments and still renders no ScaledObject and no HPA for
     that tier.

     The exclusion must keep mirroring the render conditions below. It does
     today for all five tiers: telemetryWriter is the one whose ScaledObject
     ignores disableAutoscaler, and it has no such key to ignore —
     values.schema.json pins telemetryWriter to `additionalProperties: false`
     without one, so setting it is a schema error, not a silent excuse. If that
     key is ever added to the schema, its render condition below must start
     honouring it too or this loop must stop excusing it. */}}
{{- if and (not .Values.keda.enabled) (not .Values.deployment.disableDeployments) }}
{{- $orphaned := list }}
{{- range $key, $val := .Values.probes }}
{{- if and $val.keda $val.keda.enabled (not $val.disableAutoscaler) }}
{{- $orphaned = append $orphaned (printf "probes.%s.keda.enabled" $key) }}
{{- end }}
{{- end }}
{{- range $service := list "app" "worker" "telemetryWriter" "runner" }}
{{- $serviceValues := get $.Values $service }}
{{- if and $serviceValues $serviceValues.keda $serviceValues.keda.enabled (not $serviceValues.disableAutoscaler) }}
{{- $orphaned = append $orphaned (printf "%s.keda.enabled" $service) }}
{{- end }}
{{- end }}
{{- if $orphaned }}
{{- fail (printf "the global keda.enabled is false but these per-service KEDA flags are true: %s. The global flag gates both the bundled KEDA operator (see the dependency condition in Chart.yaml) and every ScaledObject in this chart, so no ScaledObject would be rendered — and on upgrade from a release that had it on, the operator would be uninstalled while the live ScaledObjects it was reconciling are left orphaned. Set keda.enabled=true to autoscale those services with KEDA, or set them back to false to fall back to the plain HorizontalPodAutoscaler." (join ", " $orphaned)) }}
{{- end }}
{{- end }}

{{/* Probe KEDA ScaledObjects - one for each probe configuration */}}
{{- range $key, $val := $.Values.probes }}
{{- $probeEnabled := or (not (hasKey $val "enabled")) $val.enabled }}
{{- if and $.Values.keda.enabled $probeEnabled (and $val.keda $val.keda.enabled) (not $val.disableAutoscaler) (not $.Values.deployment.disableDeployments) }}
{{- $serviceName := printf "probe-%s" $key }}
{{- $probePort := 3874 }}
{{- if and $val.ports $val.ports.http }}
{{- $probePort = $val.ports.http }}
{{- end }}
{{- $metricsConfig := dict "enabled" $val.keda.enabled "minReplicas" $val.keda.minReplicas "maxReplicas" $val.keda.maxReplicas "pollingInterval" $val.keda.pollingInterval "cooldownPeriod" $val.keda.cooldownPeriod "fallback" $val.keda.fallback "triggers" (list (dict "query" "oneuptime_probe_queue_size" "threshold" $val.keda.queueSizeThreshold "port" $probePort)) }}
{{- $probeKedaArgs := dict "ServiceName" $serviceName "Release" $.Release "Values" $.Values "MetricsConfig" $metricsConfig "DisableAutoscaler" $val.disableAutoscaler }}
{{- include "oneuptime.kedaScaledObject" $probeKedaArgs }}
{{- end }}
{{- end }}

{{/* App KEDA ScaledObject.
     Combined (default) mode: scales on combined queue backlog (waiting + delayed jobs across worker + workflow + telemetry + runbook).
     Split mode (worker.enabled): the worker deployment drains the queues, so the app must
     NOT scale on queue depth — its queue-size trigger is dropped and it scales on CPU/memory. */}}
{{- if and .Values.keda.enabled .Values.app.enabled .Values.app.keda.enabled (not .Values.app.disableAutoscaler) (not .Values.deployment.disableDeployments) }}
{{- $appResources := .Values.app.resources | default dict }}
{{- $appRequests := get $appResources "requests" | default dict }}
{{- if and (gt (int (.Values.app.keda.targetCPUUtilizationPercentage | default 0)) 0) (not (get $appRequests "cpu")) }}
{{- fail "app.keda.targetCPUUtilizationPercentage requires app.resources.requests.cpu to be set" }}
{{- end }}
{{- if and (gt (int (.Values.app.keda.targetMemoryUtilizationPercentage | default 0)) 0) (not (get $appRequests "memory")) }}
{{- fail "app.keda.targetMemoryUtilizationPercentage requires app.resources.requests.memory to be set" }}
{{- end }}
{{- $appQueueTriggers := list (dict "query" "oneuptime_app_queue_size" "threshold" .Values.app.keda.queueSizeThreshold "port" .Values.app.ports.http) }}
{{- if .Values.worker.enabled }}
{{- if and (le (int (.Values.app.keda.targetCPUUtilizationPercentage | default 0)) 0) (le (int (.Values.app.keda.targetMemoryUtilizationPercentage | default 0)) 0) }}
{{- fail "worker.enabled drops the app's queue-size autoscaling trigger; set app.keda.targetCPUUtilizationPercentage (with app.resources.requests.cpu) and/or app.keda.targetMemoryUtilizationPercentage so the api tier still has an autoscaling trigger." }}
{{- end }}
{{- $appQueueTriggers = list }}
{{- end }}
{{- $metricsConfig := dict "enabled" .Values.app.keda.enabled "minReplicas" .Values.app.keda.minReplicas "maxReplicas" .Values.app.keda.maxReplicas "pollingInterval" .Values.app.keda.pollingInterval "cooldownPeriod" .Values.app.keda.cooldownPeriod "fallback" .Values.app.keda.fallback "targetCPUUtilizationPercentage" .Values.app.keda.targetCPUUtilizationPercentage "targetMemoryUtilizationPercentage" .Values.app.keda.targetMemoryUtilizationPercentage "triggers" $appQueueTriggers }}
{{- $appKedaArgs := dict "ServiceName" "app" "Release" .Release "Values" .Values "MetricsConfig" $metricsConfig "DisableAutoscaler" .Values.app.disableAutoscaler }}
{{- include "oneuptime.kedaScaledObject" $appKedaArgs }}
{{- end }}

{{/* Worker KEDA ScaledObject - scales the dedicated worker on combined queue backlog (waiting + delayed)
     (worker + workflow + telemetry + runbook) plus optional CPU/memory utilization. KEDA scales
     to the max desired replicas across all triggers. */}}
{{- if and .Values.keda.enabled .Values.worker.enabled .Values.worker.keda.enabled (not .Values.worker.disableAutoscaler) (not .Values.deployment.disableDeployments) }}
{{- $workerResources := .Values.worker.resources | default dict }}
{{- $workerRequests := get $workerResources "requests" | default dict }}
{{- if and (gt (int (.Values.worker.keda.targetCPUUtilizationPercentage | default 0)) 0) (not (get $workerRequests "cpu")) }}
{{- fail "worker.keda.targetCPUUtilizationPercentage requires worker.resources.requests.cpu to be set" }}
{{- end }}
{{- if and (gt (int (.Values.worker.keda.targetMemoryUtilizationPercentage | default 0)) 0) (not (get $workerRequests "memory")) }}
{{- fail "worker.keda.targetMemoryUtilizationPercentage requires worker.resources.requests.memory to be set" }}
{{- end }}
{{- $metricsConfig := dict "enabled" .Values.worker.keda.enabled "minReplicas" .Values.worker.keda.minReplicas "maxReplicas" .Values.worker.keda.maxReplicas "pollingInterval" .Values.worker.keda.pollingInterval "cooldownPeriod" .Values.worker.keda.cooldownPeriod "fallback" .Values.worker.keda.fallback "targetCPUUtilizationPercentage" .Values.worker.keda.targetCPUUtilizationPercentage "targetMemoryUtilizationPercentage" .Values.worker.keda.targetMemoryUtilizationPercentage "triggers" (list (dict "query" "oneuptime_worker_queue_size" "threshold" .Values.worker.keda.queueSizeThreshold "port" .Values.worker.ports.http)) }}
{{- $workerKedaArgs := dict "ServiceName" "worker" "Release" .Release "Values" .Values "MetricsConfig" $metricsConfig "DisableAutoscaler" .Values.worker.disableAutoscaler }}
{{- include "oneuptime.kedaScaledObject" $workerKedaArgs }}
{{- end }}

{{/* Telemetry-writer KEDA ScaledObject — scales the writer tier on its
     fleet-wide shed rate: 429s rejected across ALL writer pods over roughly
     the last two minutes, read from a shared Redis counter via whichever pod
     KEDA polls (/metrics/telemetry-writer-shed-rate). Sustained shedding
     while ClickHouse is healthy is the one honest "tier too small" signal.
     Deliberately NOT scaled on queue depth — queue growth is the worker
     fleet's scale signal; reacting to it here would hand ClickHouse the very
     burst this tier exists to absorb. Optional CPU/memory triggers compose.
     Keep maxReplicas x telemetryFanInMaxConcurrentInserts inside the
     ClickHouse max_concurrent_queries budget. */}}
{{- if and .Values.keda.enabled .Values.telemetryWriter.enabled ((.Values.telemetryWriter.keda).enabled) (not .Values.deployment.disableDeployments) }}
{{- $twResources := .Values.telemetryWriter.resources | default dict }}
{{- $twRequests := get $twResources "requests" | default dict }}
{{- if and (gt (int (.Values.telemetryWriter.keda.targetCPUUtilizationPercentage | default 0)) 0) (not (get $twRequests "cpu")) }}
{{- fail "telemetryWriter.keda.targetCPUUtilizationPercentage requires telemetryWriter.resources.requests.cpu to be set" }}
{{- end }}
{{- if and (gt (int (.Values.telemetryWriter.keda.targetMemoryUtilizationPercentage | default 0)) 0) (not (get $twRequests "memory")) }}
{{- fail "telemetryWriter.keda.targetMemoryUtilizationPercentage requires telemetryWriter.resources.requests.memory to be set" }}
{{- end }}
{{- $metricsConfig := dict "enabled" .Values.telemetryWriter.keda.enabled "minReplicas" .Values.telemetryWriter.keda.minReplicas "maxReplicas" .Values.telemetryWriter.keda.maxReplicas "pollingInterval" .Values.telemetryWriter.keda.pollingInterval "cooldownPeriod" .Values.telemetryWriter.keda.cooldownPeriod "fallback" .Values.telemetryWriter.keda.fallback "targetCPUUtilizationPercentage" .Values.telemetryWriter.keda.targetCPUUtilizationPercentage "targetMemoryUtilizationPercentage" .Values.telemetryWriter.keda.targetMemoryUtilizationPercentage "triggers" (list (dict "threshold" .Values.telemetryWriter.keda.shedCountThreshold "port" .Values.telemetryWriter.ports.http "urlPath" "/metrics/telemetry-writer-shed-rate" "valueLocation" "shedCount")) }}
{{- $twKedaArgs := dict "ServiceName" "telemetry-writer" "Release" .Release "Values" .Values "MetricsConfig" $metricsConfig "DisableAutoscaler" false }}
{{- include "oneuptime.kedaScaledObject" $twKedaArgs }}
{{- end }}

{{/* AI Agent KEDA ScaledObject */}}
{{- if and .Values.keda.enabled .Values.runner.enabled .Values.runner.keda.enabled (not .Values.runner.disableAutoscaler) (not .Values.deployment.disableDeployments) }}
{{- $metricsConfig := dict "enabled" .Values.runner.keda.enabled "minReplicas" .Values.runner.keda.minReplicas "maxReplicas" .Values.runner.keda.maxReplicas "pollingInterval" .Values.runner.keda.pollingInterval "cooldownPeriod" .Values.runner.keda.cooldownPeriod "fallback" .Values.runner.keda.fallback "triggers" (list (dict "query" "oneuptime_ai_agent_queue_size" "threshold" .Values.runner.keda.queueSizeThreshold "port" .Values.runner.ports.http)) }}
{{- $runnerKedaArgs := dict "ServiceName" "runner" "Release" .Release "Values" .Values "MetricsConfig" $metricsConfig "DisableAutoscaler" .Values.runner.disableAutoscaler }}
{{- include "oneuptime.kedaScaledObject" $runnerKedaArgs }}
{{- end }}
