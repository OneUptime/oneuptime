{{- $valkey := include "oneuptime.valkey" . | fromYaml }}
{{- if $valkey.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-valkey
    app.kubernetes.io/part-of: oneuptime
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: valkey
    appname: oneuptime
spec:
  serviceName: {{ .Release.Name }}-valkey-headless
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-valkey
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-valkey
        app.kubernetes.io/part-of: oneuptime
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: valkey
        appname: oneuptime
    spec:
      nodeSelector:
        {{- include "oneuptime.nodeSelector" $valkey.master.nodeSelector | nindent 8 }}
      {{- with $valkey.master.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $valkey.master.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $valkey.master.podSecurityContext }}
      {{- with $valkey.master.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- else if .Values.podSecurityContext }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: valkey
        image: "{{ $valkey.image.repository }}:{{ $valkey.image.tag }}"
        imagePullPolicy: {{ $valkey.image.pullPolicy }}
        {{- if $valkey.master.containerSecurityContext }}
        securityContext:
          {{- with $valkey.master.containerSecurityContext }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- else if .Values.containerSecurityContext }}
        securityContext:
          {{- with .Values.containerSecurityContext }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
        command:
          - sh
          - -c
          - |
            # `set -e` is load-bearing, not hygiene. Without it a sed that cannot
            # read the template leaves an EMPTY /tmp/valkey.conf behind, and the
            # server would boot on stock defaults -- no requirepass, open to the
            # whole pod network. Failing the container is the only safe outcome.
            set -e
            # Replace ${VALKEY_PASSWORD} with actual password in config file
            sed "s/\${VALKEY_PASSWORD}/${VALKEY_PASSWORD}/g" /etc/valkey/valkey.conf.template > /tmp/valkey.conf
            exec valkey-server /tmp/valkey.conf
        ports:
        - name: valkey
          containerPort: 6379
          protocol: TCP
        env:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              {{- if $valkey.auth.existingSecret.name }}
              name: {{ $valkey.auth.existingSecret.name }}
              key: {{ $valkey.auth.existingSecret.passwordKey }}
              {{- else }}
              name: {{ .Release.Name }}-valkey
              key: valkey-password
              {{- end }}
        {{- if $valkey.livenessProbe.enabled }}
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - -a
            - $(VALKEY_PASSWORD)
            - ping
          initialDelaySeconds: {{ $valkey.livenessProbe.initialDelaySeconds }}
          timeoutSeconds: {{ $valkey.livenessProbe.timeoutSeconds }}
          periodSeconds: {{ $valkey.livenessProbe.periodSeconds }}
          failureThreshold: {{ $valkey.livenessProbe.failureThreshold }}
        {{- end }}
        {{- if $valkey.readinessProbe.enabled }}
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - -a
            - $(VALKEY_PASSWORD)
            - ping
          initialDelaySeconds: {{ $valkey.readinessProbe.initialDelaySeconds }}
          timeoutSeconds: {{ $valkey.readinessProbe.timeoutSeconds }}
          periodSeconds: {{ $valkey.readinessProbe.periodSeconds }}
          failureThreshold: {{ $valkey.readinessProbe.failureThreshold }}
        {{- end }}
        {{- with $valkey.master.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: valkey-config
          mountPath: /etc/valkey
        {{- if $valkey.master.persistence.enabled }}
        - name: data
          mountPath: /data
        {{- end }}
      volumes:
      - name: valkey-config
        configMap:
          name: {{ .Release.Name }}-valkey-config
      {{- if not $valkey.master.persistence.enabled }}
      - name: data
        emptyDir: {}
      {{- end }}
  {{- if $valkey.master.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app: {{ .Release.Name }}-valkey
        app.kubernetes.io/part-of: oneuptime
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: valkey
        appname: oneuptime
    spec:
      accessModes:
        - ReadWriteOnce
      {{- if $valkey.master.persistence.storageClass }}
      {{- if (eq "-" $valkey.master.persistence.storageClass) }}
      storageClassName: ""
      {{- else }}
      storageClassName: {{ $valkey.master.persistence.storageClass }}
      {{- end }}
      {{- end }}
      resources:
        requests:
          storage: {{ $valkey.master.persistence.size }}
  {{- end }}
{{- end }}
