{{- if and .Values.migrate.enabled (not .Values.deployment.disableDeployments) }}
{{- /*
  Block the deploy on migrations (as a Helm hook) only when migrate.hook is true.
  When false (default), render a regular async Job for BOTH install and upgrade,
  so helm returns immediately and migrations run in the background. The runtime
  pods do not start on a schema older than their code meanwhile: each waits at
  boot, unready, until the schema migrations it needs are applied
  (migrate.runtimeWaitTimeoutSeconds) — so on a FRESH install they wait for this
  Job to create the schema instead of crash-looping.
*/ -}}
{{- $useHook := .Values.migrate.hook }}
# =============================================================================
# Database migration Job.
#
# Runs schema + data migrations ONCE per release, in a single dedicated pod,
# instead of on every app/worker/nginx replica on boot. The runtime pods are
# then gated off (RUN_DATABASE_MIGRATIONS_ON_BOOT=false). Since the runners
# take no advisory lock, this Job is what keeps two replicas from running the
# same data migration concurrently — keep it enabled.
#
# Connects DIRECTLY to the backend (DirectPostgres) so migrations never depend
# on the pooler. Blocking (hook) vs async is controlled by migrate.hook.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-migrate
    app.kubernetes.io/part-of: oneuptime
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: migrate
    appname: oneuptime
  {{- /*
    migrate.annotations go beside the hook's own, and no key is written twice: a
    helm.sh/hook-weight or helm.sh/hook-delete-policy there replaces the chart's.
    Not helm.sh/hook: whether the runtime pods wait for this Job (_helpers.tpl,
    NOTES.txt) is worked out from migrate.hook, and a hook it does not know of
    can leave them waiting for a Job that only runs after them.
  */ -}}
  {{- $annotations := .Values.migrate.annotations | default dict }}
  {{- if hasKey $annotations "helm.sh/hook" }}
  {{- fail "migrate.annotations sets helm.sh/hook. The chart makes the migrate Job a Helm hook itself, from migrate.hook: with migrate.hook: true it is a post-install hook on an install and a pre-upgrade hook on an upgrade, and whether the new pods wait for the Job is worked out from that. Set migrate.hook: true instead, and take helm.sh/hook out of migrate.annotations; helm.sh/hook-weight and helm.sh/hook-delete-policy can stay." }}
  {{- end }}
  {{- if $useHook }}
  # Blocking: a Helm hook — the deploy waits for migrations before rolling the
  # new pods (new code never runs against an un-migrated schema). post-install on
  # a fresh install; pre-upgrade on an upgrade (only when migrate.hook=true).
  # A post-install hook runs only after the release's pods exist (once they are
  # ready, under `helm install --wait` and Argo CD), so on an install those pods
  # do not wait for it (DATABASE_MIGRATION_WAIT_TIMEOUT_MS=0, see _helpers.tpl).
  {{- end }}
  {{- if or $useHook $annotations }}
  annotations:
    {{- if $useHook }}
    "helm.sh/hook": {{ ternary "post-install" "pre-upgrade" .Release.IsInstall }}
    {{- if not (hasKey $annotations "helm.sh/hook-weight") }}
    "helm.sh/hook-weight": "-5"
    {{- end }}
    {{- if not (hasKey $annotations "helm.sh/hook-delete-policy") }}
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
    {{- end }}
    {{- with $annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit | default 6 }}
  {{- if not $useHook }}
  # Async (non-hook) Job — `helm upgrade` does not wait for it. Auto-clean after
  # it finishes so old per-revision Jobs don't accumulate.
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished | default 86400 }}
  {{- end }}
  {{- if .Values.migrate.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-migrate
        app.kubernetes.io/part-of: oneuptime
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: migrate
        appname: oneuptime
      {{- with .Values.migrate.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- include "oneuptime.nodeSelector" (.Values.migrate.nodeSelector | default .Values.nodeSelector) | nindent 8 }}
      {{- with .Values.migrate.tolerations | default .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrate.affinity | default .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migrate.priorityClassName }}
      priorityClassName: {{ .Values.migrate.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- with (default $.Values.extraVolumes $.Values.migrate.extraVolumes) }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Wait for Postgres to accept TCP connections before migrating. As a
        # post-install hook this Job can start before the bundled Postgres /
        # CNPG cluster is ready; waiting here (instead of letting the migrate
        # container fail-and-retry) avoids racing the database bootstrap on a
        # fresh install. Talks directly to the backend (never the pooler).
        - name: wait-for-postgres
          image: {{ include "oneuptime.image" (dict "Values" $.Values "ServiceName" "app") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              until (exec 3<>/dev/tcp/"$PGHOST"/"$PGPORT") 2>/dev/null; do
                echo "waiting for postgres at $PGHOST:$PGPORT ..."
                sleep 3
              done
              echo "postgres reachable at $PGHOST:$PGPORT"
          env:
            - name: PGHOST
              value: {{ include "oneuptime.postgres.backendHost" . }}
            - name: PGPORT
              value: {{ include "oneuptime.postgres.backendPort" . | quote }}
      containers:
        - name: {{ .Release.Name }}-migrate
          image: {{ include "oneuptime.image" (dict "Values" $.Values "ServiceName" "app") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /usr/src/app
          command: ["npm", "run", "migrate"]
          {{- if .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- end }}
          env:
            {{- include "oneuptime.env.common" . | nindent 12 }}
            {{- /* DirectPostgres bypasses pgbouncer so migrations talk straight to the backend. RUN_DATABASE_MIGRATIONS_ON_BOOT is intentionally NOT set here, so it defaults true and this Job runs migrations. */ -}}
            {{- include "oneuptime.env.runtime" (dict "Values" $.Values "Release" $.Release "DirectPostgres" true "DatabaseMaxOpenConnections" $.Values.deployment.databaseMaxOpenConnections) | nindent 12 }}
            {{- /* Explicit nil check (not `with`): 0 is a meaningful ClickHouse value (enqueue and return immediately) and must render. */ -}}
            {{- if not (kindIs "invalid" .Values.migrate.clickhouseDistributedDdlTaskTimeoutSeconds) }}
            - name: CLICKHOUSE_DISTRIBUTED_DDL_TASK_TIMEOUT_SECONDS
              value: {{ .Values.migrate.clickhouseDistributedDdlTaskTimeoutSeconds | squote }}
            {{- end }}
            {{- with (default $.Values.extraEnv $.Values.migrate.extraEnv) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with (default $.Values.extraVolumeMounts $.Values.migrate.extraVolumeMounts) }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.migrate.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
