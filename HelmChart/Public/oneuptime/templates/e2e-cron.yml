
{{- if and $.Values.cronJobs.e2e.enabled (not $.Values.deployment.disableDeployments) }}

apiVersion: batch/v1
kind: CronJob
metadata:
  name: e2e-cron
  namespace: {{ $.Release.Namespace }}
  labels: 
    appname: oneuptime
    app.kubernetes.io/part-of: oneuptime
    app.kubernetes.io/managed-by: Helm
    {{- if $.Values.deployment.includeTimestampLabel }}
    date: "{{ now | unixEpoch }}"
    {{- end }}
spec:
  schedule: "*/30 * * * *" # At every 30 minute.
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            {{- include "oneuptime.nodeSelector" ($.Values.cronJobs.e2e.nodeSelector | default $.Values.nodeSelector) | nindent 12 }}
          containers:
          - name: e2e-cron
            image: {{ include "oneuptime.image" (dict "Values" $.Values "ServiceName" "e2e") }}
            imagePullPolicy: {{ $.Values.image.pullPolicy }}
            env:
              {{- include "oneuptime.env.common" . | nindent 14 }}
              - name: E2E_TEST_IS_USER_REGISTERED
                value: {{ $.Values.cronJobs.e2e.isUserRegistered | quote }}
              - name: E2E_TEST_REGISTERED_USER_EMAIL
                value: {{ $.Values.cronJobs.e2e.registeredUserEmail | quote }}
              - name: E2E_TEST_REGISTERED_USER_PASSWORD
                value: {{ $.Values.cronJobs.e2e.registeredUserPassword | quote }}
              - name: E2E_TEST_STATUS_PAGE_URL
                value: {{ $.Values.cronJobs.e2e.statusPageUrl | quote }}
              - name: E2E_TESTS_FAILED_WEBHOOK_URL
                value: {{ $.Values.cronJobs.e2e.failedWebhookUrl | quote }}
              {{- with (default $.Values.extraEnv $.Values.cronJobs.e2e.extraEnv) }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            {{- with (default $.Values.extraVolumeMounts $.Values.cronJobs.e2e.extraVolumeMounts) }}
            volumeMounts:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- with (default $.Values.extraVolumes $.Values.cronJobs.e2e.extraVolumes) }}
          volumes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: Never

{{- end }}