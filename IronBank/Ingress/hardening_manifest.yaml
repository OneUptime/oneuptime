# OneUptime Ingress (nginx) for Iron Bank: what Iron Bank's pipeline builds
# the Dockerfile beside this with. Scripts/IronBank/PinRelease.js moves it to
# a release, and IronBank/README.md describes the whole process.
apiVersion: v1

# Where Iron Bank publishes the image:
# registry1.dso.mil/ironbank/oneuptime/ingress. Iron Bank's onboarding team
# picks the project's path on Repo1; keep this the same as that path.
name: "oneuptime/ingress"

# The first tag is the release the Dockerfile copies.
tags:
  - "14.0.102"
  - "latest"

# The Iron Bank image the Dockerfile builds on. renovate.json moves BASE_TAG
# to the next nginx 1.30 release of it on Repo1.
args:
  BASE_IMAGE: "opensource/nginx/nginx-alpine"
  BASE_TAG: "1.30.3"

# Only the labels Iron Bank's schema allows, in printable ASCII. The
# Dockerfile sets the release's other labels.
labels:
  org.opencontainers.image.title: "OneUptime Nginx"
  org.opencontainers.image.description: "OneUptime Nginx ingress: TLS termination, routing, and Let's Encrypt automation."
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.url: "https://oneuptime.com"
  org.opencontainers.image.vendor: "OneUptime"
  org.opencontainers.image.version: "14.0.102"
  mil.dso.ironbank.image.keywords: "observability, monitoring, ingress, nginx, reverse proxy, tls"
  mil.dso.ironbank.image.type: "opensource"
  mil.dso.ironbank.product.name: "OneUptime"

# The release's ingress image for linux/amd64, by digest. Iron Bank's
# pipeline pulls it and gives it the name in `tag`, which the Dockerfile's
# release stage starts from.
resources:
  - tag: "oneuptime/nginx:14.0.102"
    url: "docker://docker.io/oneuptime/nginx@sha256:a402eed531c57d80bc5942ff9d68164596aa3760cb3ab6a7d0babea4b3e9ed69"

# The engineers the onboarding request names, by their Platform One (Repo1)
# usernames. Iron Bank's pipeline refuses a manifest until these are filled in.
maintainers:
  - name: "FIXME"
    username: "FIXME"
    email: "hello@oneuptime.com"
