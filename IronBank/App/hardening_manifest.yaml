# OneUptime App (Community Edition) for Iron Bank: what Iron Bank's pipeline
# builds the Dockerfile beside this with. Scripts/IronBank/PinRelease.js moves
# it to a release, and IronBank/README.md describes the whole process.
apiVersion: v1

# Where Iron Bank publishes the image: registry1.dso.mil/ironbank/oneuptime/app.
# Iron Bank's onboarding team picks the project's path on Repo1 when it
# creates the project; keep this the same as that path.
name: "oneuptime/app"

# The first tag is the release the Dockerfile copies.
tags:
  - "14.0.101"
  - "latest"

# The Iron Bank image the Dockerfile builds on. renovate.json moves BASE_TAG
# to the next Node.js 26 release of it on Repo1.
args:
  BASE_IMAGE: "opensource/nodejs/nodejs26"
  BASE_TAG: "26.13.0-npm12-yarn4-slim"

# Only the labels Iron Bank's schema allows, in printable ASCII. The
# Dockerfile sets the release's other labels.
labels:
  org.opencontainers.image.title: "OneUptime App"
  org.opencontainers.image.description: "OneUptime core application server: dashboard API, workers, and telemetry ingestion."
  org.opencontainers.image.licenses: "Apache-2.0"
  org.opencontainers.image.url: "https://oneuptime.com"
  org.opencontainers.image.vendor: "OneUptime"
  org.opencontainers.image.version: "14.0.101"
  mil.dso.ironbank.image.keywords: "observability, monitoring, status page, incident management, on-call, logs, metrics, traces"
  mil.dso.ironbank.image.type: "opensource"
  mil.dso.ironbank.product.name: "OneUptime"

# The release's Community Edition image for linux/amd64, by digest. Iron
# Bank's pipeline pulls it and gives it the name in `tag`, which the
# Dockerfile's release stage starts from.
resources:
  - tag: "oneuptime/app:14.0.101"
    url: "docker://docker.io/oneuptime/app@sha256:f748c1864a1bc334a08e02de3a7f9cbf8e562f953fd8cc602aac7f2d781a69d7"

# The engineers the onboarding request names, by their Platform One (Repo1)
# usernames. Iron Bank's pipeline refuses a manifest until these are filled in.
maintainers:
  - name: "FIXME"
    username: "FIXME"
    email: "hello@oneuptime.com"
