# OneUptime App (Enterprise Edition) for Iron Bank: what Iron Bank's pipeline
# builds the Dockerfile beside this with. Scripts/IronBank/PinRelease.js moves
# it to a release, and IronBank/README.md describes the whole process.
apiVersion: v1

# Where Iron Bank publishes the image: registry1.dso.mil/ironbank/oneuptime/app.
# Iron Bank's onboarding team picks the project's path on Repo1 when it
# creates the project; keep this the same as that path.
name: "oneuptime/app"

# The first tag is the release the Dockerfile copies.
tags:
  - "16.0.0"
  - "latest"

# The Iron Bank image the Dockerfile builds on. renovate.json moves BASE_TAG
# to the next Node.js 26 release of it on Repo1.
args:
  BASE_IMAGE: "opensource/nodejs/nodejs26"
  BASE_TAG: "26.13.0-npm12-yarn4-slim"

# Only the labels Iron Bank's schema allows, in printable ASCII. The
# Dockerfile sets the release's other labels.
labels:
  org.opencontainers.image.title: "OneUptime App"
  org.opencontainers.image.description: "OneUptime core application server: dashboard API, workers, and telemetry ingestion."
  org.opencontainers.image.licenses: "Apache-2.0 AND LicenseRef-OneUptime-Enterprise"
  org.opencontainers.image.url: "https://oneuptime.com"
  org.opencontainers.image.vendor: "OneUptime"
  org.opencontainers.image.version: "16.0.0"
  mil.dso.ironbank.image.keywords: "observability, monitoring, status page, incident management, on-call, logs, metrics, traces"
  # ee/ is under the OneUptime Enterprise License, not an open-source one.
  mil.dso.ironbank.image.type: "commercial"
  mil.dso.ironbank.product.name: "OneUptime"

# The release's Enterprise Edition image for linux/amd64, by digest. Iron
# Bank's pipeline pulls it and gives it the name in `tag`, which the
# Dockerfile's release stage starts from.
resources:
  - tag: "oneuptime/app:enterprise-16.0.0"
    url: "docker://docker.io/oneuptime/app@sha256:f5e73433cd750cb36e6328a404c862eeb7ea0318f9384d7a02183204533ef410"
  # Data Security's names-and-addresses model (openmasq/ner-multilingual,
  # Apache-2.0), which the workers run inside the scanner: the files of the
  # pinned revision, with the checksums the release's build checks them
  # against (packages/Common/Server/Utils/DataSecurity/Model/
  # NameAddressModel.json; Tests/Ops/IronBankDataSecurityModel.test.js holds
  # the two to each other). The Dockerfile copies them to where the scanner
  # reads them.
  - url: "https://huggingface.co/openmasq/ner-multilingual/resolve/8cf72739a75da1de5680ea6c30c381660e740303/onnx/model_quantized.onnx"
    filename: "data-security-model_quantized.onnx"
    validation:
      type: "sha256"
      value: "7470819a0961b246614ceedd940934b8d8ae7c39070cb15508883fe0e6f93012"
  - url: "https://huggingface.co/openmasq/ner-multilingual/resolve/8cf72739a75da1de5680ea6c30c381660e740303/vocab.txt"
    filename: "data-security-vocab.txt"
    validation:
      type: "sha256"
      value: "2c6a68543b91336cb07a688b9678a2a61d8ff687ab6885826cd89680785fae40"
  - url: "https://huggingface.co/openmasq/ner-multilingual/resolve/8cf72739a75da1de5680ea6c30c381660e740303/config.json"
    filename: "data-security-config.json"
    validation:
      type: "sha256"
      value: "b942516293db81db39bc12b734888dc5e7a7e38c2f5f6f7ecacb337fd716c4c3"
  - url: "https://huggingface.co/openmasq/ner-multilingual/resolve/8cf72739a75da1de5680ea6c30c381660e740303/README.md"
    filename: "data-security-README.md"
    validation:
      type: "sha256"
      value: "e39d9b3a38e02a7af00c54568ae44d5c8a3a0a3c7dd3d07e0e53cf5bf000e48a"

# The engineers the onboarding request names, by their Platform One (Repo1)
# usernames.
maintainers:
  - name: "Nawaz Dhandala"
    username: "oneuptime"
    email: "hello@oneuptime.com"
