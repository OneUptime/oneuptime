load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;
# The ingress fans a very high volume of short-lived upstream connections
# (OTLP/telemetry ingest, API, dashboard) out to the backend. Raise the
# file-descriptor ceiling so worker_connections below is bounded by kernel
# source ports (see the sysctl tuning in the Helm chart / docker-compose),
# not by nginx's own defaults.
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  16384;
}


http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Buffered access logging. Unbuffered, nginx issues a write(2) on the log
    # file for every single request -- including every OTLP export, every
    # session-replay chunk and every probe heartbeat -- which at ingest volume
    # is the hottest syscall in the worker. buffer=64k batches those writes and
    # flush=10s bounds how long a line may sit unwritten, so no line is ever
    # dropped and a `tail -f` is at most ten seconds behind.
    #
    # The buffer=64k flush=10s pair is repeated verbatim on the per-location
    # access_log directives in conf.d/default.conf. It has to be: nginx refuses
    # to start ("access_log ... already defined with conflicting parameters")
    # if two access_log directives name the same file with different buffer,
    # flush or gzip parameters.
    access_log  /var/log/nginx/access.log  main buffer=64k flush=10s;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # Connection header for upstream requests. WebSocket/Upgrade requests must
    # forward "Connection: upgrade"; every other request gets an empty value so
    # nginx can return the upstream connection to the keepalive pool for reuse
    # (see the upstream{} keepalive blocks generated into conf.d/default.conf).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    #gzip  on;

    # Default for the ingest access-logging switch, which conf.d/default.conf
    # reads to decide whether the high-volume ingest locations (/otlp,
    # /telemetry, /session-replay, /kubernetes-cost, /pyroscope) write an
    # access-log line. "on" here means ingest logging is ENABLED unless an
    # operator explicitly turns it off -- per-request status and client IP at
    # the ingress are how a tenant's 413s and 429s get diagnosed, so silently
    # dropping them is not an acceptable default.
    #
    # Why the default lives here rather than in the template: default.conf is
    # rendered by envsubst (run.sh -> envsubst-on-templates.sh), and envsubst
    # is given a shell-format list built from `env`. A variable that is NOT in
    # the container environment is therefore left in the rendered output as the
    # literal text "${NGINX_INGEST_ACCESS_LOG}", which nginx then reads as a
    # reference to a variable of that name. Declaring it here is what makes an
    # unset NGINX_INGEST_ACCESS_LOG render to a valid, still-logging config
    # instead of "nginx: [emerg] unknown NGINX_INGEST_ACCESS_LOG variable".
    # It cannot be declared in the template itself, because envsubst would
    # rewrite the declaration too. nginx.conf is copied verbatim by the
    # Dockerfile and never passes through envsubst.
    map $host $NGINX_INGEST_ACCESS_LOG {
        default "on";
    }

    include /etc/nginx/conf.d/default.conf;
}
