# Images are pushed to both Docker Hub and Github Container Registry. If you're using Github Container Registry, you can change the image tag to use the Github Container Registry.
# For example, if you want to use the image from Github Container Registry, you can change the image tag from oneuptime/dashboard:latest to ghcr.io/oneuptime/dashboard:latest
# APP_TAG (config.env) also picks the edition: APP_TAG=release runs the Community Edition, APP_TAG=enterprise-release the Enterprise Edition. See config.example.env.

x-common-depends-on: &common-depends-on
  postgres:
    condition: service_healthy
  valkey:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  valkey:
    extends:
      file: ./docker-compose.base.yml
      service: valkey

  clickhouse:
    extends:
      file: ./docker-compose.base.yml
      service: clickhouse

  postgres:
    # PostgreSQL is published on this server's loopback address only, for
    # npm run backup, restore.sh and psql on the server: no other machine
    # reaches it. To reach it from another machine, use an SSH tunnel, or see
    # "Back up and restore" in the Docker Compose guide.
    ports:
      - "127.0.0.1:5400:5432"
    extends:
      file: ./docker-compose.base.yml
      service: postgres

  app:
    image: oneuptime/app:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: app
    depends_on:
      <<: *common-depends-on

  probe-1:
    image: oneuptime/probe:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: probe-1
    depends_on:
      <<: *common-depends-on

  global-runner:
    image: oneuptime/runner:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: global-runner
    depends_on:
      <<: *common-depends-on

  ingress:
    image: oneuptime/nginx:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: ingress
    depends_on:
      <<: *common-depends-on

volumes:
  postgres:
  clickhouse:

networks:
  oneuptime:
    driver: bridge
