receivers:
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    # Docker Engine API version the receiver speaks, from DOCKER_API_VERSION.
    # Empty by default (the image's ENV and docker-compose.yml), and empty
    # means NEGOTIATE.
    #
    # Verified against otel/opentelemetry-collector-contrib:0.165.0:
    #   * empty makes the receiver let the Docker SDK negotiate (one HEAD
    #     /_ping, then the daemon's own maximum, down to API 1.40), which
    #     works against any daemon this agent supports: Docker Engine 20.10
    #     (API 1.41) to the newest;
    #   * a daemon rejects a client NEWER than its maximum ("client version 1.44
    #     is too new"), and a rejected receiver fails to start, which takes the
    #     whole collector down with it -- which is what the image's old pinned
    #     1.44 did on Engine 20.10 to 24, so a version is pinned only when
    #     DOCKER_API_VERSION names one;
    #   * the receiver's own default, with the field left out, is 1.44 (1.25
    #     is its accepted MINIMUM, not its default) -- which is why the field
    #     is here, and empty, rather than left out.
    #
    # A plain ${env:...}: an unset variable expands to empty too, which is
    # the same negotiation.
    api_version: "${env:DOCKER_API_VERSION}"
    collection_interval: 30s
    # Enable optional metrics that the OneUptime Docker monitor alert
    # templates depend on (container restarts, uptime, pid count,
    # CPU throttling). These are OFF by default in the contrib
    # docker_stats receiver and must be explicitly turned on.
    metrics:
      # The receiver's own CPU percent is OFF: it reads ONE stats sample (its
      # Docker client asks for a one-shot sample, which carries no previous
      # reading), so it divides all the CPU the container used since it
      # started by all the CPU the host used since it booted -- a flat line
      # near zero that never follows the load. container.cpu.utilization is
      # built from container.cpu.usage.total instead: see
      # transform/cpu-utilization-source below.
      container.cpu.utilization:
        enabled: false
      container.cpu.throttling_data.throttled_periods:
        enabled: true
      container.cpu.throttling_data.throttled_time:
        enabled: true
      container.memory.percent:
        enabled: true
      container.pids.count:
        enabled: true
      container.restarts:
        enabled: true
      container.uptime:
        enabled: true
    # Copy the container labels OneUptime's database discovery reads onto
    # every metric of the container, as RESOURCE attributes of the same name
    # (verified against otel/opentelemetry-collector-contrib:0.161.0 and a
    # real daemon; a label the container lacks is simply absent). They
    # group the replicas of one Compose / Swarm service into one database
    # and keep Testcontainers runs, `docker compose run` one-offs and
    # kubelet-managed containers from becoming databases. Keep this list
    # equal to CONTAINER_CLASSIFIER_LABEL_KEYS
    # (packages/Common/Types/DatabaseServer/DatabaseContainerClassifier.ts).
    # container.command_line stays OFF: a command line can carry secrets.
    container_labels_to_metric_labels:
      com.docker.compose.oneoff: com.docker.compose.oneoff
      com.docker.compose.project: com.docker.compose.project
      com.docker.compose.service: com.docker.compose.service
      com.docker.swarm.service.name: com.docker.swarm.service.name
      io.kubernetes.pod.name: io.kubernetes.pod.name
      io.podman.compose.project: io.podman.compose.project
      io.podman.compose.service: io.podman.compose.service
      org.testcontainers: org.testcontainers
      org.testcontainers.sessionId: org.testcontainers.sessionId

  filelog:
    include:
      - /var/lib/docker/containers/*/*-json.log
    # Exclude the agent's own container log to avoid a feedback loop where
    # the collector ingests and exports its own scrape/export stack traces.
    # Inside a Docker container, HOSTNAME defaults to the short (12-char)
    # container ID, and Docker stores each container's log under a directory
    # named by the full container ID, so a prefix glob excludes this
    # container's log file on start-up.
    exclude:
      - /var/lib/docker/containers/${env:HOSTNAME}*/*-json.log
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      # Parse the Docker JSON log envelope
      - type: json_parser
        id: parser-docker
        timestamp:
          parse_from: attributes.time
          layout: "%Y-%m-%dT%H:%M:%S.%LZ"
      # Extract the container ID from the file path so we can display
      # it on the Logs page and correlate with docker_stats metrics.
      - type: regex_parser
        id: extract-container-id
        regex: "^/var/lib/docker/containers/(?P<container_id>[^/]+)/.+$"
        parse_from: attributes["log.file.path"]
      - type: move
        from: attributes.container_id
        to: resource["container.id"]
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]
      # Docker's json-file log driver writes one JSON envelope per newline, so
      # a multi-line stack trace (e.g. a Node.js error with "    at ..." frames)
      # arrives as many separate log records. Recombine consecutive entries
      # from the same container log file into a single record so exceptions
      # show up as one log line in the OneUptime UI. We treat any line that
      # begins with whitespace or a closing bracket/brace/paren as a
      # continuation of the previous entry, which covers stack frames, pretty-
      # printed JSON, and multi-line error details. source_identifier keeps
      # records from different containers from being merged together.
      - type: recombine
        id: recombine-multiline
        combine_field: body
        combine_with: "\n"
        is_first_entry: 'body matches "^[^\\s\\}\\)\\]]"'
        source_identifier: attributes["log.file.path"]
        force_flush_period: 5s
        max_log_size: 1048576
      # Operators of your own (issue #11225), for a format the readers below
      # do not know: up to five, each one stanza operator, as JSON, in
      # ONEUPTIME_LOG_OPERATOR_1 to ONEUPTIME_LOG_OPERATOR_5. They run on
      # every line after it is put back together and before its level is read,
      # and a slot left unset is a noop. To set a line's level, write it to
      # attributes.severity_text, as a word this agent reads (ERROR, warn,
      # critical, ...): the router below sends a line that has one straight to
      # the severity parser. Leave a slot unset rather than empty: the
      # collector reads an empty one as no operator at all and stops.
      # install.sh and the Compose file's config check run `otelcol validate`
      # over them first, so a bad one stops the install with the collector's
      # own message instead of a collector that restarts forever.
      - "${env:ONEUPTIME_LOG_OPERATOR_1:-type: noop}"
      - "${env:ONEUPTIME_LOG_OPERATOR_2:-type: noop}"
      - "${env:ONEUPTIME_LOG_OPERATOR_3:-type: noop}"
      - "${env:ONEUPTIME_LOG_OPERATOR_4:-type: noop}"
      - "${env:ONEUPTIME_LOG_OPERATOR_5:-type: noop}"
      # Docker's json-file driver records no severity, only the stream a line
      # was written to; OTel log records have dedicated severity_number /
      # severity_text fields that downstream viewers rely on for filtering.
      #
      # Derive a severity: the router hands each line to the FIRST reader that
      # knows where its format keeps the level.
      #
      #   1. parse-klog-severity. klog and glog (every Kubernetes
      #      component, cert-manager, ingress-nginx's controller) put the
      #      level in the first letter, glued to the date: "I1123
      #      19:09:25.286486 1 solver.go:104] ..." is INFO, W is WARN, E
      #      ERROR, F FATAL.
      #   2. add-exception-severity. What a runtime prints for an exception
      #      names no level but is an error: Python's "Traceback (most
      #      recent call last):", Java's "Exception in thread ..." and
      #      "Caused by: ...", .NET's "Unhandled exception.", Rust's "thread
      #      'main' panicked at ...", and a line that starts with an
      #      exception's class ("TypeError: ...",
      #      "java.lang.IllegalStateException: ..."). ERROR.
      #   3. add-warning-severity. Python's warnings module and Node's
      #      process warnings name a category, not a level: "/app/x.py:3:
      #      DeprecationWarning: ..." and "(node:1) [DEP0005]
      #      DeprecationWarning: ...". WARN.
      #   4. parse-numeric-severity. pino and bunyan write the level as a
      #      number among the top-level fields, {"level":30,...}: 10 TRACE,
      #      20 DEBUG, 30 INFO, 40 WARN, 50 ERROR, 60 FATAL.
      #   5. The formats that keep the level in a place of their own, each
      #      read there and nowhere else (issue #11226), so a word that is a
      #      level only in its own format ("System", "Fine", a "#") is read
      #      in no other line:
      #        parse-mongodb-severity  MongoDB's "s" (F E W I, D1 to D5);
      #        parse-cnpg-severity     CloudNativePG's wrapped PostgreSQL
      #                                record: its "error_severity", not
      #                                the wrapper's "level";
      #        parse-clef-severity     Serilog's compact JSON: "@l";
      #        add-clef-information    ...which writes no "@l" for
      #                                Information: INFO;
      #        parse-redis-severity    Redis's and Valkey's symbol: .
      #                                debug, - verbose, * notice, #
      #                                warning;
      #        parse-nest-severity     NestJS's ConsoleLogger, after its
      #                                locale's time;
      #        parse-logrus-severity   logrus with colours: TRAC, DEBU,
      #                                ERRO, FATA, PANI;
      #        parse-mysql-severity    MySQL 8's [System] and its others;
      #        parse-jul-severity      java.util.logging's FINEST to
      #                                CONFIG, in capitals before a colon;
      #        parse-sidekiq-severity  Sidekiq 7's "pid=1 tid=x INFO:";
      #        parse-php-severity      PHP's error log, "PHP Warning:  ";
      #        parse-gitea-severity    Gitea's [I], after its caller.
      #   6. parse-severity-from-body. A level word, believed only where a
      #      level sits, not merely because the word turns up in the line:
      #        LINE PREAMBLE. The word is on the first line and everything
      #        before it is preamble: punctuation, digits, word tokens that
      #        end on a structural delimiter (. ] = - : / | ) }), colour
      #        codes, and a time at the very start, read with its letters
      #        (RFC 3339's T and Z, a zone such as UTC or GMT, ctime's day
      #        and month, zerolog's 3:04PM). That is "[ERROR] ...",
      #        Monolog's "app.INFO: ...", hclog's
      #        "2026-11-23T18:58:14.670Z [INFO] ...", Python's "... - myapp
      #        - INFO - ..." and PostgreSQL's "2026-11-23 18:53:14.906 GMT
      #        [27] LOG:  ...". Prose is not: "Connection error, retrying"
      #        stops at "Connection ", a bare word followed by a space. The
      #        repetition is lazy, so the first word in preamble position
      #        wins.
      #        LEVEL FIELD. The word is the value of a level key anywhere in
      #        the line, quoted or not, after ":" or "=": level, lvl,
      #        severity, severity_text, levelname, level_name, log.level,
      #        log_level, hclog's @level, Serilog's @l. That is zap, logrus
      #        and slog JSON, and logfmt.
      #      The preamble is anchored, so it beats a level field further
      #      along the line. The words are the OTel names, PSR-3's and
      #      syslog's, and the ones formats write for them: PostgreSQL's LOG
      #      (in capitals only: "Log rotated" is prose), MySQL's Note,
      #      java.util.logging's SEVERE, .NET's trce, dbug and fail,
      #      zerolog's and Serilog's three letters (INF, WRN, ...), log15's
      #      eror, zap's DPanic.
      #   7. parse-slog-severity. Go's log/slog between its four names,
      #      level=ERROR+4 or "level":"INFO+2", where the general read found
      #      no level, so a line that one reads keeps that level.
      #   8. add-fallback-severity. A line nothing read, on stdout: INFO, as
      #      stdout is a program's ordinary output.
      # A line nothing read on STDERR gets no severity at all (the router's
      # default, severity-unspecified). stderr is where programs write their
      # diagnostics, every level of them: klog, zap's production config, logrus,
      # hclog, Python's logging and PostgreSQL write everything there. So the
      # stream says nothing about such a line's level. It used to make one
      # ERROR, which stored every unread INFO and WARN line on stderr as an
      # Error (issue #10972). OneUptime shows it as Unspecified, and a severity
      # filter keeps it, having no level to compare.
      #
      # Every text a reader lifts MUST resolve in `severity-parser` below:
      # stanza's built-in preset knows only
      # trace/debug/info/warn/warning/error/err/fatal, and an unmapped text
      # leaves the record Unspecified. The patterns are linear in JavaScript's
      # backtracking engine as well as in RE2, since the Kubernetes agent's
      # API-mode tailer runs the same source there: a time is read once, at the
      # start of the line, and only the colour-code token consumes an ESC.
      # Tests/Ops/ContainerAgentLogSeverity.test.js pins all of it over a corpus
      # of real lines (Tests/Ops/Utils/LogSeverityCorpus.js), prose that must
      # not be read included, and Tests/Ops/agent-log-severity-behaviour.sh runs
      # that corpus through the real collector.
      - type: router
        id: severity-router
        routes:
          - output: severity-parser
            expr: 'attributes["severity_text"] != nil'
          - output: parse-klog-severity
            expr: 'body matches "^([IWEF])\\d{4}(?:\\d{4})? \\d\\d:\\d\\d:\\d\\d\\.\\d{6} +\\d+ [^ :\\]]+:\\d+\\]"'
          - output: add-exception-severity
            expr: 'body matches "^(?:Traceback \\(most recent call last\\):|Exception in thread \"|Caused by: |Unhandled [Ee]xception[.:]|thread \\x27[^\\x27]*\\x27 panicked at |(?:[A-Za-z_$][\\w$]*\\.)*(?:[A-Z][\\w$]*)?(?:Error|Exception)(?::(?:\\s|$)|[\\r\\n]|$))"'
          - output: add-warning-severity
            expr: 'body matches "^(?:\\S+:\\d+: |\\(node:\\d+\\) (?:\\[[A-Z]+\\d+\\] )?)[A-Z][A-Za-z]*Warning: "'
          - output: parse-numeric-severity
            expr: 'body matches "^\\{(?:\"(?:[^\"\\\\]|\\\\.)*\":(?:\"(?:[^\"\\\\]|\\\\.)*\"|-?\\d+(?:\\.\\d+)?|true|false|null),)*?\"level\":([1-6]0)[,}]"'
          - output: parse-mongodb-severity
            expr: 'body matches "^\\{\"t\":\\{\"[$]date\":\"[^\"]*\"\\},\"s\":\"([FEWI]|D[1-5])\""'
          - output: parse-cnpg-severity
            expr: 'body matches "^\\{\"level\":\"[a-z]+\",\"ts\":\"[^\"]*\",\"logger\":\"postgres\",\"msg\":\"record\",.*?\"error_severity\":\"(DEBUG|LOG|INFO|NOTICE|WARNING|ERROR|FATAL|PANIC)\""'
          - output: parse-clef-severity
            expr: 'body matches "^\\{\"@t\":\"[^\"\\\\]*\",\"@mt?\":\"(?:[^\"\\\\]|\\\\.)*\",(?:\"@r\":\\[(?:\"(?:[^\"\\\\]|\\\\.)*\",?)*\\],)?(?:\"@i\":\"[0-9a-f]+\",)?\"@l\":\"(Verbose|Debug|Information|Warning|Error|Fatal)\""'
          - output: add-clef-information
            expr: 'body matches "^\\{\"@t\":\"[^\"\\\\]*\",\"@mt?\":\""'
          - output: parse-redis-severity
            expr: 'body matches "^\\d+:[CMSX] \\d\\d? [A-Z][a-z]{2} \\d{4} \\d\\d:\\d\\d:\\d\\d\\.\\d{3} ([.*#-]) "'
          - output: parse-nest-severity
            expr: 'body matches "^(?:\\x1b\\[[0-9;]*m)?\\[Nest\\] \\d+  - (?:\\x1b\\[[0-9;]*m)?[^\\x1b\\n]*?\\d(?: ?[AP]M)? (?:\\x1b\\[[0-9;]*m)? *(VERBOSE|DEBUG|LOG|WARN|ERROR|FATAL)(?:\\x1b\\[[0-9;]*m)? "'
          - output: parse-logrus-severity
            expr: 'body matches "^\\x1b\\[\\d+m(TRAC|DEBU|INFO|WARN|ERRO|FATA|PANI)\\x1b\\[0m\\[[^\\]\\n]*\\] "'
          - output: parse-mysql-severity
            expr: 'body matches "^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d\\.\\d{6}(?:Z|[+-]\\d\\d:\\d\\d) \\d+ \\[(System|ERROR|Warning|Note)\\] \\[MY-\\d{6}\\] "'
          - output: parse-jul-severity
            expr: 'body matches "^(FINEST|FINER|FINE|CONFIG): "'
          - output: parse-sidekiq-severity
            expr: 'body matches "^(?:\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d\\.\\d{3}Z )?pid=\\d+ tid=[a-z0-9]+(?: [a-z_]+=[^ =]+)* (DEBUG|INFO|WARN|ERROR|FATAL): "'
          - output: parse-php-severity
            expr: 'body matches "^PHP (Fatal error|Parse error|Recoverable fatal error|Warning|Notice|Deprecated):  "'
          - output: parse-gitea-severity
            expr: 'body matches "^\\d{4}/\\d\\d/\\d\\d \\d\\d:\\d\\d:\\d\\d(?:\\.\\d+)? (?:\\S+\\(\\) )?\\[([TDIWEF])\\] "'
          - output: parse-severity-from-body
            expr: 'body matches "(?i)(?:^(?:(?:\\x1b\\[[0-9;]*m)*(?:\\[(?:\\x1b\\[[0-9;]*m)*)?(?:\\d{4}-\\d\\d-\\d\\d[T ]\\d\\d:\\d\\d(?::\\d\\d(?:[.,]\\d+)?)?(?:Z|[+-]\\d\\d(?::?\\d\\d)?)?(?:[ \\t]+(?-i:UTC|GMT|CET|CEST|EET|EEST|WET|WEST|BST|IST|MSK|EST|EDT|CST|CDT|MST|MDT|PST|PDT|HST|AKST|AKDT|JST|KST|HKT|SGT|AEST|AEDT|ACST|ACDT|AWST|NZST|NZDT))?|(?-i:Mon|Tue|Wed|Thu|Fri|Sat|Sun) (?-i:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) +\\d\\d? \\d\\d:\\d\\d:\\d\\d(?:\\.\\d+)? \\d{4}|\\d\\d?:\\d\\d(?-i:AM|PM)))?(?:[^A-Za-z\"\\n\\x1b]|\\x1b\\[[0-9;]*m|[A-Za-z][A-Za-z0-9_]*[ \\t]*[.:=,/>|)}\\]-])*?|(?:^|[\\s,{\\[])\"?(?:@?(?:log[._]?level|severity_?text|severity|level_?name|level|lvl)|@l)\"?[ \\t]*[:=][ \\t]*\"?)(TRACE|TRCE|TRC|DEBUG|DBUG|DBG|VRB|INFORMATION|INFO|INF|NOTICE|NOTE|(?-i:LOG)|WARNING|WARN|WRN|EMERGENCY|EMERG|ALERT|CRITICAL|CRIT|ERROR|EROR|ERR|FAIL|SEVERE|DPANIC|FATAL|FTL|PANIC|PNC)(?:$|[\\s\\]:=,)\"}|>\\x1b]|/[A-Za-z][A-Za-z0-9_-]*\\])"'
          - output: parse-slog-severity
            expr: 'body matches "(?:^|[\\s{,])\"?level\"?[=:]\"?(DEBUG-[1-4]|DEBUG\\+[1-3]|INFO\\+[1-3]|WARN\\+[1-3]|ERROR\\+[1-7])(?:$|[\\s\",}])"'
          - output: add-fallback-severity
            expr: 'attributes["log.iostream"] != "stderr"'
        default: severity-unspecified
      # 1. klog and glog: the first letter is the level.
      - type: regex_parser
        id: parse-klog-severity
        regex: '^(?P<severity_text>[IWEF])\d{4}(?:\d{4})? \d\d:\d\d:\d\d\.\d{6} +\d+ [^ :\]]+:\d+\]'
        parse_from: body
        output: severity-parser
      # 2. An exception's header: an error, though it names no level.
      - type: add
        id: add-exception-severity
        field: attributes.severity_text
        value: ERROR
        output: severity-parser
      # 3. A Python or Node warning category: a warning.
      - type: add
        id: add-warning-severity
        field: attributes.severity_text
        value: WARN
        output: severity-parser
      # 4. pino and bunyan: a number among the top-level fields.
      - type: regex_parser
        id: parse-numeric-severity
        regex: '^\{(?:"(?:[^"\\]|\\.)*":(?:"(?:[^"\\]|\\.)*"|-?\d+(?:\.\d+)?|true|false|null),)*?"level":(?P<severity_text>[1-6]0)[,}]'
        parse_from: body
        output: severity-parser
      # 5. MongoDB's JSON: the "s" right after the time (F E W I, D1-D5).
      - type: regex_parser
        id: parse-mongodb-severity
        regex: '^\{"t":\{"[$]date":"[^"]*"\},"s":"(?P<severity_text>[FEWI]|D[1-5])"'
        parse_from: body
        output: severity-parser
      # 6. CloudNativePG wraps each PostgreSQL record in a line of its own
      #    manager, whose "level" says only that it logged one: the record's
      #    "error_severity" is the level.
      - type: regex_parser
        id: parse-cnpg-severity
        regex: '^\{"level":"[a-z]+","ts":"[^"]*","logger":"postgres","msg":"record",.*?"error_severity":"(?P<severity_text>DEBUG|LOG|INFO|NOTICE|WARNING|ERROR|FATAL|PANIC)"'
        parse_from: body
        output: severity-parser
      # 7. Serilog's compact JSON (CLEF): "@l" after the message.
      - type: regex_parser
        id: parse-clef-severity
        regex: '^\{"@t":"[^"\\]*","@mt?":"(?:[^"\\]|\\.)*",(?:"@r":\[(?:"(?:[^"\\]|\\.)*",?)*\],)?(?:"@i":"[0-9a-f]+",)?"@l":"(?P<severity_text>Verbose|Debug|Information|Warning|Error|Fatal)"'
        parse_from: body
        output: severity-parser
      # 8. ...which leaves "@l" out for Information.
      - type: add
        id: add-clef-information
        field: attributes.severity_text
        value: INFO
        output: severity-parser
      # 9. Redis and Valkey: a symbol after the time.
      - type: regex_parser
        id: parse-redis-severity
        regex: '^\d+:[CMSX] \d\d? [A-Z][a-z]{2} \d{4} \d\d:\d\d:\d\d\.\d{3} (?P<severity_text>[.*#-]) '
        parse_from: body
        output: severity-parser
      # 10. NestJS's ConsoleLogger: the level after its locale's time.
      - type: regex_parser
        id: parse-nest-severity
        regex: '^(?:\x1b\[[0-9;]*m)?\[Nest\] \d+  - (?:\x1b\[[0-9;]*m)?[^\x1b\n]*?\d(?: ?[AP]M)? (?:\x1b\[[0-9;]*m)? *(?P<severity_text>VERBOSE|DEBUG|LOG|WARN|ERROR|FATAL)(?:\x1b\[[0-9;]*m)? '
        parse_from: body
        output: severity-parser
      # 11. logrus with colours: four letters, then the time in brackets.
      - type: regex_parser
        id: parse-logrus-severity
        regex: '^\x1b\[\d+m(?P<severity_text>TRAC|DEBU|INFO|WARN|ERRO|FATA|PANI)\x1b\[0m\[[^\]\n]*\] '
        parse_from: body
        output: severity-parser
      # 12. MySQL 8's error log, [System] among its levels.
      - type: regex_parser
        id: parse-mysql-severity
        regex: '^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{6}(?:Z|[+-]\d\d:\d\d) \d+ \[(?P<severity_text>System|ERROR|Warning|Note)\] \[MY-\d{6}\] '
        parse_from: body
        output: severity-parser
      # 13. java.util.logging's lower levels, in capitals before a colon.
      - type: regex_parser
        id: parse-jul-severity
        regex: '^(?P<severity_text>FINEST|FINER|FINE|CONFIG): '
        parse_from: body
        output: severity-parser
      # 14. Sidekiq 7: the level after its pid, thread and job.
      - type: regex_parser
        id: parse-sidekiq-severity
        regex: '^(?:\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z )?pid=\d+ tid=[a-z0-9]+(?: [a-z_]+=[^ =]+)* (?P<severity_text>DEBUG|INFO|WARN|ERROR|FATAL): '
        parse_from: body
        output: severity-parser
      # 15. PHP's own error log line.
      - type: regex_parser
        id: parse-php-severity
        regex: '^PHP (?P<severity_text>Fatal error|Parse error|Recoverable fatal error|Warning|Notice|Deprecated):  '
        parse_from: body
        output: severity-parser
      # 16. Gitea: a letter in brackets, after its caller.
      - type: regex_parser
        id: parse-gitea-severity
        regex: '^\d{4}/\d\d/\d\d \d\d:\d\d:\d\d(?:\.\d+)? (?:\S+\(\) )?\[(?P<severity_text>[TDIWEF])\] '
        parse_from: body
        output: severity-parser
      # 17. A level word where a level sits.
      - type: regex_parser
        id: parse-severity-from-body
        regex: '(?i)(?:^(?:(?:\x1b\[[0-9;]*m)*(?:\[(?:\x1b\[[0-9;]*m)*)?(?:\d{4}-\d\d-\d\d[T ]\d\d:\d\d(?::\d\d(?:[.,]\d+)?)?(?:Z|[+-]\d\d(?::?\d\d)?)?(?:[ \t]+(?-i:UTC|GMT|CET|CEST|EET|EEST|WET|WEST|BST|IST|MSK|EST|EDT|CST|CDT|MST|MDT|PST|PDT|HST|AKST|AKDT|JST|KST|HKT|SGT|AEST|AEDT|ACST|ACDT|AWST|NZST|NZDT))?|(?-i:Mon|Tue|Wed|Thu|Fri|Sat|Sun) (?-i:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) +\d\d? \d\d:\d\d:\d\d(?:\.\d+)? \d{4}|\d\d?:\d\d(?-i:AM|PM)))?(?:[^A-Za-z"\n\x1b]|\x1b\[[0-9;]*m|[A-Za-z][A-Za-z0-9_]*[ \t]*[.:=,/>|)}\]-])*?|(?:^|[\s,{\[])"?(?:@?(?:log[._]?level|severity_?text|severity|level_?name|level|lvl)|@l)"?[ \t]*[:=][ \t]*"?)(?P<severity_text>TRACE|TRCE|TRC|DEBUG|DBUG|DBG|VRB|INFORMATION|INFO|INF|NOTICE|NOTE|(?-i:LOG)|WARNING|WARN|WRN|EMERGENCY|EMERG|ALERT|CRITICAL|CRIT|ERROR|EROR|ERR|FAIL|SEVERE|DPANIC|FATAL|FTL|PANIC|PNC)(?:$|[\s\]:=,)"}|>\x1b]|/[A-Za-z][A-Za-z0-9_-]*\])'
        parse_from: body
        output: severity-parser
      # 18. Go's log/slog between its four names: level=ERROR+4.
      - type: regex_parser
        id: parse-slog-severity
        regex: '(?:^|[\s{,])"?level"?[=:]"?(?P<severity_text>DEBUG-[1-4]|DEBUG\+[1-3]|INFO\+[1-3]|WARN\+[1-3]|ERROR\+[1-7])(?:$|[\s",}])'
        parse_from: body
        output: severity-parser
      # 19. Nothing read, on stdout: a program's ordinary output.
      - type: add
        id: add-fallback-severity
        field: attributes.severity_text
        value: INFO
        output: severity-parser
      # Promote the text onto the LogRecord, so OTel consumers see a real
      # severity_number. Each text is stored at the number OneUptime's ingest
      # stores the same word at (LOG_SEVERITY_NUMBER_BY_TEXT in
      # packages/Common/Types/Log/LogSeverity.ts, issue #11228), so a line is
      # stored the same way whether it comes through this agent or a Fluent or
      # OTLP sender: Tests/Ops/LogSeverityOneTable.test.js holds this block to
      # that table, number for number. Each alias is under one level only:
      # stanza reads this block as a map, in no set order.
      - type: severity_parser
        id: severity-parser
        parse_from: attributes.severity_text
        preset: default
        mapping:
          # .NET's trce, zerolog's TRC, logrus's TRAC, java.util.logging's
          # FINEST, Gitea's T; pino's 10. And Go's log/slog between its names,
          # at its level plus 9, as OpenTelemetry's slog bridge numbers it.
          trace:
            - trce
            - trc
            - trac
            - finest
            - t
            - "10"
            - debug-4
          trace2:
            - debug-3
          trace3:
            - debug-2
          trace4:
            - debug-1
          # .NET's dbug, zerolog's DBG, Serilog's VRB and Verbose, NestJS's
          # VERBOSE, logrus's DEBU, java.util.logging's FINER, Gitea's D,
          # MongoDB's D1 to D5, Redis's "."; pino's 20.
          debug:
            - dbug
            - dbg
            - vrb
            - verbose
            - debu
            - finer
            - d
            - d1
            - d2
            - d3
            - d4
            - d5
            - "."
            - "20"
          # Redis's "-" (verbose, above its debug), java.util.logging's FINE.
          debug2:
            - "-"
            - fine
            - debug+1
          # java.util.logging's CONFIG.
          debug3:
            - config
            - debug+2
          debug4:
            - debug+3
          # MySQL's Note and System, PostgreSQL's and NestJS's LOG, zerolog's
          # INF, .NET's and Serilog's Information; klog's I, pino's 30.
          info:
            - note
            - system
            - log
            - inf
            - information
            - i
            - "30"
          # syslog's notice and Redis's "*" (its notice): INFO2, above INFO, as
          # Appendix B maps notice.
          info2:
            - notice
            - "*"
            - info+1
          info3:
            - info+2
          info4:
            - info+3
          # zerolog's WRN, Redis's "#", PHP's Deprecated; klog's W, pino's 40.
          warn:
            - warning
            - wrn
            - "#"
            - deprecated
            - w
            - "40"
          warn2:
            - warn+1
          warn3:
            - warn+2
          warn4:
            - warn+3
          # log15's eror, logrus's ERRO, .NET's fail, java.util.logging's
          # SEVERE, PHP's Recoverable fatal error; klog's E, pino's 50.
          error:
            - err
            - eror
            - erro
            - fail
            - severe
            - recoverable fatal error
            - e
            - "50"
          # syslog's crit, and zap's DPanic (it panics only in development):
          # ERROR2.
          error2:
            - crit
            - dpanic
            - error+1
          # syslog's and PSR-3's alert: ERROR3, an error that asks for action.
          error3:
            - alert
            - error+2
          error4:
            - error+3
          # A crash, or an application logger's top level: Python's and .NET's
          # critical, a panic (Go's, PostgreSQL's, logrus's PANI, zerolog's
          # PNC), logrus's FATA, PHP's Fatal error and Parse error, syslog's
          # emerg; zerolog's FTL; klog's F, pino's 60.
          fatal:
            - critical
            - panic
            - pnc
            - pani
            - fata
            - fatal error
            - parse error
            - ftl
            - emerg
            - emergency
            - f
            - "60"
            - error+4
          fatal2:
            - error+5
          fatal3:
            - error+6
          fatal4:
            - error+7
      # Remove the now-redundant attribute so the value is not duplicated as an
      # attribute beside the record's own severity.
      - type: remove
        id: remove-severity-attr
        field: attributes.severity_text
      # Nothing read, on stderr: the router's default, which leaves the record
      # with no severity. The end of the chain, after the cleanup.
      - type: noop
        id: severity-unspecified

processors:
  # Container CPU as OneUptime shows it: the CPU the container used over each
  # collection interval, as a percent of ONE core -- 100% is one core busy for
  # the whole interval, so a container on two cores reads 200%. That is the
  # `docker stats` figure, averaged over the 30 seconds between two scrapes
  # rather than read for one second, so it moves with the load and always
  # agrees with the per-second rate of container.cpu.usage.total.
  #
  # The receiver's own container.cpu.utilization is off (see the receiver),
  # so these four build it from the container's CPU time counter:
  #   1. transform/cpu-utilization-source copies container.cpu.usage.total
  #      (which goes on to OneUptime unchanged) as container.cpu.utilization;
  #   2. cumulative_to_delta/cpu-utilization turns the copy into the CPU time
  #      used since the previous scrape. A container's first scrape after the
  #      agent starts, and the scrape after its counter restarts (the
  #      container restarted), have nothing to compare with and send no CPU
  #      percent; state of a container gone for 10 minutes is dropped;
  #   3. delta_to_rate/cpu-utilization divides that by the seconds between
  #      the two scrapes: nanoseconds of CPU per second;
  #   4. transform/percent-units scales it to percent of one core (10^9 ns of
  #      CPU per second is one core, 100%) under the unit "%".
  # transform/percent-units also gives container.memory.percent the unit "%":
  # the receiver sends it as a percent (0-100) of the container's memory
  # limit, or of the host's memory without one, but labels it "1", the unit
  # of a 0-1 fraction, which reads as 100 times too much - and a description
  # that says what it is a percent of.
  # Tests/Ops/ContainerAgentCpuUtilization.test.js holds the three container
  # agents to these processors, and Tests/Ops/container-agent-cpu-
  # utilization-behaviour.sh runs them in the collector this image is built
  # FROM, against a container burning a known share of a core.
  transform/cpu-utilization-source:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - copy_metric(name="container.cpu.utilization") where metric.name == "container.cpu.usage.total"
  cumulative_to_delta/cpu-utilization:
    include:
      metrics:
        - container.cpu.utilization
      match_type: strict
    initial_value: drop
    max_staleness: 10m
  delta_to_rate/cpu-utilization:
    metrics:
      - container.cpu.utilization
  transform/percent-units:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - scale_metric(0.0000001, "%") where metric.name == "container.cpu.utilization"
          - set(metric.description, "CPU used over each collection interval, where 100% is one full CPU core.") where metric.name == "container.cpu.utilization"
          - set(metric.unit, "%") where metric.name == "container.memory.percent"
          - set(metric.description, "Memory in use as a percent of the container's limit, or of host memory if it has none.") where metric.name == "container.memory.percent"
  # Container restarts as OneUptime's Container Restart Loop template counts
  # them: every sample carries container.restarts.increase, the times the
  # container restarted since the agent's previous sample of it.
  #
  # container.restarts is Docker's RestartCount for the container: a lifetime
  # total that only its restart policy raises (a manual restart, and a
  # recreated container, start it again at 0). A monitor can only take the
  # difference of samples inside one minute, so growth between two samples
  # in different minutes went uncounted - half of a crash loop at a 30-second
  # interval. These two processors take it sample by sample instead:
  #   1. transform/restarts-increase-source copies container.restarts (which
  #      goes on to OneUptime unchanged, for the charts) as
  #      container.restarts.increase;
  #   2. cumulative_to_delta/restarts-increase turns the copy into the
  #      restarts since the previous sample of the same container, however
  #      far back it was. A container's first sample after the agent starts,
  #      and a sample whose count went down (restarted by hand, or
  #      recreated), send no increase; a container's previous sample is kept
  #      for 2 hours, so one sampled again after a long gap still sends every
  #      restart it made in between.
  # docker_stats keeps sampling a container that Docker is restarting: Docker
  # reports it as running while it waits to start it again, and answers the
  # receiver's stats request for it with empty stats, so its count arrives
  # every 30 seconds, between its runs too (as the receiver of
  # otel/opentelemetry-collector-contrib:0.161.0 and Docker Engine's source
  # read; the behaviour test below checks it against a real daemon).
  # Tests/Ops/ContainerAgentRestarts.test.js holds the Docker and Podman
  # agents to these processors, and Tests/Ops/container-agent-restarts-
  # behaviour.sh runs them in the collector this image is built FROM, against
  # a container in a restart loop.
  transform/restarts-increase-source:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - copy_metric(name="container.restarts.increase", description="Times the container restarted since the agent's previous sample of it.") where metric.name == "container.restarts"
  cumulative_to_delta/restarts-increase:
    include:
      metrics:
        - container.restarts.increase
      match_type: strict
    initial_value: drop
    max_staleness: 2h
  resource:
    attributes:
      - key: container.runtime
        value: "docker"
        action: upsert
      - key: host.name
        value: "${env:DOCKER_HOST_NAME}"
        action: upsert
      - key: oneuptime.agent.version
        value: "${env:APP_VERSION}"
        action: upsert
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    override: false
  batch:
    timeout: 10s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128
  # Drop noisy collector self-logs that slip through the filelog exclude
  # (e.g. if DOCKER_AGENT_CONTAINER_ID is not set). Matches on the
  # OTel Collector's characteristic error strings.
  filter/drop_self_logs:
    error_mode: ignore
    logs:
      log_record:
        - 'IsMatch(body, ".*(otelcol|exporterhelper|scraperhelper|opentelemetry\\.io/collector|opentelemetry-collector-contrib|dockerstatsreceiver|Error scraping metrics).*")'

exporters:
  otlphttp:
    endpoint: "${env:ONEUPTIME_URL}/otlp"
    headers:
      x-oneuptime-service-token: "${env:ONEUPTIME_SERVICE_TOKEN}"

service:
  pipelines:
    metrics:
      receivers: [docker_stats]
      processors:
        [
          memory_limiter,
          transform/cpu-utilization-source,
          cumulative_to_delta/cpu-utilization,
          delta_to_rate/cpu-utilization,
          transform/percent-units,
          transform/restarts-increase-source,
          cumulative_to_delta/restarts-increase,
          resourcedetection,
          resource,
          batch,
        ]
      exporters: [otlphttp]
    logs:
      receivers: [filelog]
      processors:
        [
          memory_limiter,
          filter/drop_self_logs,
          resourcedetection,
          resource,
          batch,
        ]
      exporters: [otlphttp]
