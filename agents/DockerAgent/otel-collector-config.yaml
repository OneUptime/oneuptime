receivers:
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    # Docker Engine API version the receiver speaks, from DOCKER_API_VERSION.
    # Empty by default (the image's ENV and docker-compose.yml), and empty
    # means NEGOTIATE.
    #
    # Verified against otel/opentelemetry-collector-contrib:0.161.0:
    #   * empty makes the receiver let the Docker SDK negotiate (one HEAD
    #     /_ping, then the daemon's own maximum, down to API 1.40), which
    #     works against any daemon this agent supports: Docker Engine 20.10
    #     (API 1.41) to the newest;
    #   * a daemon rejects a client NEWER than its maximum ("client version 1.44
    #     is too new"), and a rejected receiver fails to start, which takes the
    #     whole collector down with it -- which is what the image's old pinned
    #     1.44 did on Engine 20.10 to 24, so a version is pinned only when
    #     DOCKER_API_VERSION names one;
    #   * the receiver's own default, with the field left out, is 1.44 (1.25
    #     is its accepted MINIMUM, not its default) -- which is why the field
    #     is here, and empty, rather than left out.
    #
    # A plain ${env:...}: an unset variable expands to empty too, which is
    # the same negotiation.
    api_version: "${env:DOCKER_API_VERSION}"
    collection_interval: 30s
    # Enable optional metrics that the OneUptime Docker monitor alert
    # templates depend on (container restarts, uptime, pid count,
    # CPU throttling). These are OFF by default in the contrib
    # docker_stats receiver and must be explicitly turned on.
    metrics:
      # The receiver's own CPU percent is OFF: it reads ONE stats sample (its
      # Docker client asks for a one-shot sample, which carries no previous
      # reading), so it divides all the CPU the container used since it
      # started by all the CPU the host used since it booted -- a flat line
      # near zero that never follows the load. container.cpu.utilization is
      # built from container.cpu.usage.total instead: see
      # transform/cpu-utilization-source below.
      container.cpu.utilization:
        enabled: false
      container.cpu.throttling_data.throttled_periods:
        enabled: true
      container.cpu.throttling_data.throttled_time:
        enabled: true
      container.memory.percent:
        enabled: true
      container.pids.count:
        enabled: true
      container.restarts:
        enabled: true
      container.uptime:
        enabled: true
    # Copy the container labels OneUptime's database discovery reads onto
    # every metric of the container, as RESOURCE attributes of the same name
    # (verified against otel/opentelemetry-collector-contrib:0.161.0 and a
    # real daemon; a label the container lacks is simply absent). They
    # group the replicas of one Compose / Swarm service into one database
    # and keep Testcontainers runs, `docker compose run` one-offs and
    # kubelet-managed containers from becoming databases. Keep this list
    # equal to CONTAINER_CLASSIFIER_LABEL_KEYS
    # (packages/Common/Types/DatabaseServer/DatabaseContainerClassifier.ts).
    # container.command_line stays OFF: a command line can carry secrets.
    container_labels_to_metric_labels:
      com.docker.compose.oneoff: com.docker.compose.oneoff
      com.docker.compose.project: com.docker.compose.project
      com.docker.compose.service: com.docker.compose.service
      com.docker.swarm.service.name: com.docker.swarm.service.name
      io.kubernetes.pod.name: io.kubernetes.pod.name
      io.podman.compose.project: io.podman.compose.project
      io.podman.compose.service: io.podman.compose.service
      org.testcontainers: org.testcontainers
      org.testcontainers.sessionId: org.testcontainers.sessionId

  filelog:
    include:
      - /var/lib/docker/containers/*/*-json.log
    # Exclude the agent's own container log to avoid a feedback loop where
    # the collector ingests and exports its own scrape/export stack traces.
    # Inside a Docker container, HOSTNAME defaults to the short (12-char)
    # container ID, and Docker stores each container's log under a directory
    # named by the full container ID, so a prefix glob excludes this
    # container's log file on start-up.
    exclude:
      - /var/lib/docker/containers/${env:HOSTNAME}*/*-json.log
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      # Parse the Docker JSON log envelope
      - type: json_parser
        id: parser-docker
        timestamp:
          parse_from: attributes.time
          layout: "%Y-%m-%dT%H:%M:%S.%LZ"
      # Extract the container ID from the file path so we can display
      # it on the Logs page and correlate with docker_stats metrics.
      - type: regex_parser
        id: extract-container-id
        regex: "^/var/lib/docker/containers/(?P<container_id>[^/]+)/.+$"
        parse_from: attributes["log.file.path"]
      - type: move
        from: attributes.container_id
        to: resource["container.id"]
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]
      # Docker's json-file log driver writes one JSON envelope per newline, so
      # a multi-line stack trace (e.g. a Node.js error with "    at ..." frames)
      # arrives as many separate log records. Recombine consecutive entries
      # from the same container log file into a single record so exceptions
      # show up as one log line in the OneUptime UI. We treat any line that
      # begins with whitespace or a closing bracket/brace/paren as a
      # continuation of the previous entry, which covers stack frames, pretty-
      # printed JSON, and multi-line error details. source_identifier keeps
      # records from different containers from being merged together.
      - type: recombine
        id: recombine-multiline
        combine_field: body
        combine_with: "\n"
        is_first_entry: 'body matches "^[^\\s\\}\\)\\]]"'
        source_identifier: attributes["log.file.path"]
        force_flush_period: 5s
        max_log_size: 1048576
      # Docker's json-file driver does not record a severity; OTel log records
      # have dedicated severity_number / severity_text fields that downstream
      # viewers rely on for filtering. Derive a best-effort severity: read a
      # level keyword out of the body when there is one, and fall back to the
      # stdout/stderr stream when there is not.
      #
      # A level keyword is only believed when it sits where a LEVEL sits, not
      # merely because the word turns up somewhere in the line. Two shapes
      # count, and the pattern is those two, in this order:
      #
      #   1. LINE PREAMBLE. The keyword is on the first line of the record and
      #      everything before it is preamble: punctuation, digits, and word
      #      tokens that end on a structural delimiter (. ] = - : / | ) }).
      #      That is "[ERROR] ...", Monolog's "app.INFO: ...", "2026-08-31
      #      07:25:04 INFO ...", Python's "... - myapp - INFO - ..." and
      #      logfmt's leading "level=error ...". Prose is not: "Connection
      #      error, retrying" stops the preamble dead at "Connection ",
      #      because a bare word followed by a space is not a preamble token.
      #      The repetition is LAZY, so the first keyword in preamble
      #      position wins rather than the last.
      #   2. LEVEL FIELD. The keyword is the value of a level-ish key anywhere
      #      in the line -- level / lvl / severity / severity_text / levelname
      #      / log.level / log_level -- quoted or not, separated by ":" or
      #      "=". That is zap and logrus JSON ({"level":"info"}) and logfmt
      #      whose level is not the first field (ts=... level=error msg=...).
      #
      # The preamble branch is anchored, so when it matches it is the leftmost
      # match and beats a level field further along the same line. Both
      # branches take end-of-body as a trailing delimiter, so Docker (whose
      # json-file driver keeps the newline in the `log` field) and Podman
      # (whose CRI format does not) read the same line the same way.
      #
      # A line matching neither shape takes the stream fallback below, exactly
      # as it did before any of this existed. Every keyword in the alternation
      # MUST also resolve in `severity-parser` below: stanza's built-in preset
      # knows nothing of notice/crit/critical/panic/alert/emerg/emergency, and
      # an unmapped keyword leaves the record Unspecified, which is worse than
      # the stream guess it replaced.
      # Tests/Ops/ContainerAgentLogSeverity.test.js pins all of it, the corpus
      # of lines that must NOT match included.
      - type: router
        id: severity-router
        routes:
          - output: parse-severity-from-body
            expr: 'body matches "(?i)(?:^(?:[^A-Za-z\"\\n]|[A-Za-z][A-Za-z0-9_]*[ \\t]*[.:=,/>|)}\\]-])*?|(?:^|[\\s,{\\[])\"?(?:log[._]?level|severity_?text|severity|levelname|level|lvl)\"?[ \\t]*[:=][ \\t]*\"?)(TRACE|DEBUG|INFO|NOTICE|WARNING|WARN|EMERGENCY|EMERG|ALERT|CRITICAL|CRIT|ERROR|ERR|FATAL|PANIC)(?:$|[\\s\\]:=,)\"}|>])"'
        default: add-fallback-severity
      - type: regex_parser
        id: parse-severity-from-body
        regex: '(?i)(?:^(?:[^A-Za-z"\n]|[A-Za-z][A-Za-z0-9_]*[ \t]*[.:=,/>|)}\]-])*?|(?:^|[\s,{\[])"?(?:log[._]?level|severity_?text|severity|levelname|level|lvl)"?[ \t]*[:=][ \t]*"?)(?P<severity_text>TRACE|DEBUG|INFO|NOTICE|WARNING|WARN|EMERGENCY|EMERG|ALERT|CRITICAL|CRIT|ERROR|ERR|FATAL|PANIC)(?:$|[\s\]:=,)"}|>])'
        parse_from: body
        output: severity-parser
      # No keyword in the body: fall back to the stream. Docker's json-file
      # driver records no severity of its own. stderr -> ERROR, stdout -> INFO.
      - type: add
        id: add-fallback-severity
        field: attributes.severity_text
        value: 'EXPR(attributes["log.iostream"] == "stderr" ? "ERROR" : "INFO")'
        output: severity-parser
      # Promote the textual severity onto the LogRecord itself so OTel log
      # consumers see a real severity_number rather than Unspecified.
      - type: severity_parser
        id: severity-parser
        parse_from: attributes.severity_text
        preset: default
        mapping:
          warn:
            - warning
          error:
            - err
            - crit
            - critical
          # PSR-3 / syslog put alert and emergency above critical, and neither
          # has a built-in mapping; nginx writes emergency as [emerg].
          fatal:
            - panic
            - alert
            - emerg
            - emergency
          info:
            - notice
      # Remove the now-redundant attribute so we don't duplicate the value
      # both as an attribute and as the record's severity field.
      - type: remove
        id: remove-severity-attr
        field: attributes.severity_text

processors:
  # Container CPU as OneUptime shows it: the CPU the container used over each
  # collection interval, as a percent of ONE core -- 100% is one core busy for
  # the whole interval, so a container on two cores reads 200%. That is the
  # `docker stats` figure, averaged over the 30 seconds between two scrapes
  # rather than read for one second, so it moves with the load and always
  # agrees with the per-second rate of container.cpu.usage.total.
  #
  # The receiver's own container.cpu.utilization is off (see the receiver),
  # so these four build it from the container's CPU time counter:
  #   1. transform/cpu-utilization-source copies container.cpu.usage.total
  #      (which goes on to OneUptime unchanged) as container.cpu.utilization;
  #   2. cumulative_to_delta/cpu-utilization turns the copy into the CPU time
  #      used since the previous scrape. A container's first scrape after the
  #      agent starts, and the scrape after its counter restarts (the
  #      container restarted), have nothing to compare with and send no CPU
  #      percent; state of a container gone for 10 minutes is dropped;
  #   3. delta_to_rate/cpu-utilization divides that by the seconds between
  #      the two scrapes: nanoseconds of CPU per second;
  #   4. transform/percent-units scales it to percent of one core (10^9 ns of
  #      CPU per second is one core, 100%) under the unit "%".
  # transform/percent-units also gives container.memory.percent the unit "%":
  # the receiver sends it as a percent (0-100) of the container's memory
  # limit, or of the host's memory without one, but labels it "1", the unit
  # of a 0-1 fraction, which reads as 100 times too much - and a description
  # that says what it is a percent of.
  # Tests/Ops/ContainerAgentCpuUtilization.test.js holds the three container
  # agents to these processors, and Tests/Ops/container-agent-cpu-
  # utilization-behaviour.sh runs them in the collector this image is built
  # FROM, against a container burning a known share of a core.
  transform/cpu-utilization-source:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - copy_metric(name="container.cpu.utilization") where metric.name == "container.cpu.usage.total"
  cumulative_to_delta/cpu-utilization:
    include:
      metrics:
        - container.cpu.utilization
      match_type: strict
    initial_value: drop
    max_staleness: 10m
  delta_to_rate/cpu-utilization:
    metrics:
      - container.cpu.utilization
  transform/percent-units:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - scale_metric(0.0000001, "%") where metric.name == "container.cpu.utilization"
          - set(metric.description, "CPU used over each collection interval, where 100% is one full CPU core.") where metric.name == "container.cpu.utilization"
          - set(metric.unit, "%") where metric.name == "container.memory.percent"
          - set(metric.description, "Memory in use as a percent of the container's limit, or of host memory if it has none.") where metric.name == "container.memory.percent"
  # Container restarts as OneUptime's Container Restart Loop template counts
  # them: every sample carries container.restarts.increase, the times the
  # container restarted since the agent's previous sample of it.
  #
  # container.restarts is Docker's RestartCount for the container: a lifetime
  # total that only its restart policy raises (a manual restart, and a
  # recreated container, start it again at 0). A monitor can only take the
  # difference of samples inside one minute, so growth between two samples
  # in different minutes went uncounted - half of a crash loop at a 30-second
  # interval. These two processors take it sample by sample instead:
  #   1. transform/restarts-increase-source copies container.restarts (which
  #      goes on to OneUptime unchanged, for the charts) as
  #      container.restarts.increase;
  #   2. cumulative_to_delta/restarts-increase turns the copy into the
  #      restarts since the previous sample of the same container, however
  #      far back it was. A container's first sample after the agent starts,
  #      and a sample whose count went down (restarted by hand, or
  #      recreated), send no increase; a container's previous sample is kept
  #      for 2 hours, so one sampled again after a long gap still sends every
  #      restart it made in between.
  # docker_stats keeps sampling a container that Docker is restarting: Docker
  # reports it as running while it waits to start it again, and answers the
  # receiver's stats request for it with empty stats, so its count arrives
  # every 30 seconds, between its runs too (as the receiver of
  # otel/opentelemetry-collector-contrib:0.161.0 and Docker Engine's source
  # read; the behaviour test below checks it against a real daemon).
  # Tests/Ops/ContainerAgentRestarts.test.js holds the Docker and Podman
  # agents to these processors, and Tests/Ops/container-agent-restarts-
  # behaviour.sh runs them in the collector this image is built FROM, against
  # a container in a restart loop.
  transform/restarts-increase-source:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - copy_metric(name="container.restarts.increase", description="Times the container restarted since the agent's previous sample of it.") where metric.name == "container.restarts"
  cumulative_to_delta/restarts-increase:
    include:
      metrics:
        - container.restarts.increase
      match_type: strict
    initial_value: drop
    max_staleness: 2h
  resource:
    attributes:
      - key: container.runtime
        value: "docker"
        action: upsert
      - key: host.name
        value: "${env:DOCKER_HOST_NAME}"
        action: upsert
      - key: oneuptime.agent.version
        value: "${env:APP_VERSION}"
        action: upsert
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    override: false
  batch:
    timeout: 10s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128
  # Drop noisy collector self-logs that slip through the filelog exclude
  # (e.g. if DOCKER_AGENT_CONTAINER_ID is not set). Matches on the
  # OTel Collector's characteristic error strings.
  filter/drop_self_logs:
    error_mode: ignore
    logs:
      log_record:
        - 'IsMatch(body, ".*(otelcol|exporterhelper|scraperhelper|opentelemetry\\.io/collector|opentelemetry-collector-contrib|dockerstatsreceiver|Error scraping metrics).*")'

exporters:
  otlphttp:
    endpoint: "${env:ONEUPTIME_URL}/otlp"
    headers:
      x-oneuptime-service-token: "${env:ONEUPTIME_SERVICE_TOKEN}"

service:
  pipelines:
    metrics:
      receivers: [docker_stats]
      processors:
        [
          memory_limiter,
          transform/cpu-utilization-source,
          cumulative_to_delta/cpu-utilization,
          delta_to_rate/cpu-utilization,
          transform/percent-units,
          transform/restarts-increase-source,
          cumulative_to_delta/restarts-increase,
          resourcedetection,
          resource,
          batch,
        ]
      exporters: [otlphttp]
    logs:
      receivers: [filelog]
      processors:
        [
          memory_limiter,
          filter/drop_self_logs,
          resourcedetection,
          resource,
          batch,
        ]
      exporters: [otlphttp]
