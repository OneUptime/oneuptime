receivers:
  # Per-container resource metrics from the local Docker daemon. On a
  # swarm manager this includes the manager's own task containers; for
  # full per-node container metrics, run the agent on every node (all
  # pointed at the same DOCKER_SWARM_CLUSTER_NAME) or accept
  # manager-local stats. These power the cluster Metrics tab.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    # Docker Engine API version the receiver speaks, from DOCKER_API_VERSION.
    # Empty by default (docker-compose.yml), and empty means NEGOTIATE.
    #
    # Verified against otel/opentelemetry-collector-contrib:0.165.0:
    #   * empty makes the receiver let the Docker SDK negotiate (one HEAD
    #     /_ping, then the daemon's own maximum, down to API 1.40), which
    #     works against any daemon this agent supports: Docker Engine 20.10
    #     (API 1.41) to the newest;
    #   * a daemon rejects a client NEWER than its maximum ("client version 1.44
    #     is too new"), and a rejected receiver fails to start, which takes the
    #     whole collector down with it -- which is what a pinned 1.44 did to
    #     every node on Engine 20.10 to 24, so a version is pinned only when
    #     DOCKER_API_VERSION names one;
    #   * the receiver's own default, with the field left out, is 1.44 (1.25
    #     is its accepted MINIMUM, not its default) -- which is why the field
    #     is here, and empty, rather than left out.
    #
    # A plain ${env:...}: an unset variable expands to empty too, which is
    # the same negotiation.
    api_version: "${env:DOCKER_API_VERSION}"
    collection_interval: 30s
    metrics:
      # The receiver's own CPU percent is OFF: it reads ONE stats sample (its
      # Docker client asks for a one-shot sample, which carries no previous
      # reading), so it divides all the CPU the container used since it
      # started by all the CPU the node used since it booted -- a flat line
      # near zero that never follows the load. container.cpu.utilization is
      # built from container.cpu.usage.total instead: see
      # transform/cpu-utilization-source below.
      container.cpu.utilization:
        enabled: false
      container.memory.percent:
        enabled: true
      container.pids.count:
        enabled: true
      container.uptime:
        enabled: true
    # Copy the labels Swarm puts on every task container onto the metrics of
    # that container, as RESOURCE attributes (the receiver puts them on the
    # resource, next to container.name and container.image.name, so
    # OneUptime stores them resource.-prefixed; a container that is not a
    # task lacks the labels, and the attributes are simply absent). They are
    # what a Docker Swarm monitor's Service Name filter matches and what
    # names a task's service and node in its incidents. Swarm labels a task
    # with its node's ID only: the node's NAME is stamped from
    # DOCKER_SWARM_NODE_NAME, by transform/swarm-node-name below.
    container_labels_to_metric_labels:
      com.docker.swarm.service.name: docker.swarm.service.name
      com.docker.swarm.node.id: docker.swarm.node.id

  # Container stdout/stderr logs (powers the cluster Logs tab).
  filelog:
    include:
      - /var/lib/docker/containers/*/*-json.log
    exclude:
      - /var/lib/docker/containers/${env:HOSTNAME}*/*-json.log
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      - type: json_parser
        id: parser-docker
        timestamp:
          parse_from: attributes.time
          layout: "%Y-%m-%dT%H:%M:%S.%LZ"
      - type: regex_parser
        id: extract-container-id
        regex: "^/var/lib/docker/containers/(?P<container_id>[^/]+)/.+$"
        parse_from: attributes["log.file.path"]
      - type: move
        from: attributes.container_id
        to: resource["container.id"]
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]
      - type: recombine
        id: recombine-multiline
        combine_field: body
        combine_with: "\n"
        is_first_entry: 'body matches "^[^\\s\\}\\)\\]]"'
        source_identifier: attributes["log.file.path"]
        force_flush_period: 5s
        max_log_size: 1048576
      # The json-file driver records no severity, only the stream a line was
      # written to; OTel log records have dedicated severity_number /
      # severity_text fields that downstream viewers rely on for filtering.
      #
      # Derive a severity: the router hands each line to the FIRST reader that
      # knows where its format keeps the level.
      #
      #   1. parse-klog-severity. klog and glog (every Kubernetes component,
      #      cert-manager, ingress-nginx's controller) put the level in the
      #      first letter, glued to the date: "I1123 19:09:25.286486 1
      #      solver.go:104] ..." is INFO, W is WARN, E ERROR, F FATAL.
      #   2. add-exception-severity. What a runtime prints for an exception
      #      names no level but is an error: Python's "Traceback (most recent
      #      call last):", Java's "Exception in thread ..." and "Caused by:
      #      ...", .NET's "Unhandled exception.", Rust's "thread 'main' panicked
      #      at ...", and a line that starts with an exception's class
      #      ("TypeError: ...", "java.lang.IllegalStateException: ..."). ERROR.
      #   3. add-warning-severity. Python's warnings module and Node's process
      #      warnings name a category, not a level: "/app/x.py:3:
      #      DeprecationWarning: ..." and "(node:1) [DEP0005]
      #      DeprecationWarning: ...". WARN.
      #   4. parse-numeric-severity. pino and bunyan write the level as a number
      #      among the top-level fields, {"level":30,...}: 10 TRACE, 20 DEBUG,
      #      30 INFO, 40 WARN, 50 ERROR, 60 FATAL.
      #   5. parse-severity-from-body. A level word, believed only where a level
      #      sits, not merely because the word turns up in the line:
      #        LINE PREAMBLE. The word is on the first line and everything
      #        before it is preamble: punctuation, digits, word tokens that end
      #        on a structural delimiter (. ] = - : / | ) }), colour codes, and
      #        a time at the very start, read with its letters (RFC 3339's T and
      #        Z, a zone such as UTC or GMT, ctime's day and month). That is
      #        "[ERROR] ...", Monolog's "app.INFO: ...", hclog's
      #        "2026-11-23T18:58:14.670Z [INFO] ...", Python's "... - myapp -
      #        INFO - ..." and PostgreSQL's "2026-11-23 18:53:14.906 GMT [27]
      #        LOG:  ...". Prose is not: "Connection error, retrying" stops at
      #        "Connection ", a bare word followed by a space. The repetition is
      #        lazy, so the first word in preamble position wins.
      #        LEVEL FIELD. The word is the value of a level key anywhere in the
      #        line, quoted or not, after ":" or "=": level, lvl, severity,
      #        severity_text, levelname, level_name, log.level, log_level,
      #        hclog's @level, Serilog's @l. That is zap, logrus and slog JSON,
      #        and logfmt.
      #      The preamble is anchored, so it beats a level field further along
      #      the line. The words are the OTel names, PSR-3's and syslog's, and
      #      the ones formats write for them: PostgreSQL's LOG (in capitals
      #      only: "Log rotated" is prose), MySQL's Note, java.util.logging's
      #      SEVERE, .NET's trce, dbug and fail, zerolog's and Serilog's three
      #      letters (INF, WRN, ...), log15's eror, zap's DPanic.
      #   6. add-fallback-severity. A line nothing read, on stdout: INFO, as
      #      stdout is a program's ordinary output.
      #
      # A line nothing read on STDERR gets no severity at all (the router's
      # default, severity-unspecified). stderr is where programs write their
      # diagnostics, every level of them: klog, zap's production config, logrus,
      # hclog, Python's logging and PostgreSQL write everything there. So the
      # stream says nothing about such a line's level. It used to make one
      # ERROR, which stored every unread INFO and WARN line on stderr as an
      # Error (issue #10972). OneUptime shows it as Unspecified, and a severity
      # filter keeps it, having no level to compare.
      #
      # Every text a reader lifts MUST resolve in `severity-parser` below:
      # stanza's built-in preset knows only
      # trace/debug/info/warn/warning/error/err/fatal, and an unmapped text
      # leaves the record Unspecified. The patterns are linear in JavaScript's
      # backtracking engine as well as in RE2, since the Kubernetes agent's
      # API-mode tailer runs the same source there: a time is read once, at the
      # start of the line, and only the colour-code token consumes an ESC.
      # Tests/Ops/ContainerAgentLogSeverity.test.js pins all of it over a corpus
      # of real lines (Tests/Ops/Utils/LogSeverityCorpus.js), prose that must
      # not be read included, and Tests/Ops/agent-log-severity-behaviour.sh runs
      # that corpus through the real collector.
      - type: router
        id: severity-router
        routes:
          - output: parse-klog-severity
            expr: 'body matches "^([IWEF])\\d{4}(?:\\d{4})? \\d\\d:\\d\\d:\\d\\d\\.\\d{6} +\\d+ [^ :\\]]+:\\d+\\]"'
          - output: add-exception-severity
            expr: 'body matches "^(?:Traceback \\(most recent call last\\):|Exception in thread \"|Caused by: |Unhandled [Ee]xception[.:]|thread \\x27[^\\x27]*\\x27 panicked at |(?:[A-Za-z_$][\\w$]*\\.)*(?:[A-Z][\\w$]*)?(?:Error|Exception)(?::(?:\\s|$)|[\\r\\n]|$))"'
          - output: add-warning-severity
            expr: 'body matches "^(?:\\S+:\\d+: |\\(node:\\d+\\) (?:\\[[A-Z]+\\d+\\] )?)[A-Z][A-Za-z]*Warning: "'
          - output: parse-numeric-severity
            expr: 'body matches "^\\{(?:\"(?:[^\"\\\\]|\\\\.)*\":(?:\"(?:[^\"\\\\]|\\\\.)*\"|-?\\d+(?:\\.\\d+)?|true|false|null),)*?\"level\":([1-6]0)[,}]"'
          - output: parse-severity-from-body
            expr: 'body matches "(?i)(?:^(?:(?:\\x1b\\[[0-9;]*m)*(?:\\[(?:\\x1b\\[[0-9;]*m)*)?(?:\\d{4}-\\d\\d-\\d\\d[T ]\\d\\d:\\d\\d(?::\\d\\d(?:[.,]\\d+)?)?(?:Z|[+-]\\d\\d(?::?\\d\\d)?)?(?:[ \\t]+(?-i:UTC|GMT|CET|CEST|EET|EEST|WET|WEST|BST|IST|MSK|EST|EDT|CST|CDT|MST|MDT|PST|PDT|HST|AKST|AKDT|JST|KST|HKT|SGT|AEST|AEDT|ACST|ACDT|AWST|NZST|NZDT))?|(?-i:Mon|Tue|Wed|Thu|Fri|Sat|Sun) (?-i:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) +\\d\\d? \\d\\d:\\d\\d:\\d\\d(?:\\.\\d+)? \\d{4}))?(?:[^A-Za-z\"\\n\\x1b]|\\x1b\\[[0-9;]*m|[A-Za-z][A-Za-z0-9_]*[ \\t]*[.:=,/>|)}\\]-])*?|(?:^|[\\s,{\\[])\"?(?:@?(?:log[._]?level|severity_?text|severity|level_?name|level|lvl)|@l)\"?[ \\t]*[:=][ \\t]*\"?)(TRACE|TRCE|TRC|DEBUG|DBUG|DBG|VRB|INFORMATION|INFO|INF|NOTICE|NOTE|(?-i:LOG)|WARNING|WARN|WRN|EMERGENCY|EMERG|ALERT|CRITICAL|CRIT|ERROR|EROR|ERR|FAIL|SEVERE|DPANIC|FATAL|FTL|PANIC|PNC)(?:$|[\\s\\]:=,)\"}|>\\x1b]|/[A-Za-z][A-Za-z0-9_-]*\\])"'
          - output: add-fallback-severity
            expr: 'attributes["log.iostream"] != "stderr"'
        default: severity-unspecified
      # 1. klog and glog: the first letter is the level.
      - type: regex_parser
        id: parse-klog-severity
        regex: '^(?P<severity_text>[IWEF])\d{4}(?:\d{4})? \d\d:\d\d:\d\d\.\d{6} +\d+ [^ :\]]+:\d+\]'
        parse_from: body
        output: severity-parser
      # 2. An exception's header: an error, though it names no level.
      - type: add
        id: add-exception-severity
        field: attributes.severity_text
        value: ERROR
        output: severity-parser
      # 3. A Python or Node warning category: a warning.
      - type: add
        id: add-warning-severity
        field: attributes.severity_text
        value: WARN
        output: severity-parser
      # 4. pino and bunyan: a number among the top-level fields.
      - type: regex_parser
        id: parse-numeric-severity
        regex: '^\{(?:"(?:[^"\\]|\\.)*":(?:"(?:[^"\\]|\\.)*"|-?\d+(?:\.\d+)?|true|false|null),)*?"level":(?P<severity_text>[1-6]0)[,}]'
        parse_from: body
        output: severity-parser
      # 5. A level word where a level sits.
      - type: regex_parser
        id: parse-severity-from-body
        regex: '(?i)(?:^(?:(?:\x1b\[[0-9;]*m)*(?:\[(?:\x1b\[[0-9;]*m)*)?(?:\d{4}-\d\d-\d\d[T ]\d\d:\d\d(?::\d\d(?:[.,]\d+)?)?(?:Z|[+-]\d\d(?::?\d\d)?)?(?:[ \t]+(?-i:UTC|GMT|CET|CEST|EET|EEST|WET|WEST|BST|IST|MSK|EST|EDT|CST|CDT|MST|MDT|PST|PDT|HST|AKST|AKDT|JST|KST|HKT|SGT|AEST|AEDT|ACST|ACDT|AWST|NZST|NZDT))?|(?-i:Mon|Tue|Wed|Thu|Fri|Sat|Sun) (?-i:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) +\d\d? \d\d:\d\d:\d\d(?:\.\d+)? \d{4}))?(?:[^A-Za-z"\n\x1b]|\x1b\[[0-9;]*m|[A-Za-z][A-Za-z0-9_]*[ \t]*[.:=,/>|)}\]-])*?|(?:^|[\s,{\[])"?(?:@?(?:log[._]?level|severity_?text|severity|level_?name|level|lvl)|@l)"?[ \t]*[:=][ \t]*"?)(?P<severity_text>TRACE|TRCE|TRC|DEBUG|DBUG|DBG|VRB|INFORMATION|INFO|INF|NOTICE|NOTE|(?-i:LOG)|WARNING|WARN|WRN|EMERGENCY|EMERG|ALERT|CRITICAL|CRIT|ERROR|EROR|ERR|FAIL|SEVERE|DPANIC|FATAL|FTL|PANIC|PNC)(?:$|[\s\]:=,)"}|>\x1b]|/[A-Za-z][A-Za-z0-9_-]*\])'
        parse_from: body
        output: severity-parser
      # 6. Nothing read, on stdout: a program's ordinary output.
      - type: add
        id: add-fallback-severity
        field: attributes.severity_text
        value: INFO
        output: severity-parser
      # Promote the text onto the LogRecord, so OTel consumers see a real
      # severity_number. Each alias is under one level only: stanza reads this
      # block as a map, in no set order.
      - type: severity_parser
        id: severity-parser
        parse_from: attributes.severity_text
        preset: default
        mapping:
          # .NET's trce, zerolog's TRC; pino's 10.
          trace:
            - trce
            - trc
            - "10"
          # .NET's dbug, zerolog's DBG, Serilog's VRB; pino's 20.
          debug:
            - dbug
            - dbg
            - vrb
            - "20"
          # syslog's notice, MySQL's Note, PostgreSQL's LOG, zerolog's INF,
          # .NET's Information; klog's I, pino's 30.
          info:
            - notice
            - note
            - log
            - inf
            - information
            - i
            - "30"
          # zerolog's WRN; klog's W, pino's 40.
          warn:
            - warning
            - wrn
            - w
            - "40"
          # log15's eror, .NET's fail, java.util.logging's SEVERE, zap's DPanic,
          # syslog's crit; klog's E, pino's 50.
          error:
            - err
            - eror
            - fail
            - severe
            - dpanic
            - crit
            - critical
            - e
            - "50"
          # PSR-3 / syslog put alert and emergency above critical, and neither
          # has a built-in mapping; nginx writes it as [emerg]. zerolog's PNC
          # and FTL; klog's F, pino's 60.
          fatal:
            - panic
            - pnc
            - ftl
            - alert
            - emerg
            - emergency
            - f
            - "60"
      # Remove the now-redundant attribute so the value is not duplicated as an
      # attribute beside the record's own severity.
      - type: remove
        id: remove-severity-attr
        field: attributes.severity_text
      # Nothing read, on stderr: the router's default, which leaves the record
      # with no severity. The end of the chain, after the cleanup.
      - type: noop
        id: severity-unspecified

  # Inventory snapshots produced by inventory-snapshot.sh (which runs on
  # a manager node and walks the Swarm API). Each line is a JSON
  # envelope: {"oneuptime.dockerswarm.kind":"Node","data":{...}}
  filelog/inventory:
    include:
      - /var/log/oneuptime-docker-swarm-inventory.log
    start_at: beginning
    include_file_path: false
    include_file_name: false
    poll_interval: 30s
    operators:
      - type: json_parser
        id: parser-inventory
      - type: move
        from: attributes.data
        to: body

  # The swarm's state as metrics, from the same poller: one OTLP JSON line,
  # rewritten every minute, with whether each node is ready and how many
  # replicas each service wants and runs (docker.swarm.node.ready,
  # docker.swarm.service.replicas.desired / .running), each on a resource
  # named as its tasks' containers are (docker.swarm.node.name,
  # docker.swarm.service.name). OneUptime's Node Not Ready and Service
  # Replicas Mismatch alerts read them.
  otlpjsonfile/inventory:
    include:
      - /var/log/oneuptime-docker-swarm-inventory-metrics.json
    start_at: beginning
    poll_interval: 15s

processors:
  # Container CPU as OneUptime shows it: the CPU the container used over each
  # collection interval, as a percent of ONE core -- 100% is one core busy for
  # the whole interval, so a container on two cores reads 200%. That is the
  # `docker stats` figure, averaged over the 30 seconds between two scrapes
  # rather than read for one second, so it moves with the load and always
  # agrees with the per-second rate of container.cpu.usage.total.
  #
  # The receiver's own container.cpu.utilization is off (see the receiver),
  # so these four build it from the container's CPU time counter:
  #   1. transform/cpu-utilization-source copies container.cpu.usage.total
  #      (which goes on to OneUptime unchanged) as container.cpu.utilization;
  #   2. cumulative_to_delta/cpu-utilization turns the copy into the CPU time
  #      used since the previous scrape. A container's first scrape after the
  #      agent starts, and the scrape after its counter restarts (the
  #      container restarted), have nothing to compare with and send no CPU
  #      percent; state of a container gone for 10 minutes is dropped;
  #   3. delta_to_rate/cpu-utilization divides that by the seconds between
  #      the two scrapes: nanoseconds of CPU per second;
  #   4. transform/percent-units scales it to percent of one core (10^9 ns of
  #      CPU per second is one core, 100%) under the unit "%".
  # transform/percent-units also gives container.memory.percent the unit "%":
  # the receiver sends it as a percent (0-100) of the container's memory
  # limit, or of the node's memory without one, but labels it "1", the unit
  # of a 0-1 fraction, which reads as 100 times too much - and a description
  # that says what it is a percent of.
  # Tests/Ops/ContainerAgentCpuUtilization.test.js holds the three container
  # agents to these processors, and Tests/Ops/container-agent-cpu-
  # utilization-behaviour.sh runs them in the collector docker-compose.yml
  # pins.
  transform/cpu-utilization-source:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - copy_metric(name="container.cpu.utilization") where metric.name == "container.cpu.usage.total"
  cumulative_to_delta/cpu-utilization:
    include:
      metrics:
        - container.cpu.utilization
      match_type: strict
    initial_value: drop
    max_staleness: 10m
  delta_to_rate/cpu-utilization:
    metrics:
      - container.cpu.utilization
  transform/percent-units:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - scale_metric(0.0000001, "%") where metric.name == "container.cpu.utilization"
          - set(metric.description, "CPU used over each collection interval, where 100% is one full CPU core.") where metric.name == "container.cpu.utilization"
          - set(metric.unit, "%") where metric.name == "container.memory.percent"
          - set(metric.description, "Memory in use as a percent of the container's limit, or of host memory if it has none.") where metric.name == "container.memory.percent"
  # The node's name, from DOCKER_SWARM_NODE_NAME, as docker.swarm.node.name
  # on the node's container metrics and logs (install.sh writes the node's
  # hostname, the name `docker node ls` shows). Left off entirely when the
  # variable is empty, rather than stamped as an empty name: then only the
  # node's ID (docker.swarm.node.id, from the task label) says where a task
  # runs. Not on the inventory pipeline: the inventory describes the whole
  # cluster, not the node the poller happens to run on.
  transform/swarm-node-name:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["docker.swarm.node.name"], "${env:DOCKER_SWARM_NODE_NAME}")
          - delete_key(attributes, "docker.swarm.node.name") where attributes["docker.swarm.node.name"] == ""
    log_statements:
      - context: resource
        statements:
          - set(attributes["docker.swarm.node.name"], "${env:DOCKER_SWARM_NODE_NAME}")
          - delete_key(attributes, "docker.swarm.node.name") where attributes["docker.swarm.node.name"] == ""
  # IMPORTANT: this config stamps docker.swarm.cluster.name (the join key)
  # and the agent version on everything, and the node's name above -- never
  # host.name, and no resourcedetection. The docker_stats receiver itself
  # puts container.runtime=docker on every container's metrics, as it does
  # on a Docker host, so host.name is what would make OneUptime
  # auto-discover each node as a generic Host / Docker Host in addition to
  # the swarm cluster.
  resource:
    attributes:
      - key: docker.swarm.cluster.name
        value: "${env:DOCKER_SWARM_CLUSTER_NAME}"
        action: upsert
      - key: oneuptime.agent.version
        value: "${env:APP_VERSION}"
        action: upsert
  batch:
    timeout: 10s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128
  filter/drop_self_logs:
    error_mode: ignore
    logs:
      log_record:
        - 'IsMatch(body, ".*(otelcol|exporterhelper|scraperhelper|opentelemetry\\.io/collector|opentelemetry-collector-contrib|dockerstatsreceiver|Error scraping metrics).*")'

exporters:
  otlphttp:
    endpoint: "${env:ONEUPTIME_URL}/otlp"
    headers:
      x-oneuptime-service-token: "${env:ONEUPTIME_SERVICE_TOKEN}"

service:
  pipelines:
    metrics:
      receivers: [docker_stats]
      processors:
        [
          memory_limiter,
          transform/cpu-utilization-source,
          cumulative_to_delta/cpu-utilization,
          delta_to_rate/cpu-utilization,
          transform/percent-units,
          transform/swarm-node-name,
          resource,
          batch,
        ]
      exporters: [otlphttp]
    logs:
      receivers: [filelog]
      processors:
        [
          memory_limiter,
          filter/drop_self_logs,
          transform/swarm-node-name,
          resource,
          batch,
        ]
      exporters: [otlphttp]
    logs/inventory:
      receivers: [filelog/inventory]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
    # The swarm's state as metrics. Like the inventory, it describes the
    # whole cluster, not the node the poller runs on: no swarm-node-name.
    metrics/inventory:
      receivers: [otlpjsonfile/inventory]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
