services:
  oneuptime-proxmox-agent:
    # Upstream collector, pinned. There is no oneuptime/proxmox-agent image —
    # the agent is entirely defined by otel-collector-config.yaml, which
    # install.sh downloads next to this file, and that config reports this
    # pin as the agent's version (oneuptime.agent.version). Bump the two
    # together; Tests/Ops/validate-collector-configs.sh validates the config
    # against this version.
    #
    # For the optional journald logs pipeline (PVE service logs — see the
    # commented receiver in otel-collector-config.yaml) this stock image
    # is not enough: it is built FROM scratch with no `journalctl` and
    # runs as a non-root user that cannot read the journal. Replace it
    # with the one-line custom image from README.md ("Shipping Proxmox
    # service logs") when you enable that pipeline.
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: oneuptime-proxmox-agent
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Uncomment (together with the journald receiver and logs pipeline
      # in otel-collector-config.yaml) to give the collector read access
      # to the systemd journal. Only meaningful when this compose file
      # runs directly on a Proxmox VE node — the journal is per-host.
      # - /var/log/journal:/var/log/journal:ro
      # - /etc/machine-id:/etc/machine-id:ro
    environment:
      - ONEUPTIME_URL=${ONEUPTIME_URL}
      - ONEUPTIME_TELEMETRY_INGESTION_KEY=${ONEUPTIME_TELEMETRY_INGESTION_KEY}
      - PROXMOX_CLUSTER_NAME=${PROXMOX_CLUSTER_NAME:-proxmox-cluster}
      # Address (host:port, no scheme) of prometheus-pve-exporter. The
      # default points at the bundled exporter service below.
      - PVE_EXPORTER_URL=${PVE_EXPORTER_URL:-pve-exporter:9221}
      # Proxmox VE API host (any node of the cluster) that the exporter
      # should query. "localhost" only works when the exporter runs
      # directly on a PVE node — set this when using the bundled exporter.
      - PVE_HOST=${PVE_HOST:-localhost}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: bundled prometheus-pve-exporter. Enable it with
  #   docker compose --profile pve-exporter up -d
  # if you do not already run pve-exporter somewhere. It needs a Proxmox
  # VE API token (Datacenter -> Permissions -> API Tokens) with the
  # PVEAuditor role.
  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: oneuptime-pve-exporter
    profiles: ["pve-exporter"]
    init: true
    # prometheus-pve-exporter wants the API token split into a user part
    # (PVE_USER) and a token-name part (PVE_TOKEN_NAME). PVE_API_TOKEN_ID
    # is the full id exactly as shown in the Proxmox UI
    # ("user@realm!tokenname") — split it here so the .env file can hold
    # the token as copied. ($$ shields the parameter expansion from
    # docker compose interpolation; the exporter ignores unknown PVE_*
    # variables, so leaving PVE_API_TOKEN_ID set is harmless.)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - export PVE_USER="$${PVE_API_TOKEN_ID%%!*}" PVE_TOKEN_NAME="$${PVE_API_TOKEN_ID##*!}" && exec /usr/bin/pve_exporter
    environment:
      - PVE_API_TOKEN_ID=${PVE_API_TOKEN_ID}
      - PVE_TOKEN_VALUE=${PVE_API_TOKEN_SECRET}
      # Proxmox VE ships a self-signed certificate by default, so SSL
      # verification is off unless you opt in.
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL:-false}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The Proxmox AI agent: runs the `pvesh` commands OneUptime AI asks for
  # while it investigates an incident or alert on this cluster — read-only
  # unless you set ONEUPTIME_AI_ALLOW_WRITES=true. There is no pvesh binary
  # in it: each command becomes one call to the Proxmox VE API
  # (https://PVE_HOST:8006/api2/json) with an API token from this same .env
  # (OneUptime never sends it any), so the token's Proxmox permissions are
  # the hard limit. It registers as the cluster named PROXMOX_CLUSTER_NAME,
  # exactly like the collector above, and shows up on that cluster's
  # AI -> AI agent page. See README.md ("OneUptime AI agent"). Remove this
  # service if you do not use OneUptime AI.
  oneuptime-proxmox-ai-agent:
    image: oneuptime/resource-ai-agent:release
    container_name: oneuptime-proxmox-ai-agent
    # It only talks HTTPS to the Proxmox VE API and to OneUptime: no root,
    # no capabilities, a read-only root filesystem and a tmpfs for /tmp.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Uncomment (and set PVE_CA_FILE=/etc/oneuptime/pve-root-ca.pem) to
    # verify the API's certificate against the cluster's own CA — copy
    # /etc/pve/pve-root-ca.pem from any node next to this file.
    # volumes:
    #   - ./pve-root-ca.pem:/etc/oneuptime/pve-root-ca.pem:ro
    environment:
      - ONEUPTIME_URL=${ONEUPTIME_URL}
      - ONEUPTIME_TELEMETRY_INGESTION_KEY=${ONEUPTIME_TELEMETRY_INGESTION_KEY}
      - ONEUPTIME_AI_AGENT_RESOURCE_TYPE=proxmox
      # Must match the collector's, so the agent serves the same cluster.
      - PROXMOX_CLUSTER_NAME=${PROXMOX_CLUSTER_NAME:-proxmox-cluster}
      # Any node of the cluster (host or IP; no "localhost": inside this
      # container that is the container itself).
      - PVE_HOST=${PVE_HOST:-}
      # The API port when PVE_HOST names none (8006 when both are empty).
      - PVE_PORT=${PVE_PORT:-}
      # Proxmox VE ships a self-signed certificate, so verification is off
      # unless you set this to true or set PVE_CA_FILE (see volumes above).
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL:-false}
      - PVE_CA_FILE=${PVE_CA_FILE:-}
      # Investigations use the collector's read-only PVEAuditor token ...
      - PVE_API_TOKEN_ID=${PVE_API_TOKEN_ID:-}
      - PVE_API_TOKEN_SECRET=${PVE_API_TOKEN_SECRET:-}
      # ... or, when set, this token of the AI agent's own — one that may
      # also start, reboot and shut down guests (VM.PowerMgmt, e.g. the
      # PVEVMUser role on /vms), which fixes need. See README.md.
      - ONEUPTIME_AI_PVE_API_TOKEN_ID=${ONEUPTIME_AI_PVE_API_TOKEN_ID:-}
      - ONEUPTIME_AI_PVE_API_TOKEN_SECRET=${ONEUPTIME_AI_PVE_API_TOKEN_SECRET:-}
      # Read-only unless exactly "true". Then fixes may touch only the guests
      # (VMIDs) and node services (<node>/<service>) ONEUPTIME_AI_WRITE_TARGETS
      # matches (all when empty), and never ONEUPTIME_AI_PROTECTED_TARGETS —
      # put the VMID of the VM this agent runs in there.
      # What OneUptime AI may do here, set in .env: ONEUPTIME_AI_INVESTIGATION
      # (true or false) and ONEUPTIME_AI_FIXES (off, ask-for-approval,
      # automatic or bypass-approval; fixes also need
      # ONEUPTIME_AI_ALLOW_WRITES=true). Set either and the AI agent page in
      # OneUptime follows them, read-only; leave both empty for the agent's
      # defaults (investigation on, fixes Ask for approval when writes are
      # allowed, else off).
      - ONEUPTIME_AI_INVESTIGATION=${ONEUPTIME_AI_INVESTIGATION:-}
      - ONEUPTIME_AI_FIXES=${ONEUPTIME_AI_FIXES:-}
      - ONEUPTIME_AI_ALLOW_WRITES=${ONEUPTIME_AI_ALLOW_WRITES:-false}
      - ONEUPTIME_AI_WRITE_TARGETS=${ONEUPTIME_AI_WRITE_TARGETS:-}
      - ONEUPTIME_AI_PROTECTED_TARGETS=${ONEUPTIME_AI_PROTECTED_TARGETS:-}
      # Overrides PROXMOX_CLUSTER_NAME as the name the AI agent registers under.
      - ONEUPTIME_AI_AGENT_RESOURCE_NAME=${ONEUPTIME_AI_AGENT_RESOURCE_NAME:-}
      # The AI agent's log level: debug, info, warn or error.
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3877/status/live",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
