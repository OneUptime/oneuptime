services:
  oneuptime-proxmox-agent:
    # Upstream collector, pinned. There is no oneuptime/proxmox-agent image —
    # the agent is entirely defined by otel-collector-config.yaml, which
    # install.sh downloads next to this file, and that config reports this
    # pin as the agent's version (oneuptime.agent.version). Bump the two
    # together; Tests/Ops/validate-collector-configs.sh validates the config
    # against this version.
    #
    # For the optional journald logs pipeline (PVE service logs — see the
    # commented receiver in otel-collector-config.yaml) this stock image
    # is not enough: it is built FROM scratch with no `journalctl` and
    # runs as a non-root user that cannot read the journal. Replace it
    # with the one-line custom image from README.md ("Shipping Proxmox
    # service logs") when you enable that pipeline.
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: oneuptime-proxmox-agent
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # The node pve-api-failover (below) picked to read the cluster from,
      # which the collector's cluster scrape takes as its target.
      - pve-api-target:/etc/oneuptime/pve-api:ro
      # Uncomment (together with the journald receiver and logs pipeline
      # in otel-collector-config.yaml) to give the collector read access
      # to the systemd journal. Only meaningful when this compose file
      # runs directly on a Proxmox VE node — the journal is per-host.
      # - /var/log/journal:/var/log/journal:ro
      # - /etc/machine-id:/etc/machine-id:ro
    environment:
      - ONEUPTIME_URL=${ONEUPTIME_URL}
      - ONEUPTIME_TELEMETRY_INGESTION_KEY=${ONEUPTIME_TELEMETRY_INGESTION_KEY}
      - PROXMOX_CLUSTER_NAME=${PROXMOX_CLUSTER_NAME:-proxmox-cluster}
      # Address (host:port, no scheme) of prometheus-pve-exporter. The
      # default points at the bundled exporter service below.
      - PVE_EXPORTER_URL=${PVE_EXPORTER_URL:-pve-exporter:9221}
      # The node whose Proxmox VE API the exporter reads the cluster from
      # while it answers (pve-api-failover picks another node of PVE_NODES
      # when it does not). "localhost" only works when the exporter runs
      # directly on a PVE node — set this when using the bundled exporter.
      - PVE_HOST=${PVE_HOST:-localhost}
      # Every node's own API address, comma-separated in square brackets so
      # the collector reads a list, e.g.
      #   PVE_NODES=[192.168.1.10,192.168.1.11,192.168.1.12]
      # The exporter reads start-on-boot (Guest Down), replication and the
      # subscription only for the node it queries, so each node is queried
      # in turn. Unset, only PVE_HOST is: fine for a single node, but on a
      # cluster the guests and jobs of every other node go unseen, and
      # there is no other node to read the cluster from when PVE_HOST's
      # goes down.
      - PVE_NODES=${PVE_NODES:-[${PVE_HOST:-localhost}]}
    depends_on:
      - pve-api-failover
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Keeps the agent reading the cluster when a node goes down, with no
  # virtual IP to set up. Every 15 seconds it asks PVE_HOST's Proxmox VE API,
  # then each node of PVE_NODES in turn, and writes the first that answers
  # where the collector's cluster scrape takes its target (file_sd in
  # otel-collector-config.yaml). With the API token it asks /cluster/status
  # and also passes over a node cut off from the quorate part of the
  # cluster, whose view would report every other node down; without one it
  # can only ask /version whether the node answers. It reads the cluster
  # from the first node that answers at all when none of them is quorate,
  # and keeps its last choice when none answers. It writes nothing else and
  # sends nothing but these checks: docker logs oneuptime-pve-api-failover
  # says which node it reads the cluster from, and why.
  pve-api-failover:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    container_name: oneuptime-pve-api-failover
    # tini forwards docker stop's SIGTERM to the script, which exits at once.
    init: true
    # The image's own user, which owns the pve-api-target volume below.
    user: "100:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - pve-api-target:/run/oneuptime/pve-api
    environment:
      # The order the nodes are tried in: PVE_HOST, then PVE_NODES.
      - PVE_HOST=${PVE_HOST:-localhost}
      - PVE_NODES=${PVE_NODES:-[${PVE_HOST:-localhost}]}
      # The exporter's token, sent on stdin to curl (never on its command
      # line) to ask whether a node is part of the quorate cluster.
      - PVE_API_TOKEN_ID=${PVE_API_TOKEN_ID:-}
      - PVE_API_TOKEN_SECRET=${PVE_API_TOKEN_SECRET:-}
      # Checks the nodes' certificates only when the exporter does.
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL:-false}
    # Every $ is written $$ so Docker Compose leaves it to the shell.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -f
        dir=/run/oneuptime/pve-api
        trap 'exit 0' TERM INT
        insecure=-k
        case "$$(printf '%s' "$${PVE_VERIFY_SSL:-false}" | tr 'A-Z' 'a-z')" in
          true|1|yes|on) insecure="" ;;
        esac
        nodes=$${PVE_NODES:-}
        nodes=$${nodes#\[}
        nodes=$${nodes%\]}
        candidates=""
        for c in $${PVE_HOST:-localhost} $$(printf '%s' "$$nodes" | tr ',' ' '); do
          c=$$(printf '%s' "$$c" | tr -d "\"'")
          case "$$c" in
            "") continue ;;
            *[!]A-Za-z0-9.:_[-]*) echo "Skipping \"$$c\": not a host name or address."; continue ;;
          esac
          case " $$candidates " in *" $$c "*) continue ;; esac
          candidates="$${candidates:+$$candidates }$$c"
        done
        if [ -z "$$candidates" ]; then
          echo "Neither PVE_HOST nor PVE_NODES names a node: set PVE_HOST in .env to a node's address, then run docker compose up -d."
          while :; do sleep 3600 & wait $$!; done
        fi
        first=$${candidates%% *}
        url() {
          case "$$1" in
            \[*\]:*) printf 'https://%s' "$$1" ;;
            \[*\]) printf 'https://%s:8006' "$$1" ;;
            *:*:*) printf 'https://[%s]:8006' "$$1" ;;
            *:*) printf 'https://%s' "$$1" ;;
            *) printf 'https://%s:8006' "$$1" ;;
          esac
        }
        probe() {
          if [ -n "$${PVE_API_TOKEN_ID:-}" ] && [ -n "$${PVE_API_TOKEN_SECRET:-}" ]; then
            out=$$(printf 'Authorization: PVEAPIToken=%s=%s\n' "$$PVE_API_TOKEN_ID" "$$PVE_API_TOKEN_SECRET" | curl -s $$insecure -H @- --connect-timeout 3 --max-time 6 -w '\n%{http_code}' "$$(url "$$1")/api2/json/cluster/status" 2>/dev/null; printf ' %s' "$$?")
          else
            out=$$(curl -s $$insecure -o /dev/null --connect-timeout 3 --max-time 6 -w '\n%{http_code}' "$$(url "$$1")/api2/json/version" 2>/dev/null; printf ' %s' "$$?")
          fi
          last=$$(printf '%s\n' "$$out" | tail -n 1)
          code=$${last% *}
          rc=$${last##* }
          case "$$code" in
            200)
              if [ -z "$${PVE_API_TOKEN_ID:-}" ] || [ -z "$${PVE_API_TOKEN_SECRET:-}" ]; then echo 2; return; fi
              cluster=$$(printf '%s\n' "$$out" | sed '$$d' | tr -d ' \t\r' | tr '{}' '\n\n' | grep '"type":"cluster"')
              if [ -z "$$cluster" ] || printf '%s\n' "$$cluster" | grep -Eq '"quorate":"?1"?(,|$$)'; then echo 2; else echo "1 is not part of the quorate cluster"; fi ;;
            401) if [ -z "$${PVE_API_TOKEN_ID:-}" ] || [ -z "$${PVE_API_TOKEN_SECRET:-}" ]; then echo 2; else echo "1 refuses the API token (HTTP 401)"; fi ;;
            [1-9][0-9][0-9]) echo "1 answers HTTP $$code" ;;
            *)
              case "$$rc" in
                35|51|53|54|58|59|60|64|66|77|80|82|83|90|91) echo "0 fails the TLS check" ;;
                *) echo "0 does not answer" ;;
              esac ;;
          esac
        }
        current=""
        status=""
        echo "Reading the cluster from the first of these whose Proxmox VE API answers, checked every 15 seconds: $$candidates"
        while :; do
          chosen=""
          fallback=""
          skipped=""
          for c in $$candidates; do
            result=$$(probe "$$c")
            level=$${result%% *}
            if [ "$$level" = 2 ]; then chosen=$$c; break; fi
            if [ "$$level" = 1 ] && [ -z "$$fallback" ]; then fallback=$$c; fi
            skipped="$${skipped:+$$skipped; }$$c $${result#* }"
          done
          if [ -n "$$chosen" ]; then
            next="ok $$chosen"
          elif [ -n "$$fallback" ]; then
            chosen=$$fallback
            next="fallback $$chosen"
          else
            chosen=$${current:-$$first}
            next="none $$chosen"
          fi
          if [ "$$chosen" != "$$current" ] || [ ! -s "$$dir/target.json" ]; then
            if printf '[{"targets":["%s"]}]\n' "$$chosen" > "$$dir/.target.json.tmp" && mv -f "$$dir/.target.json.tmp" "$$dir/target.json"; then
              current=$$chosen
            else
              echo "Could not write $$dir/target.json: the collector keeps its last target."
            fi
          fi
          if [ "$$next" != "$$status" ]; then
            case "$$next" in
              ok\ *) if [ -z "$$skipped" ]; then echo "Reading the cluster from $$chosen."; else echo "Reading the cluster from $$chosen: $$skipped."; fi ;;
              fallback\ *) echo "No node answers as part of the quorate cluster ($$skipped): reading the cluster from $$chosen." ;;
              *) echo "No node's Proxmox VE API answers ($$skipped): still reading the cluster from $$chosen." ;;
            esac
            status=$$next
          fi
          sleep 15 &
          wait $$!
        done
    healthcheck:
      # Unhealthy until it has written a node for the collector to read.
      test: ["CMD", "test", "-s", "/run/oneuptime/pve-api/target.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: bundled prometheus-pve-exporter. Enable it with
  #   docker compose --profile pve-exporter up -d
  # if you do not already run pve-exporter somewhere. It needs a Proxmox
  # VE API token (Datacenter -> Permissions -> API Tokens) with the
  # PVEAuditor role.
  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: oneuptime-pve-exporter
    profiles: ["pve-exporter"]
    init: true
    # prometheus-pve-exporter wants the API token split into a user part
    # (PVE_USER) and a token-name part (PVE_TOKEN_NAME). PVE_API_TOKEN_ID
    # is the full id exactly as shown in the Proxmox UI
    # ("user@realm!tokenname") — split it here so the .env file can hold
    # the token as copied. ($$ shields the parameter expansion from
    # docker compose interpolation; the exporter ignores unknown PVE_*
    # variables, so leaving PVE_API_TOKEN_ID set is harmless.)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - export PVE_USER="$${PVE_API_TOKEN_ID%%!*}" PVE_TOKEN_NAME="$${PVE_API_TOKEN_ID##*!}" && exec /usr/bin/pve_exporter
    environment:
      - PVE_API_TOKEN_ID=${PVE_API_TOKEN_ID}
      - PVE_TOKEN_VALUE=${PVE_API_TOKEN_SECRET}
      # Proxmox VE ships a self-signed certificate by default, so SSL
      # verification is off unless you opt in.
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL:-false}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The Proxmox AI agent: runs the `pvesh` commands OneUptime AI asks for
  # while it investigates an incident or alert on this cluster — read-only
  # unless you set ONEUPTIME_AI_ALLOW_WRITES=true. There is no pvesh binary
  # in it: each command becomes one call to the Proxmox VE API
  # (https://PVE_HOST:8006/api2/json) with an API token from this same .env
  # (OneUptime never sends it any), so the token's Proxmox permissions are
  # the hard limit. It registers as the cluster named PROXMOX_CLUSTER_NAME,
  # exactly like the collector above, and shows up on that cluster's
  # AI -> AI agent page. See README.md ("OneUptime AI agent"). Remove this
  # service if you do not use OneUptime AI.
  oneuptime-proxmox-ai-agent:
    image: oneuptime/resource-ai-agent:release
    container_name: oneuptime-proxmox-ai-agent
    # It only talks HTTPS to the Proxmox VE API and to OneUptime: no root,
    # no capabilities, a read-only root filesystem and a tmpfs for /tmp.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Uncomment (and set PVE_CA_FILE=/etc/oneuptime/pve-root-ca.pem) to
    # verify the API's certificate against the cluster's own CA — copy
    # /etc/pve/pve-root-ca.pem from any node next to this file.
    # volumes:
    #   - ./pve-root-ca.pem:/etc/oneuptime/pve-root-ca.pem:ro
    environment:
      - ONEUPTIME_URL=${ONEUPTIME_URL}
      - ONEUPTIME_TELEMETRY_INGESTION_KEY=${ONEUPTIME_TELEMETRY_INGESTION_KEY}
      - ONEUPTIME_AI_AGENT_RESOURCE_TYPE=proxmox
      # Must match the collector's, so the agent serves the same cluster.
      - PROXMOX_CLUSTER_NAME=${PROXMOX_CLUSTER_NAME:-proxmox-cluster}
      # Any node of the cluster (host or IP; no "localhost": inside this
      # container that is the container itself).
      - PVE_HOST=${PVE_HOST:-}
      # Every node's own address: when PVE_HOST's API cannot be reached, the
      # AI agent calls the first of them that can be, and keeps using it.
      - PVE_NODES=${PVE_NODES:-}
      # The API port when PVE_HOST names none (8006 when both are empty).
      - PVE_PORT=${PVE_PORT:-}
      # Proxmox VE ships a self-signed certificate, so verification is off
      # unless you set this to true or set PVE_CA_FILE (see volumes above).
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL:-false}
      - PVE_CA_FILE=${PVE_CA_FILE:-}
      # Investigations use the collector's read-only PVEAuditor token ...
      - PVE_API_TOKEN_ID=${PVE_API_TOKEN_ID:-}
      - PVE_API_TOKEN_SECRET=${PVE_API_TOKEN_SECRET:-}
      # ... or, when set, this token of the AI agent's own — one that may
      # also start, reboot and shut down guests (VM.PowerMgmt, e.g. the
      # PVEVMUser role on /vms), which fixes need. See README.md.
      - ONEUPTIME_AI_PVE_API_TOKEN_ID=${ONEUPTIME_AI_PVE_API_TOKEN_ID:-}
      - ONEUPTIME_AI_PVE_API_TOKEN_SECRET=${ONEUPTIME_AI_PVE_API_TOKEN_SECRET:-}
      # Read-only unless exactly "true". Then fixes may touch only the guests
      # (VMIDs) and node services (<node>/<service>) ONEUPTIME_AI_WRITE_TARGETS
      # matches (all when empty), and never ONEUPTIME_AI_PROTECTED_TARGETS —
      # put the VMID of the VM this agent runs in there.
      # What OneUptime AI may do here, set in .env: ONEUPTIME_AI_INVESTIGATION
      # (true or false) and ONEUPTIME_AI_FIXES (off, ask-for-approval,
      # automatic or bypass-approval; fixes also need
      # ONEUPTIME_AI_ALLOW_WRITES=true). Set either and the AI agent page in
      # OneUptime follows them, read-only; leave both empty for the agent's
      # defaults (investigation on, fixes Ask for approval when writes are
      # allowed, else off).
      - ONEUPTIME_AI_INVESTIGATION=${ONEUPTIME_AI_INVESTIGATION:-}
      - ONEUPTIME_AI_FIXES=${ONEUPTIME_AI_FIXES:-}
      - ONEUPTIME_AI_ALLOW_WRITES=${ONEUPTIME_AI_ALLOW_WRITES:-false}
      - ONEUPTIME_AI_WRITE_TARGETS=${ONEUPTIME_AI_WRITE_TARGETS:-}
      - ONEUPTIME_AI_PROTECTED_TARGETS=${ONEUPTIME_AI_PROTECTED_TARGETS:-}
      # Overrides PROXMOX_CLUSTER_NAME as the name the AI agent registers under.
      - ONEUPTIME_AI_AGENT_RESOURCE_NAME=${ONEUPTIME_AI_AGENT_RESOURCE_NAME:-}
      # The AI agent's log level: debug, info, warn or error.
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3877/status/live",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # pve-api-failover's choice, in memory: it writes it, the collector reads
  # it. Owned by the user pve-api-failover runs as, so it needs no root.
  pve-api-target:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,uid=100,gid=101,mode=0755"
