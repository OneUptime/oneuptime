processors:
  # What ISILON-MIB reports in a shape no chart or monitor can read, made
  # plain gauges, and the identity the receivers read as resource
  # attributes moved onto each series, where OneUptime reads it:
  transform/powerscale:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - copy_metric(name="powerscale_ifs_used_percent") where metric.name == "powerscale_ifs_total_bytes"
          - copy_metric(name="powerscale_cluster_offline_nodes") where metric.name == "powerscale_cluster_nodes"
          - copy_metric(name="powerscale_quota_used_percent") where metric.name == "powerscale_quota_usage_bytes"
      - context: datapoint
        statements:
          # Which cluster and node a series describes.
          - set(datapoint.attributes["cluster"], resource.attributes["powerscale.cluster.name"]) where resource.attributes["powerscale.cluster.name"] != nil
          - set(datapoint.attributes["cluster_guid"], resource.attributes["powerscale.cluster.guid"]) where resource.attributes["powerscale.cluster.guid"] != nil
          - set(datapoint.attributes["configured_nodes"], resource.attributes["powerscale.cluster.configured_nodes"]) where resource.attributes["powerscale.cluster.configured_nodes"] != nil
          - set(datapoint.attributes["online_nodes"], resource.attributes["powerscale.cluster.online_nodes"]) where resource.attributes["powerscale.cluster.online_nodes"] != nil
          - set(datapoint.attributes["offline_nodes"], resource.attributes["powerscale.cluster.offline_nodes"]) where resource.attributes["powerscale.cluster.offline_nodes"] != nil
          - set(datapoint.attributes["system_description"], resource.attributes["powerscale.system.description"]) where resource.attributes["powerscale.system.description"] != nil
          - set(datapoint.attributes["node"], resource.attributes["powerscale.node.name"]) where resource.attributes["powerscale.node.name"] != nil
          # One name per drive and per quota, which their alerts are grouped
          # by: "ps-prod-2 bay 3"; a directory quota's path, or the path and
          # whose quota it is ("/ifs/home (user 2001)").
          - set(datapoint.attributes["drive"], Concat([datapoint.attributes["node"], datapoint.attributes["bay"]], " bay ")) where datapoint.attributes["node"] != nil and datapoint.attributes["bay"] != nil
          - set(datapoint.attributes["drive"], Concat([datapoint.attributes["node"], datapoint.attributes["perf_bay"]], " bay ")) where datapoint.attributes["node"] != nil and datapoint.attributes["perf_bay"] != nil
          - set(datapoint.attributes["quota"], datapoint.attributes["path"]) where IsMatch(metric.name, "^powerscale_quota_") and datapoint.attributes["type"] == "4"
          - set(datapoint.attributes["quota"], Concat([datapoint.attributes["path"], " (user ", datapoint.attributes["id"], ")"], "")) where IsMatch(metric.name, "^powerscale_quota_") and datapoint.attributes["type"] == "1"
          - set(datapoint.attributes["quota"], Concat([datapoint.attributes["path"], " (group ", datapoint.attributes["id"], ")"], "")) where IsMatch(metric.name, "^powerscale_quota_") and datapoint.attributes["type"] == "3"
          - set(datapoint.attributes["quota"], Concat([datapoint.attributes["path"], " (default user)"], "")) where IsMatch(metric.name, "^powerscale_quota_") and datapoint.attributes["type"] == "0"
          - set(datapoint.attributes["quota"], Concat([datapoint.attributes["path"], " (default group)"], "")) where IsMatch(metric.name, "^powerscale_quota_") and datapoint.attributes["type"] == "2"
          - set(datapoint.attributes["quota"], Concat([datapoint.attributes["path"], " (", datapoint.attributes["type"], ")"], "")) where IsMatch(metric.name, "^powerscale_quota_") and datapoint.attributes["quota"] == nil and datapoint.attributes["path"] != nil and datapoint.attributes["type"] != nil
          # How full the cluster is: the share of its capacity no longer
          # available for writes (used, and the virtual hot spare reserve).
          - set(datapoint.value_double, (Double(datapoint.value_int) - Double(resource.attributes["powerscale.ifs.available_bytes"])) * 100.0 / Double(datapoint.value_int)) where metric.name == "powerscale_ifs_used_percent" and datapoint.value_int > 0 and resource.attributes["powerscale.ifs.available_bytes"] != nil
          # How many configured nodes are offline.
          - set(datapoint.value_int, Len(Split(datapoint.attributes["offline_nodes"], ","))) where metric.name == "powerscale_cluster_offline_nodes" and datapoint.attributes["offline_nodes"] != nil and datapoint.attributes["offline_nodes"] != ""
          - set(datapoint.value_int, 0) where metric.name == "powerscale_cluster_offline_nodes" and (datapoint.attributes["offline_nodes"] == nil or datapoint.attributes["offline_nodes"] == "")
          # How near its limit a quota is: its usage as a share of its hard
          # limit, or of its soft limit when it has no hard one.
          - set(datapoint.attributes["limit"], "hard") where metric.name == "powerscale_quota_used_percent" and datapoint.attributes["hard_defined"] == "1" and datapoint.attributes["hard_limit"] != "0"
          - set(datapoint.attributes["limit"], "soft") where metric.name == "powerscale_quota_used_percent" and datapoint.attributes["limit"] == nil and datapoint.attributes["soft_defined"] == "1" and datapoint.attributes["soft_limit"] != "0"
          - set(datapoint.value_double, Double(datapoint.value_int) * 100.0 / Double(datapoint.attributes["hard_limit"])) where metric.name == "powerscale_quota_used_percent" and datapoint.attributes["limit"] == "hard"
          - set(datapoint.value_double, Double(datapoint.value_int) * 100.0 / Double(datapoint.attributes["soft_limit"])) where metric.name == "powerscale_quota_used_percent" and datapoint.attributes["limit"] == "soft"
          # Bits per second, as OneFS reports throughput, to bytes.
          - set(datapoint.value_double, Double(datapoint.value_int) / 8.0) where IsMatch(metric.name, "^powerscale_.*_bytes_per_second$")
          # Idle CPU per mil to busy percent.
          - set(datapoint.value_double, 100.0 - Double(datapoint.value_int) / 10.0) where IsMatch(metric.name, "^powerscale_(cluster|node)_cpu_busy_percent$")
          # Sensor readings, which the MIB gives as strings. A sensor with no
          # number to read ("N/A") keeps its `reading` label and is dropped.
          - set(datapoint.value_double, Double(datapoint.attributes["reading"])) where metric.name == "powerscale_temperature_celsius" and IsMatch(datapoint.attributes["reading"], "^-?[0-9]+(\\.[0-9]+)?$")
          - delete_key(datapoint.attributes, "reading") where metric.name == "powerscale_temperature_celsius" and IsMatch(datapoint.attributes["reading"], "^-?[0-9]+(\\.[0-9]+)?$")
          - set(datapoint.value_double, Double(datapoint.attributes["power_reading"])) where metric.name == "powerscale_power_sensor_reading" and IsMatch(datapoint.attributes["power_reading"], "^-?[0-9]+(\\.[0-9]+)?$")
          - delete_key(datapoint.attributes, "power_reading") where metric.name == "powerscale_power_sensor_reading" and IsMatch(datapoint.attributes["power_reading"], "^-?[0-9]+(\\.[0-9]+)?$")
      - context: metric
        statements:
          - set(metric.unit, "%") where metric.name == "powerscale_ifs_used_percent" or metric.name == "powerscale_quota_used_percent"
          - set(metric.unit, "{node}") where metric.name == "powerscale_cluster_offline_nodes"
      - context: resource
        statements:
          - delete_matching_keys(resource.attributes, "^powerscale\\.")
  # What the transform could not make a number of: a quota with no limit, a
  # sensor with no reading, a capacity OneFS did not report. And the
  # loopback interface, which is no port.
  filter/powerscale:
    error_mode: ignore
    metrics:
      datapoint:
        - metric.name == "powerscale_quota_used_percent" and datapoint.attributes["limit"] == nil
        - metric.name == "powerscale_ifs_used_percent" and datapoint.value_int != 0
        - metric.name == "powerscale_temperature_celsius" and datapoint.attributes["reading"] != nil
        - metric.name == "powerscale_power_sensor_reading" and datapoint.attributes["power_reading"] != nil
        - metric.name == "powerscale_interface_status" and datapoint.attributes["interface_type"] == "24"
  # Stamp every metric with the array's identity. OneUptime auto-registers
  # the storage array from `storage.array.name`, and every Storage Arrays
  # page and monitor scopes on it — this attribute is what makes the data
  # appear under the Storage Arrays section of the dashboard. Keep it
  # stable: changing it later registers a brand-new array.
  resource:
    attributes:
      - key: storage.array.name
        value: "${env:STORAGE_ARRAY_NAME}"
        action: upsert
      # The platform: dell.powerscale for this config.
      - key: storage.system
        value: "${env:STORAGE_SYSTEM}"
        action: upsert
      # Shown as the agent version on the array's page, with a sign when
      # a newer one is out. Keep it in step with the collector image
      # docker-compose.yml pins.
      - key: oneuptime.agent.version
        value: "0.165.0"
        action: upsert
      # Optional: promote resource attributes to project labels on the
      # array — oneuptime.label.<dimension>=<value> becomes the label
      # <dimension>:<value> (see README.md, "Auto-tag with Project Labels").
      # - key: oneuptime.label.env
      #   value: production
      #   action: upsert
      # OneUptime routes a batch by service.name first. The SNMP receiver
      # sets none, but a service.name added here would register a phantom
      # Service instead of routing this data to the storage array, so the
      # two are deleted as in every Storage Array Agent config. Do not
      # remove these two deletes.
      - key: service.name
        action: delete
      - key: service.instance.id
        action: delete
  batch:
    timeout: 10s
    # Large enough to hold a whole poll of a big cluster. There is
    # deliberately NO send_batch_max_size: a poll must never be split across
    # exports, because OneUptime reads a whole poll per request to rebuild
    # the inventory (the node and quota lists, their counts) — a split poll
    # would make objects vanish and counts drop until the next one.
    send_batch_size: 8192
  memory_limiter:
    check_interval: 5s
    # A cluster with many nodes and thousands of quotas returns large polls;
    # 512 MiB leaves ample headroom.
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  otlphttp:
    endpoint: "${env:ONEUPTIME_URL}/otlp"
    headers:
      x-oneuptime-token: "${env:ONEUPTIME_TELEMETRY_INGESTION_KEY}"

service:
  pipelines:
    metrics:
      # The receivers that run: install.sh writes the list (the cluster, the
      # quotas, and a slot per node). With none, the node at
      # POWERSCALE_ENDPOINT alone.
      receivers: ${env:POWERSCALE_SNMP_RECEIVERS:-[snmp/cluster, snmp/quotas, snmp/node]}
      processors: [memory_limiter, transform/powerscale, filter/powerscale, resource, batch]
      exporters: [otlphttp]
