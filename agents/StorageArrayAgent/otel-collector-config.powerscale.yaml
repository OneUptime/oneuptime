receivers:
  # Dell PowerScale (Isilon, OneFS): the collector polls the cluster over
  # SNMP and reads Dell's ISILON-MIB (enterprises.12124) and IF-MIB. Nothing
  # runs next to the collector, and nothing on the cluster changes: OneFS
  # answers SNMP read-only, with v2c on by default (SNMPv3 is a setting, see
  # README.md).
  #
  # A PowerScale cluster is one storage array. Its objects come in two kinds,
  # which is why there are three receivers here and a slot per node below:
  #
  #   - the cluster's own objects (health, capacity, the online and offline
  #     nodes, /ifs throughput, quotas) are the same on every node, so they
  #     are read once, through the node at POWERSCALE_ENDPOINT
  #     (snmp/cluster every minute, snmp/quotas every five);
  #   - a node's objects (its health, drives, sensors, ports and protocol
  #     performance) describe only the node that answers, as Dell's MIB
  #     defines them, so every node is polled at its own address: the
  #     snmp/node-<n> slots below, one per node listed in POWERSCALE_NODES
  #     (install.sh writes POWERSCALE_NODE_<n> and POWERSCALE_SNMP_RECEIVERS
  #     from it). With no list, snmp/node reads the node at
  #     POWERSCALE_ENDPOINT alone.
  #
  # Use a node's own address, not the SmartConnect zone name: SmartConnect
  # hands each lookup to a different node, and the cluster's SmartConnect
  # service address does not answer SNMP.
  #
  # Every receiver stamps its series `scrape_endpoint: cluster`, `quotas` or
  # `node`. The cluster's series list every configured node and the quotas
  # scrape lists every quota, so OneUptime knows a batch is the COMPLETE list
  # of nodes or quotas: that is how a deleted quota leaves the inventory.
  # Keep the labels as shipped.
  snmp/cluster:
    endpoint: "udp://${env:POWERSCALE_ENDPOINT}:161"
    version: "${env:POWERSCALE_SNMP_VERSION:-v2c}"
    community: "${env:POWERSCALE_SNMP_COMMUNITY}"
    user: "${env:POWERSCALE_SNMP_USER:-}"
    security_level: "${env:POWERSCALE_SNMP_SECURITY_LEVEL:-auth_priv}"
    auth_type: "${env:POWERSCALE_SNMP_AUTH_PROTOCOL:-SHA}"
    auth_password: "${env:POWERSCALE_SNMP_AUTH_PASSWORD:-}"
    privacy_type: "${env:POWERSCALE_SNMP_PRIVACY_PROTOCOL:-AES}"
    privacy_password: "${env:POWERSCALE_SNMP_PRIVACY_PASSWORD:-}"
    collection_interval: 60s
    timeout: 10s
    resource_attributes:
      powerscale.cluster.name:
        scalar_oid: "1.3.6.1.4.1.12124.1.1.1.0" # clusterName
      powerscale.cluster.guid:
        scalar_oid: "1.3.6.1.4.1.12124.1.1.3.0" # clusterGUID
      # Comma-separated logical node numbers (LNNs).
      powerscale.cluster.configured_nodes:
        scalar_oid: "1.3.6.1.4.1.12124.1.1.5.0" # configuredNodes
      powerscale.cluster.online_nodes:
        scalar_oid: "1.3.6.1.4.1.12124.1.1.6.0" # onlineNodes
      powerscale.cluster.offline_nodes:
        scalar_oid: "1.3.6.1.4.1.12124.1.1.7.0" # offlineNodes
      # "<node> <id> Isilon OneFS v9.11.0.0": the OneFS version.
      powerscale.system.description:
        scalar_oid: "1.3.6.1.2.1.1.1.0" # sysDescr
      # Read onto the capacity series so the collector can work out how full
      # the cluster is (powerscale_ifs_used_percent, below).
      powerscale.ifs.available_bytes:
        scalar_oid: "1.3.6.1.4.1.12124.1.3.3.0" # ifsAvailableBytes
    attributes:
      scrape_endpoint:
        enum: [cluster]
    metrics:
      # 0 ok, 1 attn (attention), 2 down, 3 invalid.
      powerscale_cluster_health:
        unit: "1"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.1.1.2.0" # clusterHealth
            resource_attributes: &cluster_identity
              - powerscale.cluster.name
              - powerscale.cluster.guid
              - powerscale.cluster.configured_nodes
              - powerscale.cluster.online_nodes
              - powerscale.cluster.offline_nodes
              - powerscale.system.description
            attributes:
              - name: scrape_endpoint
                value: cluster
      powerscale_cluster_nodes:
        unit: "{node}"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.1.1.4.0" # nodeCount
            resource_attributes: *cluster_identity
            attributes:
              - name: scrape_endpoint
                value: cluster
      powerscale_ifs_total_bytes:
        unit: "By"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.1.3.1.0" # ifsTotalBytes
            resource_attributes:
              - powerscale.cluster.name
              - powerscale.ifs.available_bytes
      powerscale_ifs_used_bytes:
        unit: "By"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.1.3.2.0" # ifsUsedBytes
            resource_attributes: &cluster_name
              - powerscale.cluster.name
      # Free space left for writes: ifsFreeBytes less the virtual hot spare
      # reserve.
      powerscale_ifs_available_bytes:
        unit: "By"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.1.3.3.0" # ifsAvailableBytes
            resource_attributes: *cluster_name
      powerscale_ifs_free_bytes:
        unit: "By"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.1.3.4.0" # ifsFreeBytes
            resource_attributes: *cluster_name
      # Read and write throughput of /ifs: OneFS reports bits per second
      # (out of /ifs is reads); the collector turns them into bytes below.
      powerscale_cluster_ifs_read_bytes_per_second:
        unit: "By/s"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.1.2.1.4.0" # clusterIfsOutBitsPerSecond
            resource_attributes: *cluster_name
      powerscale_cluster_ifs_write_bytes_per_second:
        unit: "By/s"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.1.2.1.2.0" # clusterIfsInBitsPerSecond
            resource_attributes: *cluster_name
      powerscale_cluster_network_in_bytes_per_second:
        unit: "By/s"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.1.2.2.2.0" # clusterNetworkInBitsPerSecond
            resource_attributes: *cluster_name
      powerscale_cluster_network_out_bytes_per_second:
        unit: "By/s"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.1.2.2.4.0" # clusterNetworkOutBitsPerSecond
            resource_attributes: *cluster_name
      # Idle CPU per mil, averaged over the nodes; the collector turns it into
      # the busy percentage below.
      powerscale_cluster_cpu_busy_percent:
        unit: "%"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.1.2.3.5.0" # clusterCPUIdlePct
            resource_attributes: *cluster_name

  # Every directory, user and group quota (SmartQuotas), with its usage and
  # thresholds, every five minutes: a cluster with thousands of quotas is
  # slow to walk. The thresholds ride on the usage series as labels, so the
  # collector can say how near its limit each quota is (below).
  snmp/quotas:
    endpoint: "udp://${env:POWERSCALE_ENDPOINT}:161"
    version: "${env:POWERSCALE_SNMP_VERSION:-v2c}"
    community: "${env:POWERSCALE_SNMP_COMMUNITY}"
    user: "${env:POWERSCALE_SNMP_USER:-}"
    security_level: "${env:POWERSCALE_SNMP_SECURITY_LEVEL:-auth_priv}"
    auth_type: "${env:POWERSCALE_SNMP_AUTH_PROTOCOL:-SHA}"
    auth_password: "${env:POWERSCALE_SNMP_AUTH_PASSWORD:-}"
    privacy_type: "${env:POWERSCALE_SNMP_PRIVACY_PROTOCOL:-AES}"
    privacy_password: "${env:POWERSCALE_SNMP_PRIVACY_PASSWORD:-}"
    collection_interval: 300s
    timeout: 60s
    attributes:
      path:
        oid: "1.3.6.1.4.1.12124.1.12.1.1.5" # quotaPath
      # 0 default-user, 1 user, 2 default-group, 3 group, 4 directory.
      type:
        oid: "1.3.6.1.4.1.12124.1.12.1.1.2" # quotaType
      # The user or group ID of a user or group quota, else 0.
      id:
        oid: "1.3.6.1.4.1.12124.1.12.1.1.3" # quotaID
      includes_snapshots:
        oid: "1.3.6.1.4.1.12124.1.12.1.1.4" # quotaIncludesSnapshotUsage
      includes_overhead:
        oid: "1.3.6.1.4.1.12124.1.12.1.1.16" # quotaIncludesOverhead
      hard_defined:
        oid: "1.3.6.1.4.1.12124.1.12.1.1.6" # quotaHardThresholdDefined
      hard_limit:
        oid: "1.3.6.1.4.1.12124.1.12.1.1.7" # quotaHardThreshold
      soft_defined:
        oid: "1.3.6.1.4.1.12124.1.12.1.1.8" # quotaSoftThresholdDefined
      soft_limit:
        oid: "1.3.6.1.4.1.12124.1.12.1.1.9" # quotaSoftThreshold
      advisory_defined:
        oid: "1.3.6.1.4.1.12124.1.12.1.1.10" # quotaAdvisoryThresholdDefined
      advisory_limit:
        oid: "1.3.6.1.4.1.12124.1.12.1.1.11" # quotaAdvisoryThreshold
      # Seconds a soft limit may be exceeded before writes are refused.
      grace_period:
        oid: "1.3.6.1.4.1.12124.1.12.1.1.12" # quotaGracePeriod
      scrape_endpoint:
        enum: [quotas]
    metrics:
      powerscale_quota_usage_bytes:
        unit: "By"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.1.12.1.1.13" # quotaUsage
            attributes:
              - name: path
              - name: type
              - name: id
              - name: includes_snapshots
              - name: includes_overhead
              - name: hard_defined
              - name: hard_limit
              - name: soft_defined
              - name: soft_limit
              - name: advisory_defined
              - name: advisory_limit
              - name: grace_period
              - name: scrape_endpoint
                value: quotas
      # The same usage with the data protection (FlexProtect) overhead.
      powerscale_quota_physical_bytes:
        unit: "By"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.1.12.1.1.14" # quotaUsageWithOverhead
            attributes: &quota_identity
              - name: path
              - name: type
              - name: id
      powerscale_quota_inodes:
        unit: "{inode}"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.1.12.1.1.15" # quotaInodeUsage
            attributes: *quota_identity

  # One node's own objects: its health, /ifs and network throughput, CPU,
  # protocol performance, chassis, drives, fans, sensors and ports. This is
  # the template every snmp/node-<n> slot below copies; with no node list it
  # reads the node at POWERSCALE_ENDPOINT itself.
  snmp/node: &powerscale_node
    endpoint: "udp://${env:POWERSCALE_ENDPOINT}:161"
    version: "${env:POWERSCALE_SNMP_VERSION:-v2c}"
    community: "${env:POWERSCALE_SNMP_COMMUNITY}"
    user: "${env:POWERSCALE_SNMP_USER:-}"
    security_level: "${env:POWERSCALE_SNMP_SECURITY_LEVEL:-auth_priv}"
    auth_type: "${env:POWERSCALE_SNMP_AUTH_PROTOCOL:-SHA}"
    auth_password: "${env:POWERSCALE_SNMP_AUTH_PASSWORD:-}"
    privacy_type: "${env:POWERSCALE_SNMP_PRIVACY_PROTOCOL:-AES}"
    privacy_password: "${env:POWERSCALE_SNMP_PRIVACY_PASSWORD:-}"
    collection_interval: 60s
    timeout: 10s
    resource_attributes:
      # The node's host name: <cluster>-<logical node number> unless renamed.
      powerscale.node.name:
        scalar_oid: "1.3.6.1.4.1.12124.2.1.1.0" # nodeName
      powerscale.system.description:
        scalar_oid: "1.3.6.1.2.1.1.1.0" # sysDescr
    attributes:
      scrape_endpoint:
        enum: [node]
      protocol:
        oid: "1.3.6.1.4.1.12124.2.2.10.1.1" # protocolName
      bay:
        oid: "1.3.6.1.4.1.12124.2.52.1.1" # diskBay
      logical_number:
        oid: "1.3.6.1.4.1.12124.2.52.1.2" # diskLogicalNumber
      chassis:
        oid: "1.3.6.1.4.1.12124.2.52.1.3" # diskChassisNumber
      device:
        oid: "1.3.6.1.4.1.12124.2.52.1.4" # diskDeviceName
      # HEALTHY, L3, SMARTFAIL, DEAD, REPLACE, STALLED, EMPTY, NEW, ...
      status:
        oid: "1.3.6.1.4.1.12124.2.52.1.5" # diskStatus
      model:
        oid: "1.3.6.1.4.1.12124.2.52.1.6" # diskModel
      serial:
        oid: "1.3.6.1.4.1.12124.2.52.1.7" # diskSerialNumber
      firmware:
        oid: "1.3.6.1.4.1.12124.2.52.1.8" # diskFirmwareVersion
      perf_bay:
        oid: "1.3.6.1.4.1.12124.2.2.52.1.1" # diskPerfBay
      chassis_configuration:
        oid: "1.3.6.1.4.1.12124.2.51.1.2" # chassisConfigNumber
      chassis_serial:
        oid: "1.3.6.1.4.1.12124.2.51.1.3" # chassisSerialNumber
      chassis_model:
        oid: "1.3.6.1.4.1.12124.2.51.1.4" # chassisModel
      fan:
        oid: "1.3.6.1.4.1.12124.2.53.1.2" # fanName
      fan_description:
        oid: "1.3.6.1.4.1.12124.2.53.1.3" # fanDescription
      sensor:
        oid: "1.3.6.1.4.1.12124.2.54.1.2" # tempSensorName
      sensor_description:
        oid: "1.3.6.1.4.1.12124.2.54.1.3" # tempSensorDescription
      # A string in the MIB ("31.0"): the collector makes it the value below.
      reading:
        oid: "1.3.6.1.4.1.12124.2.54.1.4" # tempSensorValue
      power_sensor:
        oid: "1.3.6.1.4.1.12124.2.55.1.2" # powerSensorName
      power_sensor_description:
        oid: "1.3.6.1.4.1.12124.2.55.1.3" # powerSensorDescription
      power_reading:
        oid: "1.3.6.1.4.1.12124.2.55.1.4" # powerSensorValue
      interface:
        oid: "1.3.6.1.2.1.31.1.1.1.1" # ifName
      interface_type:
        oid: "1.3.6.1.2.1.2.2.1.3" # ifType
      admin_status:
        oid: "1.3.6.1.2.1.2.2.1.7" # ifAdminStatus
      speed_mbps:
        oid: "1.3.6.1.2.1.31.1.1.1.15" # ifHighSpeed
    metrics:
      # 0 ok, 1 attn (attention), 2 down, 3 invalid.
      powerscale_node_health:
        unit: "1"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.2.1.2.0" # nodeHealth
            resource_attributes: &node_identity
              - powerscale.node.name
              - powerscale.system.description
            attributes:
              - name: scrape_endpoint
                value: node
      # 0 storage, 1 accelerator.
      powerscale_node_type:
        unit: "1"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.2.1.3.0" # nodeType
            resource_attributes: *node_identity
      # 1 while the node is read-only.
      powerscale_node_read_only:
        unit: "1"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.2.1.4.0" # readOnly
            resource_attributes: *node_identity
      powerscale_node_ifs_read_bytes_per_second:
        unit: "By/s"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.1.4.0" # nodeIfsOutBitsPerSecond
            resource_attributes: *node_identity
      powerscale_node_ifs_write_bytes_per_second:
        unit: "By/s"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.1.2.0" # nodeIfsInBitsPerSecond
            resource_attributes: *node_identity
      powerscale_node_network_in_bytes_per_second:
        unit: "By/s"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.2.2.0" # nodeNetworkInBitsPerSecond
            resource_attributes: *node_identity
      powerscale_node_network_out_bytes_per_second:
        unit: "By/s"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.2.4.0" # nodeNetworkOutBitsPerSecond
            resource_attributes: *node_identity
      powerscale_node_cpu_busy_percent:
        unit: "%"
        gauge:
          value_type: int
        scalar_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.3.5.0" # nodeCPUIdle, per mil
            resource_attributes: *node_identity
      # Per protocol on this node (nfs3, nfs4, smb1, smb2, hdfs, http, ftp,
      # nlm, siq, ...): operations per second over the last five seconds,
      # throughput (bits per second, made bytes below) and latency in
      # microseconds.
      powerscale_protocol_operations_per_second:
        unit: "{operation}/s"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.10.1.3" # protocolOpsPerSecond
            resource_attributes: *node_identity
            attributes:
              - name: protocol
      powerscale_protocol_in_bytes_per_second:
        unit: "By/s"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.10.1.8" # inBitsPerSecond
            resource_attributes: *node_identity
            attributes:
              - name: protocol
      powerscale_protocol_out_bytes_per_second:
        unit: "By/s"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.10.1.13" # outBitsPerSecond
            resource_attributes: *node_identity
            attributes:
              - name: protocol
      powerscale_protocol_latency_microseconds:
        unit: "us"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.10.1.16" # latencyAverage
            resource_attributes: *node_identity
            attributes:
              - name: protocol
      powerscale_protocol_latency_max_microseconds:
        unit: "us"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.10.1.15" # latencyMax
            resource_attributes: *node_identity
            attributes:
              - name: protocol
      # The chassis that make up the node, with model and serial number; the
      # value is its blue service light (-1 none, 0 off, 1 on).
      powerscale_chassis_service_light:
        unit: "1"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.51.1.5" # chassisUnitIDLEDOn
            resource_attributes: *node_identity
            attributes:
              - name: chassis_configuration
              - name: chassis_serial
              - name: chassis_model
      # One series per drive bay, with the drive's status and identity.
      powerscale_drive_size_bytes:
        unit: "By"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.52.1.9" # diskSizeBytes
            resource_attributes: *node_identity
            attributes:
              - name: bay
              - name: logical_number
              - name: chassis
              - name: device
              - name: status
              - name: model
              - name: serial
              - name: firmware
      powerscale_drive_operations_per_second:
        unit: "{operation}/s"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.52.1.3" # diskPerfOpsPerSecond
            resource_attributes: *node_identity
            attributes:
              - name: perf_bay
      powerscale_drive_in_bytes_per_second:
        unit: "By/s"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.52.1.4" # diskPerfInBitsPerSecond
            resource_attributes: *node_identity
            attributes:
              - name: perf_bay
      powerscale_drive_out_bytes_per_second:
        unit: "By/s"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.2.52.1.5" # diskPerfOutBitsPerSecond
            resource_attributes: *node_identity
            attributes:
              - name: perf_bay
      powerscale_fan_speed_rpm:
        unit: "{rpm}"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.53.1.4" # fanSpeed
            resource_attributes: *node_identity
            attributes:
              - name: fan
              - name: fan_description
      # The sensor's number, until the collector replaces it with the reading.
      powerscale_temperature_celsius:
        unit: "Cel"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.54.1.1" # tempSensorNumber
            resource_attributes: *node_identity
            attributes:
              - name: sensor
              - name: sensor_description
              - name: reading
      # Volts or amps, by the sensor (its description says which).
      powerscale_power_sensor_reading:
        unit: "1"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.4.1.12124.2.55.1.1" # powerSensorNumber
            resource_attributes: *node_identity
            attributes:
              - name: power_sensor
              - name: power_sensor_description
              - name: power_reading
      # 1 up, 2 down, 3 testing, 5 dormant, 6 not present, 7 lower layer down.
      powerscale_interface_status:
        unit: "1"
        gauge:
          value_type: int
        column_oids:
          - oid: "1.3.6.1.2.1.2.2.1.8" # ifOperStatus
            resource_attributes: *node_identity
            attributes:
              - name: interface
              - name: interface_type
              - name: admin_status
              - name: speed_mbps

  # One slot per node, each a copy of snmp/node at the node's own address.
  # install.sh fills POWERSCALE_NODE_<n> from POWERSCALE_NODES and puts the
  # slots it filled in POWERSCALE_SNMP_RECEIVERS; a slot no node fills is
  # not in the pipeline and never runs. OneFS clusters have up to 252 nodes.
  # POWERSCALE NODE SLOTS BEGIN
