            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:00400801|00400A01|00400B01|00500301|00600601|00600602|00600603|00600A01|00600B01|00700103|00700104|00700201|00700202|00700203|00700204|00700501)$")
