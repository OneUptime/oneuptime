            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:01300907|01300908|01300909|0130090A|0130090C|01300A01|01300C01|01300C05|01300C09|01300D03|01300F02|01300F03|01300F06|01300F07|01301001|01301202)$")
            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:01301203|01301206|01301301|01301501|01301701|01301C01|01301C02|01303E01|01303F04|01304501|01304505|01304603|01304704|01304705|01304804|01400301)$")
            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:01500A08|01700F02|01700F03|01701101|01701E02|01701E03|01702001|01A00105|01A00202|01A00305|01A00402|01C00101|01C00203|01C00301|01C00302|01C00501)$")
            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:01C00502|01C00601|01C00C01|01C00D01|01C00E01|01C01001|01C01101|01C01303|01C01901|01C01A01|01D00101|01D00201|01D00301|01E00101|02200102|02200303)$")
            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:02200306|02800203|02800204|02800206|02A00101|02B00102|02B00103|02B00202|02B00203|02B00302|02B00303|02B00402|02B00403|02B00502|02B00503|02C00203)$")
            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:02C00601|02D00103|03700104)$"))
          - set(severity_number, SEVERITY_NUMBER_INFO) where attributes["powerstore.alert.severity"] == "Info"
          - set(severity_number, SEVERITY_NUMBER_WARN) where attributes["powerstore.alert.severity"] == "Minor"
          - set(severity_number, SEVERITY_NUMBER_ERROR) where attributes["powerstore.alert.severity"] == "Major"
          - set(severity_number, SEVERITY_NUMBER_FATAL) where attributes["powerstore.alert.severity"] == "Critical"
          - set(severity_text, attributes["powerstore.alert.severity"])

  # Stamp every line with the array's identity, as the metrics are: OneUptime
  # shows it on the array's Logs tab, and the alert templates scope on it.
  # Keep it stable: changing it later registers a brand-new array.
  resource:
    attributes:
      - key: storage.array.name
        value: "${env:STORAGE_ARRAY_NAME}"
        action: upsert
      # The platform: dell.powerstore for this config.
      - key: storage.system
        value: "${env:STORAGE_SYSTEM}"
        action: upsert
      # Keep it in step with the collector image docker-compose.yml pins.
      - key: oneuptime.agent.version
        value: "0.165.0"
        action: upsert
      # OneUptime routes batches by service.name first: none may reach it.
      - key: service.name
        action: delete
      - key: service.instance.id
        action: delete
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  otlphttp:
    endpoint: "${env:ONEUPTIME_URL}/otlp"
    headers:
      x-oneuptime-token: "${env:ONEUPTIME_TELEMETRY_INGESTION_KEY}"

service:
  pipelines:
    logs:
      receivers: [syslog/tcp, syslog/udp]
      processors:
        [
          memory_limiter,
          transform/powerstore-record,
          transform/powerstore-alert-severity,
          resource,
          batch,
        ]
