            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:00906B05|00906B06|00906B07|00906C01|00906D01|00906E01|00906F01|00907001|00907201|0090CA01|0090CB01|00A00301|00A00401|00A00502|00B00202|00B00404)$")
            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:00B00B04|00B00C02|00B01402|00B01502|00B01601|00B01701|00B01801|00B01901|00B01A01|00B01B04|00B01C03|00B01E03|00B01F03|00B02102|00D00201|00D00302)$")
