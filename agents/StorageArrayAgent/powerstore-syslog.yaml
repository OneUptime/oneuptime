            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:0030BF02|0030C503|0030C601|0030C904|0030C905|0030C906|0030C909|0030D803|0030E302|00314006|00314007|00400107|00400302|00400602|00400802|00B00501)$")
