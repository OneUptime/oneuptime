            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:01300C02|01300C06|01300D01|01300F04|01300F05|01301204|01301205|01301815|01301816|01301817|01301818|01301819|0130181A|0130181B|0130181C|0130181D)$")
