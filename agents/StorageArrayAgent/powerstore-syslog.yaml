            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:01800D03|01800E02|01800F02|01801002|01801202|01801302|01801402|01801502|01801602|01801702|01801802|01801902|01801A02|01801C02|01801D02|01801E02)$")
            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:01801F02|01802003|01802103|01802104|01802402|01802602|01802702|01802802|01802A02|01803103|01803602|01803802|01803903|01803A03|01803B02|01803C03)$")
            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:01803D03|01803E02|01803F03|01804002|01804103|01804202|01804303|01804402|01804503|01804602|01804703|01804802|01804903|01804A02|01804B03|01804C02)$")
            or IsMatch(attributes["powerstore.event.code"], "(?i)^0x(?:01804D03|01804E02|01804F03|01805002|01805103|01805203|01805302|01805403|01805503|01805602|01805703|01805803|01805902|01805A03|01805B03|01805C02)$")
