# Lets the oneuptime_monitoring role read Neutron's agents and address pools.
# Merge these into the file named by [oslo_policy] policy_file in neutron.conf, which
# is /etc/neutron/policy.yaml unless your deployment says otherwise (DevStack says
# policy.json). oslo.policy notices a changed file on its own, so no restart is needed.
# To take them off again, empty the file rather than deleting it: on Flamingo and
# Epoxy a service fails every request once a policy file it has read is gone, until
# it is restarted, and Keystone failing that way stops the whole cloud.
"get_agent": "role:admin or role:oneuptime_monitoring"
"get_network_ip_availability": "role:admin or role:oneuptime_monitoring"
"get_l3-routers": "role:admin or role:oneuptime_monitoring"
"get_dhcp-agents": "role:admin or role:oneuptime_monitoring"
