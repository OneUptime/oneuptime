services:
  oneuptime-openstack-agent:
    # Upstream collector, pinned. There is no oneuptime/openstack-agent image:
    # the agent is entirely defined by otel-collector-config.yaml, and that
    # config reports this pin as the agent's version (oneuptime.agent.version).
    # Bump the two together; Tests/Ops/validate-collector-configs.sh validates
    # the config against this version.
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: oneuptime-openstack-agent
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      - ONEUPTIME_URL=${ONEUPTIME_URL}
      - ONEUPTIME_TELEMETRY_INGESTION_KEY=${ONEUPTIME_TELEMETRY_INGESTION_KEY}
      # The name this cloud has in OneUptime. Keep it stable: changing it later
      # registers a brand-new cloud.
      - OPENSTACK_CLOUD_NAME=${OPENSTACK_CLOUD_NAME:-openstack}
      # The clouds.yaml entries to read, one per region and named for the region,
      # in square brackets so the collector reads a list: [RegionOne,RegionTwo].
      - OPENSTACK_EXPORTER_CLOUDS=${OPENSTACK_EXPORTER_CLOUDS:-[RegionOne]}
      # host:port of the exporter (no scheme). The default is the service below.
      - OPENSTACK_EXPORTER_ADDRESS=${OPENSTACK_EXPORTER_ADDRESS:-openstack-exporter:9180}
      # The compute nodes to read real instance usage from, whichever a cloud runs, in
      # square brackets: [compute-01:9177,compute-02:9177]. Empty reads none, which is
      # the default because per-instance series multiply fast.
      - OPENSTACK_LIBVIRT_EXPORTER_TARGETS=${OPENSTACK_LIBVIRT_EXPORTER_TARGETS:-[]}
      - OPENSTACK_CEILOMETER_EXPORTER_TARGETS=${OPENSTACK_CEILOMETER_EXPORTER_TARGETS:-[]}
      # What the cloud stands on, in square brackets, from the endpoints the deployment
      # already serves. Empty reads none: otel-collector-config.yaml says what each is.
      - OPENSTACK_RABBITMQ_TARGETS=${OPENSTACK_RABBITMQ_TARGETS:-[]}
      - OPENSTACK_MARIADB_TARGETS=${OPENSTACK_MARIADB_TARGETS:-[]}
      - OPENSTACK_MEMCACHED_TARGETS=${OPENSTACK_MEMCACHED_TARGETS:-[]}
      - OPENSTACK_HAPROXY_TARGETS=${OPENSTACK_HAPROXY_TARGETS:-[]}
      - OPENSTACK_NETWORK_EXPORTER_TARGETS=${OPENSTACK_NETWORK_EXPORTER_TARGETS:-[]}
      - OPENSTACK_LIBVIRT_HEALTH_TARGETS=${OPENSTACK_LIBVIRT_HEALTH_TARGETS:-[]}
      # The region a target above is in, unless it says its own. Also the region of an
      # exporter that reads one cloud on /metrics, as Kolla-Ansible's does.
      - OPENSTACK_CONTROL_PLANE_REGION=${OPENSTACK_CONTROL_PLANE_REGION:-RegionOne}
      # An exporter already running in single-cloud mode, such as Kolla-Ansible's. Set
      # OPENSTACK_EXPORTER_CLOUDS=[] with it: README.md says what it costs.
      - OPENSTACK_SINGLE_CLOUD_EXPORTER_TARGETS=${OPENSTACK_SINGLE_CLOUD_EXPORTER_TARGETS:-[]}
      # Which services this agent reads, for the largest clouds: compute|placement on one
      # agent, the rest on another. Everything, unless you share them out.
      - OPENSTACK_AGENT_SERVICES=${OPENSTACK_AGENT_SERVICES:-.*}
      # The collector holds a whole scrape in memory. Raise it past tens of thousands of instances.
      - OPENSTACK_AGENT_MEMORY_LIMIT_MIB=${OPENSTACK_AGENT_MEMORY_LIMIT_MIB:-512}
      # The largest clouds' path, read from the databases: see openstack-database-exporter below.
      - OPENSTACK_DATABASE_EXPORTER_TARGETS=${OPENSTACK_DATABASE_EXPORTER_TARGETS:-[]}
      - OPENSTACK_DATABASE_EXPORTER_HOST_SUFFIX=${OPENSTACK_DATABASE_EXPORTER_HOST_SUFFIX:-}
      - OPENSTACK_WORKER_STATE_CLOUDS=${OPENSTACK_WORKER_STATE_CLOUDS:-[]}
      - OPENSTACK_WORKER_STATE_EXPORTER_ADDRESS=${OPENSTACK_WORKER_STATE_EXPORTER_ADDRESS:-openstack-worker-state-exporter:9180}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # openstack-exporter, pinned. COMPOSE_PROFILES=openstack-exporter in .env starts
  # it, which is what install.sh writes. Leave the profile off and set
  # OPENSTACK_EXPORTER_ADDRESS when you already run the exporter in --multi-cloud
  # mode, for example the one Kolla-Ansible deploys.
  #
  # Gentle by default, because monitoring must never be what takes a cloud down:
  #  - the slow metrics (quotas and limits per project, usage per server) are off;
  #  - the per-port series are off. Listing every port with an admin credential
  #    can saturate Neutron on a large cloud (openstack-exporter issue 540).
  # README.md says what each one gives up, and how to turn it on.
  openstack-exporter:
    image: ghcr.io/openstack-exporter/openstack-exporter:2.0.0-alpha@sha256:2a864f41db28a1656a5034e8a17831fb37986e8856fd3f5361586a05f928950a
    container_name: oneuptime-openstack-exporter
    profiles: ["openstack-exporter"]
    # The image runs as uid 65532, and clouds.yaml is readable by its owner alone,
    # so the exporter has to run as the file's owner or it cannot read the
    # credential at all. install.sh gives the file to 65532 when it runs as root;
    # any other user cannot do that, so it writes its own uid:gid here instead.
    user: "${OPENSTACK_EXPORTER_USER:-65532:65532}"
    # It only reads clouds.yaml and makes HTTPS calls.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --multi-cloud
      - --os-client-config=/etc/openstack/clouds.yaml
      # Every read below is left out on purpose, by name, instead of with
      # --disable-slow-metrics, which also takes the image list that the product's
      # Images page reads with one call. Naming a series that reads the others turns
      # them all off.
      #
      # One call per project, on each scrape:
      - --disable-metric=nova-quota_cores
      - --disable-metric=nova-limits_vcpus_max
      - --disable-metric=nova-server_local_gb
      - --disable-metric=neutron-quota_network
      - --disable-metric=cinder-limits_volume_max_gb
      # Every port in the cloud, which can saturate Neutron (upstream issue 540):
      - --disable-metric=neutron-ports
      - --disable-metric=neutron-port
      - --disable-metric=neutron-ports_no_ips
      - --disable-metric=neutron-ports_lb_not_active
      # Many series saying what the address pools already say:
      - --disable-metric=neutron-subnets_total
      # Nova no longer has this route, so it only fills the exporter's log:
      - --disable-metric=nova-security_groups
    volumes:
      # The cloud's credential: an application credential, one entry per region.
      # install.sh writes it readable only by the user the exporter runs as.
      - ./clouds.yaml:/etc/openstack/clouds.yaml:ro
      # A cloud with its own certificate authority. install.sh copies the file
      # to ./ca.pem, sets OPENSTACK_CA_FILE=./ca.pem and names it in clouds.yaml
      # (`cacert: /etc/openstack/ca.pem`). Without one, nothing is mounted here
      # that anything reads.
      - ${OPENSTACK_CA_FILE:-/dev/null}:/etc/openstack/ca.pem:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The largest clouds' path, offered past 1,500 hypervisors or 100,000 instances, where the APIs
  # cannot be scraped in time. COMPOSE_PROFILES=openstack-database-exporter starts it. It reads
  # each service's database with a read-only account, and has no credential for any API. Each
  # URL is oslo.db's form, such as mysql+pymysql://oneuptime:secret@db.example:3306/nova, and
  # one left empty is a service it leaves alone. It has no secret on a command line, and its
  # port is never published.
  #
  # One exporter reads one region and one Nova cell. README.md says what it needs and what it
  # does not cover.
  openstack-database-exporter:
    image: ghcr.io/vexxhost/openstack-database-exporter:v1.2.0@sha256:cae2c794f14f84f697d802a60b866ce69a99ebcffade7dd5e6e0e46f44457508
    container_name: oneuptime-openstack-database-exporter
    profiles: ["openstack-database-exporter"]
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NOVA_DATABASE_URL=${NOVA_DATABASE_URL:-}
      - NOVA_API_DATABASE_URL=${NOVA_API_DATABASE_URL:-}
      - PLACEMENT_DATABASE_URL=${PLACEMENT_DATABASE_URL:-}
      - NEUTRON_DATABASE_URL=${NEUTRON_DATABASE_URL:-}
      - CINDER_DATABASE_URL=${CINDER_DATABASE_URL:-}
      - GLANCE_DATABASE_URL=${GLANCE_DATABASE_URL:-}
      - KEYSTONE_DATABASE_URL=${KEYSTONE_DATABASE_URL:-}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # What the database exporter cannot say: whether each Nova worker is alive, and how full each
  # storage pool is. The same pinned openstack-exporter, with every other read of Nova and Cinder
  # off and nothing else asked of it, so each scrape is one small list and one login.
  openstack-worker-state-exporter:
    image: ghcr.io/openstack-exporter/openstack-exporter:2.0.0-alpha@sha256:2a864f41db28a1656a5034e8a17831fb37986e8856fd3f5361586a05f928950a
    container_name: oneuptime-openstack-worker-state-exporter
    profiles: ["openstack-database-exporter"]
    user: "${OPENSTACK_EXPORTER_USER:-65532:65532}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --multi-cloud
      - --os-client-config=/etc/openstack/clouds.yaml
      - --disable-metric=nova-flavors
      - --disable-metric=nova-availability_zones
      - --disable-metric=nova-security_groups
      - --disable-metric=nova-total_vms
      - --disable-metric=nova-current_workload
      - --disable-metric=nova-quota_cores
      - --disable-metric=nova-limits_vcpus_max
      - --disable-metric=nova-server_local_gb
      - --disable-metric=cinder-volumes
      - --disable-metric=cinder-snapshots
      - --disable-metric=cinder-backups
      - --disable-metric=cinder-agent_state
      - --disable-metric=cinder-limits_volume_max_gb
    volumes:
      - ./clouds.yaml:/etc/openstack/clouds.yaml:ro
      - ${OPENSTACK_CA_FILE:-/dev/null}:/etc/openstack/ca.pem:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
