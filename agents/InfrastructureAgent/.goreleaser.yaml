# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy
    - go mod download
env:
    - CGO_ENABLED=0

# The version every package, the Homebrew cask and the winget manifests carry.
#
# release.yml runs GoReleaser with --snapshot (it builds; the release jobs
# publish), and a snapshot's version defaults to <tag>-SNAPSHOT-<commit>. So
# 14.0.71's .deb said 14.0.71~SNAPSHOT-<commit>, and its .rpm
# 14.0.71~SNAPSHOT_<commit>. The apt and yum repositories, the cask and the
# winget manifests name the release, so the packages are versioned as the
# release is: the tag release.yml passes in GORELEASER_CURRENT_TAG.
snapshot:
  version_template: "{{ .Version }}"

nfpms:
  # note that this is an array of nfpm configs
  - #
    # ID of the nfpm config, must be unique.
    #
    # Default: 'default'.
    id: default

    # Name of the package.
    #
    # Default: ProjectName.
    # Templates: allowed.
    package_name: oneuptime-infrastructure-agent

    file_name_template: 'oneuptime-infrastructure-agent_{{ .Arch }}.{{ .Format }}'

    # Your app's vendor.
    vendor: HackerBay, Inc.

    # Your app's homepage.
    #
    # Default: inferred from global metadata.
    homepage: https://oneuptime.com/

    # Your app's maintainer (probably you).
    #
    # Default: inferred from global metadata.
    maintainer: OneUptime Infrastructure Team <infra@oneuptime.com>

    # Your app's description.
    #
    # Default: inferred from global metadata.
    description: |-
      OneUptime Infrastructure Agent is a lightweight agent that collects system metrics and sends them to the OneUptime platform.

    # Your app's license.
    #
    # Default: inferred from global metadata.
    license: Apache 2.0

    # Formats to be generated.
    formats:
      - apk
      - deb
      - rpm
      - termux.deb
      - archlinux

    # Packages your package depends on. (overridable)
    #
    # Not git: the agent runs no other program, and installing the package
    # pulled git (and perl) onto every server for nothing.
    dependencies:
      - bash
      - coreutils
      - systemd
  

builds:
  - binary: oneuptime-infrastructure-agent
    main: ./
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
    goarm:
      - "6"
      - "7"
archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: '{{ .Binary }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        format: zip
# CycloneDX SBOMs for everything published to the GitHub release.
#
# These artifacts are installed as root on customer hosts, and a stripped Go
# binary's dependency tree is opaque to whoever installs it — the SBOM is how
# they answer "am I exposed to CVE-X?" without reverse-engineering the binary.
#
# Two entries: `archive` and `binary`. `artifacts` takes a single value, so one
# entry cannot cover both.
#
# There is deliberately NO `artifacts: package` entry. syft unpacks a .tar.gz
# and finds the Go module tree inside, but it does NOT descend into .deb/.rpm/
# .apk/.archlinux — for those it reads only the package control metadata, and
# measurably produces a 2-component document (the package name plus the file
# itself) against the 21 components in the archive SBOM for the same build.
# Attaching that would be worse than attaching nothing: it looks like coverage
# while carrying none of the dependency data an SBOM exists to convey.
#
# The `binary` entry is what covers the packages. Every nfpm package wraps
# exactly one of these binaries, so the binary SBOM for a given os/arch
# describes the contents of the .deb, .rpm, .apk and .archlinux for that same
# os/arch. Verified: scanning the raw linux/amd64 binary yields the same 21
# modules as the archive.
#
# `args` is pinned rather than defaulted for two reasons: the default emits
# spdx-json, and we publish CycloneDX to match the container SBOMs; and the
# default appends `--enrich all`, which makes network calls during the release
# and yields non-deterministic output.
#
# `disable` was added in GoReleaser v2.10 and defaults to false. It is set
# explicitly here because the upstream docs page states the default is true
# while the code says otherwise — being explicit costs nothing and survives
# whichever one turns out to be authoritative later.
sboms:
  - id: archives
    artifacts: archive
    disable: false
    documents:
      - "${artifact}.cdx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]
  - id: binaries
    artifacts: binary
    disable: false
    documents:
      - "{{ .Binary }}_{{ .Os }}_{{ .Arch }}.cdx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

# The Homebrew cask and the winget manifests, generated here and published by
# release.yml.
#
# GoReleaser runs with --snapshot, which writes both into dist/ (homebrew/ and
# winget/) and publishes neither; GoReleaser OSS has no way to publish files
# from an earlier run. They also cannot be published here: they point at this
# version's GitHub release, which finalize-github-release publishes hours
# later, and only once the e2e jobs pass. So infrastructure-agent-build keeps
# them as an artifact, and the publish-infrastructure-agent-homebrew and
# publish-infrastructure-agent-winget jobs push them once the release is out
# (Scripts/PackageManagers/). skip_upload says the same thing to anyone who
# runs GoReleaser without --snapshot.
#
# The checksums they carry are those of the archives this run attaches to the
# release, which is why they are generated in the same run and not rebuilt.

# `brew install oneuptime/tap/oneuptime-infrastructure-agent`, from the
# OneUptime/homebrew-tap repository.
homebrew_casks:
  - name: oneuptime-infrastructure-agent
    binaries:
      - oneuptime-infrastructure-agent
    description: Agent that sends a server's metrics to a OneUptime Server / VM monitor
    homepage: https://oneuptime.com/docs/monitor/server-monitor
    license: Apache-2.0
    # No `verified:`. Homebrew 7 deprecates it, for its own verification.
    url:
      template: "https://github.com/OneUptime/oneuptime/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    directory: Casks
    skip_upload: true
    repository:
      owner: OneUptime
      name: homebrew-tap
      branch: main
    # The caveats and the quarantine step, written as Ruby here rather than
    # in GoReleaser's caveats and hooks fields.
    #
    # Caveats: one heredoc keeps every line, whichever GoReleaser writes the
    # cask. GoReleaser 2.13 writes each line of its caveats field as a string
    # of its own in a `caveats do` block, and Ruby keeps only the block's last
    # one, so a cask it wrote showed only the line about restarting after an
    # upgrade. (The newer GoReleaser release.yml installs, `~> v2`, writes a
    # heredoc itself.)
    #
    # Quarantine: the binary is not notarized, and Homebrew quarantines what
    # a cask downloads, so Gatekeeper would refuse to run it. The step takes
    # the quarantine off once it is installed.
    #
    # In Homebrew 7's postflight_steps, not GoReleaser's hooks.post.install:
    # that writes a `postflight` block, which Homebrew 7 deprecates, so every
    # brew command that read the cask printed "Calling `postflight` is
    # deprecated!" and asked users to report it to the tap. A step runs in
    # Homebrew's sandbox, takes {{staged_path}} in its arguments (written
    # {{ "{{staged_path}}" }} here, as GoReleaser templates the cask), and does
    # not fail the install when there is no quarantine to remove (must_succeed).
    custom_block: |
      caveats <<~EOS
        Connect the agent to your Server / VM monitor and start it:
          sudo oneuptime-infrastructure-agent configure --secret-key=YOUR_SECRET_KEY --oneuptime-url=https://oneuptime.com
          sudo oneuptime-infrastructure-agent start
        After an upgrade, restart it: sudo oneuptime-infrastructure-agent restart
      EOS

      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/oneuptime-infrastructure-agent"], must_succeed: false
        end
      end

# `winget install OneUptime.InfrastructureAgent`: the Windows zips as a
# portable package, which winget puts on the PATH. The publish job opens the
# pull request to microsoft/winget-pkgs from a fork.
winget:
  # GoReleaser writes the name as both PackageName and Moniker, the short
  # alias people type, so it is the command's name rather than a title.
  - name: oneuptime-infrastructure-agent
    package_identifier: OneUptime.InfrastructureAgent
    publisher: OneUptime
    publisher_url: https://oneuptime.com
    publisher_support_url: https://github.com/OneUptime/oneuptime/issues
    author: HackerBay, Inc.
    copyright: Copyright (c) HackerBay, Inc.
    short_description: Agent that sends a server's metrics to a OneUptime Server / VM monitor
    description: |-
      The OneUptime Infrastructure Agent runs as a Windows service and reports CPU, memory, disks, network and running processes to a OneUptime Server / VM monitor every 30 seconds.
    license: Apache-2.0
    license_url: https://github.com/OneUptime/oneuptime/blob/master/agents/InfrastructureAgent/LICENSE
    homepage: https://oneuptime.com/docs/monitor/server-monitor
    release_notes_url: "https://github.com/OneUptime/oneuptime/releases/tag/{{ .Tag }}"
    installation_notes: "From an Administrator prompt, run: oneuptime-infrastructure-agent configure --secret-key=YOUR_SECRET_KEY --oneuptime-url=https://oneuptime.com, then: oneuptime-infrastructure-agent start"
    tags:
      - agent
      - infrastructure
      - metrics
      - monitoring
      - oneuptime
    url_template: "https://github.com/OneUptime/oneuptime/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    skip_upload: true
    repository:
      owner: OneUptime
      name: winget-pkgs

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
