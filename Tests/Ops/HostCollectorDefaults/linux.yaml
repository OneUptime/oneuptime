# OneUptime's default config for Linux hosts.
receivers:
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.logical.count:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
        # Leave out file systems that are full by design (snap packages and
        # other read-only images, CDs and DVDs, macOS's /dev) or hold no data
        # (the automounter's maps): the full ones would read 100% used for good.
        exclude_fs_types:
          fs_types: [autofs, cd9660, CDFS, devfs, erofs, iso9660, squashfs, udf, UDF]
          match_type: strict
        metrics:
          system.filesystem.utilization:
            enabled: true
      load:
      network:
      paging:
      # How long the host has been up (system.uptime): when it last started.
      system:
      processes:
      process:
        mute_process_name_error: true
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_user_error: true
        metrics:
          process.cpu.utilization:
            enabled: true
          process.memory.utilization:
            enabled: true

  # The systemd journal: every unit's logs, info and above. Each line is sent
  # as its message, at its level, with the unit it is about and - for a unit
  # that failed - systemd's own result and exit status, which the Systemd
  # Units page reads why it failed from. The rest of an entry (its command
  # line, user and group ids, cursor) stays on this host.
  journald:
    priority: info
    # A line holding a control character arrives as text, not as numbers.
    convert_message_bytes: true
    operators:
      # What systemd itself says about a unit comes from PID 1, naming it in UNIT.
      - type: move
        if: 'body._PID == "1" and body.UNIT != nil'
        from: body.UNIT
        to: attributes["systemd.unit.name"]
      - type: move
        if: 'attributes["systemd.unit.name"] == nil and body._SYSTEMD_UNIT != nil'
        from: body._SYSTEMD_UNIT
        to: attributes["systemd.unit.name"]
      # Why a unit failed, in systemd's words: its result and how its process ended.
      - type: move
        if: 'body._PID == "1" and body.UNIT_RESULT != nil'
        from: body.UNIT_RESULT
        to: attributes["systemd.unit.result"]
      - type: move
        if: 'body._PID == "1" and body.EXIT_CODE != nil'
        from: body.EXIT_CODE
        to: attributes["systemd.unit.exit_code"]
      - type: move
        if: 'body._PID == "1" and body.EXIT_STATUS != nil'
        from: body.EXIT_STATUS
        to: attributes["systemd.unit.exit_status"]
      - type: move
        if: 'body.SYSLOG_IDENTIFIER != nil'
        from: body.SYSLOG_IDENTIFIER
        to: attributes["syslog.identifier"]
      - type: move
        if: 'body._PID != nil'
        from: body._PID
        to: attributes["process.pid"]
      # The journal's priority as the line's severity: syslog's levels.
      - type: severity_parser
        if: 'body.PRIORITY != nil'
        parse_from: body.PRIORITY
        preset: none
        overwrite_text: true
        mapping:
          fatal: "0"
          error3: "1"
          error2: "2"
          error: "3"
          warn: "4"
          info2: "5"
          info: "6"
          debug: "7"
      # Nothing else of the entry leaves the host: the message is the line.
      - type: retain
        fields:
          - body.MESSAGE
      - type: move
        from: body.MESSAGE
        to: body
        on_error: send_quiet

  # The Systemd Units page: the state of every service.
  systemd:
    collection_interval: 30s
    units: ["*.service"]
    metrics:
      systemd.service.cpu.time:
        enabled: false

processors:
  # Stamps host.name, host.id and os.type: this is how OneUptime files the
  # telemetry under this host. Keep it in every pipeline.
  resource_detection:
    detectors: [system, env]
    system:
      hostname_sources: [os]
      resource_attributes:
        host.name:
          enabled: true
        host.id:
          enabled: true
        host.arch:
          enabled: true
        host.ip:
          enabled: true
        host.mac:
          enabled: true
        os.type:
          enabled: true
        os.description:
          enabled: true
        os.version:
          enabled: true
  batch:

exporters:
  # Sends to the OneUptime this host was installed with, with its key.
  otlp_http/oneuptime:
    endpoint: ${env:ONEUPTIME_URL}/otlp
    headers:
      x-oneuptime-token: ${env:ONEUPTIME_INGESTION_KEY}

service:
  pipelines:
    metrics:
      receivers: [host_metrics, systemd]
      processors: [resource_detection, batch]
      exporters: [otlp_http/oneuptime]
    logs:
      receivers: [journald]
      processors: [resource_detection, batch]
      exporters: [otlp_http/oneuptime]
